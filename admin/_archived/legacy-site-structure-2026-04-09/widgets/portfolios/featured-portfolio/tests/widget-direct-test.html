<!DOCTYPE html>
<html>
<head>
    <title>Widget Direct Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .test-container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .widget-container { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Featured Portfolio Widget Direct Test</h1>
        <p><strong>Testing:</strong> Widget loading with individual portfolio manifests</p>
        <p><strong>Server:</strong> http://localhost:3000</p>
        
        <div class="widget-container">
            <iframe src="../versions/v1.5.html" 
                    width="100%" 
                    height="800" 
                    frameborder="0"
                    style="border: 1px solid #ddd; border-radius: 4px;">
            </iframe>
        </div>
        
        <div>
            <h3>Debug Actions</h3>
            <button onclick="reloadWidget()">🔄 Reload Widget</button>
            <button onclick="clearCache()">🗑️ Clear Cache</button>
            <button onclick="checkManifests()">📋 Check Manifests</button>
        </div>
        
        <div id="debug-output" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 400px; overflow-y: auto;">
            <strong>Debug Output:</strong><br>
        </div>
    </div>
    
    <script>
        function reloadWidget() {
            const iframe = document.querySelector('iframe');
            iframe.src = iframe.src;
            log('Widget reloaded');
        }
        
        function clearCache() {
            // Clear localStorage for featured portfolio
            Object.keys(localStorage).forEach(key => {
                if (key.includes('featured-portfolio') || key.includes('manifest')) {
                    localStorage.removeItem(key);
                }
            });
            log('Cache cleared');
        }
        
        async function checkManifests() {
            const manifests = [
                '../../../../src/images/Portfolios/Concert/concert-manifest.json',
                '../../../../src/images/Portfolios/Events/events-manifest.json',  
                '../../../../src/images/Portfolios/Journalism/journalism-manifest.json'
            ];
            
            for (const url of manifests) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        log(`✅ ${url} - OK (${Object.keys(data).length} keys)`);
                    } else {
                        log(`❌ ${url} - HTTP ${response.status}`);
                    }
                } catch (error) {
                    log(`❌ ${url} - ${error.message}`);
                }
            }
        }
        
        function log(message) {
            const output = document.getElementById('debug-output');
            const timestamp = new Date().toLocaleTimeString();
            output.innerHTML += `<br>[${timestamp}] ${message}`;
            output.scrollTop = output.scrollHeight;
        }
        
        // Listen for messages from the iframe
        window.addEventListener('message', function(event) {
            if (event.data && typeof event.data === 'string') {
                log(`📨 Widget: ${event.data}`);
            }
        });
        
        // Auto-check manifests on load
        setTimeout(checkManifests, 1000);
    </script>
</body>
</html>
