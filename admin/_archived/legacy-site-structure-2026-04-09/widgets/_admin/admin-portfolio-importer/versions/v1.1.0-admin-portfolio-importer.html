          type="file"
          class="admin-upload-input"
          id="fileInputSingle"
          multiple
          accept="image/jpeg,image/jpg,image/png,image/webp"
          style="display: none"
        />
      </div>
    </div>

    <!-- Preview Panel -->
    <div class="admin-preview-panel" id="previewPanel">
      <div class="admin-preview-header">
        <div class="admin-preview-title">Import Preview</div>
        <div class="admin-preview-count" id="previewCount">0 files selected</div>
      </div>
      <div class="admin-preview-list" id="previewList"></div>
      <div class="admin-progress" id="progressContainer" style="display: none">
        <div class="admin-progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="admin-actions" id="actionButtons" style="display: none">
      <button class="admin-btn secondary" onclick="clearFiles()">Clear All</button>
      <button class="admin-btn secondary" onclick="previewImport()" id="previewBtn">
        🔍 Preview Backend
      </button>
      <button class="admin-btn primary" onclick="processFiles()" id="processBtn">
        📁 Import Files
      </button>
    </div>
  </div>

  <!-- Version Indicator -->
  <div class="admin-version-indicator" onclick="showAdminInfo()">Admin v1.1.0</div>

  <script>
    (function () {
      'use strict';

      // Configuration
      const CONFIG = {
        version: '1.1.0',
        adminPassword: null,
        currentPortfolio: 'Concert',
        autoManifest: true,
        previewMode: true,
        maxFiles: 100,
        maxFileSize: 50 * 1024 * 1024, // 50MB
        allowedTypes: ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'],
        backendUrl: 'http://localhost:3001', // Backend server URL
        backendAutoStart: true, // Try to auto-start backend
        portfolioStructure: {
          Concert: 'src/images/Portfolios/Concert/{band}/{monthYear}/',
          Events: 'src/images/Portfolios/Events/{event}/{monthYear}/',
          Journalism: 'src/images/Portfolios/Journalism/{category}/',
          Nature: 'src/images/Portfolios/Nature/{category}/',
        },
        optimization: {
          enabled: true,
          maxDimension: 3840, // target longest edge in pixels
          sizeThreshold: 8 * 1024 * 1024, // optimise files larger than 8MB
          quality: 0.85,
          minReductionRatio: 0.08, // require at least 8% size reduction to keep optimized version
          supportedTypes: ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'],
        },
      };

      // State management
      const state = {
        authenticated: false,
        selectedFiles: [],
        processing: false,
        sessionTimeout: null,
        backendRunning: false,
        backendChecked: false,
        optimizationStats: {
          optimized: 0,
          totalOriginalBytes: 0,
          totalOptimizedBytes: 0,
        },
      };

      // Initialize widget
      function initializeWidget() {
        // Get configuration from data attributes
        const widget = document.querySelector('.admin-portfolio-importer');
        CONFIG.adminPassword = widget.dataset.adminPassword || 'admin123';
        CONFIG.currentPortfolio = widget.dataset.defaultPortfolio || 'Concert';
        CONFIG.autoManifest = widget.dataset.autoManifest !== 'false';
        CONFIG.previewMode = widget.dataset.previewMode !== 'false';

        // Setup event listeners
        setupEventListeners();

        // Show authentication screen
        showAuthScreen();
      }

      // Event listeners setup
      function setupEventListeners() {
        // Authentication form
        document.getElementById('authForm').addEventListener('submit', handleAuthentication);

        // File upload
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        // Don't auto-click on upload area anymore - use buttons
        uploadArea.addEventListener('dragover', handleDragOver);
        uploadArea.addEventListener('dragleave', handleDragLeave);
        uploadArea.addEventListener('drop', handleDrop);
        fileInput.addEventListener('change', handleFileSelect);
        document.getElementById('fileInputSingle').addEventListener('change', handleFileSelect);

        // Prevent default drag behavior on document
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());
      }

      // Backend health checking
      async function checkBackendHealth() {
        try {
          const response = await fetch(`${CONFIG.backendUrl}/health`, {
            method: 'GET',
            timeout: 3000,
          });

          if (response.ok) {
            state.backendRunning = true;
            return true;
          }
        } catch (error) {
          console.log('Backend health check failed:', error.message);
        }

        state.backendRunning = false;
        return false;
      }

      // Auto-start backend (simulation - provides instructions)
      async function startBackend() {
        showNotification('Starting backend server...', 'warning');

        // In a real implementation, this would use a Node.js child process
        // For now, we provide clear instructions to the user
        const instructions = `
Backend server needs to be started manually:

1. Open a new terminal
2. Run: node scripts/admin-import-backend.js
3. Wait for "Backend running on http://localhost:3001"
4. Return to this widget and try again

The backend server is required for file import operations.
    `;

        setTimeout(() => {
          alert(instructions);
          showNotification('Backend startup instructions provided', 'warning');
        }, 1000);
      }

      // Authentication handling with backend check
      async function handleAuthentication(e) {
        e.preventDefault();
        const password = document.getElementById('adminPassword').value;
        const errorElement = document.getElementById('authError');

        if (!password) {
          showAuthError('Please enter a password');
          return;
        }

        // Check password
        if (password !== CONFIG.adminPassword) {
          showAuthError('Invalid admin password');
          document.getElementById('adminPassword').value = '';
          return;
        }

        // Password is correct, now check backend
        showAuthError('Checking backend server...');

        const backendHealthy = await checkBackendHealth();

        if (!backendHealthy && CONFIG.backendAutoStart) {
          showAuthError('Backend server not running. Starting...');
          await startBackend();

          // Give user a chance to start backend manually
          setTimeout(async () => {
            const retryHealthy = await checkBackendHealth();
            if (retryHealthy) {
              completeAuthentication();
            } else {
              showAuthError('Backend server still not responding. Please start manually.');
            }
          }, 3000);
        } else if (backendHealthy) {
          completeAuthentication();
        } else {
          showAuthError('Backend server required but not running');
        }
      }

      function completeAuthentication() {
        state.authenticated = true;
        state.backendChecked = true;
        showMainInterface();
        startSessionTimeout();
        updateBackendStatus();
        showNotification('Admin access granted - Backend ready', 'success');
      }

      // Update backend status UI
      function updateBackendStatus() {
        const indicator = document.getElementById('statusIndicator');
        const text = document.getElementById('statusText');

        if (state.backendRunning) {
          indicator.textContent = '🟢';
          text.textContent = 'Backend Online';
          text.style.color = 'var(--admin-success)';
        } else {
          indicator.textContent = '🔴';
          text.textContent = 'Backend Offline';
          text.style.color = 'var(--error)';
        }
      }

      // Refresh backend status
      window.refreshBackendStatus = async function () {
        const refreshBtn = document.getElementById('statusRefresh');
        refreshBtn.style.opacity = '0.5';

        await checkBackendHealth();
        updateBackendStatus();

        refreshBtn.style.opacity = '1';

        if (state.backendRunning) {
          showNotification('Backend server is responding', 'success');
        } else {
          showNotification(
            'Backend server not responding. Run: node scripts/admin-import-backend.js',
            'warning',
          );
        }
      };

      function showAuthError(message) {
        const errorElement = document.getElementById('authError');
        errorElement.textContent = message;
        setTimeout(() => (errorElement.textContent = ''), 3000);
      }

      function showAuthScreen() {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('mainInterface').classList.remove('visible');
      }

      function showMainInterface() {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainInterface').classList.add('visible');
      }

      // Session management
      function startSessionTimeout() {
        clearTimeout(state.sessionTimeout);
        state.sessionTimeout = setTimeout(
          () => {
            adminLogout();
            showNotification('Session expired - please log in again', 'warning');
          },
          30 * 60 * 1000,
        ); // 30 minutes
      }

      window.adminLogout = function () {
        state.authenticated = false;
        clearTimeout(state.sessionTimeout);
        document.getElementById('adminPassword').value = '';
        showAuthScreen();
        clearFiles();
        showNotification('Logged out successfully', 'success');
      };

      // Folder and file selection functions
      window.selectFolder = function () {
        if (!state.authenticated) {
          showNotification('Authentication required', 'error');
          return;
        }
        document.getElementById('fileInput').click();
      };

      window.selectFiles = function () {
        if (!state.authenticated) {
          showNotification('Authentication required', 'error');
          return;
        }
        document.getElementById('fileInputSingle').click();
      };

      // Portfolio type selection
      window.selectPortfolioType = function (type) {
        CONFIG.currentPortfolio = type;

        // Update UI
        document.querySelectorAll('.portfolio-type-btn').forEach((btn) => {
          btn.classList.remove('active');
        });
        document.querySelector(`[data-type="${type}"]`).classList.add('active');

        // Update preview if files are selected
        if (state.selectedFiles.length > 0) {
          updatePreview();
        }

        showNotification(`Switched to ${type} portfolio`, 'success');
      };

      // File handling
      function handleDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
      }

      function handleDragLeave(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
      }

      async function handleDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');

        const files = [];
        const items = e.dataTransfer.items;

        if (items) {
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.kind !== 'file') continue;
            const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
            if (entry) {
              if (entry.isDirectory) {
                await readDirectoryRecursive(entry, files);
              } else {
                const file = item.getAsFile();
                if (file) files.push(file);
              }
            } else {
              const file = item.getAsFile();
              if (file) files.push(file);
            }
          }
        } else {
          files.push(...Array.from(e.dataTransfer.files));
        }

        if (files.length > 0) {
          await processSelectedFiles(files);
        }
      }

      // Recursive directory reading function
      async function readDirectoryRecursive(directoryEntry, fileArray) {
        return new Promise((resolve, reject) => {
          const dirReader = directoryEntry.createReader();

          function readEntries() {
            dirReader.readEntries(async (entries) => {
              if (entries.length === 0) {
                resolve();
                return;
              }

              const promises = entries.map((entry) => {
                if (entry.isDirectory) {
                  return readDirectoryRecursive(entry, fileArray);
                } else if (entry.isFile) {
                  return new Promise((fileResolve) => {
                    entry.file((file) => {
                      // Add folder path information to file
                      file.relativePath = entry.fullPath;
                      fileArray.push(file);
                      fileResolve();
                    });
                  });
                }
              });

              await Promise.all(promises);
              readEntries(); // Continue reading if there are more entries
            });
          }

          readEntries();
        });
      }

      async function handleFileSelect(e) {
        const files = Array.from(e.target.files);

        files.forEach((file) => {
          if (file.webkitRelativePath) {
            file.relativePath = '/' + file.webkitRelativePath;
          }
        });

        if (files.length > 0) {
          await processSelectedFiles(files);
        }
      }

      // File processing
      async function processSelectedFiles(files) {
        if (!state.authenticated) {
          showNotification('Authentication required', 'error');
          return;
        }

        const validFiles = files.filter((file) => {
          if (!CONFIG.allowedTypes.includes(file.type)) {
            showNotification(`Skipped ${file.name}: unsupported file type`, 'warning');
            return false;
          }
          if (file.size > CONFIG.maxFileSize) {
            showNotification(`Skipped ${file.name}: file too large (max 50MB)`, 'warning');
            return false;
          }
          return true;
        });

        if (validFiles.length === 0) {
          showNotification('No valid image files selected', 'error');
          return;
        }

        if (validFiles.length > CONFIG.maxFiles) {
          showNotification(`Too many files selected. Maximum: ${CONFIG.maxFiles}`, 'error');
          return;
        }

        const folderSummary = analyzeFolderStructure(validFiles);

        releasePreviewUrls(state.selectedFiles);
        state.selectedFiles = [];
        state.optimizationStats = {
          optimized: 0,
          totalOriginalBytes: 0,
          totalOptimizedBytes: 0,
        };

        const preparedEntries = [];
        for (const file of validFiles) {
          const entry = await prepareFileEntry(file);
          preparedEntries.push(entry);
          state.optimizationStats.totalOriginalBytes += entry.optimization.originalSize;
          state.optimizationStats.totalOptimizedBytes += entry.optimization.optimized
            ? entry.optimization.optimizedSize
            : entry.optimization.originalSize;
          if (entry.optimization.optimized) {
            state.optimizationStats.optimized += 1;
          }
        }

        state.selectedFiles = preparedEntries;

        const optimizedMessage =
          state.optimizationStats.optimized > 0
            ? ` • Optimized ${state.optimizationStats.optimized} (${bytesToSize(state.optimizationStats.totalOriginalBytes - state.optimizationStats.totalOptimizedBytes)} saved)`
            : '';

        if (folderSummary.hasMultipleFolders) {
          showNotification(
            `Found ${folderSummary.folderCount} folders with ${validFiles.length} images${optimizedMessage}`,
            'success',
          );
        } else {
          showNotification(
            `${validFiles.length} files ready for import${optimizedMessage}`,
            'success',
          );
        }

        updatePreview();
      }

      // Preview update
      function updatePreview() {
        const previewPanel = document.getElementById('previewPanel');
        const previewList = document.getElementById('previewList');
        const previewCount = document.getElementById('previewCount');
        const actionButtons = document.getElementById('actionButtons');

        if (state.selectedFiles.length === 0) {
          previewPanel.classList.remove('visible');
          actionButtons.style.display = 'none';
          return;
        }

        previewPanel.classList.add('visible');
        actionButtons.style.display = 'flex';
        const optimizedCount = state.selectedFiles.filter(
          (entry) => entry.optimization.optimized,
        ).length;
        const bytesSaved = Math.max(
          0,
          state.optimizationStats.totalOriginalBytes - state.optimizationStats.totalOptimizedBytes,
        );
        let summary = `${state.selectedFiles.length} files selected`;
        if (optimizedCount > 0 && bytesSaved > 0) {
          summary += ` • ${optimizedCount} optimized (${bytesToSize(bytesSaved)} saved)`;
        }
        previewCount.textContent = summary;

        // Generate preview items
        previewList.innerHTML = '';
        state.selectedFiles.forEach((entry) => {
          const item = createPreviewItem(entry);
          previewList.appendChild(item);
        });
      }

      function createPreviewItem(entry) {
        const item = document.createElement('div');
        item.className = 'admin-preview-item';

        // Extract date and generate path - use folder structure if available
        const targetPath = generateTargetPath(
          entry.uploadFile.name,
          entry.dateInfo,
          entry.folderInfo,
        );
        const status = validateImport(entry);

        // Show folder indicator if file came from a folder
        const folderIndicator =
          entry.folderInfo && entry.folderInfo.sourceFolder
            ? `<span class="admin-folder-indicator">📁 ${entry.folderInfo.folderPath || entry.folderInfo.sourceFolder}</span>`
            : '';

        const optimizationLine = entry.optimization.optimized
          ? `<div class="admin-preview-optimization">Optimized ${bytesToSize(entry.optimization.originalSize)} → ${bytesToSize(entry.optimization.optimizedSize)} (${Math.round(entry.optimization.reduction * 100)}% smaller)</div>`
          : '';

        item.innerHTML = `
      <img class="admin-preview-thumbnail" src="${entry.previewUrl}" alt="${entry.uploadFile.name}">
      <div class="admin-preview-info">
        <div class="admin-preview-filename">${entry.uploadFile.name}${folderIndicator}</div>
        <div class="admin-preview-path">${targetPath}</div>
        ${optimizationLine}
      </div>
      <div class="admin-preview-status ${status.type}">${status.message}</div>
    `;

        return item;
      }

      // Date extraction (simplified version)
      function extractDateFromFilename(filename) {
        // Basic date extraction - in production, use enhanced-manifest-generator logic
        const patterns = [
          /^(\d{2})(\d{2})(\d{2})/, // YYMMDD
          /^(\d{4})(\d{2})(\d{2})/, // YYYYMMDD
          /(\d{2})-(\d{2})-(\d{2})/, // DD-MM-YY
        ];

        for (const pattern of patterns) {
          const match = filename.match(pattern);
          if (match) {
            let year, month, day;
            if (pattern === patterns[0]) {
              // YYMMDD
              year = parseInt(match[1]) + (parseInt(match[1]) > 50 ? 1900 : 2000);
              month = parseInt(match[2]);
              day = parseInt(match[3]);
            } else if (pattern === patterns[1]) {
              // YYYYMMDD
              year = parseInt(match[1]);
              month = parseInt(match[2]);
              day = parseInt(match[3]);
            } else {
              // DD-MM-YY
              day = parseInt(match[1]);
              month = parseInt(match[2]);
              year = parseInt(match[3]) + 2000;
            }

            if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
              return { year, month, day, date: new Date(year, month - 1, day) };
            }
          }
        }

        return null;
      }

      // Folder structure analysis
      function analyzeFolderStructure(files) {
        const folders = new Set();

        files.forEach((file) => {
          if (file.relativePath) {
            const pathParts = file.relativePath.split('/');
            if (pathParts.length > 1) {
              // Get the first folder name
              folders.add(pathParts[1]);
            }
          }
        });

        return {
          hasMultipleFolders: folders.size > 1,
          folderCount: folders.size,
          folders: Array.from(folders),
        };
      }

      // Extract folder information from file
      function extractFolderInfo(file) {
        if (!file.relativePath) {
          return { sourceFolder: null, folderPath: null };
        }

        const pathParts = file.relativePath.split('/');
        if (pathParts.length > 1) {
          return {
            sourceFolder: pathParts[1], // First folder name
            folderPath: pathParts.slice(1, -1).join('/'), // Full folder path without filename
            fullPath: file.relativePath,
          };
        }

        return { sourceFolder: null, folderPath: null };
      }

      const bytesToSize = (bytes) => {
        if (!bytes || bytes <= 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const exponent = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        const value = bytes / Math.pow(1024, exponent);
        return `${value.toFixed(value >= 10 || exponent === 0 ? 0 : 1)} ${units[exponent]}`;
      };

      const canvasToBlob = (canvas, mimeType, quality) =>
        new Promise((resolve) => {
          if (!canvas || typeof canvas.toBlob !== 'function') {
            resolve(null);
            return;
          }
          canvas.toBlob((blob) => resolve(blob), mimeType, quality);
        });

      const loadImageForProcessing = async (file) => {
        if (!file) throw new Error('No file provided');

        if ('createImageBitmap' in window) {
          try {
            const bitmap = await createImageBitmap(file);
            return {
              width: bitmap.width,
              height: bitmap.height,
              renderTo(canvas, width, height) {
                const ctx = canvas.getContext('2d');
                ctx.drawImage(bitmap, 0, 0, width, height);
              },
              dispose() {
                bitmap.close();
              },
            };
          } catch (error) {
            console.warn('createImageBitmap failed, falling back to Image()', error);
          }
        }

        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            resolve({
              width: img.naturalWidth,
              height: img.naturalHeight,
              renderTo(canvas, width, height) {
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
              },
              dispose() {
                URL.revokeObjectURL(url);
              },
            });
          };
          img.onerror = (err) => {
            URL.revokeObjectURL(url);
            reject(err);
          };
          img.src = url;
        });
      };

      async function optimizeImageIfNeeded(file) {
        const result = {
          optimized: false,
          file,
          originalSize: file.size,
          optimizedSize: file.size,
          originalDimensions: null,
          optimizedDimensions: null,
          reduction: 0,
          reason: '',
          error: null,
        };

        if (!CONFIG.optimization.enabled) {
          return result;
        }

        if (!CONFIG.optimization.supportedTypes.includes(file.type)) {
          return result;
        }

        try {
          const image = await loadImageForProcessing(file);
          if (!image.width || !image.height) {
            image.dispose();
            return result;
          }

          result.originalDimensions = { width: image.width, height: image.height };

          const longestEdge = Math.max(image.width, image.height);
          const shouldResize = longestEdge > CONFIG.optimization.maxDimension;
          const shouldCompress = file.size > CONFIG.optimization.sizeThreshold;

          if (!shouldResize && !shouldCompress) {
            image.dispose();
            return result;
          }

          const scale = shouldResize
            ? Math.min(CONFIG.optimization.maxDimension / longestEdge, 1)
            : 1;
          const targetWidth = Math.round(image.width * scale);
          const targetHeight = Math.round(image.height * scale);

          const canvas = document.createElement('canvas');
          canvas.width = targetWidth || image.width;
          canvas.height = targetHeight || image.height;
          image.renderTo(canvas, canvas.width, canvas.height);
          image.dispose();

          const outputType =
            file.type === 'image/png'
              ? 'image/png'
              : file.type === 'image/webp'
                ? 'image/webp'
                : 'image/jpeg';
          const quality = outputType === 'image/png' ? undefined : CONFIG.optimization.quality;

          const optimizedBlob = await canvasToBlob(canvas, outputType, quality);
          if (!optimizedBlob) {
            return result;
          }

          result.optimizedSize = optimizedBlob.size;
          result.optimizedDimensions = { width: canvas.width, height: canvas.height };
          result.reduction = file.size > 0 ? 1 - optimizedBlob.size / file.size : 0;

          if (
            result.optimizedSize >= file.size ||
            result.reduction < CONFIG.optimization.minReductionRatio
          ) {
            return result;
          }

          const optimizedFile = new File([optimizedBlob], file.name, {
            type: outputType,
            lastModified: Date.now(),
          });
          optimizedFile.relativePath = file.relativePath;
          optimizedFile.webkitRelativePath = file.webkitRelativePath;
          optimizedFile.__optimizedFrom = file.name;
          result.optimized = true;
          result.reason = shouldResize ? 'dimension' : 'size';
          result.file = optimizedFile;
          return result;
        } catch (error) {
          console.error('Image optimization failed:', error);
          result.error = error && error.message ? error.message : 'Optimization failed';
          return result;
        }
      }

      async function prepareFileEntry(file) {
        const folderInfo = extractFolderInfo(file);
        const dateInfo = extractDateFromFilename(file.name);
        const optimization = await optimizeImageIfNeeded(file);
        const uploadFile = optimization.file || file;
        if (file.relativePath) {
          uploadFile.relativePath = file.relativePath;
        }
        if (file.webkitRelativePath) {
          uploadFile.webkitRelativePath = file.webkitRelativePath;
        }

        const previewUrl = URL.createObjectURL(file);

        return {
          originalFile: file,
          uploadFile,
          relativePath:
            file.relativePath || (file.webkitRelativePath ? '/' + file.webkitRelativePath : ''),
          folderInfo,
          dateInfo,
          optimization,
          previewUrl,
        };
      }

      function releasePreviewUrls(entries) {
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          if (entry && entry.previewUrl) {
            try {
              URL.revokeObjectURL(entry.previewUrl);
            } catch (error) {
              console.warn('Failed to revoke preview URL', error);
            }
          }
        });
      }

      // Enhanced path generation with folder support
      function generateTargetPath(filename, dateInfo, folderInfo = null) {
        const portfolio = CONFIG.currentPortfolio;
        let basePath = CONFIG.portfolioStructure[portfolio] || '';

        if (!basePath) {
          return filename;
        }

        if (portfolio === 'Concert' || portfolio === 'Events') {
          const entityName =
            folderInfo && folderInfo.sourceFolder
              ? folderInfo.sourceFolder
              : extractEntityName(filename) || 'Unknown';
          const monthYear = dateInfo ? formatMonthYear(dateInfo.date) : 'Unknown Date';

          basePath = basePath
            .replace('{band}', entityName)
            .replace('{event}', entityName)
            .replace('{monthYear}', monthYear);
        } else if (portfolio === 'Journalism') {
          const category =
            folderInfo && (folderInfo.folderPath || folderInfo.sourceFolder)
              ? folderInfo.folderPath || folderInfo.sourceFolder
              : 'General';
          basePath = basePath.replace('{category}', category);
        } else if (portfolio === 'Nature') {
          let categoryPath =
            (folderInfo && folderInfo.folderPath) || extractEntityName(filename) || 'General';
          categoryPath = categoryPath.replace(/^\/+/, '');
          basePath = basePath.replace('{category}', categoryPath);
        }

        return basePath + filename;
      }

      function determineMappingValue(entry) {
        if (!entry) return null;
        const relPath = entry.relativePath || '';
        const parts = relPath.split('/').filter(Boolean);

        if (CONFIG.currentPortfolio === 'Nature') {
          if (entry.folderInfo && entry.folderInfo.folderPath) {
            return entry.folderInfo.folderPath;
          }
          return extractEntityName(entry.uploadFile.name) || 'General';
        }

        if (CONFIG.currentPortfolio === 'Journalism') {
          if (entry.folderInfo && (entry.folderInfo.folderPath || entry.folderInfo.sourceFolder)) {
            return entry.folderInfo.folderPath || entry.folderInfo.sourceFolder;
          }
        }

        const candidate = parts.find((part) => part && part !== entry.uploadFile.name);
        return candidate || extractEntityName(entry.uploadFile.name) || null;
      }

      function extractEntityName(filename) {
        // Extract band/event name from filename (basic implementation)
        const parts = filename.split('_');
        if (parts.length >= 2) {
          return parts[1]; // Assuming format like "250829_BandName_Photo.jpg"
        }
        return null;
      }

      function formatMonthYear(date) {
        const months = [
          'January',
          'February',
          'March',
          'April',
          'May',
          'June',
          'July',
          'August',
          'September',
          'October',
          'November',
          'December',
        ];
        return `${months[date.getMonth()]} ${date.getFullYear()}`;
      }

      // Enhanced import validation with folder support
      function validateImport(entry) {
        const { dateInfo, folderInfo, optimization } = entry;
        let type = 'success';
        let message = 'Ready to import';

        if (!dateInfo) {
          type = 'warning';
          message = 'No date found';
        }

        if (folderInfo && folderInfo.sourceFolder) {
          message = type === 'success' ? 'Folder organized' : `${message} (folder)`;
        }

        if (optimization && optimization.error) {
          type = 'error';
          message = optimization.error;
        }

        if (optimization && optimization.optimized) {
          const reductionPercent = Math.max(1, Math.round(optimization.reduction * 100));
          message += ` • Saved ${reductionPercent}%`;
        }

        return { type, message };
      }

      // Preview import with backend
      window.previewImport = async function () {
        if (!state.authenticated || state.selectedFiles.length === 0) {
          showNotification('No files selected for preview', 'warning');
          return;
        }

        const backendHealthy = await checkBackendHealth();
        if (!backendHealthy) {
          showNotification(
            'Backend server not running. Please start: node scripts/admin-import-backend.js',
            'error',
          );
          return;
        }

        const previewBtn = document.getElementById('previewBtn');
        previewBtn.disabled = true;
        previewBtn.textContent = '🔄 Previewing...';

        try {
          const formData = new FormData();
          formData.append('portfolioType', CONFIG.currentPortfolio);
          formData.append('adminPassword', CONFIG.adminPassword);
          formData.append('previewOnly', 'true');

          const folderMapping = {};

          state.selectedFiles.forEach((entry, index) => {
            formData.append('files', entry.uploadFile, entry.uploadFile.name);
            const relPath = entry.uploadFile.relativePath || entry.relativePath;
            if (relPath) {
              formData.append(`relativePath_${index}`, relPath);
            }
            const mappingValue = determineMappingValue(entry);
            if (mappingValue) {
              folderMapping[entry.uploadFile.name] = mappingValue;
            }
          });

          formData.append('folderMapping', JSON.stringify(folderMapping));

          const response = await fetch(`${CONFIG.backendUrl}/api/admin/import/preview`, {
            method: 'POST',
            body: formData,
          });

          const result = await response.json();

          if (response.ok) {
            showNotification(`Backend preview: ${result.files.length} files analyzed`, 'success');
            console.log('Backend preview result:', result);
          } else {
            if (response.status === 401) {
              throw new Error('Unauthorized - Check admin password');
            }
            throw new Error(result.error || 'Backend preview failed');
          }
        } catch (error) {
          console.error('Preview error:', error);
          if (error.message && error.message.includes('fetch')) {
            showNotification(
              'Backend server not responding. Please start: node scripts/admin-import-backend.js',
              'error',
            );
          } else {
            showNotification(`Preview failed: ${error.message}`, 'error');
          }
        } finally {
          previewBtn.disabled = false;
          previewBtn.textContent = '🔍 Preview Backend';
        }
      };

      // File processing with backend integration
      window.processFiles = async function () {
        if (!state.authenticated || state.processing || state.selectedFiles.length === 0) {
          return;
        }

        // Check backend health first
        const backendHealthy = await checkBackendHealth();
        if (!backendHealthy) {
          showNotification(
            'Backend server not running. Please start: node scripts/admin-import-backend.js',
            'error',
          );
          return;
        }

        state.processing = true;
        const processBtn = document.getElementById('processBtn');
        processBtn.disabled = true;
        processBtn.textContent = 'Importing...';

        // Show progress
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        progressContainer.style.display = 'block';
        progressBar.style.width = '10%';

        try {
          // Create FormData for backend upload
          const formData = new FormData();
          formData.append('portfolioType', CONFIG.currentPortfolio);
          formData.append('adminPassword', CONFIG.adminPassword);

          // Build folder mapping for band/entity names
          const folderMapping = {};
          state.selectedFiles.forEach((entry) => {
            const mappingValue = determineMappingValue(entry);
            if (mappingValue) {
              folderMapping[entry.uploadFile.name] = mappingValue;
            }
          });
          formData.append('folderMapping', JSON.stringify(folderMapping));

          // Add files and their metadata
          state.selectedFiles.forEach((entry, index) => {
            formData.append('files', entry.uploadFile, entry.uploadFile.name);
            const relPath = entry.uploadFile.relativePath || entry.relativePath;
            if (relPath) {
              formData.append(`relativePath_${index}`, relPath);
            }
          });

          progressBar.style.width = '30%';

          // Call backend import API
          const response = await fetch(`${CONFIG.backendUrl}/api/admin/import/execute`, {
            method: 'POST',
            body: formData,
          });

          progressBar.style.width = '70%';

          if (!response.ok) {
            const errorData = await response.json();
            if (response.status === 401) {
              throw new Error('Unauthorized - Check admin password configuration');
            }
            throw new Error(errorData.error || 'Import failed');
          }

          const result = await response.json();

          // Update progress to completion
          progressBar.style.width = '100%';

          // Show results
          setTimeout(() => {
            state.processing = false;
            processBtn.disabled = false;
            processBtn.textContent = '📁 Import Files';
            progressContainer.style.display = 'none';

            const successCount = result.successCount || 0;
            const errorCount = result.errorCount || 0;

            if (successCount > 0) {
              showNotification(
                `Successfully imported ${successCount} files to ${CONFIG.currentPortfolio} portfolio!`,
                'success',
              );

              // Show detailed results if there were errors
              if (errorCount > 0) {
                setTimeout(() => {
                  showNotification(
                    `${errorCount} files failed to import. Check console for details.`,
                    'warning',
                  );
                  console.log('Import results:', result.results);
                }, 2000);
              }
            } else {
              showNotification('No files were imported successfully', 'error');
              console.error('Import failed:', result);
            }

            clearFiles();

            // Trigger manifest regeneration notification
            if (successCount > 0 && CONFIG.autoManifest) {
              setTimeout(() => {
                showNotification('Manifest regeneration triggered automatically', 'success');
              }, 3000);
            }
          }, 1000);
        } catch (error) {
          console.error('Import error:', error);

          state.processing = false;
          processBtn.disabled = false;
          processBtn.textContent = '📁 Import Files';
          progressContainer.style.display = 'none';

          showNotification(`Import failed: ${error.message}`, 'error');
        }
      };

      window.clearFiles = function () {
        releasePreviewUrls(state.selectedFiles);
        state.selectedFiles = [];
        state.optimizationStats = {
          optimized: 0,
          totalOriginalBytes: 0,
          totalOptimizedBytes: 0,
        };
        document.getElementById('fileInput').value = '';
        document.getElementById('fileInputSingle').value = '';
        document.getElementById('previewPanel').classList.remove('visible');
        document.getElementById('actionButtons').style.display = 'none';
      };

      // Notifications
      function showNotification(message, type = 'success') {
        const notification = document.createElement('div');
        notification.className = `admin-notification ${type}`;
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(() => {
          notification.remove();
        }, 4000);
      }

      // Update preview with backend data
      function updatePreviewFromBackend(backendResult) {
        const previewList = document.getElementById('previewList');
        const previewCount = document.getElementById('previewCount');

        previewCount.textContent = `${backendResult.fileCount} files (backend validated)`;
        previewList.innerHTML = '';

        backendResult.preview.forEach((item) => {
          const previewItem = document.createElement('div');
          previewItem.className = 'admin-preview-item';

          // Find the original file for thumbnail
          const matchedEntry = state.selectedFiles.find(
            (entry) => entry.uploadFile.name === item.filename,
          );
          const thumbnailSrc = matchedEntry ? matchedEntry.previewUrl : '';

          const folderIndicator =
            item.entityName !== 'Unknown'
              ? `<span class="admin-folder-indicator">📁 ${item.entityName}</span>`
              : '';

          const statusClass = item.status === 'ready' ? 'success' : 'warning';
          const statusText = item.status === 'ready' ? 'Backend Ready' : 'Needs Review';

          previewItem.innerHTML = `
        <img class="admin-preview-thumbnail" src="${thumbnailSrc}" alt="${item.filename}">
        <div class="admin-preview-info">
          <div class="admin-preview-filename">${item.filename}${folderIndicator}</div>
          <div class="admin-preview-path">${item.targetPath}</div>
        </div>
        <div class="admin-preview-status ${statusClass}">${statusText}</div>
      `;

          previewList.appendChild(previewItem);
        });
      }

      // Admin info modal
      window.showAdminInfo = function () {
        const info = `
Admin Portfolio Importer v${CONFIG.version}

Backend: ${CONFIG.backendUrl}
Current Portfolio: ${CONFIG.currentPortfolio}
Auto Manifest: ${CONFIG.autoManifest ? 'Enabled' : 'Disabled'}
Preview Mode: ${CONFIG.previewMode ? 'Enabled' : 'Disabled'}
Optimization: ${CONFIG.optimization.enabled ? 'Enabled' : 'Disabled'}
Max Files: ${CONFIG.maxFiles}
Max File Size: ${CONFIG.maxFileSize / (1024 * 1024)}MB

Files Selected: ${state.selectedFiles.length}
Optimized During Selection: ${state.optimizationStats.optimized}
Estimated Savings: ${bytesToSize(Math.max(0, state.optimizationStats.totalOriginalBytes - state.optimizationStats.totalOptimizedBytes))}
Authentication: ${state.authenticated ? 'Active' : 'Required'}
    `;
        alert(info);
      };

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeWidget);
      } else {
        initializeWidget();
      }
    })();
  </script>
</div>
