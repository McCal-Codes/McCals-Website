  <style>
    :root {

    .mcc-hero-widget {

    .mcc-hero-shell {
      position: relative;
      width: 100vw;
      left: 50%;
      transform: translateX(-50%);
      color: inherit;
      overflow: hidden;
      background: transparent;
    }

    :root[data-mcc-nav='active'] .mcc-hero-shell {

    .mcc-hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .mcc-hero__stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: inherit;
    }

    .mcc-hero__slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.04);
      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
      animation: mcc-hero-cycle 48s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      animation-fill-mode: both;
    }

    .mcc-hero__slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mcc-hero__slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(4, 4, 12, 0.6) 70%,
        rgba(5, 5, 10, 0.92) 100%
      );
    }

    .mcc-hero__caption {
      position: absolute;
      left: 50%;
      bottom: clamp(42px, 9vw, 128px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      z-index: 2;
    }

    .mcc-hero__slide h2 {
      margin: 0;
      font-family: 'Libre Baskerville', 'Georgia', serif;
      font-size: clamp(1.55rem, 3.6vw, 2.85rem);
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.02em;
    }

    .mcc-hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2.6rem;
      border-radius: 999px;
      background: rgba(10, 10, 14, 0.88);
      color: #f8f8f8;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
    }

    .mcc-hero__cta:hover,
    .mcc-hero__cta:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.95);
      color: #0a0a0f;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.4);
      outline: none;
    }

    .mcc-hero__slide:nth-child(1) {
      --delay: 0s;
    }
    .mcc-hero__slide:nth-child(2) {
      --delay: 8s;
    }
    .mcc-hero__slide:nth-child(3) {
      --delay: 16s;
    }
    .mcc-hero__slide:nth-child(4) {
      --delay: 24s;
    }
    .mcc-hero__slide:nth-child(5) {
      --delay: 32s;
    }
    .mcc-hero__slide:nth-child(6) {
      --delay: 40s;
    }

    @keyframes mcc-hero-cycle {
      0% {
        opacity: 0;
        transform: scale(1.04);
      }
      4% {
        opacity: 1;
        transform: scale(1);
      }
      16% {
        opacity: 1;
        transform: scale(1);
      }
      20% {
        opacity: 0;
        transform: scale(1.02);
      }
      100% {
        opacity: 0;
        transform: scale(1.02);
      }
    }

    @media (max-width: 768px) {
      .mcc-hero__caption {
        bottom: clamp(32px, 12vw, 88px);

      }
    }

        animation: none;
        opacity: 0;
        transform: none;
      }
      .mcc-hero__slide:first-child {

      }
    }
