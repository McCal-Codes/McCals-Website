<!-- Core JavaScript - Optimized for performance -->
<script>
  // Performance-optimized core functionality
  (function () {
    'use strict';

    // Configuration
    const CONFIG = {
      scrollThreshold: 100,
      cacheDuration: 24 * 60 * 60 * 1000, // 24 hours
      throttleDelay: 16, // ~60fps
    };

    // DOM references
    const nav = document.getElementById('mainNav');
    const navMenu = document.getElementById('navMenu');
    const mobileToggle = document.getElementById('mobileToggle');

    // State management
    let state = {
      lastScrollY: 0,
      isHidden: false,
      isMobileMenuOpen: false,
      currentPath: window.location.pathname,
      cacheKey: 'nav-state-v1.7.0',
    };

    // Utility functions
    const log = DEBUG ? console.log.bind(console, '[Nav v1.7.0]') : () => {};
    const throttle = (func, delay) => {
      let timeoutId;
      return (...args) => {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func.apply(null, args), delay);
      };
    };

    // Navigation hide/show on scroll
    const handleScroll = throttle(() => {
      const currentScrollY = window.scrollY;

      if (Math.abs(currentScrollY - state.lastScrollY) < CONFIG.scrollThreshold) return;

      if (currentScrollY > state.lastScrollY && currentScrollY > CONFIG.scrollThreshold) {
        // Scrolling down - hide nav
        if (!state.isHidden) {
          nav.classList.add('mcc-nav--hidden');
          state.isHidden = true;
          log('Navigation hidden');
        }
      } else {
        // Scrolling up - show nav
        if (state.isHidden) {
          nav.classList.remove('mcc-nav--hidden');
          state.isHidden = false;
          log('Navigation shown');
        }
      }

      state.lastScrollY = currentScrollY;
    }, CONFIG.throttleDelay);

    // Mobile menu toggle
    const toggleMobileMenu = () => {
      state.isMobileMenuOpen = !state.isMobileMenuOpen;
      navMenu.classList.toggle('show', state.isMobileMenuOpen);
      mobileToggle.classList.toggle('active', state.isMobileMenuOpen);
      log(`Mobile menu ${state.isMobileMenuOpen ? 'opened' : 'closed'}`);
    };

    // Set active navigation item
    const setActiveNavItem = () => {
      const navLinks = navMenu.querySelectorAll('a');
      navLinks.forEach((link) => {
        link.classList.remove('active');
        if (link.getAttribute('href') === state.currentPath) {
          link.classList.add('active');
        }
      });
    };

    // Dropdown menu handling
    const initDropdowns = () => {
      const dropdownTriggers = navMenu.querySelectorAll('li:has(.mcc-nav__dropdown) > a');

      dropdownTriggers.forEach((trigger) => {
        const dropdown = trigger.nextElementSibling;

        trigger.addEventListener('mouseenter', () => {
          dropdown.classList.add('show');
        });

        trigger.addEventListener('mouseleave', () => {
          setTimeout(() => {
            if (!dropdown.matches(':hover')) {
              dropdown.classList.remove('show');
            }
          }, 100);
        });

        dropdown.addEventListener('mouseenter', () => {
          dropdown.classList.add('show');
        });

        dropdown.addEventListener('mouseleave', () => {
          dropdown.classList.remove('show');
        });
      });
    };

    // SEO structured data
    const addStructuredData = () => {
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'SiteNavigationElement',
        name: 'McCal Media Navigation',
        url: window.location.origin,
        provider: {
          '@type': 'Organization',
          name: 'McCal Media',
          url: window.location.origin,
        },
      });
      document.head.appendChild(script);
      log('Structured data added for navigation');
    };

    // Load non-critical features
    const loadDeferredFeatures = () => {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          // Load analytics tracking if needed
          if (window.location.search.includes('debug')) {
            import('./analytics-features.js').catch(() => log('Analytics features not available'));
          }
        });
      }
    };

    // Initialize
    const init = () => {
      try {
        // Event listeners
        window.addEventListener('scroll', handleScroll, { passive: true });
        mobileToggle.addEventListener('click', toggleMobileMenu);

        // Initialize features
        setActiveNavItem();
        initDropdowns();
        addStructuredData();
        loadDeferredFeatures();

        log('Navigation widget initialized');
      } catch (error) {
        console.error('Failed to initialize navigation widget:', error);
      }
    };

    // Start the application
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
