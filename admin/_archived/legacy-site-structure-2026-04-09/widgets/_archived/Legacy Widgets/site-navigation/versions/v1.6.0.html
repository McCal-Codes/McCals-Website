<!-- McCal Navigation Widget v1.6 -->
<div class="mcc-nav-widget" data-widget-version="1.6-nav">
  <style>
    :root {
      --mcc-nav-height: 0px;
    }

    .mcc-nav-widget,
    .mcc-nav-widget * {
      box-sizing: border-box;
    }

    .mcc-nav-widget {
      display: block;
      width: 100%;
      color: #f5f5f5;
      font-family: 'Inter','Segoe UI',system-ui,sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    html[data-mcc-nav="active"] #page {
      padding-top: 0 !important;
    }

    html[data-mcc-nav="active"] .Header,
    html[data-mcc-nav="active"] header[role="banner"],
    html[data-mcc-nav="active"] [data-test="header"] {
      display: none !important;
      visibility: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .mcc-nav-shell {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 1000;
    }

    .mcc-nav {
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: none;
      padding: clamp(32px, 7vw, 72px) clamp(44px, 8vw, 128px) clamp(12px, 3vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(18px, 5vw, 72px);
      color: inherit;
      background: transparent;
      pointer-events: auto;
      z-index: 1000;

      transition: background 0.25s ease, border-bottom-color 0.25s ease, backdrop-filter 0.25s ease;
    }

    .mcc-nav.is-scrolled {
      background: rgba(10, 10, 16, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .mcc-nav__brand a {
      font-family: 'Libre Baskerville','Georgia',serif;
      font-size: clamp(1.35rem, 2.6vw, 1.9rem);
      font-weight: 600;
      color: inherit;
      text-decoration: none;
      letter-spacing: 0.015em;
      text-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .mcc-nav__menu {
      display: flex;
      align-items: center;
      gap: clamp(1.2rem, 3vw, 2.8rem);
    }

    .mcc-nav__links {
      list-style: none;
      display: flex;
      gap: inherit;
      margin: 0;
      padding: 0;
      align-items: center;
    }

    .mcc-nav__link {
      position: relative;
    }

    .mcc-nav__link a {
      color: rgba(255, 255, 255, 0.86);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding-bottom: 6px;
      display: inline-flex;
      align-items: center;
      transition: color 0.2s ease;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .mcc-nav__link a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: currentColor;
      border-radius: 999px;
      transform: scaleX(0);
      transform-origin: left;
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .mcc-nav__link a:hover,
    .mcc-nav__link a:focus-visible {
      color: #ffffff;
      outline: none;
    }

    .mcc-nav__link a:hover::after,
    .mcc-nav__link a:focus-visible::after,
    .mcc-nav__link a[aria-current="page"]::after {
      transform: scaleX(1);
      opacity: 1;
    }

    .mcc-nav__toggle {
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      background: rgba(10, 10, 18, 0.52);
      color: rgba(255, 255, 255, 0.92);
      width: 46px;
      height: 46px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .mcc-nav__toggle:hover,
    .mcc-nav__toggle:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.34);
      color: #ffffff;
      outline: none;
    }

    .mcc-nav__toggle-box {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      justify-content: space-between;
      width: 22px;
      height: 14px;
    }

    .mcc-nav__toggle-line {
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      mix-blend-mode: normal;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .mcc-nav.is-scrolled .mcc-nav__toggle {
      background: rgba(10, 10, 16, 0.78);
      border-color: rgba(255, 255, 255, 0.26);
    }
    .mcc-nav__brand a,
    .mcc-nav__link a {
      color: #f5f5f5;
      text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      mix-blend-mode: normal;
    }

    .mcc-nav__toggle {
      color: #f5f5f5;
      mix-blend-mode: normal;
    }

    .mcc-nav--on-hero .mcc-nav__brand a,
    .mcc-nav--on-hero .mcc-nav__link a {
      color: #ffffff;
      mix-blend-mode: difference;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.6), 0 0 2px rgba(255, 255, 255, 0.5);
    }

    .mcc-nav--on-hero .mcc-nav__toggle {
      color: #ffffff;
      mix-blend-mode: difference;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
    }

    .mcc-nav--on-hero .mcc-nav__toggle-line {
      mix-blend-mode: difference;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
    }

    .mcc-nav.is-scrolled .mcc-nav__brand a,
    .mcc-nav.is-scrolled .mcc-nav__link a,
    .mcc-nav.is-scrolled .mcc-nav__toggle,
    .mcc-nav--menu-open .mcc-nav__brand a,
    .mcc-nav--menu-open .mcc-nav__link a,
    .mcc-nav--menu-open .mcc-nav__toggle {
      color: #f5f5f5;
      text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      mix-blend-mode: normal;
    }

    .mcc-nav.is-scrolled .mcc-nav__toggle-line,
    .mcc-nav--menu-open .mcc-nav__toggle-line {
      mix-blend-mode: normal;
    }
    @media (max-width: 1024px) {
      .mcc-nav {
        gap: clamp(16px, 6vw, 48px);
      }
    }

    @media (max-width: 768px) {
      .mcc-nav {
        padding: clamp(26px, 8vw, 48px) clamp(26px, 8vw, 64px) clamp(12px, 4vw, 24px);
      }

      .mcc-nav__toggle {
        display: inline-flex;
      }

      .mcc-nav__menu {
        position: absolute;
        top: calc(100% + clamp(12px, 3vw, 20px));
        right: clamp(20px, 6vw, 40px);
        width: min(240px, 82vw);
        display: none;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: clamp(16px, 5vw, 24px);
        border-radius: 16px;
        background: rgba(10, 10, 14, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        z-index: 12;
      }

      .mcc-nav__links {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
      }

      .mcc-nav__link a {
        width: 100%;
        padding: 6px 0;
      }

      .mcc-nav.mcc-nav--menu-open .mcc-nav__menu {
        display: flex;
      }
    }

    @media (max-width: 520px) {
      .mcc-nav__brand a {
        font-size: clamp(1.2rem, 5.8vw, 1.6rem);
      }

      .mcc-nav {
        padding-left: clamp(20px, 7vw, 44px);
        padding-right: clamp(20px, 7vw, 44px);
      }
    }
  </style>

  <div class="mcc-nav-shell">
    <nav class="mcc-nav" aria-label="Primary navigation">
      <div class="mcc-nav__brand"><a href="/" data-match="^/$">Caleb McCartney</a></div>
      <button class="mcc-nav__toggle" type="button" aria-expanded="false" aria-controls="mcc-nav-links">
        <span class="sr-only">Toggle navigation</span>
        <span class="mcc-nav__toggle-box" aria-hidden="true">
          <span class="mcc-nav__toggle-line"></span>
          <span class="mcc-nav__toggle-line"></span>
          <span class="mcc-nav__toggle-line"></span>
        </span>
      </button>
      <div class="mcc-nav__menu">
        <ul class="mcc-nav__links" id="mcc-nav-links" role="list">
          <li class="mcc-nav__link"><a href="/" data-match="^/$">Work</a></li>
          <li class="mcc-nav__link"><a href="/podcast" data-match="^/podcast">Podcast</a></li>
          <li class="mcc-nav__link"><a href="/about" data-match="^/about">About</a></li>
        </ul>
      </div>
    </nav>
  </div>

  <script>
    (function(){
      const root = document.currentScript ? document.currentScript.closest('.mcc-nav-widget') : null;
      if (!root || root.dataset.mounted === 'true') return;
      root.dataset.mounted = 'true';

      document.documentElement.dataset.mccNav = 'active';

      const killSelectors = ['.Header','header[role="banner"]','[data-test="header"]'];
      killSelectors.forEach(sel => {
        document.querySelectorAll(sel).forEach(node => {
          node.setAttribute('data-mcc-nav-replaced','true');
          node.style.display = 'none';
          node.setAttribute('aria-hidden','true');
        });
      });

      const nav = root.querySelector('.mcc-nav');
      if (!nav) return;

      const toggle = nav.querySelector('.mcc-nav__toggle');
      const links = nav.querySelectorAll('.mcc-nav__links a');

      const closeMobile = function() {
        nav.classList.remove('mcc-nav--menu-open');
        if (toggle) toggle.setAttribute('aria-expanded','false');
      };

      if (toggle) {
        toggle.addEventListener('click', function(){
          const willOpen = !nav.classList.contains('mcc-nav--menu-open');
          nav.classList.toggle('mcc-nav--menu-open', willOpen);
          this.setAttribute('aria-expanded', String(willOpen));
        });
      }

      links.forEach(anchor => anchor.addEventListener('click', closeMobile));

      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeMobile();
        requestAnimationFrame(updateNavHeight);
      });

      const highlight = function() {
        const path = window.location.pathname;
        nav.querySelectorAll('[data-match]').forEach(anchor => {
          const pattern = anchor.getAttribute('data-match');
          anchor.removeAttribute('aria-current');
          if (!pattern) return;
          try {
            if (new RegExp(pattern).test(path)) {
              anchor.setAttribute('aria-current','page');
            }
          } catch (err) {
            console.warn('[mcc-nav] invalid regex', pattern, err);
          }
        });
      };
      highlight();
      const handleRoute = function(){
        highlight();
        closeMobile();
      };
      window.addEventListener('SquarespaceRoutingComplete', handleRoute);

      const heroRoot = document.querySelector('[data-mcc-hero-root]');
      const setHeroState = function(isActive) {
        nav.classList.toggle('mcc-nav--on-hero', Boolean(isActive));
      };

      if (heroRoot) {
        setHeroState(true);
        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver(entries => {
            const isActive = entries.some(entry => entry.isIntersecting && entry.intersectionRatio > 0);
            setHeroState(isActive);
          }, { rootMargin: '-20% 0px 0px 0px', threshold: [0, 0.15, 0.4] });
          observer.observe(heroRoot);
          requestAnimationFrame(() => {
            const rect = heroRoot.getBoundingClientRect();
            setHeroState(rect.top < window.innerHeight && rect.bottom > 0);
          });
        } else {
          setHeroState(true);
        }
      } else {
        setHeroState(false);
      }


      const updateNavHeight = function(){
        const height = nav.getBoundingClientRect().height;
        document.documentElement.style.setProperty('--mcc-nav-height', height + 'px');
      };
      requestAnimationFrame(updateNavHeight);
      window.addEventListener('load', updateNavHeight);

      const applyScrollState = function(){
        const threshold = nav.getBoundingClientRect().height * 0.35;
        nav.classList.toggle('is-scrolled', window.scrollY > threshold);
      };
      applyScrollState();
      window.addEventListener('scroll', applyScrollState, { passive: true });
    })();
  </script>
</div>
<!-- /McCal Navigation Widget -->
