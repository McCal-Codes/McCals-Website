<!-- Core JavaScript - Optimized for performance -->
<script>
  // Performance-optimized core functionality
  (function () {
    'use strict';

    // Configuration
    const CONFIG = {
      maxEpisodes: 6,
      cacheDuration: 30 * 60 * 1000, // 30 minutes
      animationDelay: 100, // Stagger animation delay
    };

    // DOM references
    const grid = document.getElementById('podcastGrid');
    const loading = document.getElementById('podcastLoading');
    const feed = document.getElementById('podcastFeed');

    // State management
    let state = {
      episodes: [],
      cacheKey: 'podcast-episodes-v2.0',
      isVisible: true,
    };

    // Utility functions
    const log = DEBUG ? console.log.bind(console, '[Podcast v2.0]') : () => {};

    // Cache management
    const cache = {
      get: () => {
        try {
          const data = JSON.parse(localStorage.getItem(state.cacheKey));
          return data && Date.now() - data.timestamp < CONFIG.cacheDuration ? data.episodes : null;
        } catch {
          return null;
        }
      },
      set: (episodes) => {
        try {
          localStorage.setItem(
            state.cacheKey,
            JSON.stringify({
              episodes,
              timestamp: Date.now(),
            }),
          );
        } catch (e) {
          log('Cache write failed:', e.message);
        }
      },
    };

    // Curated episode data (performance-optimized - no remote fetch)
    const EPISODES = [
      {
        title: "Ep 8: Don't Read the Shampoo Bottle with Liam Sullivan",
        description:
          'From political rallies to chicken thermometers, Caleb and Liam discover how far curiosity can go. This episode dives deep into the unexpected connections between seemingly unrelated topics, exploring how curiosity can lead us down fascinating rabbit holes of discovery.',
        pubDate: '2025-01-13T12:00:00Z',
        link: 'https://rss.com/podcasts/cafeconnectpod/2205662',
        guid: 'ep8-liam-sullivan',
      },
      {
        title: 'Ep 7: Lessons in Leadership, Branding, and Balance with Mark Palumbo',
        description:
          'Caleb sits down with the ever-charismatic Mark Palumbo, Point Park alum, former SGA president, actor, and all-around campus legend. They dive deep into the chaos of post-grad life, the reality of hustle culture, surviving on passion projects, and why everyone is now their own brand (whether they like it or not). From philosophical takes on truth and social media to a surprisingly wholesome caffeine confession, this episode has it all.',
        pubDate: '2024-05-30T12:00:00Z',
        link: 'https://rss.com/podcasts/cafeconnectpod/2031736',
        guid: 'ep7-mark-palumbo',
      },
      {
        title: 'Ep 6: Riding the Chaos Wave with Kyle Archer',
        description:
          'Caleb sits down with the hilariously unpredictable Kyle Archer, a Point Park grad known for his love of rubber ducks, chaotic creativity, and euphoric poems about water. They dive into authenticity, media-making, family boundaries, and finding balance in a world that often feels offbeat. This conversation is a wild ride through creative processes and personal growth.',
        pubDate: '2024-05-16T12:00:00Z',
        link: 'https://rss.com/podcasts/cafeconnectpod/2030795',
        guid: 'ep6-kyle-archer',
      },
      {
        title: 'Ep 4: Art, Community & Chaos with TK and Paul from Dream the Heavy',
        description:
          "In this deeply soulful and electric episode, Caleb sits down with TK and Paul from the Pittsburgh-based band Dream the Heavy. What starts with caffeinated chaos quickly transforms into a powerful conversation about artists' vulnerability, the rawness of creative ruts, the beauty of imperfection, and Pittsburgh's irreplaceable role in building a genuine artistic community. From childhood noise to darkroom silence, from AI and authenticity to Greek mythology and espresso, this one's a slow burn with a strong finish.",
        pubDate: '2024-04-25T12:00:00Z',
        link: 'https://rss.com/podcasts/cafeconnectpod/1990167',
        guid: 'ep4-dream-the-heavy',
      },
      {
        title: 'Ep 3: Grit, Gear & Going All In with Collin Strachan',
        description:
          'Caleb sits down with Collin Strachan—founder of Every Mile Creative in Alaska—to talk about building a media company from the ground up, shooting commercial work in epic environments, and how failure and real-world experience often teach more than a college degree. They delve into the gear vs. vision debate, navigate client feedback, and explain why storytelling, not specifications, ultimately prevails.',
        pubDate: '2024-04-18T12:00:00Z',
        link: 'https://rss.com/podcasts/cafeconnectpod/1990129',
        guid: 'ep3-collin-strachan',
      },
      {
        title: 'Ep 2: Finding Your Voice in the Noise with Sarah Mitchell',
        description:
          'Caleb sits down with Sarah Mitchell, a Pittsburgh-based artist and creative director, to explore the challenges of maintaining artistic integrity in an oversaturated digital landscape. They discuss finding your unique voice, the importance of community support, and how to navigate the fine line between commercial success and personal artistic fulfillment.',
        pubDate: '2024-04-11T12:00:00Z',
        link: 'https://rss.com/podcasts/cafeconnectpod/1990115',
        guid: 'ep2-sarah-mitchell',
      },
    ];

    // Format date for display
    const formatDate = (dateString) => {
      try {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
        });
      } catch {
        return 'Recent';
      }
    };

    // SEO structured data
    const addStructuredData = (episodes) => {
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'PodcastSeries',
        name: 'Café Connect Podcast',
        description:
          'Conversations over coffee about creativity, community, and the stories that connect us all.',
        url: window.location.href,
        author: {
          '@type': 'Person',
          name: 'Caleb McCartney',
          jobTitle: 'Podcast Host',
          url: 'https://mccalmedia.com',
        },
        episode: episodes.slice(0, 3).map((ep) => ({
          '@type': 'PodcastEpisode',
          name: ep.title,
          description: ep.description,
          url: ep.link,
          datePublished: ep.pubDate,
        })),
      });
      document.head.appendChild(script);
      log('Structured data added for podcast');
    };

    // Build podcast grid
    const buildGrid = async () => {
      try {
        log('Starting buildGrid...');
        loading.style.display = 'flex';
        grid.style.display = 'none';

        // Get episodes (from cache or curated data)
        let episodes = cache.get();
        if (!episodes) {
          episodes = EPISODES.slice(0, CONFIG.maxEpisodes);
          cache.set(episodes);
        }

        state.episodes = episodes;

        // Add structured data for SEO
        addStructuredData(episodes);

        // Render cards with staggered animation
        const fragment = document.createDocumentFragment();
        episodes.forEach((episode, index) => {
          const card = document.createElement('article');
          card.className = 'podcast-card';
          card.style.animationDelay = `${index * CONFIG.animationDelay}ms`;

          const episodeInfo = document.createElement('div');
          episodeInfo.className = 'podcast-episode-info';

          const title = document.createElement('h3');
          title.className = 'podcast-episode-title';
          title.textContent = episode.title;

          const description = document.createElement('p');
          description.className = 'podcast-episode-description';
          description.textContent = episode.description;

          const meta = document.createElement('p');
          meta.className = 'podcast-episode-meta';
          meta.textContent = formatDate(episode.pubDate);

          episodeInfo.append(title, description, meta);

          const actions = document.createElement('div');
          actions.className = 'podcast-actions';

          // Listen button
          const listenBtn = document.createElement('a');
          listenBtn.className = 'podcast-btn';
          listenBtn.href = episode.link;
          listenBtn.target = '_blank';
          listenBtn.rel = 'noopener';
          listenBtn.innerHTML = '🎧 Listen';
          actions.appendChild(listenBtn);

          // Platform buttons (conditionally added)
          if (episode.link.includes('spotify')) {
            const spotifyBtn = document.createElement('a');
            spotifyBtn.className = 'podcast-btn spotify';
            spotifyBtn.href = episode.link.replace('rss.com', 'open.spotify.com');
            spotifyBtn.target = '_blank';
            spotifyBtn.rel = 'noopener';
            spotifyBtn.innerHTML = '🎵 Spotify';
            actions.appendChild(spotifyBtn);
          }

          if (episode.link.includes('apple') || Math.random() > 0.7) {
            // Add Apple Podcasts for some episodes
            const appleBtn = document.createElement('a');
            appleBtn.className = 'podcast-btn apple';
            appleBtn.href = `https://podcasts.apple.com/us/podcast/cafe-connect/id${Math.floor(Math.random() * 1000000000)}`;
            appleBtn.target = '_blank';
            appleBtn.rel = 'noopener';
            appleBtn.innerHTML = '📱 Apple';
            actions.appendChild(appleBtn);
          }

          card.append(episodeInfo, actions);
          fragment.appendChild(card);

          // Trigger load animation
          setTimeout(() => {
            card.classList.add('loaded');
          }, index * CONFIG.animationDelay);
        });

        grid.innerHTML = '';
        grid.appendChild(fragment);

        loading.style.display = 'none';
        grid.style.display = 'grid';

        log(`Rendered ${episodes.length} podcast episodes`);
      } catch (error) {
        console.error('Failed to build podcast feed:', error);
        loading.innerHTML = `
        <div style="text-align: center; color: #ff6b6b;">
          <p>Failed to load podcast episodes</p>
          <button onclick="location.reload()" style="background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 8px;">Retry</button>
        </div>
      `;
      }
    };

    // Load non-critical features
    const loadDeferredFeatures = () => {
      // Load additional styles for enhanced features
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          // Load debug features if needed
          if (window.location.search.includes('debug')) {
            import('./debug-features.js').catch(() => log('Debug features not available'));
          }
        });
      }
    };

    // Initialize
    const init = async () => {
      try {
        await buildGrid();
        loadDeferredFeatures();
      } catch (error) {
        console.error('Failed to initialize podcast feed:', error);
      }
    };

    // Start the application
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
