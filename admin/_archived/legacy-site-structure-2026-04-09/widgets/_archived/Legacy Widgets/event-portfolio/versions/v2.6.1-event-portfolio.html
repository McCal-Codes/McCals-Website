<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>McCal Media - Event Portfolio v2.6.1</title>
<style>:root{--fg:#0e0f10;--bg:#fff;--line:#e7e7e7;--muted:#6b7280;--accent:#4d79ff;--demo:#00d4aa}
@media (prefers-color-scheme:dark){:root{--fg:#f3f4f6;--bg:#0b0c0f;--line:#22252a;--muted:#a3aab7;--accent:#7aa0ff}}
body{background:var(--bg);color:var(--fg);margin:0;font:400 14px/1.4 ui-sans-serif,system-ui}
.events-portfolio{max-width:1200px;margin:48px auto;padding:0 16px 96px;text-align:center}
.events-heading{font:800 28px/1.2 ui-sans-serif,system-ui;margin:0 0 8px}
.events-sub{margin:0 0 18px;color:var(--muted);font:400 15px/1.45 ui-sans-serif,system-ui}

/* Enhanced version indicator integrated in heading */
.version-indicator {
  display: inline-block;
  margin-left: 12px;
  font: 600 14px/1.2 ui-sans-serif,system-ui;
  color: rgba(128,128,128,.7);
  cursor: pointer;
  transition: all .3s ease;
  background: rgba(0,0,0,.08);
  padding: 4px 8px;
  border-radius: 4px;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(128,128,128,.2);
  vertical-align: baseline;
}
.version-indicator:hover {
  color: var(--accent);
  background: rgba(77,121,255,.12);
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.filter-btn{border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 12px;border-radius:999px;font:600 12px ui-sans-serif,system-ui;cursor:pointer;opacity:.85;transition:background .2s,border-color .2s,opacity .2s}
.filter-btn[aria-pressed="true"],.filter-btn:hover{opacity:1;border-color:var(--fg)}
.loading{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 0;color:var(--muted)}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{column-width:300px;column-gap:16px;text-align:left;opacity:0;transition:opacity .3s;margin-bottom:32px}
.grid.loaded{opacity:1}
@media (max-width:960px){.grid{column-width:260px}}
@media (max-width:680px){.grid{column-width:100%}}
.card{position:relative;display:inline-block;width:100%;margin:0 0 16px;background:#0b0c0f;border:none;border-radius:12px;overflow:hidden;cursor:pointer;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;box-sizing:border-box;opacity:0;transform:translateY(12px);transition:all .25s}
.card.loaded{opacity:1;transform:translateY(0)}
.card img{width:100%;height:auto;display:block;object-fit:contain}
.card.demo-fallback{background:linear-gradient(135deg,rgba(10,10,10,0.95),rgba(200,200,200,0.6));color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px/1.4 ui-sans-serif,system-ui;padding:40px;text-align:center;min-height:clamp(180px,30vw,280px)}
.info{position:absolute;inset:auto 0 0 0;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.7));color:#fff}
.title{margin:0;font:800 14px/1.2 ui-sans-serif,system-ui}
.meta{margin:4px 0 0;font:600 11px/1.2 ui-sans-serif,system-ui;opacity:.9}
.badge{position:absolute;top:8px;left:8px;font:700 10px ui-sans-serif,system-ui;color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);padding:3px 6px;border-radius:10px}

/* Hidden scrollbars for immersive experience */
body, html {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* Internet Explorer/Edge */
}
body::-webkit-scrollbar,
html::-webkit-scrollbar {
  display: none; /* Chrome/Safari/WebKit */
}

/* Comprehensive lightbox styles */
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:2147483647;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:all .25s ease-out}
.lightbox.active{opacity:1;visibility:visible}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.4);

/* Fixed lightbox image stretching with proper aspect ratio preservation */
object-fit: contain;
display: block;
margin: 0 auto;
}

/* Enhanced close button with fixed positioning and accessibility */
.close-btn{
position: fixed;
top: env(safe-area-inset-top, 20px);
right: env(safe-area-inset-right, 20px);
width: 40px;
height: 40px;
background: rgba(0,0,0,.8);
color: #fff;
border: none;
border-radius: 50%;
cursor: pointer;
font: 800 18px/1 ui-sans-serif,system-ui;
display: flex;
align-items: center;
justify-content: center;
z-index: 2147483648;
transition: all .2s ease;
backdrop-filter: blur(8px);
border: 1px solid rgba(255,255,255,.2);
}
.close-btn:hover{
background: rgba(255,255,255,.15);
transform: scale(1.1);
border-color: rgba(255,255,255,.4);
}

/* Comprehensive navigation hiding during lightbox */
.lightbox.active ~ nav,
.lightbox.active ~ .nav,
.lightbox.active ~ .navigation,
.lightbox.active ~ header,
.lightbox.active ~ .header,
.lightbox.active ~ .site-header,
.lightbox.active ~ .site-nav,
.lightbox.active ~ .main-nav,
.lightbox.active ~ .primary-nav,
.lightbox.active ~ .top-nav,
.lightbox.active ~ .navbar,
.lightbox.active ~ .menu,
.lightbox.active ~ .site-menu,
.lightbox.active ~ footer,
.lightbox.active ~ .footer,
.lightbox.active ~ .site-footer {
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}

/* Ensure lightbox is fully interactive */
.lightbox.active {
  pointer-events: all;
}
.lightbox:not(.active) {
  pointer-events: none;
}

/* Debug panel - comprehensive metrics and controls */
.debug-panel {
  position: fixed;
  top: 60px;
  right: 20px;
  background: rgba(0, 0, 0, 0.9);
  color: #fff;
  padding: 12px;
  border-radius: 8px;
  font: 600 11px/1.3 ui-monospace, monospace;
  z-index: 1000000;
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  max-width: 280px;
  display: none;
}

.debug-panel.active {
  display: block;
}

.debug-section {
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.debug-section:last-child {
  border-bottom: none;
  margin-bottom: 0;
}

.debug-title {
  color: #4d79ff;
  margin-bottom: 4px;
  font-weight: 700;
}

.debug-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2px;
}

.debug-controls {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.debug-btn {
  background: rgba(77, 121, 255, 0.8);
  color: #fff;
  border: none;
  padding: 4px 8px;
  border-radius: 4px;
  font: 600 10px ui-sans-serif, system-ui;
  cursor: pointer;
  transition: background 0.2s;
}

.debug-btn:hover {
  background: rgba(77, 121, 255, 1);
}

.debug-btn.danger {
  background: rgba(239, 68, 68, 0.8);
}

.debug-btn.danger:hover {
  background: rgba(239, 68, 68, 1);
}

</style></head><body>
<div class="events-portfolio" id="eventsPf" data-manifest="https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/src/images/Portfolios/Events/events-manifest.json">
  <h1 class="events-heading">
    Event Photography
    <span class="version-indicator" onclick="toggleDebug()">v2.6.1</span>
  </h1>
  <p class="events-sub">Corporate events, conferences, and special occasions</p>
  
  <div class="filters" id="filters" style="display: none;">
    <button class="filter-btn" data-filter="all" aria-pressed="true">All Events</button>
  </div>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Loading events...</div>
  </div>
  
  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <img id="lightbox-img" src="" alt="Event Photo"/>
  <button class="close-btn" onclick="closeLightbox()" aria-label="Close">×</button>
</div>

<div class="debug-panel" id="debugPanel">
  <div class="debug-section">
    <div class="debug-title">Performance</div>
    <div class="debug-item">
      <span>Load Time:</span>
      <span id="debugLoadTime">-</span>
    </div>
    <div class="debug-item">
      <span>Image Count:</span>
      <span id="debugImageCount">-</span>
    </div>
    <div class="debug-item">
      <span>Render Time:</span>
      <span id="debugRenderTime">-</span>
    </div>
  </div>
  
  <div class="debug-section">
    <div class="debug-title">Cache</div>
    <div class="debug-item">
      <span>Hit Rate:</span>
      <span id="debugCacheHits">-</span>
    </div>
    <div class="debug-item">
      <span>API Calls:</span>
      <span id="debugApiCalls">-</span>
    </div>
    <div class="debug-item">
      <span>Cache Size:</span>
      <span id="debugCacheSize">-</span>
    </div>
  </div>
  
  <div class="debug-section">
    <div class="debug-title">Status</div>
    <div class="debug-item">
      <span>Manifest:</span>
      <span id="debugManifestStatus">-</span>
    </div>
    <div class="debug-item">
      <span>Filters:</span>
      <span id="debugFilterCount">-</span>
    </div>
    <div class="debug-item">
      <span>Version:</span>
      <span>2.6.1</span>
    </div>
  </div>
  
  <div class="debug-controls">
    <button class="debug-btn" onclick="refreshCache()">Refresh</button>
    <button class="debug-btn danger" onclick="clearCache()">Clear Cache</button>
    <button class="debug-btn" onclick="exportMetrics()">Export</button>
  </div>
</div>

<script>
const startTime = performance.now();
let debugMode = false;
let eventData = null;
let renderStartTime = 0;
let apiCallCount = 0;
let cacheHits = 0;

// Enhanced debug controls
function toggleDebug() {
  debugMode = !debugMode;
  const panel = document.getElementById('debugPanel');
  panel.classList.toggle('active', debugMode);
  if (debugMode) {
    updateDebugInfo();
  }
}

function refreshCache() {
  localStorage.removeItem('events_manifest_cache');
  localStorage.removeItem('events_manifest_timestamp');
  location.reload();
}

function clearCache() {
  localStorage.clear();
  cacheHits = 0;
  apiCallCount = 0;
  updateDebugInfo();
}

function exportMetrics() {
  const metrics = {
    loadTime: (performance.now() - startTime).toFixed(2) + 'ms',
    imageCount: eventData?.items?.length || 0,
    renderTime: renderStartTime ? (performance.now() - renderStartTime).toFixed(2) + 'ms' : 'N/A',
    cacheHitRate: apiCallCount > 0 ? ((cacheHits / apiCallCount * 100).toFixed(1) + '%') : '0%',
    apiCalls: apiCallCount,
    cacheSize: Object.keys(localStorage).length,
    manifestStatus: eventData ? 'Loaded' : 'Failed',
    version: '2.6.1',
    timestamp: new Date().toISOString()
  };
  
  console.log('Event Portfolio Metrics:', metrics);
  
  // Copy to clipboard
  navigator.clipboard.writeText(JSON.stringify(metrics, null, 2))
    .then(() => console.log('Metrics copied to clipboard'))
    .catch(() => console.log('Manual copy required'));
}

function updateDebugInfo() {
  if (!debugMode) return;
  
  document.getElementById('debugLoadTime').textContent = (performance.now() - startTime).toFixed(2) + 'ms';
  document.getElementById('debugImageCount').textContent = eventData?.items?.length || '0';
  document.getElementById('debugRenderTime').textContent = renderStartTime ? (performance.now() - renderStartTime).toFixed(2) + 'ms' : 'N/A';
  document.getElementById('debugCacheHits').textContent = apiCallCount > 0 ? ((cacheHits / apiCallCount * 100).toFixed(1) + '%') : '0%';
  document.getElementById('debugApiCalls').textContent = apiCallCount;
  document.getElementById('debugCacheSize').textContent = Object.keys(localStorage).length;
  document.getElementById('debugManifestStatus').textContent = eventData ? 'Loaded' : 'Failed';
  document.getElementById('debugFilterCount').textContent = document.querySelectorAll('.filter-btn').length - 1; // -1 for "All" button
}

// Check for debug mode from URL
if (new URLSearchParams(window.location.search).has('debug')) {
  debugMode = true;
  document.getElementById('debugPanel').classList.add('active');
}

// Robust manifest loading with fallbacks
const RAW = 'https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/';
const PF = document.getElementById('eventsPf');
const MANIFEST_BASE = (PF && PF.dataset.manifest && PF.dataset.manifest.trim()) || (RAW + 'src/images/Portfolios/Events/events-manifest.json');

function manifestUrl() {
  return MANIFEST_BASE + (window.__EP_BUST ? ((MANIFEST_BASE.indexOf('?') > -1 ? '&' : '?') + 'b=' + window.__EP_BUST) : '');
}

function withTimeout(run, ms) {
  let ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  let t = setTimeout(() => { if (ctrl) ctrl.abort() }, ms);
  return Promise.race([
    run(ctrl ? ctrl.signal : undefined),
    new Promise((_, rej) => setTimeout(() => rej(new Error('Request timed out after ' + ms + 'ms')), ms + 10))
  ]).finally(() => clearTimeout(t));
}

function norm(j) {
  let ev = [];
  if (Array.isArray(j)) ev = j;
  else if (j && Array.isArray(j.events)) ev = j.events;
  else if (j && j.events && typeof j.events === 'object') ev = Object.values(j.events);
  
  ev = (ev || []).filter(Boolean).map(e => {
    let imgs = Array.isArray(e.images) ? e.images.slice() : [];
    imgs = imgs.map(im => {
      if (typeof im === 'string') return { path: im };
      if (im && (im.path || im.url)) return { path: im.path || im.url, srcset: im.srcset, sizes: im.sizes };
      return null;
    }).filter(Boolean);
    
    return {
      eventName: e.eventName || e.name || 'Event',
      category: e.category || 'Event',
      dateDisplay: e.dateDisplay || e.date || '',
      dateISO: e.dateISO || e.iso || '',
      images: imgs,
      totalImages: e.totalImages || imgs.length
    };
  });
  
  return {
    version: (j && j.version) || '2.6.1',
    generated: (j && j.generated) || '',
    events: ev,
    items: j && j.items ? j.items : ev // Support both formats
  };
}

async function fetchManifest() {
  const fallbackPaths = [
    manifestUrl(),
    '../../../images/Portfolios/Events/events-manifest.json',
    '../../images/Portfolios/Events/events-manifest.json',
    'src/images/Portfolios/Events/events-manifest.json'
  ];
  
  let lastError = null;
  
  for (let i = 0; i < fallbackPaths.length; i++) {
    try {
      const url = fallbackPaths[i] + (fallbackPaths[i].includes('?') ? '&' : '?') + 'v=' + Date.now();
      const data = await withTimeout(sig => fetch(url, { cache: 'no-store', signal: sig }), 8000)
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + (r.statusText || ''));
          return r.text();
        })
        .then(t => {
          try {
            return norm(JSON.parse(t));
          } catch (e) {
            throw new Error('Parse error: ' + e.message);
          }
        });
      
      console.log('✅ Loaded manifest from:', fallbackPaths[i]);
      return data;
    } catch (err) {
      console.warn('❌ Failed to load from:', fallbackPaths[i], err.message);
      lastError = err;
    }
  }
  
  throw lastError || new Error('All manifest sources failed');
}

async function loadEvents() {
  try {
    renderStartTime = performance.now();
    
    // Check cache first
    const cacheKey = 'events_manifest_cache';
    const cacheTimeKey = 'events_manifest_timestamp';
    const cacheExpiry = 5 * 60 * 1000; // 5 minutes
    
    const cachedData = localStorage.getItem(cacheKey);
    const cacheTime = localStorage.getItem(cacheTimeKey);
    
    if (cachedData && cacheTime && (Date.now() - parseInt(cacheTime)) < cacheExpiry) {
      cacheHits++;
      eventData = JSON.parse(cachedData);
    } else {
      apiCallCount++;
      eventData = await fetchManifest();
      
      // Cache the result
      localStorage.setItem(cacheKey, JSON.stringify(eventData));
      localStorage.setItem(cacheTimeKey, Date.now().toString());
    }

    createFilters(eventData.events || []);
    displayEvents(eventData.items || [], 'all');
    
    if (debugMode) {
      updateDebugInfo();
    }
    
  } catch (error) {
    console.error('Error loading events:', error);
    document.getElementById('loading').innerHTML = `
      <div style="color: var(--muted); text-align: center; padding: 40px;">
        Unable to load events. Please try again later.
      </div>
    `;
  }
}

function createFilters(events) {
  const filtersDiv = document.getElementById('filters');
  const categories = [...new Set(events.map(e => e.category))].sort();
  
  // Clear existing filters except "All"
  const allBtn = filtersDiv.querySelector('[data-filter="all"]');
  filtersDiv.innerHTML = '';
  filtersDiv.appendChild(allBtn);
  
  categories.forEach(category => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = category;
    btn.setAttribute('aria-pressed', 'false');
    btn.textContent = category;
    btn.onclick = () => filterEvents(category);
    filtersDiv.appendChild(btn);
  });
  
  if (categories.length > 0) {
    filtersDiv.style.display = 'flex';
  }
}

function filterEvents(category) {
  // Update button states
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.setAttribute('aria-pressed', btn.dataset.filter === category);
  });
  
  displayEvents(eventData.items || [], category);
}

function displayEvents(items, filterCategory = 'all') {
  renderStartTime = performance.now();
  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  
  // Filter items
  let filteredItems = items;
  if (filterCategory !== 'all') {
    const categoryEvents = (eventData.events || []).filter(e => e.category === filterCategory);
    const categoryEventIds = new Set(categoryEvents.map(e => e.id));
    filteredItems = items.filter(item => categoryEventIds.has(item.eventId));
  }
  
  // Sort by date (most recent first) and limit to 12 featured items
  const sorted = filteredItems
    .sort((a, b) => new Date(b.dateISO) - new Date(a.dateISO))
    .slice(0, Math.min(12, filteredItems.length));
  
  if (sorted.length === 0) {
    grid.innerHTML = `
      <div style="text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1;">
        <div style="font: 700 16px/1.4 ui-sans-serif,system-ui; margin-bottom: 8px;">Coming Soon</div>
        <div>New ${filterCategory} events will be added regularly.</div>
      </div>
    `;
    grid.classList.add('loaded');
    loading.style.display = 'none';
    return;
  }
  
  grid.innerHTML = sorted.map(item => {
    const event = (eventData.events || []).find(e => e.id === item.eventId);
    const eventName = event?.name || 'Event';
    const category = event?.category || '';
    const date = formatDate(item.dateISO);
    
    return `
      <div class="card" onclick="openLightbox('${item.thumbnail}')" role="button" tabindex="0" 
           onkeydown="if(event.key==='Enter'||event.key===' ')openLightbox('${item.thumbnail}')">
        <img src="${item.thumbnail}" alt="${eventName}" loading="lazy"/>
        <div class="info">
          <h3 class="title">${eventName}</h3>
          <div class="meta">${date}</div>
        </div>
        ${category ? `<div class="badge">${category}</div>` : ''}
      </div>
    `;
  }).join('');
  
  // Animate cards in
  requestAnimationFrame(() => {
    document.querySelectorAll('.card').forEach((card, i) => {
      setTimeout(() => card.classList.add('loaded'), i * 50);
    });
    grid.classList.add('loaded');
    loading.style.display = 'none';
  });
  
  if (debugMode) {
    updateDebugInfo();
  }
}

function formatDate(dateString) {
  try {
    const date = new Date(dateString);
    return date.toLocaleDateString('en-US', { 
      year: 'numeric', 
      month: 'long' 
    });
  } catch {
    return 'Date Unknown';
  }
}

function openLightbox(imgSrc) {
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  
  lightboxImg.src = imgSrc;
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(event) {
  if (event && event.target !== event.currentTarget && !event.target.classList.contains('close-btn')) {
    return;
  }
  
  const lightbox = document.getElementById('lightbox');
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeLightbox();
  }
});

// Initialize
loadEvents();

// Global API for external access and debugging
window.portfolioAPI = {
  getMetrics: () => ({
    loadTime: (performance.now() - startTime).toFixed(2) + 'ms',
    imageCount: eventData?.items?.length || 0,
    renderTime: renderStartTime ? (performance.now() - renderStartTime).toFixed(2) + 'ms' : 'N/A',
    cacheHitRate: apiCallCount > 0 ? ((cacheHits / apiCallCount * 100).toFixed(1) + '%') : '0%',
    apiCalls: apiCallCount,
    cacheHits: cacheHits,
    cacheSize: Object.keys(localStorage).length,
    manifestStatus: eventData ? 'Loaded' : 'Failed',
    version: '2.6.1'
  }),
  toggleDebug: () => toggleDebug(),
  refreshData: () => loadEvents(),
  clearCache: () => clearCache(),
  exportMetrics: () => exportMetrics()
};
</script>
</body></html>
