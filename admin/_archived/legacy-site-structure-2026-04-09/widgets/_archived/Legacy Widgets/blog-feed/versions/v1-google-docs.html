<!-- Blog Feed Widget (Google Docs) - Single Page Example -->
<div id="blogFeed"
  data-provider="docs"
  data-blog-feed-docs
  data-doc-id="1PlnajhCPl2Np5AN_uVcxG7xIR_BGkjfk9rUDcInbJLc"
  data-max-posts="10"
  data-show-dates="true"
  data-show-images="true"
  data-auto-captions="true"
  data-feed-url="/src/site/blog/feed.json">
  <div class="blog-loading">Loading blog posts...</div>
</div>

<style>
/* Blog Feed Styles - McCal Media Blog Layout */
#blogFeed { 
  margin: 2rem 0; 
  min-height: 200px;
}

/* Blog Feed Layout - Single Column Blog Style */
.blog-feed {
  max-width: 800px;
  margin: 0 auto;
  padding: 0;
}

/* Blog Card - Full Width Blog Post Style */
.blog-card {
  background: white;
  border-radius: 1rem;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
  margin-bottom: 3rem;
}

.blog-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
}

/* Hero Image - Blog Style */
.blog-image {
  margin: 0;
  position: relative;
  width: 100%;
}

.blog-image img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}

.blog-card:hover .blog-image img {
  transform: scale(1.01);
}

/* Content Area - Blog Post Style */
.blog-card-header {
  padding: 2rem 2rem 0 2rem;
  text-align: left;
}

.blog-title {
  margin: 0 0 0.75rem 0;
  font-size: 1.75rem;
  font-weight: 700;
  color: #000;
  line-height: 1.3;
}

.blog-date {
  display: inline-block;
  color: #999;
  font-size: 0.9rem;
  font-weight: 500;
  margin-bottom: 1.5rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.blog-body {
  padding: 0 2rem 2rem 2rem;
  color: #333;
  font-size: 1rem;
  line-height: 1.7;
}

.blog-body p {
  margin: 0 0 1rem 0;
}

.blog-body p:last-child {
  margin-bottom: 0;
}

.blog-body h2, .blog-body h3 {
  color: #000;
  font-weight: 600;
  margin: 1.5rem 0 0.75rem 0;
}

.blog-body h2 {
  font-size: 1.1rem;
}

.blog-body h3 {
  font-size: 1rem;
}

.blog-body a {
  color: #000;
  text-decoration: underline;
  transition: opacity 0.2s ease;
}

.blog-body a:hover {
  opacity: 0.7;
}

.blog-body ul, .blog-body ol {
  margin: 0.75rem 0;
  padding-left: 1.25rem;
}

.blog-body li {
  margin: 0.25rem 0;
}

/* Additional Images within Body */
.blog-body .blog-image {
  margin: 1.5rem 0;
  border-radius: 0.5rem;
  overflow: hidden;
}

.blog-body .blog-image img {
  height: auto;
  max-height: 300px;
}

.blog-image-caption {
  font-size: 0.85rem;
  color: #999;
  font-style: italic;
  padding: 0.5rem 0.75rem;
  background: rgba(0, 0, 0, 0.02);
  border-top: 1px solid rgba(0, 0, 0, 0.05);
}

/* Loading and Error States */
.blog-loading, .blog-error {
  text-align: center;
  padding: 3rem 1.5rem;
  color: #666;
  font-size: 1rem;
  background: white;
  border-radius: 1rem;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}

.blog-error {
  color: #d73027;
  background: #fef7f7;
  border: 1px solid rgba(215, 48, 39, 0.1);
}

/* Fade-in Animation matching gallery */
.blog-feed {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive Design - Blog Layout */
@media (max-width: 768px) {
  .blog-feed {
    max-width: 95%;
    margin: 0 auto;
  }
  
  .blog-card {
    margin-bottom: 2rem;
  }
  
  .blog-image img {
    height: 250px;
  }
  
  .blog-card-header {
    padding: 1.5rem 1.5rem 0 1.5rem;
  }
  
  .blog-body {
    padding: 0 1.5rem 1.5rem 1.5rem;
  }
  
  .blog-title {
    font-size: 1.5rem;
  }
}

@media (max-width: 480px) {
  .blog-card-header {
    padding: 1.25rem 1.25rem 0 1.25rem;
  }
  
  .blog-body {
    padding: 0 1.25rem 1.25rem 1.25rem;
    font-size: 0.95rem;
  }
  
  .blog-title {
    font-size: 1.3rem;
  }
  
  .blog-image img {
    height: 200px;
  }
}
</style>

<!-- Auto captions (EXIF/IPTC) -->
<script src="../shared/universal-caption-system.js"></script>
<!-- Google Docs Blog Feed logic -->
<script src="./blog-feed-docs.js"></script>

<!-- Feed provider renderer: if `data-provider="feed"` this will render JSON feed (feed.json) into the same markup/style used by the docs renderer -->
<script>
  (function(){
    const root = document.getElementById('blogFeed');
    if(!root) return;
  const provider = root.getAttribute('data-provider');
  // run if explicitly set to feed, or if a feed URL is present (backwards-compatible)
  const hasFeedUrl = root.hasAttribute('data-feed-url') && root.getAttribute('data-feed-url').trim() !== '';
  if(provider !== 'feed' && !hasFeedUrl) return; // only run for feed mode or when feed-url is provided

    const feedUrl = root.getAttribute('data-feed-url') || '/src/site/blog/feed.json';
    const maxPosts = parseInt(root.getAttribute('data-max-posts')||'10',10);
    const showDates = (root.getAttribute('data-show-dates')||'true') === 'true';
    const showImages = (root.getAttribute('data-show-images')||'true') === 'true';

    function esc(s){ if(s==null) return ''; return String(s); }

    function render(posts){
      root.innerHTML = '';
      const feedEl = document.createElement('div'); feedEl.className='blog-feed';
      posts.slice(0,maxPosts).forEach(it=>{
        const card = document.createElement('article'); card.className='blog-card';
        const header = document.createElement('div'); header.className='blog-card-header';
        if(showImages && it.image){
          const imgWrap = document.createElement('div'); imgWrap.className='blog-image';
          const img = document.createElement('img'); img.src = it.image; img.alt = it.image_alt || '';
          imgWrap.appendChild(img);
          card.appendChild(imgWrap);
        }
        const title = document.createElement('h2'); title.className='blog-title';
        const a = document.createElement('a'); a.href = it.url || '#'; a.textContent = it.title || 'Untitled'; a.setAttribute('aria-label', it.title || 'Post');
        title.appendChild(a);
        header.appendChild(title);
        if(showDates && it.date_published){
          const date = document.createElement('div'); date.className='blog-date';
          const d = new Date(it.date_published); date.textContent = isNaN(d.getTime()) ? it.date_published : d.toLocaleDateString();
          header.appendChild(date);
        }
        card.appendChild(header);

        const body = document.createElement('div'); body.className='blog-body';
        if(it.summary) body.innerHTML = `<p>${esc(it.summary)}</p>`;
        feedEl.appendChild(card);
        card.appendChild(body);
      });
      root.appendChild(feedEl);
    }

    // show a tiny debug hint in console for troubleshooting
    console.debug('blog-feed: loading feed from', feedUrl);
    fetch(feedUrl).then(r=>{
      if(!r.ok) throw new Error('Feed fetch failed: '+r.status);
      return r.json();
    }).then(json=>{
      const items = json.items || json.posts || [];
      render(items);
    }).catch(err=>{
      root.innerHTML = `<div class="blog-error">Unable to load blog feed. ${esc(err.message)}</div>`;
      console.error('Feed renderer error', err);
    });
  })();
</script>

<!-- Configuration notes:
1) Your Google Doc must be "Published to web" (File > Share > Publish to web)
2) The document ID is extracted from the URL: 1PlnajhCPl2Np5AN_uVcxG7xIR_BGkjfk9rUDcInbJLc
3) Blog posts are identified by headings (H1, H2, H3) in your document
4) Content under each heading becomes the blog post body
5) Images are automatically detected and used as hero images or inline content
6) Auto-captions work with your existing UniversalCaptionSystem for images with EXIF data
-->
