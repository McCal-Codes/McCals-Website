    <style>
      :root {
        --mcc-bg-primary: #ffffff;
        --mcc-bg-secondary: #f8f9fa;
        --mcc-text-primary: #0a0a0a;
        --mcc-text-secondary: #4a5568;
        --mcc-text-muted: #718096;
        --mcc-border: #e2e8f0;
        --mcc-accent: #000000;
        --mcc-glass-bg: rgba(255, 255, 255, 0.85);
        --mcc-glass-border: rgba(0, 0, 0, 0.08);
        --mcc-glass-blur: 20px;
        --mcc-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
        --mcc-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --mcc-shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.12);
        --mcc-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --mcc-font-display: 'Outfit', sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --mcc-bg-primary: #1a1a1a;
          --mcc-bg-secondary: #0a0a0a;
          --mcc-text-primary: #f7fafc;
          --mcc-text-secondary: #cbd5e0;
          --mcc-text-muted: #a0aec0;
          --mcc-border: #2d3748;
          --mcc-accent: #ffffff;
          --mcc-glass-bg: rgba(26, 26, 26, 0.85);
          --mcc-glass-border: rgba(255, 255, 255, 0.1);
        }
      }

      * {
        box-sizing: border-box;
      }

      .mcc-blog-widget {
        font-family: var(--mcc-font-sans);
        color: var(--mcc-text-primary);
        line-height: 1.7;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .mcc-blog-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 5rem 2rem;
        color: var(--mcc-text-muted);
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        border-radius: 2rem;
        backdrop-filter: blur(var(--mcc-glass-blur));
      }

      .mcc-blog-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--mcc-border);
        border-top-color: var(--mcc-accent);
        border-radius: 50%;
        animation: mcc-spin 1s linear infinite;
        margin-bottom: 1.5rem;
      }

      @keyframes mcc-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .mcc-blog-grid {
        display: flex;
        flex-direction: column;
        gap: 3rem;
        max-width: 900px;
        margin: 0 auto;
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }

      .mcc-blog-grid.mcc-loaded {
        opacity: 1;
        transform: translateY(0);
      }

      .mcc-blog-card {
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        backdrop-filter: blur(var(--mcc-glass-blur));
        -webkit-backdrop-filter: blur(var(--mcc-glass-blur));
        border-radius: 1.5rem;
        overflow: hidden;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease,
          border-color 0.3s ease;
        box-shadow: var(--mcc-shadow-sm);
        scroll-margin-top: 2rem;
      }

      .mcc-blog-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--mcc-shadow-lg);
        border-color: var(--mcc-accent);
      }

      .mcc-blog-hero {
        width: 100%;
        height: 400px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .mcc-blog-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
      }

      .mcc-blog-card:hover .mcc-blog-hero img {
        transform: scale(1.03);
      }

      .mcc-blog-content {
        padding: 2.5rem 3rem 3rem;
      }

      .mcc-blog-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        font-size: 0.875rem;
        color: var(--mcc-text-muted);
        margin-bottom: 1.25rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      .mcc-blog-category {
        background: var(--mcc-accent);
        color: var(--mcc-bg-primary);
        padding: 0.375rem 0.875rem;
        border-radius: 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .mcc-blog-title {
        font-family: var(--mcc-font-display);
        font-size: 2.25rem;
        font-weight: 800;
        margin: 0 0 1.5rem 0;
        line-height: 1.2;
        color: var(--mcc-text-primary);
        letter-spacing: -0.02em;
      }

      .mcc-blog-excerpt {
        color: var(--mcc-text-secondary);
        font-size: 1.125rem;
        line-height: 1.8;
        margin-bottom: 2rem;
        font-weight: 400;
      }

      .mcc-blog-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.625rem;
        margin-bottom: 2rem;
      }

      .mcc-blog-tag {
        font-size: 0.8125rem;
        padding: 0.375rem 0.75rem;
        background: var(--mcc-bg-secondary);
        border: 1px solid var(--mcc-border);
        border-radius: 0.5rem;
        color: var(--mcc-text-secondary);
        font-weight: 500;
      }

      .mcc-blog-actions {
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .mcc-blog-expand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 1.75rem;
        background: var(--mcc-accent);
        color: var(--mcc-bg-primary);
        font-family: var(--mcc-font-sans);
        font-weight: 700;
        text-decoration: none;
        font-size: 0.9375rem;
        border-radius: 0.75rem;
        border: none;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: var(--mcc-shadow-sm);
        letter-spacing: 0.01em;
      }

      .mcc-blog-expand:hover {
        transform: translateY(-2px);
        box-shadow: var(--mcc-shadow-md);
      }

      .mcc-blog-expand::after {
        content: '→';
        font-size: 1.125rem;
      }

      .mcc-blog-share {
        padding: 0.75rem;
        background: transparent;
        border: 2px solid var(--mcc-border);
        border-radius: 0.75rem;
        cursor: pointer;
        color: var(--mcc-text-secondary);
        transition: all 0.2s;
        font-size: 1.125rem;
      }

      .mcc-blog-share:hover {
        border-color: var(--mcc-accent);
        color: var(--mcc-accent);
      }

      /* Lightbox Modal */
      .mcc-lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .mcc-lightbox.mcc-active {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        overflow-y: auto;
        opacity: 1;
      }

      .mcc-lightbox-content {
        background: var(--mcc-bg-primary);
        border-radius: 1.5rem;
        max-width: 800px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        transform: translateY(20px);
        transition: transform 0.3s ease;
      }

      .mcc-lightbox.mcc-active .mcc-lightbox-content {
        transform: translateY(0);
      }

      .mcc-lightbox-header {
        position: sticky;
        top: 0;
        background: var(--mcc-bg-primary);
        border-bottom: 1px solid var(--mcc-border);
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
      }

      .mcc-lightbox-actions {
        display: flex;
        gap: 0.75rem;
      }

      .mcc-lightbox-btn {
        background: transparent;
        border: 2px solid var(--mcc-border);
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        color: var(--mcc-text-secondary);
        font-size: 0.875rem;
        font-weight: 600;
        transition: all 0.2s;
      }

      .mcc-lightbox-btn:hover {
        border-color: var(--mcc-accent);
        color: var(--mcc-accent);
      }

      .mcc-lightbox-close {
        background: var(--mcc-accent);
        color: var(--mcc-bg-primary);
        border: none;
        font-size: 1.25rem;
        width: 2.5rem;
        height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mcc-lightbox-body {
        padding: 3rem;
        font-size: 1.0625rem;
        line-height: 1.8;
      }

      .mcc-lightbox-body h1 {
        font-size: 2.75rem;
        font-weight: 800;
        margin: 0 0 1rem 0;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .mcc-lightbox-body .meta {
        color: var(--mcc-text-muted);
        margin-bottom: 2.5rem;
        font-size: 0.9375rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--mcc-border);
      }

      .mcc-lightbox-body p {
        margin: 1.25rem 0;
      }

      .mcc-lightbox-body a {
        color: var(--mcc-accent);
        font-weight: 500;
        text-decoration: underline;
      }

      .mcc-lightbox-body img {
        max-width: 100%;
        height: auto;
        border-radius: 0.75rem;
        margin: 2rem 0;
      }

      .mcc-lightbox-body h2,
      .mcc-lightbox-body h3,
      .mcc-lightbox-body h4 {
        margin: 2rem 0 1rem;
        font-weight: 700;
        line-height: 1.3;
      }

      .mcc-lightbox-body h2 {
        font-size: 1.75rem;
      }
      .mcc-lightbox-body h3 {
        font-size: 1.375rem;

      .mcc-lightbox-body h4 {

      .mcc-lightbox-body ul,

      .mcc-lightbox-body li {

      .mcc-lightbox-body blockquote {
        border-left: 4px solid var(--mcc-border);
        padding-left: 1.5rem;
        margin: 1.5rem 0;

      .mcc-blog-error {
        text-align: center;
        padding: 3rem 2rem;

      @media (max-width: 768px) {
        .mcc-blog-widget {
          padding: 2rem 1rem;

        .mcc-lightbox-content {
          border-radius: 0;

  <body
    style="
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
    "
  >
    <div
      id="mccBlogWidget"
      class="mcc-blog-widget"
      data-doc-id="https://docs.google.com/document/d/e/2PACX-1vRYF2JnbIfiNkCq8zLMxnvedTHPjzXPYQsmVTqX75ossMlyCuxSNOARhdUXSeE9FrPXnZJUzf_dV6WD/pub"
      data-max-posts="50"
    >
      <div class="mcc-blog-loading">
        <div class="mcc-blog-spinner"></div>
        <span>Loading blog posts...</span>
      </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="mccLightbox" class="mcc-lightbox">
      <div class="mcc-lightbox-content">
        <div class="mcc-lightbox-header">
          <div class="mcc-lightbox-actions">
            <button class="mcc-lightbox-btn" id="mccCopyLink">🔗 Copy Link</button>
          </div>
          <button class="mcc-lightbox-btn mcc-lightbox-close" id="mccCloseLightbox">✕</button>
        </div>
        <div class="mcc-lightbox-body" id="mccLightboxBody">
          <!-- Content inserted here -->
        </div>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        const CONFIG = {
          docId: document.getElementById('mccBlogWidget').dataset.docId,
          maxPosts: parseInt(document.getElementById('mccBlogWidget').dataset.maxPosts) || 50,
        };

        // --- Utils ---

        function getFetchUrl(input) {
          if (input.startsWith('http')) return input;
          return `https://docs.google.com/document/d/${input}/pub`;
        }

        async function fetchGoogleDoc(urlInput) {
          const url = getFetchUrl(urlInput);
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.text();
        }

        function slugify(text) {
          return text
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .trim();
        }

        // --- Metadata Extraction ---

        function extractMetadata(textBlock) {
          const result = {
            date: null,
            author: null,
            category: null,
            tags: [],
            excerpt: null,
          };

          const lines = textBlock
            .split('\n')
            .map((l) => l.trim())
            .filter(Boolean);

          for (const line of lines) {
            const lower = line.toLowerCase();

            if (lower.startsWith('date:')) {
              result.date = parseDateString(line.substring(5).trim());
            } else if (lower.startsWith('category:')) {
              result.category = line.substring(9).trim();
            } else if (lower.startsWith('tags:')) {
              const tagStr = line.substring(5).trim();
              result.tags = tagStr
                .split(',')
                .map((t) => t.trim())
                .filter(Boolean);
            } else if (lower.startsWith('excerpt:')) {
              result.excerpt = line
                .substring(8)
                .trim()
                .replace(/^["']|["']$/g, '');
            } else if (lower.startsWith('by ')) {
              const authorMatch = line.match(/^By\s+(.+?)(?:\s{2,}|\d|$)/i);
              if (authorMatch) {
                result.author = authorMatch[1].trim();
              }
            } else {
              const dateMatch = line.match(
                /(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})|(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4})/i,
              );
              if (dateMatch && !result.date) {
                result.date = parseDateString(dateMatch[0]);
              }
            }
          }

          return result;
        }

        function parseDateString(str) {
          if (!str) return null;

          const shortDate = str.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
          if (shortDate) {
            let year = shortDate[3];
            if (year.length === 2) year = '20' + year;
            const date = new Date(`${shortDate[1]}/${shortDate[2]}/${year}`);
            if (!isNaN(date.getTime())) return date;
          }

          const parsed = new Date(str);
          if (!isNaN(parsed.getTime())) return parsed;

          return null;
        }

        // --- Improved Parsing Logic ---

        function parseGoogleDoc(html) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const posts = [];

          const allElements = Array.from(doc.body.querySelectorAll('*'));

          let currentPost = null;
          let metadataLines = [];
          let collectingMetadata = false;
          let bodyStarted = false;
          let inSourcesSection = false;

          for (let i = 0; i < allElements.length; i++) {
            const el = allElements[i];
            const tag = el.tagName;
            const text = el.textContent.trim();

            if (!text) continue;

            // H1 or H2 = New Post (reset sources flag)
            if ((tag === 'H1' || tag === 'H2') && text.length > 0) {
              // Save previous post
              if (currentPost) {
                if (metadataLines.length > 0) {
                  const meta = extractMetadata(metadataLines.join('\n'));
                  Object.assign(currentPost, meta);
                }
                posts.push(currentPost);
              }

              currentPost = {
                title: text,
                body: '',
                images: [],
                author: null,
                date: null,
                category: null,
                tags: [],
                excerpt: null,
                slug: slugify(text),
              };

              metadataLines = [];
              collectingMetadata = true;
              bodyStarted = false;
              inSourcesSection = false;
              continue;
            }

            if (!currentPost) continue;

            // Check for Sources heading
            if (text.toLowerCase() === 'sources' && tag.match(/^H[3-6]$/)) {
              inSourcesSection = true;
              continue;
            }

            // Skip content in Sources section
            if (inSourcesSection) {
              continue;
            }

            // Collect metadata
            if (collectingMetadata && !bodyStarted) {
              const isMetadataLine =
                text.toLowerCase().match(/^(date:|category:|tags:|excerpt:|by |post:)/i) ||
                text.match(/\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/) ||
                text.match(/\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i);

              if (isMetadataLine && text.length < 150) {
                metadataLines.push(text);
                continue;
              } else if (tag.match(/^H[3-6]$/) && text.length < 100) {
                metadataLines.push(text);
                continue;
              } else if (tag === 'P' && text.length > 50) {
                collectingMetadata = false;
                bodyStarted = true;

                if (metadataLines.length > 0) {
                  const meta = extractMetadata(metadataLines.join('\n'));
                  Object.assign(currentPost, meta);
                  metadataLines = [];
                }
              }
            }

            if (tag === 'IMG') {
              currentPost.images.push(el.src);
              continue;
            }

            if (
              bodyStarted &&
              ['P', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'H3', 'H4', 'H5', 'H6'].includes(tag)
            ) {
              if (text.toLowerCase().match(/^(date:|category:|tags:|excerpt:|post:)/)) {
                continue;
              }

              el.querySelectorAll('a').forEach((a) => {
                try {
                  const urlObj = new URL(a.href);
                  if (urlObj.hostname.includes('google.com') && urlObj.searchParams.has('q')) {
                    a.href = urlObj.searchParams.get('q');
                  }
                } catch (e) {}
              });

              let content = el.outerHTML;
              content = content.replace(/\s(class|style|id)="[^"]*"/g, '');
              currentPost.body += content;
            }
          }

          if (currentPost) {
            if (metadataLines.length > 0) {
              const meta = extractMetadata(metadataLines.join('\n'));
              Object.assign(currentPost, meta);
            }
            posts.push(currentPost);
          }

          posts.sort((a, b) => {
            const dA = a.date || new Date(0);
            const dB = b.date || new Date(0);
            return dB - dA;
          });

          console.log('Parsed posts:', posts);
          return posts;
        }

        // --- Lightbox Functions ---

        function openLightbox(post, displayDate) {
          const lightbox = document.getElementById('mccLightbox');
          const body = document.getElementById('mccLightboxBody');

          const escapeHtml = (str) => {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
          };

          body.innerHTML = `
                <h1>${escapeHtml(post.title)}</h1>
                <div class="meta">
                    ${displayDate ? `<strong>${escapeHtml(displayDate)}</strong>` : ''}
                    ${post.author ? ` • ${escapeHtml(post.author)}` : ''}
                    ${post.category ? ` • ${escapeHtml(post.category)}` : ''}
                </div>
                ${post.body}
            `;

          lightbox.classList.add('mcc-active');
          document.body.style.overflow = 'hidden';

          // Update URL hash
          history.pushState(null, '', `#${post.slug}`);
        }

        function closeLightbox() {
          const lightbox = document.getElementById('mccLightbox');
          lightbox.classList.remove('mcc-active');
          document.body.style.overflow = '';
          history.pushState(null, '', window.location.pathname);
        }

        function copyCurrentLink() {
          const url = window.location.href;
          navigator.clipboard.writeText(url).then(() => {
            const btn = document.getElementById('mccCopyLink');
            const original = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => {
              btn.textContent = original;
            }, 2000);
          });
        }

        // --- Rendering ---

        function renderPosts(posts) {
          const container = document.getElementById('mccBlogWidget');

          if (posts.length === 0) {
            container.innerHTML = `<div class="mcc-blog-error">
                    <h3>No posts found</h3>
                    <p>Check that your document uses H1 or H2 for post titles.</p>
                </div>`;
            return;
          }

          const grid = document.createElement('div');
          grid.className = 'mcc-blog-grid';

          posts.slice(0, CONFIG.maxPosts).forEach((post) => {
            const article = document.createElement('article');
            article.className = 'mcc-blog-card';
            article.id = post.slug;

            const heroImg =
              post.images[0] ||
              'https://images.unsplash.com/photo-1499750310159-53f0f6145f4b?auto=format&fit=crop&w=1200&q=80';

            const displayDate = post.date
              ? post.date.toLocaleDateString('en-US', {
                  month: 'long',
                  day: 'numeric',
                  year: 'numeric',
                })
              : '';

            let excerpt = post.excerpt;
            if (!excerpt && post.body) {
              const tmp = document.createElement('div');
              tmp.innerHTML = post.body;
              excerpt = tmp.textContent.substring(0, 220).trim() + '...';
            }

            const categoryHtml = post.category
              ? `<span class="mcc-blog-category">${post.category}</span>`
              : '';

            const authorHtml = post.author
              ? `<span class="mcc-blog-author">${post.author}</span>`
              : '';

            const dateHtml = displayDate ? `<span class="mcc-blog-date">${displayDate}</span>` : '';

            const tagsHtml =
              post.tags.length > 0
                ? `<div class="mcc-blog-tags">${post.tags.map((t) => `<span class="mcc-blog-tag">${t}</span>`).join('')}</div>`
                : '';

            article.innerHTML = `
                    <div class="mcc-blog-hero">
                        <img src="${heroImg}" alt="${post.title}" loading="lazy">
                    </div>
                    <div class="mcc-blog-content">
                        <div class="mcc-blog-meta">
                            ${categoryHtml}
                            ${dateHtml}
                            ${authorHtml}
                        </div>
                        <h2 class="mcc-blog-title">${post.title}</h2>
                        ${excerpt ? `<div class="mcc-blog-excerpt">${excerpt}</div>` : ''}
                        ${tagsHtml}
                        <div class="mcc-blog-actions">
                            <button class="mcc-blog-expand" type="button">Read Article</button>
                            <button class="mcc-blog-share" type="button" title="Copy Link">🔗</button>
                        </div>
                    </div>
                `;

            const expandBtn = article.querySelector('.mcc-blog-expand');
            expandBtn.addEventListener('click', () => openLightbox(post, displayDate));

            const shareBtn = article.querySelector('.mcc-blog-share');
            shareBtn.addEventListener('click', () => {
              const url = `${window.location.origin}${window.location.pathname}#${post.slug}`;
              navigator.clipboard.writeText(url).then(() => {
                shareBtn.textContent = '✓';
                setTimeout(() => {
                  shareBtn.textContent = '🔗';
                }, 2000);
              });
            });

            grid.appendChild(article);

            if (post.date) injectSeo(post, heroImg);
          });

          container.innerHTML = '';
          container.appendChild(grid);

          requestAnimationFrame(() => {
            grid.classList.add('mcc-loaded');

            // Check for hash in URL
            if (window.location.hash) {
              const slug = window.location.hash.substring(1);
              const post = posts.find((p) => p.slug === slug);
              if (post) {
                const displayDate = post.date
                  ? post.date.toLocaleDateString('en-US', {
                      month: 'long',
                      day: 'numeric',
                      year: 'numeric',
                    })
                  : '';
                setTimeout(() => openLightbox(post, displayDate), 500);
              }
            }
          });
        }

        // --- SEO ---

        function injectSeo(post, image) {
          const script = document.createElement('script');
          script.type = 'application/ld+json';

          const schema = {
            '@context': 'https://schema.org',
            '@type': 'BlogPosting',
            headline: post.title,
            image: [image],
            datePublished: post.date ? post.date.toISOString() : new Date().toISOString(),
            author: {
              '@type': 'Person',
              name: post.author || 'Caleb McCartney',
            },
          };

          if (post.category) schema.articleSection = post.category;
          if (post.tags.length > 0) schema.keywords = post.tags.join(', ');
          if (post.excerpt) schema.description = post.excerpt;

          script.text = JSON.stringify(schema);
          document.head.appendChild(script);
        }

        // --- Event Listeners ---

        document.getElementById('mccCloseLightbox').addEventListener('click', closeLightbox);
        document.getElementById('mccCopyLink').addEventListener('click', copyCurrentLink);

        document.getElementById('mccLightbox').addEventListener('click', (e) => {
          if (e.target.id === 'mccLightbox') {
            closeLightbox();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            closeLightbox();
          }
        });

        // --- Init ---

        async function init() {
          try {
            const html = await fetchGoogleDoc(CONFIG.docId);
            const posts = parseGoogleDoc(html);
            renderPosts(posts);
          } catch (err) {
            console.error('Blog load error:', err);
            const container = document.getElementById('mccBlogWidget');
            container.innerHTML = `<div class="mcc-blog-error">
                    <h3>Unable to load blog</h3>
                    <p>${err.message}</p>
                </div>`;
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
