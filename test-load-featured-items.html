<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test loadFeaturedItems Function</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            font-family: ui-sans-serif, system-ui;
        }
        .result {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test loadFeaturedItems Function</h1>
    <div id="output" class="result">Starting test...</div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message, data = null) {
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            let text = `[${timestamp}] ${message}`;
            if (data) {
                text += '\n' + JSON.stringify(data, null, 2);
            }
            output.textContent += text + '\n\n';
            console.log(message, data || '');
        }
        
        const GH = { owner: 'McCal-Codes', repo: 'McCals-Website', branch: 'main' };
        const RAW_ROOT = `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/`;
        
        function resolveManifestUrl(candidate) {
            if (/^https?:/i.test(candidate)) return candidate;
            const cleaned = candidate
              .replace(/^(\.\.?\/)+/, '')
              .replace(/^\.\/+/, '')
              .replace(/^\/+/, '');
            return RAW_ROOT + cleaned;
        }
        
        function cleanPath(value) {
            if (!value) return '';
            return String(value).replace(/\\+/g, '/').trim();
        }
        
        function canonicalizeType(value) {
            if (!value) return 'portfolio';
            const normalized = String(value).trim().toLowerCase();
            if (!normalized) return 'portfolio';
            if (['concert', 'concerts', 'music', 'music photography', 'concert photography'].includes(normalized)) return 'concert';
            if (['event', 'events', 'event photography', 'corporate', 'events photography'].includes(normalized)) return 'events';
            if (['journalism', 'photojournalism', 'photo journalism', 'documentary', 'journalism photography', 'politics'].includes(normalized)) return 'journalism';
            if (['portfolio', 'work', 'projects', 'featured'].includes(normalized)) return 'portfolio';
            return normalized;
        }
        
        function titleCase(value) {
            if (!value) return '';
            return String(value)
              .replace(/[_-]+/g, ' ')
              .replace(/\s+/g, ' ')
              .trim()
              .replace(/\b\w/g, char => char.toUpperCase());
        }
        
        function extractDate(entry) {
            const dateData = entry.date || entry.datetime || entry.metaDate || null;
            const displayCandidates = [entry.dateDisplay, entry.displayDate, entry.prettyDate, entry.dateText];
            const isoCandidates = [];
            
            if (typeof entry.dateISO === 'string') isoCandidates.push(entry.dateISO);
            if (typeof entry.dateIso === 'string') isoCandidates.push(entry.dateIso);
            if (typeof entry.date === 'string') isoCandidates.push(entry.date);
            if (typeof entry.lastUpdated === 'string') isoCandidates.push(entry.lastUpdated);
            if (typeof entry.generatedAt === 'string') isoCandidates.push(entry.generatedAt);
            if (typeof entry.generated === 'string') isoCandidates.push(entry.generated);

            if (dateData && typeof dateData === 'object') {
              if (typeof dateData.iso === 'string') isoCandidates.push(dateData.iso);
              if (typeof dateData.utc === 'string') isoCandidates.push(dateData.utc);
              if (typeof dateData.value === 'string') isoCandidates.push(dateData.value);
              if (dateData.year && dateData.month) {
                const day = dateData.day || 1;
                const iso = `${dateData.year}-${String(dateData.month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                isoCandidates.push(iso);
              }
              if (dateData.display) displayCandidates.push(dateData.display);
              if (dateData.dateDisplay) displayCandidates.push(dateData.dateDisplay);
              if (dateData.monthName && dateData.year) {
                displayCandidates.push(`${dateData.monthName} ${dateData.year}`);
              }
            }

            let iso = isoCandidates.find(Boolean) || null;
            let value = iso ? Date.parse(iso.replace(/\//g, '-')) : NaN;
            if (!Number.isFinite(value)) {
              value = 0;
              iso = null;
            }
            let display = displayCandidates.find(Boolean) || '';
            if (!display && iso) {
              try {
                display = new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
              } catch {
                display = iso;
              }
            }
            return { iso, display, value };
        }
        
        function formatItem(item, type, pathPrefix, index) {
            const folderPath = cleanPath(item.folderPath || item.path || item.source || '');
            const rawParts = folderPath ? folderPath.split('/').filter(Boolean) : [];
            
            if (!rawParts.length) return null;

            // Build pathSegments with proper prefix
            const pathSegments = [...pathPrefix, ...rawParts];
            
            const rawImages = Array.isArray(item.images) ? item.images : [];
            if (!rawImages.length) return null;

            // Use filename-only for images array
            const images = rawImages.map(img => {
              if (typeof img === 'string') return img;
              return img.filename || img.file || img.src || img.path || img.url || '';
            }).filter(Boolean);

            if (!images.length) return null;

            // Shuffle images for random cover selection
            const shuffledImages = [...images];
            for (let i = shuffledImages.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [shuffledImages[i], shuffledImages[j]] = [shuffledImages[j], shuffledImages[i]];
            }

            const { iso, display, value } = extractDate(item);
            const id = item.id || item.slug || item.uid || `${pathSegments.join('-')}-${index}`;
            const canonType = canonicalizeType(type);
            const typeLabel = titleCase(canonType);

            // Enhanced title extraction based on type
            let title;
            if (canonType === 'journalism') {
              // For journalism, get the article title from the folder path
              if (rawParts.length >= 2) {
                title = rawParts[rawParts.length - 1]; // Last segment is article title
              } else if (rawParts.length === 1) {
                title = rawParts[0];
              }
              
              // If still not good, try extracting from image filename
              if (!title || title === 'Events' || title === 'Politics') {
                const firstImage = rawImages[0];
                if (typeof firstImage === 'string') {
                  const match = firstImage.match(/^\d+\s+(.+?)_/);
                  if (match) {
                    title = match[1];
                  }
                }
              }
            }

            if (!title) {
              const titleCandidates = [
                item.title,
                item.name,
                item.eventName,
                item.bandName,
                item.articleTitle,
                item.headline
              ].filter(Boolean);

              if (titleCandidates.length > 0) {
                title = titleCandidates[0];
              } else {
                title = rawParts[rawParts.length - 1] || `Item ${index + 1}`;
              }
            }

            title = String(title).replace(/\s+/g, ' ').trim();

            // Get tags
            let tags = Array.isArray(item.tags) ? item.tags.filter(Boolean) : [];
            const primaryTag = canonType === 'journalism' ? 'Journalism' : `${typeLabel} Photography`;
            
            if (!tags.includes(primaryTag)) {
              tags.unshift(primaryTag);
            }

            // Clean up date display
            let cleanDateDisplay = display ? String(display).replace(/\s+/g, ' ').replace(/undefined\s*/g, '').replace(/^\s+|\s+$/g, '') : '';
            if (!cleanDateDisplay && iso) {
              try {
                cleanDateDisplay = new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
              } catch {
                cleanDateDisplay = iso;
              }
            }

            const sourceLabel = titleCase(
              item.collection || item.collectionName || item.source || pathPrefix[0] || typeLabel || 'Portfolio'
            );

            return {
              id,
              title,
              type: canonType,
              typeLabel,
              source: sourceLabel,
              pathSegments,
              folderKey: pathSegments.join('/'),
              dateDisplay: cleanDateDisplay,
              dateValue: value,
              isoDate: iso,
              cover: shuffledImages[0],
              images: shuffledImages,
              tags: tags.slice(0, 4)
            };
        }
        
        async function loadFeaturedItems() {
            const portfolioTypes = [
              {
                url: 'src/images/Portfolios/Concert/concert-manifest.json',
                type: 'concert',
                arrayKey: 'bands',
                pathPrefix: ['Concert']
              },
              {
                url: 'src/images/Portfolios/Events/events-manifest.json', 
                type: 'events',
                arrayKey: 'events',
                pathPrefix: ['Events']
              },
              {
                url: 'src/images/Portfolios/Journalism/journalism-manifest.json',
                type: 'journalism', 
                arrayKey: 'events',
                pathPrefix: ['Journalism']
              }
            ];

            const allItems = [];

            for (const portfolio of portfolioTypes) {
              try {
                const url = resolveManifestUrl(portfolio.url);
                log(`Loading ${portfolio.type} manifest`, { url });
                
                const response = await fetch(url);
                const manifest = await response.json();
                const items = manifest[portfolio.arrayKey] || [];
                
                items.forEach((item, index) => {
                  const formattedItem = formatItem(item, portfolio.type, portfolio.pathPrefix, index);
                  if (formattedItem) {
                    allItems.push(formattedItem);
                  }
                });
                
                log(`✅ Loaded ${items.length} ${portfolio.type} items`);
              } catch (error) {
                log(`❌ Failed to load ${portfolio.type} manifest`, { error: error.message });
              }
            }

            return allItems;
        }
        
        // Run the test
        async function runTest() {
            try {
                log('🚀 Starting loadFeaturedItems test...');
                
                const items = await loadFeaturedItems();
                
                log(`✅ Test complete! Loaded ${items.length} total items`);
                
                // Show sample items
                if (items.length > 0) {
                    log('📋 Sample items:', items.slice(0, 3).map(item => ({
                        id: item.id,
                        title: item.title,
                        type: item.type,
                        pathSegments: item.pathSegments,
                        images: item.images?.slice(0, 2) + (item.images?.length > 2 ? '...' : ''),
                        dateDisplay: item.dateDisplay
                    })));
                }
                
                // Show type breakdown
                const typeBreakdown = {};
                items.forEach(item => {
                    typeBreakdown[item.type] = (typeBreakdown[item.type] || 0) + 1;
                });
                log('📊 Type breakdown:', typeBreakdown);
                
            } catch (error) {
                log('💥 Test failed!', { error: error.message, stack: error.stack });
            }
        }
        
        runTest();
    </script>
</body>
</html>
