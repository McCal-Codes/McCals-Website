<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Test - McCal Media</title>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .logo-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .logo-item {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .logo-item img {
            width: 200px;
            height: 80px;
            object-fit: contain;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .logo-item h3 {
            margin: 0;
            font-size: 14px;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>Logo Loading Test</h1>
    <p>This page shows all logos individually to verify they're loading correctly:</p>
    
    <div class="logo-container">
        <div class="logo-item">
            <img src="assets/images/logos/new-york-post-logo.svg" alt="New York Post">
            <h3>New York Post</h3>
        </div>
        <div class="logo-item">
            <img src="assets/images/logos/pittsburgh-magazine-logo.svg" alt="Pittsburgh Magazine">
            <h3>Pittsburgh Magazine</h3>
        </div>
        <div class="logo-item">
            <img src="assets/images/logos/point-park-university-logo.svg" alt="Point Park University">
            <h3>Point Park University</h3>
        </div>
        <div class="logo-item">
            <img src="assets/images/logos/the-globe-logo.svg" alt="The Globe">
            <h3>The Globe</h3>
        </div>
        <div class="logo-item">
            <img src="assets/images/logos/nppa-logo.svg" alt="NPPA">
            <h3>NPPA</h3>
        </div>
        <div class="logo-item">
            <img src="assets/images/logos/pennsylvania-news-media-logo.svg" alt="Pennsylvania News Media">
            <h3>Pennsylvania News Media</h3>
        </div>
        <div class="logo-item">
            <img src="assets/images/logos/next-generation-news-logo.svg" alt="Next Generation News">
            <h3>Next Generation News</h3>
        </div>
        <div class="logo-item">
            <img src="assets/images/logos/upward-consulting-logo.svg" alt="Upward Consulting">
            <h3>Upward Consulting</h3>
        </div>
    </div>
    
    <script>
        // Log any image loading errors
        document.querySelectorAll('img').forEach(img => {
            img.onerror = function() {
                console.log(`❌ Failed to load: ${this.src}`);
                this.style.background = 'red';
                this.alt = `FAILED: ${this.alt}`;
            };
            img.onload = function() {
                console.log(`✅ Loaded: ${this.src}`);
            };
        });
    </script>
</body>
</html>
