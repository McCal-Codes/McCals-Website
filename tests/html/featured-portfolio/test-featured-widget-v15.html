<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Portfolio v1.5 Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            font-family: ui-sans-serif, system-ui;
        }
    </style>
</head>
<body>
    <!-- Load the widget HTML from GitHub -->
    <script>
        fetch('https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/src/widgets/featured-portfolio/versions/v1.5.html')
        .then(response => response.text())
        .then(html => {
            document.body.innerHTML = html;
        })
        .catch(error => {
            console.error('Failed to load widget:', error);
            document.body.innerHTML = '<h1 style="color: white;">Failed to load widget</h1>';
        });
    </script>
</body>
</html>
