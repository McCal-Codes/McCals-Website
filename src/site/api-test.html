<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Integration Test - McCal Media</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .card h2 {
      color: #333;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    
    .card pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .status.healthy {
      background: #d4edda;
      color: #155724;
    }
    
    .status.loading {
      background: #fff3cd;
      color: #856404;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    .endpoints {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .endpoint {
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      background: #f8f9fa;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .endpoint code {
      color: #667eea;
      font-weight: 600;
    }
    
    .manifest-list {
      list-style: none;
    }
    
    .manifest-item {
      padding: 0.5rem;
      margin-bottom: 0.25rem;
      background: #f8f9fa;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .manifest-item button {
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 API Integration Test</h1>
    
    <div class="grid">
      <!-- Health Check Card -->
      <div class="card">
        <h2>Health Check</h2>
        <div id="health-status" class="status loading">Checking...</div>
        <div id="health-data"></div>
        <button onclick="checkHealth()">Refresh</button>
      </div>
      
      <!-- Manifests Card -->
      <div class="card">
        <h2>Available Manifests</h2>
        <div id="manifests-status" class="status loading">Loading...</div>
        <div id="manifests-data"></div>
        <button onclick="loadManifests()">Refresh</button>
      </div>
      
      <!-- Cache Stats Card -->
      <div class="card">
        <h2>Cache Statistics</h2>
        <div id="cache-status" class="status loading">Loading...</div>
        <div id="cache-data"></div>
        <button onclick="loadCacheStats()">Refresh</button>
        <button onclick="clearCache()">Clear Cache</button>
      </div>
    </div>
    
    <!-- Test Endpoints -->
    <div class="endpoints">
      <h2>Test Endpoints</h2>
      <div id="test-results"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001';
    
    async function fetchAPI(endpoint) {
      try {
        const response = await fetch(`${API_BASE}${endpoint}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        return await response.json();
      } catch (error) {
        throw error;
      }
    }
    
    async function checkHealth() {
      const statusEl = document.getElementById('health-status');
      const dataEl = document.getElementById('health-data');
      
      statusEl.textContent = 'Checking...';
      statusEl.className = 'status loading';
      
      try {
        const data = await fetchAPI('/api/health');
        statusEl.textContent = data.status.toUpperCase();
        statusEl.className = `status ${data.status}`;
        
        dataEl.innerHTML = `
          <pre>${JSON.stringify({
            uptime: Math.round(data.uptime) + 's',
            memory: data.memory,
            timestamp: new Date(data.timestamp).toLocaleString()
          }, null, 2)}</pre>
        `;
      } catch (error) {
        statusEl.textContent = 'ERROR';
        statusEl.className = 'status error';
        dataEl.innerHTML = `<pre>Error: ${error.message}</pre>`;
      }
    }
    
    async function loadManifests() {
      const statusEl = document.getElementById('manifests-status');
      const dataEl = document.getElementById('manifests-data');
      
      statusEl.textContent = 'Loading...';
      statusEl.className = 'status loading';
      
      try {
        const data = await fetchAPI('/api/v1/manifests');
        statusEl.textContent = `${data.total} Available`;
        statusEl.className = 'status healthy';
        
        const list = data.manifests.map(m => `
          <div class="manifest-item">
            <span><strong>${m.type}</strong></span>
            <button onclick="loadManifest('${m.type}')">Load</button>
          </div>
        `).join('');
        
        dataEl.innerHTML = `
          <div class="manifest-list">${list}</div>
          <pre style="margin-top: 1rem;">${JSON.stringify(data.cacheStatus, null, 2)}</pre>
        `;
      } catch (error) {
        statusEl.textContent = 'ERROR';
        statusEl.className = 'status error';
        dataEl.innerHTML = `<pre>Error: ${error.message}</pre>`;
      }
    }
    
    async function loadManifest(type) {
      const resultsEl = document.getElementById('test-results');
      resultsEl.innerHTML = '<div class="endpoint">Loading manifest...</div>';
      
      try {
        const response = await fetch(`${API_BASE}/api/v1/manifests/${type}`);
        const data = await response.json();
        const cacheStatus = response.headers.get('X-Cache');
        
        resultsEl.innerHTML = `
          <div class="endpoint">
            <div>
              <strong>${type.toUpperCase()} Manifest</strong>
              <div style="font-size: 0.875rem; color: #666;">Cache: ${cacheStatus || 'MISS'}</div>
            </div>
          </div>
          <pre style="margin-top: 0.5rem; max-height: 400px; overflow-y: auto;">${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        resultsEl.innerHTML = `<div class="endpoint" style="color: #dc3545;">Error: ${error.message}</div>`;
      }
    }
    
    async function loadCacheStats() {
      const statusEl = document.getElementById('cache-status');
      const dataEl = document.getElementById('cache-data');
      
      statusEl.textContent = 'Loading...';
      statusEl.className = 'status loading';
      
      try {
        const data = await fetchAPI('/api/v1/manifests/cache/stats');
        statusEl.textContent = `${data.entries} Cached`;
        statusEl.className = 'status healthy';
        
        dataEl.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch (error) {
        statusEl.textContent = 'ERROR';
        statusEl.className = 'status error';
        dataEl.innerHTML = `<pre>Error: ${error.message}</pre>`;
      }
    }
    
    async function clearCache() {
      const statusEl = document.getElementById('cache-status');
      const dataEl = document.getElementById('cache-data');
      
      try {
        const response = await fetch(`${API_BASE}/api/v1/manifests/cache/clear`, {
          method: 'POST'
        });
        const data = await response.json();
        
        statusEl.textContent = 'Cleared';
        statusEl.className = 'status healthy';
        dataEl.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        
        setTimeout(loadCacheStats, 1000);
      } catch (error) {
        statusEl.textContent = 'ERROR';
        statusEl.className = 'status error';
        dataEl.innerHTML = `<pre>Error: ${error.message}</pre>`;
      }
    }
    
    // Auto-load on page load
    window.addEventListener('DOMContentLoaded', () => {
      checkHealth();
      loadManifests();
      loadCacheStats();
    });
  </script>
</body>
</html>
