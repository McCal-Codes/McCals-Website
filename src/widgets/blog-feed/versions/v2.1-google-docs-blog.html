  - Masonry grid layout

  - Tag filtering
  - Related posts
  - Professional typography
  
  Google Doc Format:
  1. H1: Document title (will be skipped)
  2. H2: Article title
  3. H4 or paragraph: "By Myself ... Date" (e.g., "10 January 2025")
  4. Paragraphs: Article content (multiple paragraphs work!)
  5. Add "Source: [link]" or "Sources: [link]" paragraphs for references
  6. Use #hashtags in content or article will auto-tag by keywords
  7. Add images anywhere - first becomes hero image
  
  Example Google Doc Structure:
  ────────────────────────────────
  H1: My Blog (skipped)
  
  H2: The Future of AI Photography
  H4: 5 November 2025
  
  Paragraph 1: Introduction text here...
  Paragraph 2: More detailed discussion...
  Paragraph 3: Analysis and insights...
  Paragraph 4: Conclusion and thoughts...
  
  Paragraph: Source: https://example.com (auto-detected)
  
  H2: Another Article Title
  H4: 1 November 2025
  (etc...)
  ────────────────────────────────
  
  McCal Media - https://mcc-cal.com
-->

<script>
const BlogFeed = {
  posts: [],
  
  async init() {
    const container = document.getElementById('blogFeed');
    if (!container) return;
    
    const docId = container.dataset.docId;
    if (!docId) {
      container.innerHTML = '<div class="blog-loading">No document ID provided</div>';
      return;
    }
    
    try {
      const html = await this.fetchGoogleDoc(docId);
      this.posts = this.parseGoogleDocHTML(html);
      this.render();
      this.initializeFilters();
      this.addStructuredData();
      this.updateMetaTags();
      
      // Check if URL has a post slug and open that post
      this.checkUrlForPost();
    } catch (error) {
      console.error('[Blog Feed] Error:', error);
      container.innerHTML = `<div class="blog-loading">Failed to load blog posts</div>`;
    }
  },
  
  checkUrlForPost() {
    const urlParams = new URLSearchParams(window.location.search);
    const postSlug = urlParams.get('post');
    
    if (postSlug) {
      const post = this.posts.find(p => this.slugify(p.title) === postSlug);
      if (post) {
        console.log('[Blog Feed] Opening post from URL:', post.title);
        this.openModal(post);
      }
    }
  },
  
  async fetchGoogleDoc(docId) {
    // Add cache-busting timestamp to force fresh content
    const timestamp = Date.now();
    const url = docId.startsWith('2PACX-')
      ? `https://docs.google.com/document/d/e/${docId}/pub?cachebust=${timestamp}`
      : `https://docs.google.com/document/d/${docId}/pub?cachebust=${timestamp}`;
    
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.text();
  },
  
  formatParagraphs(html) {
    // Split long paragraphs into multiple paragraphs after 4-5 sentences
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    
    const paragraphs = tempDiv.querySelectorAll('p');
    paragraphs.forEach(p => {
      const text = p.textContent;
      
      // Split by sentences (period, exclamation, question mark followed by space)
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      
      if (sentences.length > 5) {
        // Break into chunks of 4-5 sentences
        const chunks = [];
        for (let i = 0; i < sentences.length; i += 5) {
          chunks.push(sentences.slice(i, i + 5).join(' ').trim());
        }
        
        // Replace the paragraph with multiple paragraphs
        const fragment = document.createDocumentFragment();
        chunks.forEach(chunk => {
          const newP = document.createElement('p');
          newP.innerHTML = chunk;
          fragment.appendChild(newP);
        });
        
        p.replaceWith(fragment);
      }
    });
    
    return tempDiv.innerHTML;
  },
  
  parseGoogleDocHTML(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const posts = [];
    
    let currentPost = null;
    let contentBuffer = [];
    let skipFirstH1 = true;
    let expectingDate = false;
    let inSourcesSection = false;
    
    const processContent = () => {
      if (contentBuffer.length > 0) {
        // Wrap each paragraph in <p> tags to preserve Google Doc structure
        const content = contentBuffer.map(html => `<p>${html}</p>`).join('\n').trim();
        if (currentPost && content) {
          currentPost.body = content;
          // Create excerpt from first paragraph
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = content;
          const text = tempDiv.textContent || '';
          currentPost.excerpt = text.length > 150 ? text.substring(0, 150) + '...' : text;
        }
        contentBuffer = [];
      }
    };
    
    const walker = document.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT, null, false);
    
    let node;
    while (node = walker.nextNode()) {
      const tagName = node.tagName.toLowerCase();
      const text = node.textContent.trim();
      
      // Debug: log all elements when in sources section
      if (inSourcesSection) {
        console.log('[Blog Feed] 🔍 Element in sources section:', tagName, 'Text:', text.substring(0, 60));
      }
      
      // Skip first H1 (document title)
      if (tagName === 'h1' && skipFirstH1) {
        skipFirstH1 = false;
        continue;
      }
      
      // H2 = New post (skip if empty)
      if (tagName === 'h2' && text.trim()) {
        if (currentPost) {
          processContent();
          if (currentPost.title) {
            console.log('[Blog Feed] ===== Finalizing post:', currentPost.title, '=====');
            console.log('[Blog Feed] Sources count:', currentPost.sources.length);
            console.log('[Blog Feed] Sources:', currentPost.sources);
            posts.push(currentPost);
          }
        }
        
        inSourcesSection = false; // Reset sources flag for new post
        
        currentPost = {
          title: text,
          author: 'Caleb McCartney',
          date: null,
          hero: null,
          images: [],
          body: '',
          excerpt: '',
          tags: [],
          sources: []
        };
        
        console.log('[Blog Feed] Starting new post:', text);
        expectingDate = true;
      }
      // Extract date
      else if (tagName === 'h4' && currentPost && expectingDate) {
        const dateMatch = text.match(/(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})/i);
        if (dateMatch) {
          currentPost.date = dateMatch[1];
        } else {
          currentPost.date = text;
        }
        expectingDate = false;
      }
      // Check for H5 "Sources" heading OR source citations
      else if (tagName === 'h5' && currentPost) {
        const h5Text = text.toLowerCase();
        
        // First H5 with "source" is the heading
        if (!inSourcesSection && h5Text.includes('source')) {
          console.log('[Blog Feed] ✓ Found H5 sources heading:', text);
          console.log('[Blog Feed] ✓ inSourcesSection is now TRUE');
          inSourcesSection = true;
        }
        // Subsequent H5s in sources section are actual citations
        else if (inSourcesSection && text.length > 10) {
          console.log('[Blog Feed] ✓ Adding H5 source citation:', text);
          currentPost.sources.push({
            url: null,
            title: text
          });
        }
      }
      // Collect content
      else if (currentPost) {
        if (tagName === 'p') {
          const text = node.textContent.trim();
          const html = node.innerHTML.trim();
          
          console.log('[Blog Feed] Processing paragraph. inSourcesSection:', inSourcesSection, 'Text:', text.substring(0, 50));
          
          // Check for date in paragraph
          let skipThisParagraph = false;
          if (!currentPost.date && expectingDate) {
            const dateMatch = text.match(/(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})/i);
            if (dateMatch) {
              currentPost.date = dateMatch[1];
              expectingDate = false;
              if (text.startsWith('By Myself')) {
                skipThisParagraph = true;
              }
            }
          }
          
          // Extract images
          const images = node.querySelectorAll('img');
          images.forEach(img => {
            if (img.src) {
              if (!currentPost.hero) {
                currentPost.hero = img.src;
              } else {
                currentPost.images.push(img.src);
              }
            }
          });
          
          // If we're in sources section, extract all links from paragraphs
          if (inSourcesSection) {
            console.log('[Blog Feed] In sources section, checking paragraph:', text);
            const links = node.querySelectorAll('a');
            if (links.length > 0) {
              console.log('[Blog Feed] Found', links.length, 'links in sources paragraph');
              links.forEach(link => {
                if (link.href) {
                  console.log('[Blog Feed] Adding source with link:', link.href, link.textContent.trim());
                  currentPost.sources.push({
                    url: link.href,
                    title: link.textContent.trim()
                  });
                }
              });
            } else if (text) {
              // No links, treat as plain text citation (APA format)
              console.log('[Blog Feed] Adding plain text source:', text);
              currentPost.sources.push({
                url: null,
                title: text
              });
            }
            skipThisParagraph = true;
          }
          // Legacy: Check for sources (paragraphs starting with "Source:")
          else if (text.toLowerCase().startsWith('source:') || text.toLowerCase().startsWith('sources:')) {
            console.log('[Blog Feed] Found sources paragraph:', text);
            const links = node.querySelectorAll('a');
            console.log('[Blog Feed] Links found in sources:', links.length);
            links.forEach(link => {
              if (link.href) {
                console.log('[Blog Feed] Adding source:', link.href, link.textContent.trim());
                currentPost.sources.push({
                  url: link.href,
                  title: link.textContent.trim()
                });
              }
            });
            skipThisParagraph = true;
          }
          
          if (text && !skipThisParagraph && !expectingDate) {
            contentBuffer.push(html);
          }
        }
        else if (['ul', 'ol', 'blockquote', 'div'].includes(tagName)) {
          if (!expectingDate) {
            const html = node.outerHTML;
            if (html.trim()) contentBuffer.push(html);
          }
        }
      }
    }
    
    // Process last post
    if (currentPost) {
      processContent();
      if (currentPost.title) {
        console.log('[Blog Feed] Adding post:', currentPost.title, 'Sources:', currentPost.sources.length);
        posts.push(currentPost);
      }
    }
    
    // Extract tags - only from proper hashtags (whitespace or start of text before #)
    posts.forEach(post => {
      if (!post.tags) post.tags = [];
      
      // Match hashtags that are standalone (not mid-word references like #blm in "like #blm")
      // Only match if # follows whitespace or is at start of line
      const tagMatches = post.body ? post.body.match(/(?:^|\s)#(\w+)/g) : null;
      if (tagMatches) {
        const excludedTags = ['blm']; // Tags that are references, not actual post tags
        post.tags = tagMatches
          .map(tag => tag.trim().substring(1).toLowerCase())
          .filter(tag => !excludedTags.includes(tag));
      }
      
      // Always add inferred tags from title regardless of hashtags found
      const title = post.title ? post.title.toLowerCase() : '';
      if ((title.includes('marx') || title.includes('politic')) && !post.tags.includes('politics')) {
        post.tags.push('politics');
      }
      if ((title.includes('loss') || title.includes('grief') || title.includes('death') || title.includes('shadow')) && !post.tags.includes('personal')) {
        post.tags.push('personal');
      }
      if (title.includes('review') && !post.tags.includes('review')) {
        post.tags.push('review');
      }
      if (title.includes('tech') && !post.tags.includes('technology')) {
        post.tags.push('technology');
      }
    });
    
    console.log('[Blog Feed] ========== FINAL POSTS ==========');
    posts.forEach((post, idx) => {
      console.log(`Post ${idx + 1}: ${post.title}`);
      console.log(`  - Sources count: ${post.sources ? post.sources.length : 0}`);
      if (post.sources && post.sources.length > 0) {
        post.sources.forEach((src, i) => {
          console.log(`    ${i + 1}. ${src.title ? src.title.substring(0, 50) : src.url}`);
        });
      }
    });
    console.log('[Blog Feed] =====================================');
    
    console.log('[Blog Feed] Parsed posts:', posts);
    
    // Load hero images from local src folder if not found in Google Doc
    this.assignLocalHeroImages(posts);
    
    return posts;
  },
  
  assignLocalHeroImages(posts) {
    const container = document.getElementById('blogFeed');
    const imageBasePath = container?.dataset.imagePath || '../../../images/blog/';
    
    posts.forEach(post => {
      // Skip if post already has a hero image from Google Doc
      if (post.hero) return;
      
      // Create slug from title for image filename matching
      const slug = this.slugify(post.title);
      
      // Try common image extensions
      const extensions = ['jpg', 'jpeg', 'png', 'webp'];
      const imagePath = `${imageBasePath}${slug}.jpg`; // Default to .jpg
      
      // Set the hero image path
      post.hero = imagePath;
      
      console.log(`[Blog Feed] Assigned local hero image for "${post.title}": ${imagePath}`);
    });
  },
  
  render() {
    const container = document.getElementById('blogFeed');
    if (!container) return;
    
    const grid = document.createElement('div');
    grid.className = 'blog-grid';
    
    this.posts.forEach((post, index) => {
      const card = this.createCard(post);
      setTimeout(() => card.classList.add('loaded'), index * 50);
      grid.appendChild(card);
    });
    
    container.innerHTML = '';
    container.appendChild(grid);
    
    setTimeout(() => grid.classList.add('loaded'), 100);
  },
  
  createCard(post) {
    const card = document.createElement('article');
    card.className = 'blog-card';
    card.dataset.tags = post.tags.join(',');
    card.onclick = () => this.openModal(post);
    card.setAttribute('role', 'article');
    card.setAttribute('aria-label', post.title);
    
    let html = '';
    
    // Hero image
    if (post.hero) {
      html += `
        <div class="card-image">
          <img src="${post.hero}" alt="${post.title} - Blog post cover image" loading="lazy">
        </div>
      `;
    }
    
    // Content
    html += '<div class="card-content">';
    
    // Tags
    if (post.tags && post.tags.length > 0) {
      html += '<div class="card-tags">';
      post.tags.forEach(tag => {
        html += `<span class="card-tag">${tag}</span>`;
      });
      html += '</div>';
    }
    
    // Title
    html += `<h2 class="card-title">${post.title}</h2>`;
    
    // Meta
    html += '<div class="card-meta">';
    if (post.author) {
      html += `<span class="card-author">${post.author}</span>`;
    }
    if (post.date) {
      html += `<span>•</span><span class="card-date">${this.formatDate(post.date)}</span>`;
    }
    html += '</div>';
    
    // Excerpt
    if (post.excerpt) {
      html += `<p class="card-excerpt">${post.excerpt}</p>`;
    }
    
    html += '<span class="card-read-more">Read More →</span>';
    html += '</div>';
    
    card.innerHTML = html;
    return card;
  },
  
  openModal(post) {
    const modal = document.getElementById('blogModal');
    const fullPost = document.getElementById('fullPost');
    
    // Update URL with post slug
    const slug = this.slugify(post.title);
    const url = new URL(window.location);
    url.searchParams.set('post', slug);
    window.history.pushState({ post: slug }, '', url);
    
    let html = '';
    
    // Hero
    if (post.hero) {
      html += `<img src="${post.hero}" alt="${post.title} - Featured image" class="post-hero" itemprop="image">`;
    }
    
    // Tags
    if (post.tags && post.tags.length > 0) {
      html += '<div class="post-tags" role="list" aria-label="Post categories">';
      post.tags.forEach(tag => {
        html += `<span class="post-tag" role="listitem" itemprop="keywords">${tag}</span>`;
      });
      html += '</div>';
    }
    
    // Title
    html += `<h1 class="post-title" itemprop="headline">${post.title}</h1>`;
    
    // Meta
    html += '<div class="post-meta" role="contentinfo">';
    if (post.author) {
      html += `<span class="post-author" itemprop="author" itemscope itemtype="https://schema.org/Person"><span itemprop="name">By ${post.author}</span></span>`;
    }
    if (post.date) {
      html += `<span>•</span><span class="post-date"><time itemprop="datePublished" datetime="${this.parseDate(post.date)}">${this.formatDate(post.date)}</time></span>`;
    }
    html += '</div>';
    
    // Body
    html += `<div class="post-body" itemprop="articleBody">${post.body}</div>`;
    
    // Related posts
    const related = this.getRelatedPosts(post);
    if (related.length > 0) {
      html += '<div class="related-posts">';
      html += '<h3 class="related-title">Related Articles</h3>';
      html += '<div class="related-grid">';
      related.forEach(relPost => {
        html += `
          <div class="related-card" onclick="BlogFeed.openModal(BlogFeed.posts.find(p => p.title === '${relPost.title.replace(/'/g, "\\'")}'))">
            <h4 class="related-card-title">${relPost.title}</h4>
            <div class="related-card-meta">${relPost.date || ''}</div>
          </div>
        `;
      });
      html += '</div></div>';
    }
    
    // Sources - collapsible dropdown at bottom
    if (post.sources && post.sources.length > 0) {
      html += '<div class="sources-section" role="region" aria-label="Article sources and references">';
      html += `
        <button class="sources-toggle" onclick="BlogFeed.toggleSources()" aria-expanded="false" aria-controls="sources-list">
          <svg class="sources-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
          <span class="sources-toggle-text">Sources & References (${post.sources.length})</span>
        </button>
      `;
      html += '<div class="sources-list" id="sources-list" style="display: none;">';
      post.sources.forEach((source, index) => {
        const sourceNum = index + 1;
        html += `
          <div class="source-item" itemprop="citation">
            <div class="source-number">${sourceNum}</div>
            <div class="source-details">
              <div class="source-text" id="source-${sourceNum}">${source.title || source.url}</div>
              <div class="source-actions">`;
        
        // Only show "Visit Source" link if URL exists
        if (source.url) {
          html += `<a href="${source.url}" target="_blank" rel="noopener noreferrer" class="source-visit">Visit Source →</a>`;
        }
        
        html += `<button class="source-copy" onclick="BlogFeed.copySource('source-${sourceNum}')" aria-label="Copy source citation">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  Copy
                </button>
              </div>
            </div>
          </div>
        `;
      });
      html += '</div></div>';
    }
    
    fullPost.innerHTML = html;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  },
  
  copySource(elementId) {
    const element = document.getElementById(elementId);
    if (!element) return;
    
    const text = element.textContent;
    navigator.clipboard.writeText(text).then(() => {
      // Visual feedback
      const button = event.target.closest('.source-copy');
      const originalText = button.innerHTML;
      button.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
      button.style.background = 'rgba(76, 175, 80, 0.2)';
      button.style.borderColor = 'rgba(76, 175, 80, 0.4)';
      
      setTimeout(() => {
        button.innerHTML = originalText;
        button.style.background = '';
        button.style.borderColor = '';
      }, 2000);
    }).catch(err => {
      console.error('Failed to copy:', err);
    });
  },
  
  toggleSources() {
    const sourcesList = document.getElementById('sources-list');
    const toggle = document.querySelector('.sources-toggle');
    const icon = toggle.querySelector('.sources-icon');
    
    if (sourcesList.style.display === 'none') {
      sourcesList.style.display = 'flex';
      toggle.setAttribute('aria-expanded', 'true');
      icon.style.transform = 'rotate(90deg)';
    } else {
      sourcesList.style.display = 'none';
      toggle.setAttribute('aria-expanded', 'false');
      icon.style.transform = 'rotate(0deg)';
    }
  },
  
  closeModal() {
    const modal = document.getElementById('blogModal');
    modal.classList.remove('active');
    document.body.style.overflow = '';
    
    // Remove post parameter from URL
    const url = new URL(window.location);
    url.searchParams.delete('post');
    window.history.pushState({}, '', url);
  },
  
  getRelatedPosts(currentPost) {
    return this.posts
      .filter(post => post.title !== currentPost.title)
      .filter(post => {
        // Match by tags
        const sharedTags = post.tags.filter(tag => currentPost.tags.includes(tag));
        return sharedTags.length > 0;
      })
      .slice(0, 3);
  },
  
  formatDate(dateStr) {
    const months = {
      january: 'Jan', february: 'Feb', march: 'Mar', april: 'Apr',
      may: 'May', june: 'Jun', july: 'Jul', august: 'Aug',
      september: 'Sep', october: 'Oct', november: 'Nov', december: 'Dec'
    };
    
    const match = dateStr.match(/(\d{1,2})\s+(\w+)\s+(\d{4})/i);
    if (match) {
      const [, day, month, year] = match;
      const shortMonth = months[month.toLowerCase()];
      return `${shortMonth} ${day}, ${year}`;
    }
    return dateStr;
  },
  
  initializeFilters() {
    const allTags = new Set();
    this.posts.forEach(post => {
      if (post.tags) {
        post.tags.forEach(tag => allTags.add(tag));
      }
    });
    
    if (allTags.size === 0) return;
    
    const filtersContainer = document.getElementById('blogFilters');
    if (!filtersContainer) return;
    
    filtersContainer.style.display = 'flex';
    
    Array.from(allTags).sort().forEach(tag => {
      const button = document.createElement('button');
      button.className = 'tag-filter';
      button.textContent = tag;
      button.dataset.tag = tag;
      filtersContainer.appendChild(button);
    });
    
    filtersContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('tag-filter')) {
        const selectedTag = e.target.dataset.tag;
        
        filtersContainer.querySelectorAll('.tag-filter').forEach(btn => {
          btn.classList.remove('active');
        });
        e.target.classList.add('active');
        
        const cards = document.querySelectorAll('.blog-card');
        cards.forEach(card => {
          if (selectedTag === 'all') {
            card.style.display = '';
          } else {
            const cardTags = (card.dataset.tags || '').split(',');
            if (cardTags.includes(selectedTag)) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          }
        });
      }
    });
  },
  
  addStructuredData() {
    // Remove existing structured data if any
    const existingScript = document.querySelector('script[type="application/ld+json"]');
    if (existingScript) existingScript.remove();
    
    // Create Blog structured data
    const structuredData = {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "Caleb McCartney's Blog",
      "description": "Personal blog covering politics, photography, and social commentary",
      "author": {
        "@type": "Person",
        "name": "Caleb McCartney",
        "url": "https://mccalmedia.com"
      },
      "blogPost": this.posts.map(post => ({
        "@type": "BlogPosting",
        "headline": post.title,
        "description": post.excerpt,
        "author": {
          "@type": "Person",
          "name": post.author || "Caleb McCartney"
        },
        "datePublished": this.parseDate(post.date),
        "keywords": post.tags ? post.tags.join(', ') : '',
        "image": post.hero || '',
        "articleBody": this.stripHTML(post.body),
        "url": window.location.href + '#' + this.slugify(post.title)
      }))
    };
    
    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify(structuredData, null, 2);
    document.head.appendChild(script);
  },
  
  updateMetaTags() {
    // Update page title
    document.title = "Blog - Caleb McCartney | McCal Media";
    
    // Update or create meta description
    this.updateOrCreateMeta('description', 
      'Personal blog by photographer Caleb McCartney covering politics, social commentary, and photojournalism insights.');
    
    // Open Graph tags
    this.updateOrCreateMeta('og:title', 'Blog - Caleb McCartney', 'property');
    this.updateOrCreateMeta('og:description', 
      'Personal blog covering politics, photography, and social commentary', 'property');
    this.updateOrCreateMeta('og:type', 'blog', 'property');
    this.updateOrCreateMeta('og:url', window.location.href, 'property');
    
    // Twitter Card tags
    this.updateOrCreateMeta('twitter:card', 'summary_large_image');
    this.updateOrCreateMeta('twitter:title', 'Blog - Caleb McCartney');
    this.updateOrCreateMeta('twitter:description', 
      'Personal blog covering politics, photography, and social commentary');
    
    // Keywords
    const allTags = [...new Set(this.posts.flatMap(p => p.tags || []))];
    this.updateOrCreateMeta('keywords', allTags.join(', '));
    
    // Author
    this.updateOrCreateMeta('author', 'Caleb McCartney');
  },
  
  updateOrCreateMeta(name, content, attribute = 'name') {
    let meta = document.querySelector(`meta[${attribute}="${name}"]`);
    if (!meta) {
      meta = document.createElement('meta');
      meta.setAttribute(attribute, name);
      document.head.appendChild(meta);
    }
    meta.setAttribute('content', content);
  },
  
  parseDate(dateStr) {
    // Convert "10 January 2025" to ISO format
    if (!dateStr) return new Date().toISOString();
    const match = dateStr.match(/(\d{1,2})\s+(\w+)\s+(\d{4})/i);
    if (!match) return new Date().toISOString();
    
    const [, day, month, year] = match;
    const months = {
      january: 0, february: 1, march: 2, april: 3, may: 4, june: 5,
      july: 6, august: 7, september: 8, october: 9, november: 10, december: 11
    };
    
    const date = new Date(year, months[month.toLowerCase()], day);
    return date.toISOString();
  },
  
  stripHTML(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    return div.textContent || div.innerText || '';
  },
  
  slugify(text) {
    return text
      .toLowerCase()
      .replace(/[^\w\s-]/g, '')
      .replace(/[\s_-]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }
};

// Initialize on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => BlogFeed.init());
} else {
  BlogFeed.init();
}

// Close modal on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    BlogFeed.closeModal();
  }
});

// Handle browser back/forward buttons
window.addEventListener('popstate', (e) => {
  const urlParams = new URLSearchParams(window.location.search);
  const postSlug = urlParams.get('post');
  
  if (postSlug) {
    const post = BlogFeed.posts.find(p => BlogFeed.slugify(p.title) === postSlug);
    if (post) {
      BlogFeed.openModal(post);
    }
  } else {
    BlogFeed.closeModal();
  }
});
</script>
