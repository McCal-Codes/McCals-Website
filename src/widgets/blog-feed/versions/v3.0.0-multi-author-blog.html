    <!-- Blog Feed Widget v3.0.0 - Multi-Author with Interactive Filtering
Author: Caleb McCartney / McCal-Codes
Version: 3.0.0
Purpose: Modern multi-author blog feed with author profiles, filtering, and search.

Features:
- Multiple author support with profiles (name, bio, avatar, social links)
- Interactive filtering: by author, category, tags
- Search functionality across titles and content
- Sort options (newest, oldest, popular)
- Responsive card-based layout with CSS columns
- BEM naming convention (mcc-blog__element--modifier)
- Modern ES6+ JavaScript (const/let, arrow functions, async/await)
- CSS custom properties with fallbacks
- Accessible with ARIA attributes and keyboard navigation
- Structured data (BlogPosting schema)

Usage: Paste into Squarespace Code Block
Configuration (data-* attributes on #blogFeed):
- data-authors: JSON array of author objects or URL to authors.json
- data-posts: JSON array of post objects or URL to posts.json (Google Docs coming in v3.1)
- data-max-posts: max posts to display (default 12)
- data-author-filter: enable author filter (default true)
- data-category-filter: enable category filter (default true)
- data-search: enable search (default true)
-->

    <style>

        --mcc-fg-light: #666;

        --mcc-space-1: 4px;
        --mcc-space-2: 8px;
        --mcc-space-3: 12px;
        --mcc-space-4: 16px;
        --mcc-space-5: 24px;
        --mcc-space-6: 32px;
        --mcc-space-7: 48px;
        --mcc-space-8: 64px;

        transition: all 0.2s ease;
      }

      }

      .mcc-toolbar__select:focus {
        outline: none;
        border-color: var(--mcc-accent, #0066cc);

      }

      /* BEM: Loading Component */
      .mcc-loading {
        display: flex;

        border-radius: 50%;

      }

      @keyframes mcc-spin {

      /* BEM: Blog Grid */
      .mcc-blog__grid {
        column-count: 3;
        column-gap: var(--mcc-space-6, 30px);
        opacity: 0;
        transition: opacity 0.5s;
      }

      .mcc-blog__grid--loaded {
        opacity: 1;
      }

      /* BEM: Blog Card Component */
      .mcc-card {
        display: inline-block;
        width: 100%;
        margin-bottom: var(--mcc-space-6, 30px);
        background: var(--mcc-panel-bg, rgba(255, 255, 255, 0.95));
        border-radius: var(--mcc-radius-xl, 16px);
        overflow: hidden;
        border: 1px solid var(--mcc-panel-border, rgba(0, 0, 0, 0.08));

        color: var(--mcc-fg, #1a1a1a);

        margin: 0;

        font: var(--mcc-weight-bold, 700) var(--mcc-text-xl, 1.25rem) / 1.3
          var(--mcc-font-sans, ui-sans-serif, system-ui);
        color: var(--mcc-fg, #1a1a1a);

        justify-content: center;

          var(--mcc-font-sans, ui-sans-serif, system-ui);
        color: #fff;
        background: var(--mcc-accent, #0066cc);
        border: none;
        border-radius: var(--mcc-radius, 8px);
        cursor: pointer;
      }
      .mcc-pagination__btn[aria-disabled="true"] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .mcc-pagination__info {
        font: var(--mcc-weight-medium, 500) var(--mcc-text-sm, 0.875rem) / 1.2
          var(--mcc-font-sans, ui-sans-serif, system-ui);
        color: var(--mcc-fg-light, #666);
      }

      .mcc-card__excerpt {
        margin: 0 0 var(--mcc-space-4, 16px) 0;
        font: var(--mcc-weight-normal, 400) var(--mcc-text-base, 1rem) / 1.6
          var(--mcc-font-sans, ui-sans-serif, system-ui);
        color: var(--mcc-fg-light, #666);

      .mcc-card__tags {
        display: flex;

        color: var(--mcc-accent, #0066cc);
        background: rgba(0, 102, 204, 0.08);
        padding: var(--mcc-space-1, 4px) var(--mcc-space-2, 8px);
        border-radius: var(--mcc-radius, 4px);
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .mcc-tag:hover {
        background: rgba(0, 102, 204, 0.15);
        color: var(--mcc-accent-hover, #0052a3);
      }

      /* BEM: Modal Component */
      .mcc-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        padding: var(--mcc-space-5, 20px);
      }

      .mcc-modal--active {
        display: flex;
      }

      .mcc-modal__overlay {
        position: absolute;
        inset: 0;
        cursor: pointer;
      }

      .mcc-modal__content {
        position: relative;
        width: 100%;
        max-width: 900px;
        max-height: 90vh;
        background: var(--mcc-bg, #ffffff);
        border-radius: var(--mcc-radius-xl, 20px);
        overflow-y: auto;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }

      .mcc-modal__close {
        position: absolute;
        top: var(--mcc-space-4, 16px);

        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: none;

      .mcc-modal__close:hover {

      .mcc-modal__post {

      }

      /* Responsive */
      @media (max-width: 1024px) {
        .mcc-blog__grid {
          column-count: 2;

      }

      @media (max-width: 768px) {
        .mcc-blog {
          padding: var(--mcc-space-5, 20px);
        }
        .mcc-blog__grid {
          column-count: 1;
        }
        .mcc-toolbar {
          flex-direction: column;
        }
        .mcc-toolbar__search {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <div
      class="mcc-blog"
      id="blogWidget"
      data-widget-version="3.0.0"
      data-max-posts="12"
      data-author-filter="true"
      data-category-filter="true"
      data-search="true"
    >
      <div class="mcc-blog__header">
        <h1 class="mcc-blog__heading">
          Latest Articles
          <span class="mcc-badge">v3.0</span>
        </h1>
        <p class="mcc-blog__description">
          Explore articles from multiple authors covering politics, photography,
          and the human condition
        </p>
      </div>

      <!-- Interactive Toolbar -->
      <div class="mcc-toolbar" id="blogToolbar">
        <div class="mcc-toolbar__search">
          <input
            type="search"
            class="mcc-toolbar__input"
            id="blogSearch"
            placeholder="Search articles..."
            aria-label="Search articles"
          />
        </div>
        <div class="mcc-toolbar__filters">
          <label class="mcc-toolbar__label" for="authorFilter">Author:</label>
          <select
            class="mcc-toolbar__select"
            id="authorFilter"
            aria-label="Filter by author"
          >
            <option value="">All Authors</option>
          </select>

          <label class="mcc-toolbar__label" for="categoryFilter"
            >Category:</label
          >
          <select
            class="mcc-toolbar__select"
            id="categoryFilter"
            aria-label="Filter by category"
          >
            <option value="">All Categories</option>
          </select>

          <label class="mcc-toolbar__label" for="sortFilter">Sort:</label>
          <select
            class="mcc-toolbar__select"
            id="sortFilter"
            aria-label="Sort articles"
          >
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title">Title (A-Z)</option>
          </select>
        </div>
      </div>

      <!-- Blog Grid -->
      <div id="blogFeed">
        <div class="mcc-loading">
          <div class="mcc-spinner" aria-hidden="true"></div>
          Loading articles...
        </div>
      </div>
      <div
        class="mcc-pagination"
        id="blogPagination"
        aria-label="Pagination"
        role="navigation"
        hidden
      >
        <button
          class="mcc-pagination__btn mcc-focus-ring"
          id="prevPage"
          aria-label="Previous page"
        >
          Prev
        </button>
        <span
          class="mcc-pagination__info"
          id="pageInfo"
          aria-live="polite"
        ></span>
        <button
          class="mcc-pagination__btn mcc-focus-ring"
          id="nextPage"
          aria-label="Next page"
        >
          Next
        </button>
      </div>
    </div>

    <!-- Full Post Modal -->
    <div
      class="mcc-modal"
      id="postModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalPostTitle"
    >
      <div class="mcc-modal__overlay" onclick="BlogWidget.closeModal()"></div>
      <div class="mcc-modal__content">
        <button
          class="mcc-modal__close"
          onclick="BlogWidget.closeModal()"
          aria-label="Close article"
        >
          &times;
        </button>
        <article
          class="mcc-modal__post"
          id="modalPost"
          itemscope
          itemtype="https://schema.org/BlogPosting"
        ></article>
      </div>
    </div>

            tags: ["Photography", "Politics", "Social Justice"],
            date: "2025-11-15",
            image: "/images/blog/photojournalism-power.jpg",
            readTime: "8 min read",
          },
          {
            id: "2",
            title: "Behind the Lens: Covering the 2024 Campaign Trail",
            excerpt:
              "A first-hand account of documenting the presidential campaign and the challenges of capturing authentic moments.",
            content: "<p>Full article content here...</p>",
            author: "caleb-mccartney",
            category: "Photography",
            tags: ["Campaign", "Documentary", "Politics"],
            date: "2025-10-28",
            image: "/images/blog/campaign-trail.jpg",
            readTime: "12 min read",
          },
          {
            id: "3",
            title: "The Ethics of Documentary Photography",
            excerpt:
              "Examining the moral responsibilities photographers face when documenting sensitive subjects and vulnerable communities.",
            content: "<p>Full article content here...</p>",
            author: "guest-author",
            category: "Ethics",
            tags: ["Ethics", "Photography", "Documentary"],
            date: "2025-11-01",
            image: "/images/blog/ethics.jpg",
            readTime: "10 min read",
          },
        ];

        // Blog Widget Module
        const BlogWidget = {
          config: {
            maxPosts: 12,
            authorFilter: true,
            categoryFilter: true,
            search: true,
            pageSize: 12,
          },

          state: {
            authors: sampleAuthors,
            posts: samplePosts,
            filteredPosts: [],
            page: 1,
            currentFilters: {
              author: "",
              category: "",
              search: "",
              sort: "newest",
            },
          },

          init: function () {
            this.loadConfig();
            this.loadData();
            this.setupFilters();
            this.applyFilters();
            this.render();
          },

          loadConfig: function () {
            const widget = $("#blogWidget");
            if (!widget) return;

            this.config.maxPosts = parseInt(widget.dataset.maxPosts) || 12;
            this.config.pageSize = this.config.maxPosts; // keep behavior consistent
            this.config.authorFilter = widget.dataset.authorFilter !== "false";
            this.config.categoryFilter =
              widget.dataset.categoryFilter !== "false";
            this.config.search = widget.dataset.search !== "false";
          },

          loadData: function () {
            // In production, this would fetch from API or parse Google Docs
            // For now, using sample data
            this.state.filteredPosts = [...this.state.posts];
          },

          setupFilters: function () {
            // Populate author filter
            const authorFilter = $("#authorFilter");
            if (authorFilter && this.config.authorFilter) {
              this.state.authors.forEach((author) => {
                const option = document.createElement("option");
                option.value = author.id;
                option.textContent = author.name;
                authorFilter.appendChild(option);
              });

              authorFilter.addEventListener("change", (e) => {
                this.state.currentFilters.author = e.target.value;
                this.applyFilters();
                this.render();
              });
            }

            // Populate category filter
            const categoryFilter = $("#categoryFilter");
            if (categoryFilter && this.config.categoryFilter) {
              const categories = [
                ...new Set(this.state.posts.map((p) => p.category)),
              ];
              categories.forEach((category) => {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
              });

              categoryFilter.addEventListener("change", (e) => {
                this.state.currentFilters.category = e.target.value;
                this.applyFilters();
                this.render();
              });
            }

            // Setup search
            const searchInput = $("#blogSearch");
            if (searchInput && this.config.search) {
              searchInput.addEventListener(
                "input",
                debounce((e) => {
                  this.state.currentFilters.search =
                    e.target.value.toLowerCase();
                  this.applyFilters();
                  this.render();
                }, 300)
              );
            }

            // Setup sort
            const sortFilter = $("#sortFilter");
            if (sortFilter) {
              sortFilter.addEventListener("change", (e) => {
                this.state.currentFilters.sort = e.target.value;
                this.state.page = 1;
                this.applyFilters();
                this.render();
              });
            }

            // Pagination controls
            const prev = $("#prevPage");
            const next = $("#nextPage");
            if (prev && next) {
              prev.addEventListener("click", () => {
                if (this.state.page > 1) {
                  this.state.page--;
                  this.render();
                }
              });
              next.addEventListener("click", () => {
                const totalPages = Math.ceil(
                  this.state.filteredPosts.length / this.config.pageSize
                );
                if (this.state.page < totalPages) {
                  this.state.page++;
                  this.render();
                }
              });
              document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight") next.click();
                if (e.key === "ArrowLeft") prev.click();
              });
            }
          },

          applyFilters: function () {
            let filtered = [...this.state.posts];

            // Filter by author
            if (this.state.currentFilters.author) {
              filtered = filtered.filter(
                (post) => post.author === this.state.currentFilters.author
              );
            }

            // Filter by category
            if (this.state.currentFilters.category) {
              filtered = filtered.filter(
                (post) => post.category === this.state.currentFilters.category
              );
            }

            // Filter by search
            if (this.state.currentFilters.search) {
              const query = this.state.currentFilters.search;
              filtered = filtered.filter(
                (post) =>
                  post.title.toLowerCase().includes(query) ||
                  post.excerpt.toLowerCase().includes(query) ||
                  post.tags.some((tag) => tag.toLowerCase().includes(query))
              );
            }

            // Apply sort
            const sort = this.state.currentFilters.sort;
            if (sort === "newest") {
              filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else if (sort === "oldest") {
              filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
            } else if (sort === "title") {
              filtered.sort((a, b) => a.title.localeCompare(b.title));
            }

            // Keep full filtered list; pagination will slice during render
            this.state.filteredPosts = filtered;
          },

          render: function () {
            const container = $("#blogFeed");
            if (!container) return;

            if (this.state.filteredPosts.length === 0) {
              container.innerHTML = `
          <div class="mcc-loading">
            No articles found. Try adjusting your filters.
          </div>
        `;
              return;
            }

            const grid = document.createElement("div");
            grid.className = "mcc-blog__grid";
            grid.setAttribute("role", "list");

            const start = (this.state.page - 1) * this.config.pageSize;
            const end = start + this.config.pageSize;
            const pagePosts = this.state.filteredPosts.slice(start, end);

            pagePosts.forEach((post) => {
              const card = this.createCard(post);
              grid.appendChild(card);
            });

            container.innerHTML = "";
            container.appendChild(grid);

            // Update pagination
            const totalPages = Math.ceil(
              this.state.filteredPosts.length / this.config.pageSize
            );
            const pagination = $("#blogPagination");
            const prev = $("#prevPage");
            const next = $("#nextPage");
            const info = $("#pageInfo");
            if (totalPages > 1 && pagination && prev && next && info) {
              pagination.hidden = false;
              prev.setAttribute("aria-disabled", String(this.state.page <= 1));
              next.setAttribute(
                "aria-disabled",
                String(this.state.page >= totalPages)
              );
              info.textContent = `Page ${this.state.page} of ${totalPages}`;
            } else if (pagination) {
              pagination.hidden = true;
            }

            // Trigger reveal animation
            requestAnimationFrame(() => {
              grid.classList.add("mcc-blog__grid--loaded");
            });
          },

          createCard: function (post) {
            const author = this.state.authors.find((a) => a.id === post.author);

            const card = document.createElement("article");
            card.className = "mcc-card";
            card.setAttribute("role", "listitem");
            card.setAttribute("itemscope", "");
            card.setAttribute("itemtype", "https://schema.org/BlogPosting");

            card.innerHTML = `
        <div class="mcc-card__image">
          <img src="${post.image}" alt="${post.title}" itemprop="image">
        </div>
        <div class="mcc-card__content">
          <div class="mcc-card__meta">
            <img class="mcc-card__avatar" src="${
              author?.avatar || "/images/authors/default.jpg"
            }" alt="${author?.name || "Author"}">
            <div>
              <p class="mcc-card__author" itemprop="author">${
                author?.name || "Unknown"
              }</p>
              <p class="mcc-card__date">
                <time datetime="${
                  post.date
                }" itemprop="datePublished">${formatDate(post.date)}</time> · ${
              post.readTime
            }
              </p>
            </div>
          </div>
          <h3 class="mcc-card__title" itemprop="headline">${post.title}</h3>
          <p class="mcc-card__excerpt" itemprop="description">${
            post.excerpt
          }</p>
          <div class="mcc-card__tags">
            ${post.tags
              .map((tag) => `<span class="mcc-tag">#${tag}</span>`)
              .join("")}
          </div>
        </div>
      `;

            card.addEventListener("click", () => this.openModal(post));
            card.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                this.openModal(post);
              }
            });
            card.setAttribute("tabindex", "0");
            card.classList.add("mcc-focus-ring");

            return card;
          },

          openModal: function (post) {
            const modal = $("#postModal");
            const modalPost = $("#modalPost");

            if (!modal || !modalPost) return;

            const author = this.state.authors.find((a) => a.id === post.author);

            modalPost.innerHTML = `
        <div class="mcc-modal__post-header">
          <h2 class="mcc-modal__post-title" id="modalPostTitle" itemprop="headline">${
            post.title
          }</h2>
          <div class="mcc-modal__post-meta">
            <img class="mcc-card__avatar" src="${
              author?.avatar || "/images/authors/default.jpg"
            }" alt="${author?.name || "Author"}">
            <span itemprop="author">${author?.name || "Unknown"}</span>
            <span>·</span>
            <time datetime="${post.date}" itemprop="datePublished">${formatDate(
              post.date
            )}</time>
            <span>·</span>
            <span>${post.readTime}</span>
          </div>
        </div>
        <div class="mcc-modal__post-content" itemprop="articleBody">
          ${post.content}
        </div>
      `;

            modal.classList.add("mcc-modal--active");
            modal.setAttribute("aria-hidden", "false");

            // Focus management
            const closeBtn = $(".mcc-modal__close", modal);
            if (closeBtn) closeBtn.focus();

            // Keyboard navigation
            document.addEventListener("keydown", this.handleModalKeydown);
          },

          closeModal: function () {
            const modal = $("#postModal");
            if (!modal) return;

            modal.classList.remove("mcc-modal--active");
            modal.setAttribute("aria-hidden", "true");

            document.removeEventListener("keydown", this.handleModalKeydown);
          },

          handleModalKeydown: function (e) {
            if (e.key === "Escape") {
              BlogWidget.closeModal();
            }
          },
        };

        // Expose for global access
        window.BlogWidget = BlogWidget;

        // Auto-init when DOM ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () =>
            BlogWidget.init()
          );
        } else {
          BlogWidget.init();
        }
      })();
    </script>
  </body>
</html>
