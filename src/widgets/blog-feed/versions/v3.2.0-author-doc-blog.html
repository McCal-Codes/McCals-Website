    <!-- Blog Feed Widget v3.2.0 - One Document Per Author
Author: Caleb McCartney / McCal-Codes
Version: 3.2.0
Purpose: Multi-author blog feed where each author has one Google Doc containing all their posts.

Features:
- One Google Doc per author containing all their blog posts
- Posts separated by horizontal rules (---) or "POST:" markers
- Author metadata once at top of doc, applies to all posts
- Per-post metadata (date, category, tags, image, excerpt)
- Automatic parsing of multiple posts from single document
- localStorage caching for performance (configurable TTL)
- Interactive filtering: by author, category, tags
- Search functionality across titles and content
- Sort options (newest, oldest, popular)
- Responsive card-based layout with CSS columns
- Modern ES6+ JavaScript (const/let, arrow functions, async/await)
- CSS custom properties with fallbacks
- Accessible with ARIA attributes and keyboard navigation
- Structured data (BlogPosting schema)

Google Docs Setup:
1. Create one Google Doc per author
2. At the top, add author metadata:
   ---
   AUTHOR: Caleb McCartney
   AVATAR: https://example.com/avatar.jpg
   BIO: Photojournalist and political correspondent
   ---

3. Add posts separated by horizontal rules or "POST:" marker:
   
   POST: The Power of Photojournalism
   date: 2025-11-15
   category: Politics
   tags: Photography, Politics
   image: https://example.com/image1.jpg
   excerpt: Brief description
   
   [Your post content here with headings, images, etc.]
   
   ---
   
   POST: Behind the Lens
   date: 2025-10-28
   category: Photography
   tags: Documentary
   image: https://example.com/image2.jpg
   excerpt: Another description
   
   [Your post content here...]

4. File > Share > Publish to web > Publish
5. Convert URL: /pub → /export?format=html
6. Add to widget config

Usage: Paste into Squarespace Code Block
Configuration (data-* attributes on #blogWidget):
- data-authors-source: JSON array of author doc URLs or path to authors-manifest.json
  Example: data-authors-source='["https://docs.google.com/document/d/DOCID1/export?format=html"]'
- data-cache-ttl: cache time-to-live in minutes (default 60)
- data-max-posts: max posts to display (default 12)
- data-author-filter: enable author filter (default true)
- data-category-filter: enable category filter (default true)
- data-search: enable search (default true)
-->

    <script>
      (function () {
        "use strict";

        const $ = (selector, ctx = document) => ctx.querySelector(selector);
        const $$ = (selector, ctx = document) =>
          Array.from(ctx.querySelectorAll(selector));

        const debounce = (fn, delay) => {
          let timeoutId;
          return function (...args) {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => fn.apply(this, args), delay);
          };
        };

        const truncate = (str, maxLength) => {
          if (str.length <= maxLength) return str;
          return str.slice(0, maxLength) + "...";
        };

        const formatDate = (dateStr) => {
          const date = new Date(dateStr);
          return date.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
        };

        // Author Document Parser Module
        const AuthorDocParser = {
          /**
           * Parse author metadata from top of document
           * Format:
           * ---
           * AUTHOR: Name
           * AVATAR: URL
           * BIO: Description
           * ---
           */
          parseAuthorMetadata: function (html) {
            const metadata = {
              author: "Unknown Author",
              avatar: "/images/authors/default.jpg",
              bio: "",
            };
            const metaRegex = /---\s*([\s\S]*?)\s*---/;
            const match = String(html).match(metaRegex);

            if (match) {
              const metaBlock = match[1];
              const lines = metaBlock.split("\n");

              lines.forEach((line) => {
                const [key, ...valueParts] = line.split(":");
                if (!key || valueParts.length === 0) return;

                const value = valueParts.join(":").trim();
                const cleanKey = key.trim().toUpperCase();

                switch (cleanKey) {
                  case "AUTHOR":
                    metadata.author = value;
                    break;
                  case "AVATAR":
                    metadata.avatar = value;
                    break;
                  case "BIO":
                    metadata.bio = value;
                    break;
                }
              });

              // Remove metadata block from content
              html = String(html).replace(metaRegex, "");
              return { metadata, content: html };
            }

            // Fallback: parse top-of-document key: value pairs without --- delimiters
            // Read up to first 12 lines and stop at the first empty line
            const lines = String(html).split(/\r?\n/).slice(0, 12);
            let found = false;
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line) break; // stop at first blank line
              const colonIndex = line.indexOf(":");
              if (colonIndex === -1) continue;
              const key = line.substring(0, colonIndex).trim().toUpperCase();
              const value = line.substring(colonIndex + 1).trim();
              if (!value) continue;
              found = true;
              switch (key) {
                case "AUTHOR":
                  metadata.author = value;
                  break;
                case "AVATAR":
                  metadata.avatar = value;
                  break;
                case "BIO":
                  metadata.bio = value;
                  break;
              }
            }

            // If we found top-of-doc metadata, remove those lines from the start of the content
            if (found) {
              const contentLines = String(html).split(/\r?\n/);
              // remove leading metadata lines until an empty line
              let idx = 0;
              while (idx < contentLines.length) {
                if (!contentLines[idx].trim()) {
                  idx++;
                  break;
                }
                if (contentLines[idx].includes(":")) {
                  idx++;
                  continue;
                }
                break;
              }
              const remaining = contentLines.slice(idx).join("\n");
              return { metadata, content: remaining };
            }

            return { metadata, content: html };
          },

          /**
           * Split document into individual posts
           * Posts can be separated by:
           * 1. "POST:" marker followed by title
           * 2. Horizontal rule (---)
           * 3. Multiple blank lines
           */
          splitIntoPosts: function (html) {
            const posts = [];

            // First try splitting by POST: marker
            const postMarkerRegex = /POST:\s*([^\n]+)/gi;
            const matches = [];
            let match;

            while ((match = postMarkerRegex.exec(html)) !== null) {
              matches.push({
                index: match.index,
                title: match[1].trim(),
                fullMatch: match[0],
              });
            }

            if (matches.length > 0) {
              // Split by POST: markers
              for (let i = 0; i < matches.length; i++) {
                const start = matches[i].index;
                const end =
                  i < matches.length - 1 ? matches[i + 1].index : html.length;
                let postContent = html.substring(start, end);

                // Remove the POST: marker from content
                postContent = postContent.replace(matches[i].fullMatch, "");

                posts.push({
                  title: matches[i].title,
                  content: postContent.trim(),
                });
              }
            } else {
              // Fallback: split by horizontal rules or multiple newlines
              const sections = html.split(/\n\s*---\s*\n|\n\s*\n\s*\n\s*\n/);
              sections.forEach((section) => {
                const trimmed = section.trim();
                if (trimmed.length > 100) {
                  // Minimum content length
                  posts.push({
                    title: null, // Will extract from content
                    content: trimmed,
                  });
                }
              });
            }

            return posts;
          },

          /**
           * Parse post metadata (after POST: title line)
           * Format (plain key: value pairs):
           * date: 2025-11-15
           * category: Politics
           * tags: Photo, Politics
           * image: URL
           * excerpt: Description
           */
          parsePostMetadata: function (content) {
            const metadata = {
              date: new Date().toISOString().split("T")[0],
              category: "Uncategorized",
              tags: [],
              image: "/images/blog/default.jpg",
              excerpt: "",
            };

            const lines = content.split("\n");
            let metadataEndIndex = 0;

            for (let i = 0; i < Math.min(lines.length, 10); i++) {
              const line = lines[i].trim();
              if (!line || line.startsWith("#")) break;

              const colonIndex = line.indexOf(":");
              if (colonIndex === -1) continue;

              const key = line.substring(0, colonIndex).trim().toLowerCase();
              const value = line.substring(colonIndex + 1).trim();

              switch (key) {
                case "date":
                  metadata.date = this.normalizeDate(value);
                  metadataEndIndex = i + 1;
                  break;
                case "category":
                  metadata.category = value;
                  metadataEndIndex = i + 1;
                  break;
                case "tags":
                  metadata.tags = value.split(",").map((t) => t.trim());
                  metadataEndIndex = i + 1;
                  break;
                case "image":
                  metadata.image = value;
                  metadataEndIndex = i + 1;
                  break;
                case "excerpt":
                  metadata.excerpt = value;
                  metadataEndIndex = i + 1;
                  break;
              }
            }

            // Remove metadata lines from content
            if (metadataEndIndex > 0) {
              const contentLines = lines.slice(metadataEndIndex);
              content = contentLines.join("\n").trim();
            }

            return { metadata, content };
          },

          /**
           * Normalize a variety of date formats into ISO YYYY-MM-DD when possible.
           */
          normalizeDate: function (dateStr) {
            if (!dateStr) return new Date().toISOString().split("T")[0];
            const s = String(dateStr).trim();
            // Common ISO-like already
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            // YYYY/MM/DD or YYYY.MM.DD
            if (/^\d{4}[\/\.\s]\d{1,2}[\/\.\s]\d{1,2}$/.test(s)) {
              const parts = s.split(/[^\d]+/);
              const [y, m, d] = parts.map(Number);
              return `${String(y).padStart(4, "0")}-${String(m).padStart(
                2,
                "0"
              )}-${String(d).padStart(2, "0")}`;
            }
            // MM-DD-YY or DD-MM-YY variants (allow hyphen, slash, en dash)
            const m3 = s.match(/^(\d{1,2})[-\/–](\d{1,2})[-\/–](\d{2,4})$/);
            if (m3) {
              let a = Number(m3[1]);
              let b = Number(m3[2]);
              let y = Number(m3[3]);
              if (y < 100) y += y < 50 ? 2000 : 1900;
              // decide if first is month (if <=12) else treat as day-month
              let month, day;
              if (a >= 1 && a <= 12) {
                month = a;
                day = b;
              } else {
                month = b;
                day = a;
              }
              return `${String(y).padStart(4, "0")}-${String(month).padStart(
                2,
                "0"
              )}-${String(day).padStart(2, "0")}`;
            }
            // Try Date parse fallback
            const d = new Date(s);
            if (!isNaN(d.getTime())) {
              return d.toISOString().split("T")[0];
            }
            return new Date().toISOString().split("T")[0];
          },

          /**
           * Extract title from content (first h1/h2 or first sentence)
           */
          extractTitle: function (html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            const heading = doc.querySelector("h1") || doc.querySelector("h2");
            if (heading) {
              const title = heading.textContent.trim();
              heading.remove();
              return { title, content: doc.body.innerHTML };
            }

            const firstP = doc.querySelector("p");
            if (firstP) {
              return {
                title: truncate(firstP.textContent.trim(), 80),
                content: doc.body.innerHTML,
              };
            }

            return { title: "Untitled Post", content: html };
          },

          /**
           * Clean Google Docs HTML
           */
          cleanHTML: function (html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            $$("[class]", doc).forEach((el) => el.removeAttribute("class"));
            $$("[id]", doc).forEach((el) => el.removeAttribute("id"));
            $$("[style]", doc).forEach((el) => el.removeAttribute("style"));
            $$("span:empty, p:empty", doc).forEach((el) => el.remove());

            return doc.body.innerHTML;
          },

          /**
           * Estimate read time
           */
          estimateReadTime: function (html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");
            const text = doc.body.textContent || "";
            const words = text.split(/\s+/).length;
            const minutes = Math.ceil(words / 200);
            return `${minutes} min read`;
          },

          /**
           * Fetch and parse one author document containing multiple posts
           */
          fetchAuthorDoc: async function (url) {
            try {
              console.log(`[BlogWidget] Fetching author doc: ${url}`);

              const response = await fetch(url, {
                mode: "cors",
                credentials: "omit",
                cache: "default",
              });

              if (!response.ok) {
                console.error(
                  `[BlogWidget] HTTP ${response.status} for ${url}`
                );
                throw new Error(`HTTP ${response.status}`);
              }

              const html = await response.text();
              console.log(
                `[BlogWidget] Fetched ${html.length} bytes from ${url}`
              );

              if (!html || html.length < 100) {
                console.warn(
                  `[BlogWidget] Response too short (${html.length} bytes), might be invalid`
                );
                return [];
              }

              // quick checks for common Google publish issues
              const lowered = html.toLowerCase();
              if (
                lowered.includes("sign in") ||
                lowered.includes("you need permission") ||
                lowered.includes("access denied") ||
                lowered.includes("<form action=")
              ) {
                console.error(
                  `[BlogWidget] Likely permission/sign-in HTML returned for ${url}`
                );
                return [];
              }

              // Parse HTML into a DOM and create a text-only normalized representation
              const parsed = new DOMParser().parseFromString(html, "text/html");

              // Clone and normalize structural markers for splitting: <hr> -> --- and <br> -> newline
              const cloned = parsed.cloneNode(true);
              cloned.querySelectorAll("hr").forEach((hr) => {
                const marker = parsed.createTextNode("\n---\n");
                hr.parentNode.replaceChild(marker, hr);
              });
              cloned.querySelectorAll("br").forEach((br) => {
                br.parentNode.replaceChild(parsed.createTextNode("\n"), br);
              });

              const textOnly =
                (cloned.body && cloned.body.textContent) ||
                parsed.body.textContent ||
                html;
              const normalizedText = String(textOnly)
                .replace(/\r\n/g, "\n")
                .trim();

              // Parse author metadata from the text-only version
              const { metadata: authorMeta, content: authorContent } =
                this.parseAuthorMetadata(normalizedText);

              // Split into individual posts using the text-only content
              const postSections = this.splitIntoPosts(authorContent);
              console.log(
                `[BlogWidget] Found ${postSections.length} post sections in author doc`
              );

              // Parse each post
              const posts = [];
              for (const section of postSections) {
                // Parse post metadata
                const { metadata: postMeta, content: postContent } =
                  this.parsePostMetadata(section.content);

                // Determine title: prefer POST: title if present
                let title = section.title;
                let postBodyText = postContent || "";
                if (!title) {
                  // pick first non-empty line as title
                  const firstLine =
                    postBodyText.split("\n").find((l) => l.trim().length > 0) ||
                    "Untitled Post";
                  title = truncate(firstLine.trim(), 80);
                  // remove that line from body
                  const idx = postBodyText.indexOf(firstLine);
                  if (idx === 0)
                    postBodyText = postBodyText.slice(firstLine.length).trim();
                }

                // Convert plain text post body into minimal paragraphs HTML and sanitize
                const paragraphs = postBodyText
                  .split(/\n{2,}/)
                  .map((p) => p.trim())
                  .filter(Boolean);
                const escapeHtml = (s) =>
                  s.replace(
                    /[&<>"]/g,
                    (c) =>
                      ({
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                      }[c])
                  );
                const finalContent =
                  paragraphs.length > 0
                    ? paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join("")
                    : `<p>${escapeHtml(postBodyText)}</p>`;

                // Auto-generate excerpt if not provided
                if (!postMeta.excerpt) {
                  const parser = new DOMParser();
                  const doc = parser.parseFromString(finalContent, "text/html");
                  const firstP = doc.querySelector("p");
                  postMeta.excerpt = firstP
                    ? truncate(firstP.textContent.trim(), 150)
                    : "";
                }

                // Generate unique ID
                const postId = `${authorMeta.author
                  .toLowerCase()
                  .replace(/\s+/g, "-")}-${Date.now()}-${posts.length}`;

                posts.push({
                  id: postId,
                  title,
                  content: finalContent,
                  author: authorMeta.author,
                  authorAvatar: authorMeta.avatar,
                  authorBio: authorMeta.bio,
                  date: postMeta.date,
                  category: postMeta.category,
                  tags: postMeta.tags,
                  image: postMeta.image,
                  excerpt: postMeta.excerpt,
                  readTime: this.estimateReadTime(finalContent),
                  sourceUrl: url,
                });
              }

              console.log(
                `[BlogWidget] Parsed ${posts.length} posts from ${url}`
              );
              return posts;
            } catch (error) {
              console.error(
                `[BlogWidget] Failed to fetch author doc: ${url}`,
                error
              );

              // Provide helpful diagnostics
              if (
                error.message.includes("CORS") ||
                error.message.includes("cors")
              ) {
                console.error(
                  "[BlogWidget] CORS error - ensure Google Doc is Published to Web"
                );
              } else if (
                error.message.includes("Failed to fetch") ||
                error.message.includes("NetworkError")
              ) {
                console.error(
                  "[BlogWidget] Network error - check internet connection and URL accessibility"
                );
              } else if (error.message.includes("HTTP")) {
                console.error(
                  "[BlogWidget] HTTP error - the document may be unpublished or deleted"
                );
              }

              return [];
            }
          },
        };

        // Cache Module
        const CacheManager = {
          prefix: "mcc-blog-cache-",

          set: function (key, data, ttlMinutes) {
            const expiry = Date.now() + ttlMinutes * 60 * 1000;
            const cacheData = { data, expiry };
            try {
              localStorage.setItem(
                this.prefix + key,
                JSON.stringify(cacheData)
              );
            } catch (e) {
              console.warn("Cache write failed:", e);
            }
          },

          get: function (key) {
            try {
              const cached = localStorage.getItem(this.prefix + key);
              if (!cached) return null;

              const { data, expiry } = JSON.parse(cached);
              if (Date.now() > expiry) {
                this.remove(key);
                return null;
              }

              return data;
            } catch (e) {
              console.warn("Cache read failed:", e);
              return null;
            }
          },

          remove: function (key) {
            try {
              localStorage.removeItem(this.prefix + key);
            } catch (e) {
              console.warn("Cache remove failed:", e);
            }
          },

          clear: function () {
            try {
              Object.keys(localStorage)
                .filter((k) => k.startsWith(this.prefix))
                .forEach((k) => localStorage.removeItem(k));
            } catch (e) {
              console.warn("Cache clear failed:", e);
            }
          },
        };

        // Blog Widget Module
        const BlogWidget = {
          config: {
            authorsSource: [],
            cacheTTL: 60,
            maxPosts: 12,
            authorFilter: true,
            categoryFilter: true,
            search: true,
            pageSize: 12,
          },

          state: {
            posts: [],
            filteredPosts: [],
            page: 1,
            currentFilters: {
              author: "",
              category: "",
              search: "",
              sort: "newest",
            },
            loading: false,
          },

          init: async function () {
            // Load configuration and surface it for debugging
            this.loadConfig();
            console.log("[BlogWidget] Config after loadConfig:", this.config);
            await this.loadData();
            this.setupFilters();
            this.applyFilters();
            this.render();
          },

          loadConfig: function () {
            const widget = $("#blogWidget");
            if (!widget) return;

            try {
              const sourceAttr = widget.dataset.authorsSource;
              console.log("[BlogWidget] Raw data-authors-source:", sourceAttr);
              let parsed;
              if (sourceAttr && sourceAttr.trim().startsWith("[")) {
                parsed = JSON.parse(sourceAttr);
              } else if (sourceAttr && sourceAttr.trim().startsWith("{")) {
                parsed = [JSON.parse(sourceAttr)];
              } else if (
                typeof sourceAttr === "string" &&
                sourceAttr.trim().length > 0
              ) {
                parsed = [sourceAttr.trim()];
              } else {
                parsed = [];
              }
              this.config.authorsSource = Array.isArray(parsed)
                ? parsed
                : [parsed];
            } catch (e) {
              console.warn("Invalid authors-source, using empty array", e);
              console.warn(
                "[BlogWidget] data-authors-source attribute raw value:",
                widget.getAttribute("data-authors-source")
              );
              this.config.authorsSource = [];
            }

            // Fallback for test harnesses: allow a global override
            try {
              if (
                (!this.config.authorsSource ||
                  this.config.authorsSource.length === 0) &&
                window.__BLOG_WIDGET_AUTHORS
              ) {
                console.warn(
                  "[BlogWidget] Using global fallback window.__BLOG_WIDGET_AUTHORS for authorsSource"
                );
                this.config.authorsSource = Array.isArray(
                  window.__BLOG_WIDGET_AUTHORS
                )
                  ? window.__BLOG_WIDGET_AUTHORS
                  : [window.__BLOG_WIDGET_AUTHORS];
              }
            } catch (e) {
              // ignore
            }

            this.config.cacheTTL = parseInt(widget.dataset.cacheTtl) || 60;
            this.config.maxPosts = parseInt(widget.dataset.maxPosts) || 12;
            this.config.pageSize = this.config.maxPosts;
            this.config.authorFilter = widget.dataset.authorFilter !== "false";
            this.config.categoryFilter =
              widget.dataset.categoryFilter !== "false";
            this.config.search = widget.dataset.search !== "false";
          },

          loadData: async function () {
            this.state.loading = true;

            // Check if authorsSource is a manifest URL
            if (
              this.config.authorsSource.length === 1 &&
              this.config.authorsSource[0].endsWith(".json")
            ) {
              await this.loadFromManifest(this.config.authorsSource[0]);
            } else {
              await this.loadFromUrls(this.config.authorsSource);
            }

            this.state.loading = false;
          },

          loadFromManifest: async function (manifestUrl) {
            const cacheKey = `manifest-${manifestUrl}`;
            const cached = CacheManager.get(cacheKey);

            if (cached) {
              this.state.posts = cached;
              return;
            }

            try {
              const response = await fetch(manifestUrl);
              if (!response.ok) throw new Error(`HTTP ${response.status}`);

              const manifest = await response.json();
              const urls = manifest.authors || manifest.urls || [];

              await this.loadFromUrls(urls);
              CacheManager.set(
                cacheKey,
                this.state.posts,
                this.config.cacheTTL
              );
            } catch (error) {
              console.error("Failed to load manifest:", error);
              this.showError("Failed to load author documents manifest");
            }
          },

          loadFromUrls: async function (urls) {
            if (!urls || urls.length === 0) {
              this.showError(
                "No author documents configured. Please add Google Docs URLs to data-authors-source."
              );
              return;
            }

            const allPosts = [];
            const diagnostics = [];

            // Fetch author docs one at a time (each can have many posts)
            for (const url of urls) {
              // Normalize Google Docs 'pub' URLs to 'export?format=html'
              const normalizedUrl =
                typeof url === "string" && url.includes("/pub")
                  ? url.replace(/\/pub(?:\?.*)?$/i, "/export?format=html")
                  : url;

              const cacheKey = `author-${url}`;
              let posts = CacheManager.get(cacheKey);

              if (!posts) {
                let fetchedPosts = [];
                try {
                  fetchedPosts = await AuthorDocParser.fetchAuthorDoc(
                    normalizedUrl
                  );
                  if (fetchedPosts && fetchedPosts.length > 0) {
                    CacheManager.set(
                      cacheKey,
                      fetchedPosts,
                      this.config.cacheTTL
                    );
                    posts = fetchedPosts;
                  } else {
                    posts = [];
                  }
                  diagnostics.push({
                    url,
                    normalizedUrl,
                    fetched: fetchedPosts.length,
                  });
                } catch (err) {
                  diagnostics.push({ url, normalizedUrl, error: String(err) });
                  posts = [];
                }
              }

              if (posts) {
                allPosts.push(...posts);
              }
            }

            this.state.posts = allPosts;

            if (!this.state.posts || this.state.posts.length === 0) {
              console.warn("[BlogWidget] No posts parsed.", {
                authorsSource: this.config.authorsSource,
                normalizedUrls: urls.map((u) =>
                  typeof u === "string" && u.includes("/pub")
                    ? u.replace(/\/pub(?:\?.*)?$/i, "/export?format=html")
                    : u
                ),
                rawUrls: urls,
                diagnostics,
              });
              console.warn("[BlogWidget] Troubleshooting steps:");
              console.warn(
                "  1. Ensure Google Docs are Published to Web (File → Share → Publish to web)"
              );
              console.warn(
                "  2. Check browser console Network tab for failed requests"
              );
              console.warn(
                "  3. Verify docs contain POST: markers or --- separators between posts"
              );
              console.warn("  4. Try clearing cache: CacheManager.clear()");
              this.showError(
                `No articles found. Check console for details. Diagnostics: ${JSON.stringify(
                  diagnostics
                )}`
              );
            } else {
              console.log(
                `[BlogWidget] Successfully loaded ${this.state.posts.length} posts from ${urls.length} author doc(s)`
              );
            }
          },

          showError: function (message) {
            const container = $("#blogFeed");
            if (!container) return;

            container.innerHTML = `
              <div class="mcc-loading" style="color: #cc0000;">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                ${message}
              </div>
            `;
          },

          setupFilters: function () {
            const authorFilter = $("#authorFilter");
            if (authorFilter && this.config.authorFilter) {
              const authors = [
                ...new Set(this.state.posts.map((p) => p.author)),
              ];
              authors.forEach((author) => {
                const option = document.createElement("option");
                option.value = author;
                option.textContent = author;
                authorFilter.appendChild(option);
              });

              authorFilter.addEventListener("change", (e) => {
                this.state.currentFilters.author = e.target.value;
                this.state.page = 1;
                this.applyFilters();
                this.render();
              });
            }

            const categoryFilter = $("#categoryFilter");
            if (categoryFilter && this.config.categoryFilter) {
              const categories = [
                ...new Set(this.state.posts.map((p) => p.category)),
              ];
              categories.forEach((category) => {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
              });

              categoryFilter.addEventListener("change", (e) => {
                this.state.currentFilters.category = e.target.value;
                this.state.page = 1;
                this.applyFilters();
                this.render();
              });
            }

            const searchInput = $("#blogSearch");
            if (searchInput && this.config.search) {
              searchInput.addEventListener(
                "input",
                debounce((e) => {
                  this.state.currentFilters.search =
                    e.target.value.toLowerCase();
                  this.state.page = 1;
                  this.applyFilters();
                  this.render();
                }, 300)
              );
            }

            const sortFilter = $("#sortFilter");
            if (sortFilter) {
              sortFilter.addEventListener("change", (e) => {
                this.state.currentFilters.sort = e.target.value;
                this.state.page = 1;
                this.applyFilters();
                this.render();
              });
            }

            const prev = $("#prevPage");
            const next = $("#nextPage");
            if (prev && next) {
              prev.addEventListener("click", () => {
                if (this.state.page > 1) {
                  this.state.page--;
                  this.render();
                  window.scrollTo({ top: 0, behavior: "smooth" });
                }
              });
              next.addEventListener("click", () => {
                const totalPages = Math.ceil(
                  this.state.filteredPosts.length / this.config.pageSize
                );
                if (this.state.page < totalPages) {
                  this.state.page++;
                  this.render();
                  window.scrollTo({ top: 0, behavior: "smooth" });
                }
              });
              document.addEventListener("keydown", (e) => {
                const modal = $("#postModal");
                if (modal && modal.classList.contains("mcc-modal--active"))
                  return;
                if (e.key === "ArrowRight") next.click();
                if (e.key === "ArrowLeft") prev.click();
              });
            }
          },

          applyFilters: function () {
            let filtered = [...this.state.posts];

            if (this.state.currentFilters.author) {
              filtered = filtered.filter(
                (post) => post.author === this.state.currentFilters.author
              );
            }

            if (this.state.currentFilters.category) {
              filtered = filtered.filter(
                (post) => post.category === this.state.currentFilters.category
              );
            }

            if (this.state.currentFilters.search) {
              const query = this.state.currentFilters.search;
              filtered = filtered.filter(
                (post) =>
                  post.title.toLowerCase().includes(query) ||
                  post.excerpt.toLowerCase().includes(query) ||
                  post.tags.some((tag) => tag.toLowerCase().includes(query))
              );
            }

            const sort = this.state.currentFilters.sort;
            if (sort === "newest") {
              filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else if (sort === "oldest") {
              filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
            } else if (sort === "title") {
              filtered.sort((a, b) => a.title.localeCompare(b.title));
            }

            this.state.filteredPosts = filtered;
          },

          render: function () {
            const container = $("#blogFeed");
            if (!container) return;

            if (this.state.filteredPosts.length === 0) {
              container.innerHTML = `
                <div class="mcc-loading">
                  No articles found. Try adjusting your filters.
                </div>
              `;
              return;
            }

            const grid = document.createElement("div");
            grid.className = "mcc-blog__grid";
            grid.setAttribute("role", "list");

            const start = (this.state.page - 1) * this.config.pageSize;
            const end = start + this.config.pageSize;
            const pagePosts = this.state.filteredPosts.slice(start, end);

            pagePosts.forEach((post) => {
              const card = this.createCard(post);
              grid.appendChild(card);
            });

            container.innerHTML = "";
            container.appendChild(grid);

            const totalPages = Math.ceil(
              this.state.filteredPosts.length / this.config.pageSize
            );
            const pagination = $("#blogPagination");
            const prev = $("#prevPage");
            const next = $("#nextPage");
            const info = $("#pageInfo");

            if (totalPages > 1 && pagination && prev && next && info) {
              pagination.hidden = false;
              prev.setAttribute("aria-disabled", String(this.state.page <= 1));
              next.setAttribute(
                "aria-disabled",
                String(this.state.page >= totalPages)
              );
              info.textContent = `Page ${this.state.page} of ${totalPages}`;
            } else if (pagination) {
              pagination.hidden = true;
            }

            requestAnimationFrame(() => {
              grid.classList.add("mcc-blog__grid--loaded");
            });
          },

          createCard: function (post) {
            const card = document.createElement("article");
            card.className = "mcc-card";
            card.setAttribute("role", "listitem");
            card.setAttribute("itemscope", "");
            card.setAttribute("itemtype", "https://schema.org/BlogPosting");

            card.innerHTML = `
              <div class="mcc-card__image">
                <img src="${post.image}" alt="${
              post.title
            }" itemprop="image" loading="lazy">
              </div>
              <div class="mcc-card__content">
                <div class="mcc-card__meta">
                  <svg class="mcc-card__avatar" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#ffffff" stroke="#ffffff" aria-hidden="true" focusable="false"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="m 8 1 c -1.65625 0 -3 1.34375 -3 3 s 1.34375 3 3 3 s 3 -1.34375 3 -3 s -1.34375 -3 -3 -3 z m -1.5 7 c -2.492188 0 -4.5 2.007812 -4.5 4.5 v 0.5 c 0 1.109375 0.890625 2 2 2 h 8 c 1.109375 0 2 -0.890625 2 -2 v -0.5 c 0 -2.492188 -2.007812 -4.5 -4.5 -4.5 z m 0 0" fill="#2e3436"></path> </g></svg>
                  <div>
                    <p class="mcc-card__author" itemprop="author">${
                      post.author
                    }</p>
                    <p class="mcc-card__date">
                      <time datetime="${
                        post.date
                      }" itemprop="datePublished">${formatDate(
              post.date
            )}</time> · ${post.readTime}
                    </p>
                  </div>
                </div>
                <h3 class="mcc-card__title" itemprop="headline">${
                  post.title
                }</h3>
                <p class="mcc-card__excerpt" itemprop="description">${
                  post.excerpt
                }</p>
                <div class="mcc-card__tags">
                  ${post.tags
                    .map((tag) => `<span class="mcc-tag">#${tag}</span>`)
                    .join("")}
                </div>
              </div>
            `;

            card.addEventListener("click", () => this.openModal(post));
            card.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                this.openModal(post);
              }
            });
            card.setAttribute("tabindex", "0");
            card.classList.add("mcc-focus-ring");

            return card;
          },

          openModal: function (post) {
            const modal = $("#postModal");
            const modalPost = $("#modalPost");

            if (!modal || !modalPost) return;

            modalPost.innerHTML = `
              <div class="mcc-modal__post-header">
                <h2 class="mcc-modal__post-title" id="modalPostTitle" itemprop="headline">${
                  post.title
                }</h2>
                <div class="mcc-modal__post-meta">
                  <svg class="mcc-card__avatar" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#ffffff" stroke="#ffffff" aria-hidden="true" focusable="false"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="m 8 1 c -1.65625 0 -3 1.34375 -3 3 s 1.34375 3 3 3 s 3 -1.34375 3 -3 s -1.34375 -3 -3 -3 z m -1.5 7 c -2.492188 0 -4.5 2.007812 -4.5 4.5 v 0.5 c 0 1.109375 0.890625 2 2 2 h 8 c 1.109375 0 2 -0.890625 2 -2 v -0.5 c 0 -2.492188 -2.007812 -4.5 -4.5 -4.5 z m 0 0" fill="#2e3436"></path> </g></svg>
                  <span itemprop="author">${post.author}</span>
                  <span>·</span>
                  <time datetime="${
                    post.date
                  }" itemprop="datePublished">${formatDate(post.date)}</time>
                  <span>·</span>
                  <span>${post.readTime}</span>
                </div>
              </div>
              <div class="mcc-modal__post-content" itemprop="articleBody">
                ${post.content}
              </div>
            `;

            modal.classList.add("mcc-modal--active");
            modal.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";

            const closeBtn = $(".mcc-modal__close", modal);
            if (closeBtn) closeBtn.focus();

            document.addEventListener("keydown", this.handleModalKeydown);
          },

          closeModal: function () {
            const modal = $("#postModal");
            if (!modal) return;

            modal.classList.remove("mcc-modal--active");
            modal.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";

            document.removeEventListener("keydown", this.handleModalKeydown);
          },

          handleModalKeydown: function (e) {
            if (e.key === "Escape") {
              BlogWidget.closeModal();
            }
          },
        };

        window.BlogWidget = BlogWidget;
        window.CacheManager = CacheManager;

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () =>
            BlogWidget.init()
          );
        } else {
          BlogWidget.init();
        }
      })();
    </script>
  </body>
</html>
