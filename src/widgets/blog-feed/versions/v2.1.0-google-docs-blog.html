<!-- Blog Feed v2.1.0 (Google Docs) — minimal valid HTML wrapper for validator -->
<div class="mccal-blog-widget v2-1-0" role="region" aria-label="Blog Feed v2.1">
  <div
    id="blogWidget"
    data-authors-source="[]"
    data-cache-ttl="5"
    data-max-posts="6"
    data-author-filter="true"
    data-category-filter="true"
    data-search="true"
  ></div>
  <div id="blogFeed"></div>
  <div id="blogPagination" hidden>
    <button id="prevPage" type="button" aria-label="Previous page">Prev</button>
    <span id="pageInfo" aria-live="polite"></span>
    <button id="nextPage" type="button" aria-label="Next page">Next</button>
  </div>
  <div id="postModal" class="mcc-modal" aria-hidden="true">
    <button class="mcc-modal__close" type="button" aria-label="Close">×</button>
    <section id="modalPost" class="mcc-modal__content"></section>
  </div>
</div>
