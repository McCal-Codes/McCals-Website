<!DOCTYPE html>
<!--
  Blog Feed Widget v2.0.0 - Google Docs Integration
  
  Self-contained widget for Squarespace Code Blocks
  - Live updates from Google Docs (no API keys needed)
  - Auto-caption generation from image metadata
  - Responsive blog layout
  - SEO-optimized with structured data
  
  Setup:
  1. Create a Google Doc with your blog content
  2. Use headings (H1, H2, or H3) for blog post titles
  3. Write content under each heading
  4. Add images directly in the document
  5. File > Share > Publish to web
  6. Copy the Document ID from URL (between /d/ and /edit)
  7. Replace YOUR_DOC_ID below with your document ID
  
  McCal Media - https://mcc-cal.com
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Feed</title>
</head>
<body>

<!-- Widget Container -->
<div class="mcc-blog-widget">
  <div class="mcc-blog-header">
    <h1 class="mcc-blog-heading">Latest Posts</h1>
    <span class="mcc-version-badge" title="Blog Feed Widget v2.0.0">v2.0</span>
  </div>
  
  <!-- Tag Filter Bar -->
  <div class="mcc-blog-filters" id="mccBlogFilters" style="display: none;">
    <span class="mcc-filter-label">Filter:</span>
    <button class="mcc-tag-filter active" data-tag="all">All Posts</button>
  </div>
  
  <div id="mccBlogFeed" 
       data-blog-feed-docs 
       data-provider="docs"
       data-doc-id="2PACX-1vRYF2JnbIfiNkCq8zLMxnvedTHPjzXPYQsmVTqX75ossMlyCuxSNOARhdUXSeE9FrPXnZJUzf_dV6WD" 
       data-max-posts="10"
       data-show-dates="true" 
       data-show-images="true" 
       data-auto-captions="false">
    <div class="mcc-blog-loading">Loading blog posts...</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // === Blog Feed Widget v2.0.0 - Google Docs Integration ===
  // McCal Media - Self-contained Squarespace Widget
  
  const MCC_BLOG = {
    version: '2.0.0',
    
    // Extract document ID from URL or use as-is
    extractDocId(url) {
      const match = url.match(/\/document\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : url;
    },
    
    // Fetch published Google Doc
    async fetchGoogleDoc(docId) {
      // Handle both regular docs (d/ID) and published docs (d/e/PUBLISHED_ID)
      const publishUrl = docId.startsWith('2PACX-') 
        ? `https://docs.google.com/document/d/e/${docId}/pub`
        : `https://docs.google.com/document/d/${docId}/pub`;
      
      try {
        const response = await fetch(publishUrl, { mode: 'cors' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}. Ensure document is published to web.`);
        }
        return await response.text();
      } catch (error) {
        console.error('[Blog Feed] Failed to fetch:', error);
        throw error;
      }
    },
    
    // Parse Google Doc HTML into blog posts
    parseGoogleDocHTML(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const posts = [];
      
      let currentPost = null;
      let contentBuffer = [];
      let skipFirstH1 = true; // Skip document title
      let expectingDate = false;
      
      const processContent = () => {
        if (contentBuffer.length > 0) {
          const content = contentBuffer.join('\n').trim();
          if (currentPost && content) {
            currentPost.body = content;
          }
          contentBuffer = [];
        }
      };
      
      const walker = document.createTreeWalker(
        doc.body,
        NodeFilter.SHOW_ELEMENT,
        null,
        false
      );
      
      let node;
      while (node = walker.nextNode()) {
        const tagName = node.tagName.toLowerCase();
        const text = node.textContent.trim();
        
        // Skip first H1 (document title like "Website Blog")
        if (tagName === 'h1' && skipFirstH1) {
          console.log('[Blog Feed] Skipping document title H1:', text);
          skipFirstH1 = false;
          continue;
        }
        
        // H2 = Blog post title (article name)
        if (tagName === 'h2') {
          if (currentPost) {
            processContent();
            if (currentPost.title) posts.push(currentPost);
          }
          
          console.log('[Blog Feed] Found H2 (article title):', text);
          
          currentPost = {
            title: text,
            author: 'Caleb McCartney',
            date: null,
            hero: null,
            images: [],
            body: '',
            tags: [] // Tags will be extracted from content or added manually
          };
          
          expectingDate = true;
        }
        // H4 = Date (Google Docs uses H4 for subtitle formatting)
        else if (tagName === 'h4' && currentPost && expectingDate) {
          console.log('[Blog Feed] Found H4 (date):', text);
          // Extract just the date part if format is "By Author ... Date"
          const dateMatch = text.match(/(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})/i);
          if (dateMatch) {
            currentPost.date = dateMatch[1];
          } else {
            currentPost.date = text;
          }
          expectingDate = false;
        }
        // Collect content for current post
        else if (currentPost) {
          if (tagName === 'p') {
            const text = node.textContent.trim();
            const html = node.innerHTML.trim();
            
            // Try to extract date from first paragraph if we don't have one yet
            let skipThisParagraph = false;
            if (!currentPost.date && expectingDate) {
              const dateMatch = text.match(/(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})/i);
              if (dateMatch) {
                currentPost.date = dateMatch[1];
                expectingDate = false; // Found date, now start collecting content
                console.log('[Blog Feed] Found date in paragraph:', currentPost.date);
                // Don't add this paragraph to body if it's just the date and "By Myself"
                if (text.startsWith('By Myself')) {
                  skipThisParagraph = true;
                }
              }
            }
            
            // Extract images
            const images = node.querySelectorAll('img');
            images.forEach(img => {
              if (img.src) {
                if (!currentPost.hero) {
                  currentPost.hero = img.src;
                } else {
                  currentPost.images.push(img.src);
                }
              }
            });
            
            // Only add to body if we're not expecting a date OR we just found the date
            if (text && !skipThisParagraph && !expectingDate) {
              contentBuffer.push(html);
            }
          }
          else if (['ul', 'ol', 'blockquote', 'div'].includes(tagName)) {
            if (!expectingDate) {
              const html = node.outerHTML;
              if (html.trim()) contentBuffer.push(html);
            }
          }
          else if (tagName === 'img' && node.src) {
            if (!currentPost.hero) {
              currentPost.hero = node.src;
            } else {
              currentPost.images.push(node.src);
            }
          }
        }
      }
      
      // Process last post
      if (currentPost) {
        processContent();
        if (currentPost.title) posts.push(currentPost);
      }
      
      // Extract tags from content or infer from titles
      posts.forEach(post => {
        if (!post.tags) post.tags = [];
        
        // Look for #tags in the content
        const tagMatches = post.body ? post.body.match(/#(\w+)/g) : null;
        if (tagMatches) {
          post.tags = tagMatches.map(tag => tag.substring(1).toLowerCase());
        } else if (post.tags.length === 0) {
          // Infer tags from title keywords only if no tags yet
          const title = post.title ? post.title.toLowerCase() : '';
          if (title.includes('marx') || title.includes('politic')) post.tags.push('politics');
          if (title.includes('loss') || title.includes('grief') || title.includes('death') || title.includes('shadow')) post.tags.push('personal');
          if (title.includes('review')) post.tags.push('review');
          if (title.includes('tech')) post.tags.push('technology');
        }
      });
      
      console.log('[Blog Feed] All parsed posts:', JSON.stringify(posts, null, 2));
      
      return posts;
    },
    
    // Sanitize HTML for safe rendering
    sanitizeHtml(input) {
      const temp = document.createElement('div');
      temp.innerHTML = String(input || '');
      temp.querySelectorAll('script, style, iframe, object, embed').forEach(el => el.remove());
      
      const allowed = new Set(['A','P','BR','STRONG','EM','UL','OL','LI','BLOCKQUOTE','B','I','H2','H3','H4','H5','H6','SPAN','DIV']);
      temp.querySelectorAll('*').forEach(el => {
        if (!allowed.has(el.tagName)) {
          const parent = el.parentNode;
          if (parent) {
            while (el.firstChild) parent.insertBefore(el.firstChild, el);
            parent.removeChild(el);
          }
        } else {
          [...el.attributes].forEach(attr => {
            const name = attr.name.toLowerCase();
            if (el.tagName === 'A' && (name === 'href' || name === 'title')) {
              // keep
            } else if (name.startsWith('on') || name.startsWith('data-')) {
              el.removeAttribute(attr.name);
            } else if (!['href', 'title', 'alt', 'src'].includes(name)) {
              el.removeAttribute(attr.name);
            }
          });
          if (el.tagName === 'A') {
            el.setAttribute('target', '_blank');
            el.setAttribute('rel', 'noopener noreferrer');
          }
        }
      });
      
      return temp.innerHTML.trim();
    },
    
    // Format date string
    formatDate(dateString) {
      if (!dateString) return null;
      
      try {
        const date = new Date(dateString);
        if (!isNaN(date.getTime())) {
          return date.toLocaleDateString('en-US', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          });
        }
      } catch (e) {
        // ignore
      }
      
      // If it's already formatted nicely, return as-is
      if (/^[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}$/i.test(dateString.trim())) {
        return dateString.trim();
      }
      
      return null;
    },
    
    // Create image figure element
    createImageFigure(url, alt) {
      const fig = document.createElement('figure');
      fig.className = 'mcc-blog-image';
      
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = url;
      if (alt) img.alt = alt;
      
      fig.appendChild(img);
      
      if (alt) {
        const cap = document.createElement('figcaption');
        cap.className = 'mcc-blog-image-caption';
        cap.textContent = alt;
        fig.appendChild(cap);
      }
      
      return fig;
    },
    
    // Render blog posts from Google Docs
    async render(container, opts) {
      container.innerHTML = '<div class="mcc-blog-loading">Loading blog posts...</div>';
      
      try {
        const docId = this.extractDocId(opts.docId);
        console.log('[Blog Feed] Fetching doc:', docId);
        const html = await this.fetchGoogleDoc(docId);
        console.log('[Blog Feed] HTML fetched, length:', html.length);
        const posts = this.parseGoogleDocHTML(html);
        console.log('[Blog Feed] Parsed posts:', posts.length, posts);
        
        const validPosts = posts.filter(p => p.title); // Only require title, not body
        console.log('[Blog Feed] Valid posts:', validPosts.length, validPosts);
        
        if (validPosts.length === 0) {
          container.innerHTML = '<div class="mcc-blog-error">No blog posts found. Make sure your Google Doc has H2 headings for post titles.</div>';
          return;
        }
        
        const limit = Number.isFinite(+opts.maxPosts) && +opts.maxPosts > 0 ? +opts.maxPosts : validPosts.length;
        
        const list = document.createElement('div');
        list.className = 'mcc-blog-feed';
        
        validPosts.slice(0, limit).forEach(post => {
          const article = document.createElement('article');
          article.className = 'mcc-blog-card';
          
          // Add tags as data attribute for filtering
          if (post.tags && post.tags.length > 0) {
            article.dataset.tags = post.tags.join(',');
          }
          
          // Hero image
          if (opts.showImages && post.hero) {
            article.appendChild(this.createImageFigure(post.hero, ''));
          }
          
          // Header
          const header = document.createElement('header');
          header.className = 'mcc-blog-card-header';
          
          const h2 = document.createElement('h2');
          h2.className = 'mcc-blog-title';
          h2.textContent = post.title;
          header.appendChild(h2);
          
          // Author and date container
          const metaContainer = document.createElement('div');
          metaContainer.className = 'mcc-blog-meta';
          
          if (post.author) {
            const author = document.createElement('span');
            author.className = 'mcc-blog-author';
            author.textContent = 'By ' + post.author;
            metaContainer.appendChild(author);
          }
          
          if (opts.showDates && post.date) {
            const formattedDate = this.formatDate(post.date);
            if (formattedDate) {
              const time = document.createElement('time');
              time.className = 'mcc-blog-date';
              time.textContent = formattedDate;
              if (post.author) {
                // Add separator if we have both author and date
                metaContainer.appendChild(document.createTextNode(' • '));
              }
              metaContainer.appendChild(time);
            }
          }
          
          if (metaContainer.children.length > 0) {
            header.appendChild(metaContainer);
          }
          
          // Tags
          if (post.tags && post.tags.length > 0) {
            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'mcc-blog-tags';
            post.tags.forEach(tag => {
              const tagSpan = document.createElement('span');
              tagSpan.className = 'mcc-blog-tag';
              tagSpan.textContent = tag;
              tagSpan.dataset.tag = tag;
              tagsContainer.appendChild(tagSpan);
            });
            header.appendChild(tagsContainer);
          }
          
          article.appendChild(header);
          
          // Body
          console.log('[Blog Feed] Rendering post body:', post.title, 'Body length:', post.body ? post.body.length : 0);
          if (post.body) {
            const body = document.createElement('div');
            body.className = 'mcc-blog-body';
            body.innerHTML = this.sanitizeHtml(post.body);
            console.log('[Blog Feed] Sanitized HTML length:', body.innerHTML.length);
            article.appendChild(body);
          } else {
            console.log('[Blog Feed] No body content for:', post.title);
          }
          
          // Additional images
          if (opts.showImages && post.images && post.images.length > 0) {
            post.images.forEach(imgUrl => {
              article.appendChild(this.createImageFigure(imgUrl, ''));
            });
          }
          
          list.appendChild(article);
        });
        
        container.innerHTML = '';
        container.appendChild(list);
        
        // Initialize tag filters
        this.initializeFilters(validPosts);
        
        // Add structured data
        this.addStructuredData(validPosts.slice(0, limit));
        
      } catch (error) {
        console.error('[Blog Feed] Load failed:', error);
        container.innerHTML = `<div class="mcc-blog-error">Failed to load blog. ${error.message}</div>`;
      }
    },
    
    // Initialize tag filters
    initializeFilters(posts) {
      const allTags = new Set();
      posts.forEach(post => {
        if (post.tags) {
          post.tags.forEach(tag => allTags.add(tag));
        }
      });
      
      if (allTags.size === 0) return; // No tags, hide filters
      
      const filtersContainer = document.getElementById('mccBlogFilters');
      if (!filtersContainer) return;
      
      // Show filter bar
      filtersContainer.style.display = 'flex';
      
      // Add tag filter buttons
      Array.from(allTags).sort().forEach(tag => {
        const button = document.createElement('button');
        button.className = 'mcc-tag-filter';
        button.textContent = tag;
        button.dataset.tag = tag;
        filtersContainer.appendChild(button);
      });
      
      // Add click handlers
      filtersContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('mcc-tag-filter')) {
          const selectedTag = e.target.dataset.tag;
          
          // Update active state
          filtersContainer.querySelectorAll('.mcc-tag-filter').forEach(btn => {
            btn.classList.remove('active');
          });
          e.target.classList.add('active');
          
          // Filter posts
          const cards = document.querySelectorAll('.mcc-blog-card');
          cards.forEach(card => {
            if (selectedTag === 'all') {
              card.style.display = '';
            } else {
              const cardTags = Array.from(card.querySelectorAll('.mcc-blog-tag'))
                .map(tag => tag.dataset.tag);
              if (cardTags.includes(selectedTag)) {
                card.style.display = '';
              } else {
                card.style.display = 'none';
              }
            }
          });
        }
      });
    },
    
    // Add JSON-LD structured data for SEO
    addStructuredData(posts) {
      if (!posts || posts.length === 0) return;
      
      const structuredData = {
        '@context': 'https://schema.org',
        '@type': 'Blog',
        name: 'McCal Media Blog',
        description: 'Professional photography and multimedia content',
        blogPost: posts.map(post => ({
          '@type': 'BlogPosting',
          headline: post.title,
          datePublished: post.date || new Date().toISOString(),
          image: post.hero || '',
          author: {
            '@type': 'Person',
            name: 'McCal McCalister'
          }
        }))
      };
      
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(structuredData);
      document.head.appendChild(script);
    },
    
    // Initialize from data attributes
    init(root) {
      const opts = {
        docId: root.dataset.docId || root.dataset.docUrl,
        maxPosts: root.dataset.maxPosts ? parseInt(root.dataset.maxPosts, 10) : undefined,
        showDates: root.dataset.showDates !== 'false',
        showImages: root.dataset.showImages !== 'false'
      };
      
      if (!opts.docId) {
        root.innerHTML = '<div class="mcc-blog-error">Missing data-doc-id attribute</div>';
        return;
      }
      
      if (opts.docId === 'YOUR_DOC_ID') {
        root.innerHTML = '<div class="mcc-blog-error">Please replace YOUR_DOC_ID with your actual Google Doc ID</div>';
        return;
      }
      
      return this.render(root, opts);
    },
    
    // Auto-bootstrap
    bootstrap() {
      document.querySelectorAll('[data-blog-feed-docs]').forEach(el => this.init(el));
    }
  };
  
  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => MCC_BLOG.bootstrap());
  } else {
    MCC_BLOG.bootstrap();
  }
  
  // Expose API
  window.MccBlogWidget = MCC_BLOG;
})();
</script>

</body>
</html>
