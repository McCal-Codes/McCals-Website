<!-- McCal Navigation - Code Injection Snippet (v1.6-nav) -->
<!-- Place inside Squarespace Settings → Advanced → Code Injection → HEADER -->
<style>
  :root {
    --mcc-nav-height: 0px;
    --mcc-nav-text-color: #f5f5f5;
    --mcc-nav-text-secondary: rgba(255, 255, 255, 0.86);
    --mcc-nav-brand-color: #f5f5f5;
  }

  .mcc-nav-widget,
  .mcc-nav-widget * {
    box-sizing: border-box;
  }
  body {
    overflow-x: hidden;
  }
  html[data-mcc-nav="active"] .Header,
  html[data-mcc-nav="active"] header[role="banner"],
  html[data-mcc-nav="active"] [data-test="header"] {
    display: none !important;
    visibility: hidden;
  }
  
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .mcc-nav-shell {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
  }
  .mcc-nav {
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    max-width: none;
    padding: clamp(32px, 7vw, 72px) clamp(44px, 8vw, 128px) clamp(12px, 3vw, 28px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(18px, 5vw, 72px);
    color: var(--mcc-nav-text-color);
    font-family: 'Inter','Segoe UI',system-ui,sans-serif;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.35) 60%, rgba(0, 0, 0, 0.15) 85%, transparent 100%);
    pointer-events: auto;
    z-index: 10000;
    transition: background 0.3s ease, border-bottom-color 0.3s ease, color 0.3s ease;
  }
  .mcc-nav.is-scrolled {
    background: rgba(10, 10, 16, 0.68);
    border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    color: #f5f5f5;
  }
  .mcc-nav__brand a {
    font-family: 'Libre Baskerville','Georgia',serif;
    font-size: clamp(1.35rem, 2.6vw, 1.9rem);
    font-weight: 600;
    color: var(--mcc-nav-brand-color);
    text-decoration: none;
    letter-spacing: 0.015em;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
    transition: color 0.3s ease;
  }
  .mcc-nav.is-scrolled .mcc-nav__brand a {
    color: #f5f5f5;
  }
  .mcc-nav__menu {
    display: flex;
    align-items: center;
    gap: clamp(1.2rem, 3vw, 2.8rem);
  }
  .mcc-nav__links {
    list-style: none;
    display: flex;
    gap: inherit;
    margin: 0;
    padding: 0;
    align-items: center;
  }
  .mcc-nav__link {
    position: relative;
  }
  .mcc-nav__link a {
    color: var(--mcc-nav-text-secondary);
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding-bottom: 6px;
    display: inline-flex;
    align-items: center;
    transition: color 0.3s ease;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }
  .mcc-nav.is-scrolled .mcc-nav__link a {
    color: rgba(255, 255, 255, 0.86);
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }
  .mcc-nav__link a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 2px;
    background: currentColor;
    border-radius: 999px;
    transform: scaleX(0);
    transform-origin: left;
    opacity: 0;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .mcc-nav__link a:hover,
  .mcc-nav__link a:focus-visible {
    color: var(--mcc-nav-text-color);
    outline: none;
  }
  .mcc-nav.is-scrolled .mcc-nav__link a:hover,
  .mcc-nav.is-scrolled .mcc-nav__link a:focus-visible {
    color: #ffffff;
  }
  .mcc-nav__link a:hover::after,
  .mcc-nav__link a:focus-visible::after,
  .mcc-nav__link a[aria-current="page"]::after {
    transform: scaleX(1);
    opacity: 1;
  }
  .mcc-nav__toggle {
    display: none;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 999px;
    background: rgba(10, 10, 18, 0.52);
    color: rgba(255, 255, 255, 0.92);
    width: 46px;
    height: 46px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  .mcc-nav__toggle:hover,
  .mcc-nav__toggle:focus-visible {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.34);
    color: #ffffff;
    outline: none;
  }
  .mcc-nav__toggle-box {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    justify-content: space-between;
    width: 22px;
    height: 14px;
  }
  .mcc-nav__toggle-line {
    height: 2px;
    border-radius: 999px;
    background: currentColor;
    mix-blend-mode: difference;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .mcc-nav.is-scrolled .mcc-nav__toggle {
    background: rgba(10, 10, 16, 0.78);
    border-color: rgba(255, 255, 255, 0.26);
    color: rgba(255, 255, 255, 0.92);
  }
  @media (max-width: 1024px) {
    .mcc-nav {
      gap: clamp(16px, 6vw, 48px);
    }
  }
  @media (max-width: 768px) {
    .mcc-nav {
      padding: clamp(26px, 8vw, 48px) clamp(26px, 8vw, 64px) clamp(12px, 4vw, 24px);
    }
    .mcc-nav__toggle {
      display: inline-flex;
    }
    .mcc-nav__menu {
      position: absolute;
      top: calc(100% + clamp(12px, 3vw, 20px));
      right: clamp(20px, 6vw, 40px);
      width: min(240px, 82vw);
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      padding: clamp(16px, 5vw, 24px);
      border-radius: 16px;
      background: rgba(10, 10, 14, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.35);
      z-index: 10001;
    }
    .mcc-nav__links {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
    }
    .mcc-nav__link a {
      width: 100%;
      padding: 6px 0;
    }
    .mcc-nav.mcc-nav--menu-open .mcc-nav__menu {
      display: flex;
    }
  }
  @media (max-width: 520px) {
    .mcc-nav__brand a {
      font-size: clamp(1.2rem, 5.8vw, 1.6rem);
    }
    .mcc-nav {
      padding-left: clamp(20px, 7vw, 44px);
      padding-right: clamp(20px, 7vw, 44px);
    }
  }
</style>
<div class="mcc-nav-widget" data-widget-version="1.6-nav">
  <div class="mcc-nav-shell">
    <nav class="mcc-nav" aria-label="Primary navigation">
      <div class="mcc-nav__brand"><a href="/" data-match="^/$">Caleb McCartney</a></div>
      <button class="mcc-nav__toggle" type="button" aria-expanded="false" aria-controls="mcc-nav-links">
        <span class="sr-only">Toggle navigation</span>
        <span class="mcc-nav__toggle-box" aria-hidden="true">
          <span class="mcc-nav__toggle-line"></span>
          <span class="mcc-nav__toggle-line"></span>
          <span class="mcc-nav__toggle-line"></span>
        </span>
      </button>
      <div class="mcc-nav__menu">
        <ul class="mcc-nav__links" id="mcc-nav-links" role="list">
          <li class="mcc-nav__link"><a href="/" data-match="^/$">Work</a></li>
          <li class="mcc-nav__link"><a href="/podcast" data-match="^/podcast">Podcast</a></li>
          <li class="mcc-nav__link"><a href="/about" data-match="^/about">About</a></li>
        </ul>
      </div>
    </nav>
  </div>
</div>
<script>
  (function(){
    const killSelectors = ['.Header','header[role="banner"]','[data-test="header"]'];
    killSelectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(node => {
        node.setAttribute('data-mcc-nav-replaced','true');
        node.style.display = 'none';
        node.setAttribute('aria-hidden','true');
      });
    });

    const root = document.querySelector('.mcc-nav-widget');
    if (!root || root.dataset.mounted === 'true') return;
    root.dataset.mounted = 'true';

    document.documentElement.dataset.mccNav = 'active';

    const nav = root.querySelector('.mcc-nav');
    const toggle = nav.querySelector('.mcc-nav__toggle');
    const links = nav.querySelectorAll('.mcc-nav__links a');

    const closeMobile = () => {
      nav.classList.remove('mcc-nav--menu-open');
      if (toggle) toggle.setAttribute('aria-expanded','false');
    };

    if (toggle) {
      toggle.addEventListener('click', function(){
        const willOpen = !nav.classList.contains('mcc-nav--menu-open');
        nav.classList.toggle('mcc-nav--menu-open', willOpen);
        this.setAttribute('aria-expanded', String(willOpen));
      });
    }

    links.forEach(anchor => anchor.addEventListener('click', closeMobile));

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) closeMobile();
      requestAnimationFrame(updateNavHeight);
    });

    const highlight = () => {
      const path = window.location.pathname;
      nav.querySelectorAll('[data-match]').forEach(anchor => {
        const pattern = anchor.getAttribute('data-match');
        anchor.removeAttribute('aria-current');
        if (!pattern) return;
        try {
          if (new RegExp(pattern).test(path)) {
            anchor.setAttribute('aria-current','page');
          }
        } catch (err) {
          console.warn('[mcc-nav] invalid regex', pattern, err);
        }
      });
    };
    highlight();

    const handleRoute = () => {
      highlight();
      closeMobile();
    };
    window.addEventListener('SquarespaceRoutingComplete', handleRoute);

    const updateNavHeight = () => {
      const height = nav.getBoundingClientRect().height;
      document.documentElement.style.setProperty('--mcc-nav-height', height + 'px');
    };
    requestAnimationFrame(updateNavHeight);
    window.addEventListener('load', updateNavHeight);

    const applyScrollState = () => {
      const threshold = nav.getBoundingClientRect().height * 0.35;
      nav.classList.toggle('is-scrolled', window.scrollY > threshold);
    };
    applyScrollState();
    window.addEventListener('scroll', applyScrollState, { passive: true });
  })();
</script>
