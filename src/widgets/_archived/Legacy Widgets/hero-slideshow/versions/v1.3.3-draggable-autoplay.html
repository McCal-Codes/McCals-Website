<!-- McCal Hero Carousel v1.3.3 (Squarespace-like Drag + Autoplay) -->
<div
  id="mcc-hero"
  class="mcc-hero-widget"
  data-widget-version="1.3.3-draggable-autoplay"
  data-mcc-hero-root
  data-source-mode="favorites"
  data-max-slides="9"
  data-slide-duration="8"
  data-manifest-url="https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/src/images/Portfolios/featured-manifest.json"
  data-slide-plan="politics,journalism,pittsburgh,portraits,corporate,event,concert,theatre,nature"
>
  <!-- site-widgets:inline:start -->
  <style data-site-widgets-inline>
    :root {
      --mcc-accent: #b8b0aa;
      --mcc-accent-strong: #cac2ba;
      --mcc-bg: #050506;
      --mcc-fg: #cac2ba;
      --mcc-line: #2a2a2a;
      --mcc-muted: #5b5553;
    }
    [class^='mcc-'],
    [class*=' mcc-'] {
      box-sizing: border-box;
      font-family:
        Inter,
        'Segoe UI',
        system-ui,
        -apple-system,
        'Helvetica Neue',
        Arial,
        sans-serif;
      color: var(--mcc-fg);
    }
  </style>
  <!-- site-widgets:inline:end -->

  <style>
    :root {
      --mcc-nav-height: 0px;
    }

    .mcc-hero-widget,
    .mcc-hero-widget * {
      box-sizing: border-box;
    }

    .mcc-hero-widget {
      display: block;
      width: 100%;
      color: #f5f5f5;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    .mcc-hero-shell {
      position: relative;
      width: 100vw;
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
      background: #050506;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    :root[data-mcc-nav='active'] .mcc-hero-shell {
      margin-top: calc(-1 * var(--mcc-nav-height, 0px));
    }

    .mcc-hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .mcc-hero__viewport {
      overflow: hidden;
      width: 100%;
      min-height: inherit;
      cursor: grab;
    }

    .mcc-hero__viewport.is-dragging {
      cursor: grabbing;
    }

    .mcc-hero__track {
      display: flex;
      width: 100%;
      min-height: inherit;
      transform: translate3d(0, 0, 0);
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .mcc-hero__slide {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .mcc-hero__slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .mcc-hero__slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.12) 0%,
        rgba(4, 4, 12, 0.58) 72%,
        rgba(5, 5, 10, 0.9) 100%
      );
      pointer-events: none;
    }

    .mcc-hero__caption {
      position: absolute;
      left: 50%;
      bottom: clamp(40px, 9vw, 120px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      z-index: 2;
      width: min(92vw, 980px);
      pointer-events: auto;
    }

    .mcc-hero__slide h2 {
      margin: 0;
      font-family: 'Libre Baskerville', 'Georgia', serif;
      font-size: clamp(1.45rem, 3.6vw, 2.7rem);
      font-weight: 600;
      color: #fff;
      text-shadow: 0 12px 32px rgba(0, 0, 0, 0.58);
      letter-spacing: 0.02em;
    }

    .mcc-hero__meta {
      margin: 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(0.78rem, 1.35vw, 0.9rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .mcc-hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.82rem 2.45rem;
      border-radius: 999px;
      background: rgba(8, 8, 12, 0.88);
      color: #f8f8f8;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34);
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .mcc-hero__cta:hover,
    .mcc-hero__cta:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.96);
      color: #0a0a0f;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.4);
      outline: none;
    }

    .mcc-hero__arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(8, 8, 10, 0.5);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .mcc-hero__arrow--prev {
      left: 2.5vw;
    }

    .mcc-hero__arrow--next {
      right: 2.5vw;
    }

    .mcc-hero__dots {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .mcc-hero__dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 255, 255, 0.4);
      padding: 0;
      cursor: pointer;
    }

    .mcc-hero__dot.is-active {
      width: 19px;
      background: rgba(255, 255, 255, 0.92);
    }

    @media (max-width: 768px) {
      .mcc-hero__caption {
        bottom: clamp(30px, 12vw, 82px);
      }

      .mcc-hero__arrow {
        width: 40px;
        height: 40px;
      }

      .mcc-hero__arrow--prev {
        left: 12px;
      }

      .mcc-hero__arrow--next {
        right: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mcc-hero__track {
        transition: none !important;
      }
    }
  </style>

  <div class="mcc-hero-shell">
    <section class="mcc-hero" aria-label="Featured work carousel">
      <div class="mcc-hero__viewport" data-mcc-hero-viewport>
        <div class="mcc-hero__track" data-mcc-hero-track></div>
      </div>
      <button class="mcc-hero__arrow mcc-hero__arrow--prev" data-mcc-hero-prev aria-label="Previous slide">‹</button>
      <button class="mcc-hero__arrow mcc-hero__arrow--next" data-mcc-hero-next aria-label="Next slide">›</button>
      <div class="mcc-hero__dots" data-mcc-hero-dots aria-label="Slide navigation"></div>
    </section>
  </div>

  <script>
    (function () {
      const root = document.querySelector('[data-mcc-hero-root]');
      if (!root) return;

      const viewport = root.querySelector('[data-mcc-hero-viewport]');
      const track = root.querySelector('[data-mcc-hero-track]');
      const dotsWrap = root.querySelector('[data-mcc-hero-dots]');
      const prevBtn = root.querySelector('[data-mcc-hero-prev]');
      const nextBtn = root.querySelector('[data-mcc-hero-next]');
      if (!viewport || !track || !dotsWrap || !prevBtn || !nextBtn) return;

      const sourceMode = (root.getAttribute('data-source-mode') || 'favorites').toLowerCase();
      const maxSlides = Math.max(1, parseInt(root.getAttribute('data-max-slides') || '9', 10));
      const slideDuration = Math.max(4, parseInt(root.getAttribute('data-slide-duration') || '8', 10));
      const manifestUrl =
        root.getAttribute('data-manifest-url') ||
        'https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/src/images/Portfolios/featured-manifest.json';
      const slidePlanRaw =
        root.getAttribute('data-slide-plan') ||
        'politics,journalism,pittsburgh,portraits,corporate,event,concert,theatre,nature';
      const slidePlan = slidePlanRaw
        .split(',')
        .map((s) => s.trim().toLowerCase())
        .filter(Boolean)
        .slice(0, maxSlides);

      const SLOT_ALIASES = {
        politics: ['politics', 'political', 'election', 'campaign'],
        journalism: ['journalism', 'photojournalism', 'editorial', 'news'],
        pittsburgh: ['pittsburgh', 'pgh', 'steel city'],
        portraits: ['portrait', 'portraits', 'headshot', 'people'],
        corporate: ['corporate', 'business', 'brand'],
        event: ['event', 'events', 'festival', 'conference'],
        concert: ['concert', 'music', 'show', 'live'],
        theatre: ['theatre', 'theater', 'stage', 'performance'],
        nature: ['nature', 'landscape', 'outdoor', 'wildlife']
      };

      const SLOT_CONFIG = {
        politics: { href: '/journalism', cta: 'Politics', meta: 'Politics' },
        journalism: { href: '/journalism', cta: 'Journalism', meta: 'Journalism' },
        pittsburgh: { href: '/nature', cta: 'Pittsburgh', meta: 'Pittsburgh' },
        portraits: { href: '/portraits', cta: 'Portraits', meta: 'Portraits' },
        corporate: { href: '/event', cta: 'Corporate', meta: 'Corporate' },
        event: { href: '/events', cta: 'Event', meta: 'Event' },
        concert: { href: '/concert', cta: 'Concert', meta: 'Concert' },
        theatre: { href: '/event', cta: 'Theatre', meta: 'Theatre' },
        nature: { href: '/nature', cta: 'Nature', meta: 'Nature' },
        featured: { href: '/featured', cta: 'Explore', meta: 'Featured' }
      };

      const FAVORITES = [
        {
          title: 'Politics',
          meta: 'Politics',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/eedc836b-ce05-4452-b29c-8ab2a64f384e/101024_Obama+Speaks+at+Pittsburgh_CAL3364-min.jpg',
          href: '/journalism',
          cta: 'Politics',
          alt: 'Obama Smiling at the crowd during a Rally In Pittsburgh, PA',
          categories: ['politics', 'journalism', 'pittsburgh']
        },
        {
          title: 'Journalism',
          meta: 'Journalism',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/3a804513-dde2-4a01-b38c-d67528d655f4/250715_CMU+Trump+Protest_CAL1573.jpg',
          href: '/journalism',
          cta: 'Journalism',
          alt: 'Journalism assignment image from CMU protest.',
          categories: ['journalism', 'politics']
        },
        {
          title: 'Pittsburgh',
          meta: 'Pittsburgh',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/62dcd231-e0e8-402b-abf4-cc34e995ea58/IMGP7209.jpg',
          href: '/nature',
          cta: 'Pittsburgh',
          alt: 'A large, steel truss bridge spans over a body of water at sunset, with trees and buildings visible below and in the background.',
          categories: ['pittsburgh', 'nature']
        },
        {
          title: 'Portraits',
          meta: 'Portraits',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/f75a0ba5-795a-4b29-a86e-eb890ef944a3/6-9-25_Caleb+McCartney_134.jpg',
          href: '/portraits',
          cta: 'Portraits',
          alt: 'A woman and a child holding a sparkler at night, with dark trees in the background.',
          categories: ['portraits']
        },
        {
          title: 'Corporate',
          meta: 'Corporate',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/abf749ae-bd3d-45a0-9d6a-690a8cf0055d/230411_Cock+Tail+Hour+-+James+Bond+Event_876_Published.jpg',
          href: '/event',
          cta: 'Corporate',
          alt: 'Group of people at a professional networking event, talking and laughing, with a woman preparing drinks on a table.',
          categories: ['corporate', 'event']
        },
        {
          title: 'Event',
          meta: 'Event',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/a2b77c48-9cf4-4e5f-b15a-1c373e5fc5c1/250823_Honky+Tonk_CAL4149.jpg',
          href: '/events',
          cta: 'Event',
          alt: 'Event image from Honky Tonk gathering.',
          categories: ['event']
        },
        {
          title: 'Concert',
          meta: 'Concert',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/9c635526-663e-42ef-ba9c-7dcc8d477190/251025+When+We+Were+Dead_CAL8612_webuse.jpg',
          href: '/concert',
          cta: 'Concert',
          alt: 'A singer on stage on his knees with green and blue lighting.',
          categories: ['concert']
        },
        {
          title: 'Theatre',
          meta: 'Theatre',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/77807f5b-9895-4444-804d-1b3363d0f1b3/250319+A+Guy+Who+Hates+Musicals+-+Ghostlight_CAL999.jpg',
          href: '/event',
          cta: 'Theatre',
          alt: 'The cast from A Guy Who Hates Musicals together on stage.',
          categories: ['theatre', 'event']
        },
        {
          title: 'Nature',
          meta: 'Nature',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/f96709e7-3a00-4574-af88-795f26ce432e/IMGP6886.jpg',
          href: '/nature',
          cta: 'Nature',
          alt: 'Close-up of a pink coneflower with a bee on the dark center cone, blurred green background.',
          categories: ['nature']
        }
      ];

      const normalizeCategory = (value) => {
        const key = String(value || '').trim().toLowerCase();
        if (key === 'events') return 'event';
        if (key === 'portrait') return 'portraits';
        if (key === 'theater') return 'theatre';
        return key;
      };

      const shuffle = (arr) => {
        const out = [...arr];
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      };

      const slideKey = (slide) =>
        [String(slide?.title || '').toLowerCase(), String(slide?.href || '').toLowerCase(), String(slide?.image || '')].join('|');

      const uniqueSlides = (slides) => {
        const seen = new Set();
        const out = [];
        (Array.isArray(slides) ? slides : []).forEach((slide) => {
          if (!slide || !slide.image) return;
          const key = slideKey(slide);
          if (seen.has(key)) return;
          seen.add(key);
          out.push(slide);
        });
        return out;
      };

      const tokenize = (...values) =>
        values
          .flat()
          .map((v) => String(v || '').toLowerCase())
          .join(' ')
          .replace(/[^a-z0-9\s-]/g, ' ')
          .split(/\s+/)
          .filter(Boolean);

      const categoryMatch = (slide, slot) => {
        const slotKey = normalizeCategory(slot);
        const aliases = SLOT_ALIASES[slotKey] || [slotKey];
        const categoryValues = Array.isArray(slide?.categories) ? slide.categories : [];
        const categoryTokens = tokenize(categoryValues.join(' '));
        return aliases.some((alias) => categoryTokens.some((token) => token.includes(alias)));
      };

      const dateValue = (item) =>
        item?.date?.iso || item?.dateISO || item?.concertDate?.iso || item?.generated || '';

      const pickImagePath = (item) => {
        if (!item) return '';

        if (typeof item.coverImage === 'string' && item.coverImage) {
          if (/^https?:\/\//i.test(item.coverImage)) return item.coverImage;
          if (item.relativeFolderPath) {
            return `src/images/Portfolios/${item.relativeFolderPath}/${item.coverImage}`;
          }
          if (item.folderPath) {
            return `src/images/Portfolios/${item.folderPath}/${item.coverImage}`;
          }
          return item.coverImage;
        }

        if (item.coverImage && typeof item.coverImage.path === 'string') {
          return item.coverImage.path;
        }

        const firstImage = Array.isArray(item.images) ? item.images[0] : '';
        if (typeof firstImage === 'string') {
          if (/^https?:\/\//i.test(firstImage)) return firstImage;
          if (item.relativeFolderPath) {
            return `src/images/Portfolios/${item.relativeFolderPath}/${firstImage}`;
          }
          if (item.folderPath) {
            return `src/images/Portfolios/${item.folderPath}/${firstImage}`;
          }
          return firstImage;
        }
        if (firstImage && typeof firstImage.path === 'string') return firstImage.path;

        return '';
      };

      const toAbsoluteImageUrl = (path) => {
        if (!path) return '';
        if (/^https?:\/\//i.test(path)) return path;
        const clean = String(path).replace(/^\/+/, '');
        return `https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/${encodeURI(clean)}`;
      };

      const inferCategories = (item, title, typeKey) => {
        const baseTokens = tokenize(
          typeKey,
          item?.type,
          item?.category,
          item?.title,
          item?.name,
          item?.eventName,
          item?.bandName,
          title,
          item?.folderPath,
          item?.relativeFolderPath,
          Array.isArray(item?.tags) ? item.tags.join(' ') : ''
        );

        const categories = Object.keys(SLOT_ALIASES).filter((slot) => {
          const aliases = SLOT_ALIASES[slot] || [];
          return aliases.some((alias) => baseTokens.some((t) => t.includes(alias)));
        });

        const fallback = normalizeCategory(typeKey);
        if (!categories.length && fallback) categories.push(fallback);

        return Array.from(new Set(categories.map(normalizeCategory))).filter(Boolean);
      };

      const toDynamicSlide = (item) => {
        const typeKey = normalizeCategory(item?.type);
        const title = item?.title || item?.name || item?.eventName || item?.bandName || 'Featured Work';
        const categories = inferCategories(item, title, typeKey);
        const primaryCategory = categories[0] || typeKey || 'featured';
        const cfg = SLOT_CONFIG[primaryCategory] || SLOT_CONFIG.featured;
        const image = toAbsoluteImageUrl(pickImagePath(item));
        if (!image) return null;

        return {
          title,
          meta: cfg.meta,
          image,
          href: cfg.href,
          cta: cfg.cta,
          alt: `${title} ${cfg.meta} photography`,
          categories
        };
      };

      const takeFromPool = (pool, predicate) => {
        if (!Array.isArray(pool) || !pool.length) return null;
        const idx = typeof predicate === 'function' ? pool.findIndex(predicate) : 0;
        if (idx < 0) return null;
        const [item] = pool.splice(idx, 1);
        return item || null;
      };

      const buildFromMode = (dynamicSlides) => {
        const favoritesPool = uniqueSlides(shuffle(FAVORITES));
        const dynamicPool = uniqueSlides(dynamicSlides);
        const selected = [];

        const pickFavorite = () => takeFromPool(favoritesPool);
        const pickDynamic = () => takeFromPool(dynamicPool);
        const pickFavoriteByCategory = (slot) => takeFromPool(favoritesPool, (s) => categoryMatch(s, slot));
        const pickDynamicByCategory = (slot) => takeFromPool(dynamicPool, (s) => categoryMatch(s, slot));

        const pickForSlot = (slotRaw) => {
          const slot = normalizeCategory(slotRaw);
          if (slot === 'favorite') return pickFavorite() || pickDynamic();
          if (slot === 'dynamic') return pickDynamic() || pickFavorite();

          if (sourceMode === 'favorites') return pickFavoriteByCategory(slot) || pickFavorite();
          if (sourceMode === 'dynamic') return pickDynamicByCategory(slot) || pickDynamic();

          return pickFavoriteByCategory(slot) || pickDynamicByCategory(slot) || pickDynamic() || pickFavorite();
        };

        if (slidePlan.length) {
          slidePlan.forEach((slot) => {
            if (selected.length >= maxSlides) return;
            const pick = pickForSlot(slot);
            if (pick) selected.push(pick);
          });
        }

        while (selected.length < maxSlides) {
          const pick = sourceMode === 'favorites' ? pickFavorite() : sourceMode === 'dynamic' ? pickDynamic() : pickDynamic() || pickFavorite();
          if (!pick) break;
          selected.push(pick);
        }

        return selected.slice(0, maxSlides);
      };

      const renderSlides = (slides) => {
        track.innerHTML = slides
          .map(
            (slide, index) => `
            <figure class="mcc-hero__slide" data-slide-index="${index}">
              <img src="${slide.image}" alt="${slide.alt || slide.title}" loading="${index === 0 ? 'eager' : 'lazy'}" ${
                index === 0 ? 'fetchpriority="high"' : ''
              } />
              <figcaption class="mcc-hero__caption">
                <h2>${slide.title}</h2>
                <p class="mcc-hero__meta">${slide.meta || ''}</p>
                <a class="mcc-hero__cta" href="${slide.href}">${slide.cta || 'Explore'}</a>
              </figcaption>
            </figure>
          `
          )
          .join('');

        dotsWrap.innerHTML = slides
          .map(
            (_, idx) =>
              `<button class="mcc-hero__dot${idx === 0 ? ' is-active' : ''}" data-mcc-dot="${idx}" aria-label="Go to slide ${
                idx + 1
              }"></button>`
          )
          .join('');
      };

      const initSlider = (slides) => {
        if (!slides.length) return;

        let index = 0;
        let autoplay = null;
        let dragging = false;
        let startX = 0;
        let deltaX = 0;
        let viewportWidth = viewport.getBoundingClientRect().width || window.innerWidth;

        const updateDots = () => {
          const dots = dotsWrap.querySelectorAll('[data-mcc-dot]');
          dots.forEach((d, i) => d.classList.toggle('is-active', i === index));
        };

        const setTrackX = (x, withTransition) => {
          track.style.transition = withTransition ? 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)' : 'none';
          track.style.transform = `translate3d(${x}px,0,0)`;
        };

        const goTo = (nextIndex, withTransition = true) => {
          const total = slides.length;
          index = ((nextIndex % total) + total) % total;
          const x = -index * viewportWidth;
          setTrackX(x, withTransition);
          updateDots();
        };

        const next = () => goTo(index + 1);
        const prev = () => goTo(index - 1);

        const stopAutoplay = () => {
          if (autoplay) {
            clearInterval(autoplay);
            autoplay = null;
          }
        };

        const startAutoplay = () => {
          stopAutoplay();
          autoplay = setInterval(next, slideDuration * 1000);
        };

        const onPointerDown = (e) => {
          if (!slides.length) return;
          dragging = true;
          viewport.classList.add('is-dragging');
          startX = e.clientX;
          deltaX = 0;
          viewportWidth = viewport.getBoundingClientRect().width || window.innerWidth;
          stopAutoplay();
          viewport.setPointerCapture?.(e.pointerId);
        };

        const onPointerMove = (e) => {
          if (!dragging) return;
          deltaX = e.clientX - startX;
          const baseX = -index * viewportWidth;
          setTrackX(baseX + deltaX, false);
        };

        const onPointerUp = (e) => {
          if (!dragging) return;
          dragging = false;
          viewport.classList.remove('is-dragging');
          viewport.releasePointerCapture?.(e.pointerId);

          const threshold = Math.max(52, viewportWidth * 0.12);
          if (Math.abs(deltaX) > threshold) {
            if (deltaX < 0) next();
            else prev();
          } else {
            goTo(index, true);
          }
          startAutoplay();
        };

        prevBtn.addEventListener('click', () => {
          prev();
          startAutoplay();
        });

        nextBtn.addEventListener('click', () => {
          next();
          startAutoplay();
        });

        dotsWrap.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-mcc-dot]');
          if (!btn) return;
          const target = parseInt(btn.getAttribute('data-mcc-dot') || '0', 10);
          goTo(target);
          startAutoplay();
        });

        viewport.addEventListener('pointerdown', onPointerDown);
        viewport.addEventListener('pointermove', onPointerMove);
        viewport.addEventListener('pointerup', onPointerUp);
        viewport.addEventListener('pointercancel', onPointerUp);
        viewport.addEventListener('pointerleave', (e) => {
          if (dragging) onPointerUp(e);
        });

        window.addEventListener('resize', () => {
          viewportWidth = viewport.getBoundingClientRect().width || window.innerWidth;
          goTo(index, false);
        });

        root.addEventListener('mouseenter', stopAutoplay);
        root.addEventListener('mouseleave', startAutoplay);

        goTo(0, false);
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          startAutoplay();
        }
      };

      const init = async () => {
        try {
          let dynamicSlides = [];
          if (sourceMode !== 'favorites') {
            const res = await fetch(manifestUrl, { mode: 'cors' });
            if (res.ok) {
              const data = await res.json();
              const items = Array.isArray(data?.items) ? data.items : [];
              dynamicSlides = items
                .slice()
                .sort((a, b) => String(dateValue(b)).localeCompare(String(dateValue(a))))
                .map(toDynamicSlide)
                .filter(Boolean);
            }
          }

          const slides = buildFromMode(dynamicSlides);
          const safeSlides = slides.length ? slides : uniqueSlides(FAVORITES).slice(0, maxSlides);
          renderSlides(safeSlides);
          initSlider(safeSlides);
        } catch (error) {
          const fallback = uniqueSlides(FAVORITES).slice(0, maxSlides);
          renderSlides(fallback);
          initSlider(fallback);
        }
      };

      init();
    })();
  </script>
</div>
<!-- /McCal Hero Carousel -->
