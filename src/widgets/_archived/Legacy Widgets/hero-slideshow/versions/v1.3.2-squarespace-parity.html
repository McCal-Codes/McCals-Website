  <style>
    :root {
      --mcc-nav-height: 0px;
    }

    .mcc-hero-widget,
    .mcc-hero-widget * {
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
    }

    .mcc-hero-widget {
      display: block;
      width: 100%;
      color: #f5f5f5;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    .mcc-hero-shell {
      position: relative;
      width: 100vw;
      left: 50%;
      transform: translateX(-50%);
      color: inherit;
      overflow: hidden;
      background: transparent;
    }

    :root[data-mcc-nav='active'] .mcc-hero-shell {
      margin-top: calc(-1 * var(--mcc-nav-height, 0px));
    }

    .mcc-hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .mcc-hero__stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: inherit;
    }

    .mcc-hero__slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.04);
      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
      animation: mcc-hero-cycle var(--mcc-hero-cycle-duration, 72s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      animation-fill-mode: both;
    }

    .mcc-hero__slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mcc-hero__slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(4, 4, 12, 0.6) 70%,
        rgba(5, 5, 10, 0.92) 100%
      );
    }

    .mcc-hero__caption {
      position: absolute;
      left: 50%;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      z-index: 2;
      width: min(92vw, 960px);

    .mcc-hero__slide h2 {

      font-family: 'Libre Baskerville', 'Georgia', serif;
      font-size: clamp(1.55rem, 3.6vw, 2.85rem);

  <div class="mcc-hero-shell">
    <section class="mcc-hero" aria-label="Featured work carousel">
      <div class="mcc-hero__stage" data-mcc-hero-stage></div>

  <script>
    (function () {
      const root = document.querySelector('[data-mcc-hero-root]');
      if (!root) return;
      const stage = root.querySelector('[data-mcc-hero-stage]');
      if (!stage) return;

      const sourceMode = (root.getAttribute('data-source-mode') || 'favorites').toLowerCase();
      const maxSlides = Math.max(1, parseInt(root.getAttribute('data-max-slides') || '9', 10));
      const slideDuration = Math.max(4, parseInt(root.getAttribute('data-slide-duration') || '8', 10));
      const manifestUrl =
        root.getAttribute('data-manifest-url') ||
        'https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/src/images/Portfolios/featured-manifest.json';
      const slidePlanRaw =
        root.getAttribute('data-slide-plan') ||
        'politics,journalism,pittsburgh,portraits,corporate,event,concert,theatre,nature';
      const slidePlan = slidePlanRaw
        .split(',')
        .map((s) => s.trim().toLowerCase())
        .filter(Boolean)
        .slice(0, maxSlides);

      const SLOT_ALIASES = {
        politics: ['politics', 'political', 'election', 'campaign'],
        journalism: ['journalism', 'photojournalism', 'editorial', 'news'],
        pittsburgh: ['pittsburgh', 'pgh', 'steel city'],
        portraits: ['portrait', 'portraits', 'headshot', 'people'],
        corporate: ['corporate', 'business', 'brand'],
        event: ['event', 'events', 'festival', 'conference'],
        concert: ['concert', 'music', 'show', 'live'],
        theatre: ['theatre', 'theater', 'stage', 'performance'],
        nature: ['nature', 'landscape', 'outdoor', 'wildlife']
      };

      const SLOT_CONFIG = {
        politics: { href: '/journalism', cta: 'See Coverage', meta: 'Politics' },
        journalism: { href: '/journalism', cta: 'View Journalism', meta: 'Journalism' },
        pittsburgh: { href: '/nature', cta: 'Explore Pittsburgh', meta: 'Pittsburgh' },
        portraits: { href: '/portraits', cta: 'View Portraits', meta: 'Portraits' },
        corporate: { href: '/event', cta: 'View Corporate', meta: 'Corporate' },
        event: { href: '/events', cta: 'Discover Events', meta: 'Event' },
        concert: { href: '/concert', cta: 'View Performances', meta: 'Concert' },
        theatre: { href: '/event', cta: 'View Theatre', meta: 'Theatre' },
        nature: { href: '/nature', cta: 'View Nature', meta: 'Nature' },
        featured: { href: '/featured', cta: 'Explore Featured', meta: 'Featured' }
      };

      const FAVORITES = [
        {
          title: 'Politics',
          meta: 'Politics',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/eedc836b-ce05-4452-b29c-8ab2a64f384e/101024_Obama+Speaks+at+Pittsburgh_CAL3364-min.jpg',
          href: '/journalism',
          cta: 'Politics',
          alt: 'Obama Smiling at the crowd during a Rally In Pittsburgh, PA',
          categories: ['politics', 'journalism', 'pittsburgh']
        },
        {
          title: 'Journalism',
          meta: 'Journalism',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/3a804513-dde2-4a01-b38c-d67528d655f4/250715_CMU+Trump+Protest_CAL1573.jpg',
          href: '/journalism',
          cta: 'Journalism',
          alt: 'Journalism assignment image from CMU protest.',
          categories: ['journalism', 'politics']
        },
        {
          title: 'Pittsburgh',
          meta: 'Pittsburgh',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/62dcd231-e0e8-402b-abf4-cc34e995ea58/IMGP7209.jpg',
          href: '/nature',
          cta: 'Pittsburgh',
          alt: 'A large, steel truss bridge spans over a body of water at sunset, with trees and buildings visible below and in the background.',
          categories: ['pittsburgh', 'nature']
        },
        {
          title: 'Portraits',
          meta: 'Portraits',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/f75a0ba5-795a-4b29-a86e-eb890ef944a3/6-9-25_Caleb+McCartney_134.jpg',
          href: '/portraits',
          cta: 'Portraits',
          alt: 'A woman and a child holding a sparkler at night, with dark trees in the background.',
          categories: ['portraits']
        },
        {
          title: 'Corporate',
          meta: 'Corporate',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/abf749ae-bd3d-45a0-9d6a-690a8cf0055d/230411_Cock+Tail+Hour+-+James+Bond+Event_876_Published.jpg',
          href: '/event',
          cta: 'Corporate',
          alt: 'Group of people at a professional networking event, talking and laughing, with a woman preparing drinks on a table.',
          categories: ['corporate', 'event']
        },
        {
          title: 'Event',
          meta: 'Event',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/a2b77c48-9cf4-4e5f-b15a-1c373e5fc5c1/250823_Honky+Tonk_CAL4149.jpg',
          href: '/events',
          cta: 'Event',
          alt: 'Event image from Honky Tonk gathering.',
          categories: ['event']
        },
        {
          title: 'Concert',
          meta: 'Concert',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/9c635526-663e-42ef-ba9c-7dcc8d477190/251025+When+We+Were+Dead_CAL8612_webuse.jpg',
          href: '/concert',
          cta: 'Concert',
          alt: 'A singer on stage on his knees with green and blue lighting.',
          categories: ['concert']
        },
        {
          title: 'Theatre',
          meta: 'Theatre',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/77807f5b-9895-4444-804d-1b3363d0f1b3/250319+A+Guy+Who+Hates+Musicals+-+Ghostlight_CAL999.jpg',
          href: '/event',
          cta: 'Theatre',
          alt: 'The cast from A Guy Who Hates Musicals together on stage.',
          categories: ['theatre', 'event']
        },
        {
          title: 'Nature',
          meta: 'Nature',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/f96709e7-3a00-4574-af88-795f26ce432e/IMGP6886.jpg',
          href: '/nature',
          cta: 'Nature',
          alt: 'Close-up of a pink coneflower with a bee on the dark center cone, blurred green background.',
          categories: ['nature']
        }
      ];

      const toTypeKey = (value) => String(value || '').trim().toLowerCase();

      const normalizeCategory = (value) => {
        const key = toTypeKey(value);
        if (key === 'events') return 'event';
        if (key === 'portrait') return 'portraits';
        if (key === 'theater') return 'theatre';
        return key;
      };

      const shuffle = (arr) => {
        const out = [...arr];
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      };

      const slideKey = (slide) =>
        [String(slide?.title || '').toLowerCase(), String(slide?.href || '').toLowerCase(), String(slide?.image || '')].join('|');

      const uniqueSlides = (slides) => {
        const seen = new Set();
        const out = [];
        (Array.isArray(slides) ? slides : []).forEach((slide) => {
          if (!slide || !slide.image) return;
          const key = slideKey(slide);
          if (seen.has(key)) return;
          seen.add(key);
          out.push(slide);
        });
        return out;
      };

      const tokenize = (...values) =>
        values
          .flat()
          .map((v) => String(v || '').toLowerCase())
          .join(' ')
          .replace(/[^a-z0-9\s-]/g, ' ')
          .split(/\s+/)
          .filter(Boolean);

      const inferCategories = (item, title, typeKey) => {
        const baseTokens = tokenize(
          typeKey,
          item?.type,
          item?.category,
          item?.title,
          item?.name,
          item?.eventName,
          item?.bandName,
          title,
          item?.folderPath,
          item?.relativeFolderPath,
          Array.isArray(item?.tags) ? item.tags.join(' ') : ''
        );

        const categories = Object.keys(SLOT_ALIASES).filter((slot) => {
          const aliases = SLOT_ALIASES[slot] || [];
          return aliases.some((alias) => baseTokens.some((t) => t.includes(alias)));
        });

        if (!categories.length && normalizeCategory(typeKey)) {
          categories.push(normalizeCategory(typeKey));
        }

        return Array.from(new Set(categories.map(normalizeCategory))).filter(Boolean);
      };

      const categoryMatch = (slide, slot) => {
        const slotKey = normalizeCategory(slot);
        const aliases = SLOT_ALIASES[slotKey] || [slotKey];
        const categoryValues = Array.isArray(slide?.categories) ? slide.categories : [];
        const categoryTokens = tokenize(categoryValues.join(' '));
        return aliases.some((alias) => categoryTokens.some((token) => token.includes(alias)));
      };

      const dateValue = (item) =>
        item?.date?.iso || item?.dateISO || item?.concertDate?.iso || item?.generated || '';

      const pickImagePath = (item) => {
        if (!item) return '';

        if (typeof item.coverImage === 'string' && item.coverImage) {
          if (/^https?:\/\//i.test(item.coverImage)) return item.coverImage;
          if (item.relativeFolderPath) {
            return `src/images/Portfolios/${item.relativeFolderPath}/${item.coverImage}`;
          }
          if (item.folderPath) {
            return `src/images/Portfolios/${item.folderPath}/${item.coverImage}`;
          }
          return item.coverImage;
        }

        if (item.coverImage && typeof item.coverImage.path === 'string') {
          return item.coverImage.path;
        }

        const firstImage = Array.isArray(item.images) ? item.images[0] : '';
        if (typeof firstImage === 'string') {
          if (/^https?:\/\//i.test(firstImage)) return firstImage;
          if (item.relativeFolderPath) {
            return `src/images/Portfolios/${item.relativeFolderPath}/${firstImage}`;
          }
          if (item.folderPath) {
            return `src/images/Portfolios/${item.folderPath}/${firstImage}`;
          }
          return firstImage;
        }
        if (firstImage && typeof firstImage.path === 'string') return firstImage.path;

        return '';
      };

      const toAbsoluteImageUrl = (path) => {
        if (!path) return '';
        if (/^https?:\/\//i.test(path)) return path;
        const clean = String(path).replace(/^\/+/, '');
        return `https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/${encodeURI(clean)}`;
      };

      const toDynamicSlide = (item) => {
        const typeKey = normalizeCategory(item?.type);
        const title = item?.title || item?.name || item?.eventName || item?.bandName || 'Featured Work';
        const categories = inferCategories(item, title, typeKey);
        const primaryCategory = categories[0] || typeKey || 'featured';
        const config = SLOT_CONFIG[primaryCategory] || SLOT_CONFIG.featured;
        const imagePath = pickImagePath(item);
        const image = toAbsoluteImageUrl(imagePath);
        if (!image) return null;

        return {
          title,
          meta: config.meta,
          image,
          href: config.href,
          cta: config.cta,
          alt: `${title} ${config.meta} photography`,
          categories
        };
      };

      const renderSlides = (slides) => {
        const duration = slides.length * slideDuration;
        root.style.setProperty('--mcc-hero-cycle-duration', `${duration}s`);

        stage.innerHTML = slides
          .map(
            (slide, index) => `
              <figure class="mcc-hero__slide" style="--delay:${index * slideDuration}s">
                <img src="${slide.image}" alt="${slide.alt || slide.title}" loading="${
                  index === 0 ? 'eager' : 'lazy'
                }" ${index === 0 ? 'fetchpriority="high"' : ''} />
                <figcaption class="mcc-hero__caption">
                  <h2>${slide.title}</h2>
                  <p class="mcc-hero__meta">${slide.meta || ''}</p>
                  <a class="mcc-hero__cta" href="${slide.href}">${slide.cta || 'Explore'}</a>
                </figcaption>
              </figure>
            `
          )
          .join('');
      };

      const takeFromPool = (pool, predicate) => {
        if (!Array.isArray(pool) || !pool.length) return null;
        const idx = typeof predicate === 'function' ? pool.findIndex(predicate) : 0;
        if (idx < 0) return null;
        const [item] = pool.splice(idx, 1);
        return item || null;
      };

      const buildFromMode = (dynamicSlides) => {
        const favoritesPool = uniqueSlides(shuffle(FAVORITES));
        const dynamicPool = uniqueSlides(dynamicSlides);
        const selected = [];

        const pickFavorite = () => takeFromPool(favoritesPool);
        const pickDynamic = () => takeFromPool(dynamicPool);

        const pickFavoriteByCategory = (slot) =>
          takeFromPool(favoritesPool, (slide) => categoryMatch(slide, slot));
        const pickDynamicByCategory = (slot) =>
          takeFromPool(dynamicPool, (slide) => categoryMatch(slide, slot));

        const pickForSlot = (slotRaw) => {
          const slot = normalizeCategory(slotRaw);
          if (slot === 'favorite') return pickFavorite() || pickDynamic();
          if (slot === 'dynamic') return pickDynamic() || pickFavorite();

          if (sourceMode === 'favorites') {
            return pickFavoriteByCategory(slot) || pickFavorite();
          }
          if (sourceMode === 'dynamic') {
            return pickDynamicByCategory(slot) || pickDynamic();
          }

          return (
            pickFavoriteByCategory(slot) ||
            pickDynamicByCategory(slot) ||
            pickDynamic() ||
            pickFavorite()
          );
        };

        if (slidePlan.length) {
          slidePlan.forEach((slot) => {
            if (selected.length >= maxSlides) return;
            const slide = pickForSlot(slot);
            if (slide) selected.push(slide);
          });
        }

        while (selected.length < maxSlides) {
          let next = null;
          if (sourceMode === 'favorites') {
            next = pickFavorite();
          } else if (sourceMode === 'dynamic') {
            next = pickDynamic();
          } else {
            next = pickDynamic() || pickFavorite();
          }
          if (!next) break;
          selected.push(next);
        }

        return selected.slice(0, maxSlides);
      };

      const init = async () => {
        try {
          let dynamicSlides = [];
          if (sourceMode !== 'favorites') {
            const res = await fetch(manifestUrl, { mode: 'cors' });
            if (res.ok) {
              const data = await res.json();
              const items = Array.isArray(data?.items) ? data.items : [];
              dynamicSlides = items
                .slice()
                .sort((a, b) => String(dateValue(b)).localeCompare(String(dateValue(a))))
                .map(toDynamicSlide)
                .filter(Boolean);
            }
          }

          const slides = buildFromMode(dynamicSlides);
          if (!slides.length) {
            renderSlides(shuffle(FAVORITES).slice(0, Math.min(maxSlides, FAVORITES.length)));
            return;
          }

          renderSlides(slides);
        } catch (error) {
          renderSlides(shuffle(FAVORITES).slice(0, Math.min(maxSlides, FAVORITES.length)));
        }
      };

      init();
    })();
  </script>
</div>
