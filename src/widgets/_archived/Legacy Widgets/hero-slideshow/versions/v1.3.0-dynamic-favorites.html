<!-- McCal Hero Carousel v1.3.0 (Dynamic + Favorites Hybrid) -->
<div
  id="mcc-hero"
  class="mcc-hero-widget"
  data-widget-version="1.3.0-dynamic-favorites"
  data-mcc-hero-root
  data-source-mode="hybrid"
  data-max-slides="6"
  data-slide-duration="8"
  data-manifest-url="https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/src/images/Portfolios/featured-manifest.json"
  data-slide-plan="favorite,favorite,dynamic,dynamic,dynamic,dynamic"
>
  <!-- site-widgets:inline:start -->
  <style data-site-widgets-inline>
    :root {
      --mcc-accent: #b8b0aa;
      --mcc-accent-strong: #cac2ba;
      --mcc-bg: #050506;
      --mcc-fg: #cac2ba;
      --mcc-line: #2a2a2a;
      --mcc-muted: #5b5553;
      --bg: var(--mcc-bg);
      --fg: var(--mcc-fg);
      --line: var(--mcc-line);
      --accent: var(--mcc-accent);
      --muted: var(--mcc-muted);
      --chip: #1b1b1b;
      --focus: #7dd3fc;
      --link: var(--mcc-accent-strong);
      --panel-bg: rgba(48, 44, 44, 0.85);
      --panel-border: rgba(184, 176, 170, 0.2);
      --panel-blur: 12px;
      --mcc-gradient-business: linear-gradient(135deg, #cac2ba 0%, #b8b0aa 100%);
      --mcc-gradient-dark: linear-gradient(135deg, #363230 0%, #272423 100%);
      --mcc-space-1: 4px;
      --mcc-space-2: 8px;
      --mcc-space-3: 12px;
      --mcc-space-4: 16px;
      --mcc-space-5: 24px;
      --mcc-space-6: 32px;
      --mcc-radius: 10px;
      --mcc-control-height: 40px;
      --mcc-z-top: 2147483647;
    }
    [data-theme='light'] {
      --fg: #0a0a0a;
      --bg: #ffffff;
      --line: #e5e5e5;
      --panel-bg: rgba(255, 255, 255, 0.82);
      --panel-border: rgba(0, 0, 0, 0.08);
      --panel-blur: 8px;
      --chip: #fafafa;
      --focus: #0ea5e9;
      --link: var(--accent);
    }
    [data-theme='dark'] {

      --bg: #050506;
      --line: #2a2a2a;
      --panel-bg: rgba(30, 30, 30, 0.85);
      --panel-border: rgba(184, 176, 170, 0.15);
      --panel-blur: 10px;
      --chip: #1a1a1b;
      --focus: #b8b0aa;
      --link: #ffffff;
    }
    [class^='mcc-'],
    [class*=' mcc-'] {
      box-sizing: border-box;
      font-family:
        Inter,
        'Segoe UI',
        system-ui,
        -apple-system,
        'Helvetica Neue',
        Arial,
        sans-serif;
      color: var(--fg);
    }
    [class^='mcc-'] a:focus-visible,
    [class^='mcc-'] button:focus-visible,
    [class*=' mcc-'] a:focus-visible,
    [class*=' mcc-'] button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
      border-radius: 6px;

    .mcc-sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
  <!-- site-widgets:inline:end -->

  <style>
    :root {
      --mcc-nav-height: 0px;
    }

    .mcc-hero-widget,
    .mcc-hero-widget * {
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
    }

    .mcc-hero-widget {
      display: block;
      width: 100%;
      color: #f5f5f5;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    .mcc-hero-shell {
      position: relative;
      width: 100vw;
      left: 50%;
      transform: translateX(-50%);
      color: inherit;
      overflow: hidden;
      background: transparent;
    }

    :root[data-mcc-nav='active'] .mcc-hero-shell {
      margin-top: calc(-1 * var(--mcc-nav-height, 0px));
    }

    .mcc-hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .mcc-hero__stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: inherit;
    }

    .mcc-hero__slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.04);
      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
      animation: mcc-hero-cycle var(--mcc-hero-cycle-duration, 48s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      animation-fill-mode: both;
    }

    .mcc-hero__slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mcc-hero__slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(4, 4, 12, 0.6) 70%,
        rgba(5, 5, 10, 0.92) 100%
      );
    }

    .mcc-hero__caption {
      position: absolute;
      left: 50%;
      bottom: clamp(42px, 9vw, 128px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      z-index: 2;
      width: min(92vw, 960px);
    }

    .mcc-hero__slide h2 {
      margin: 0;
      font-family: 'Libre Baskerville', 'Georgia', serif;
      font-size: clamp(1.55rem, 3.6vw, 2.85rem);
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.02em;
    }

    .mcc-hero__meta {
      color: rgba(255, 255, 255, 0.85);
      font-size: clamp(0.78rem, 1.4vw, 0.92rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: -4px 0 0;
      text-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    .mcc-hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2.6rem;
      border-radius: 999px;
      background: rgba(10, 10, 14, 0.88);
      color: #f8f8f8;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
    }

    .mcc-hero__cta:hover,
    .mcc-hero__cta:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.95);
      color: #0a0a0f;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.4);
      outline: none;
    }

    @keyframes mcc-hero-cycle {
      0% {
        opacity: 0;
        transform: scale(1.04);
      }
      4% {
        opacity: 1;
        transform: scale(1);
      }
      16% {
        opacity: 1;
        transform: scale(1);
      }
      20% {
        opacity: 0;
        transform: scale(1.02);
      }
      100% {
        opacity: 0;
        transform: scale(1.02);
      }
    }

    @media (max-width: 768px) {
      .mcc-hero__caption {
        bottom: clamp(32px, 12vw, 88px);
        gap: 14px;
      }

      .mcc-hero__slide h2 {
        font-size: clamp(1.4rem, 6vw, 2.4rem);
      }

      .mcc-hero__cta {
        padding: 0.75rem 2.1rem;
      }
    }

    @media (max-width: 520px) {
      .mcc-hero__caption {
        bottom: clamp(28px, 14vw, 72px);
        gap: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mcc-hero__slide {
        animation: none;
        opacity: 0;
        transform: none;
      }
      .mcc-hero__slide:first-child {
        opacity: 1;
      }
      .mcc-hero__cta {
        transition: none;
      }
    }
  </style>

  <div class="mcc-hero-shell">
    <section class="mcc-hero" aria-label="Featured work carousel">
      <div class="mcc-hero__stage" data-mcc-hero-stage></div>
    </section>
  </div>

  <script>
    (function () {
      const root = document.querySelector('[data-mcc-hero-root]');
      if (!root) return;
      const stage = root.querySelector('[data-mcc-hero-stage]');
      if (!stage) return;

      const sourceMode = (root.getAttribute('data-source-mode') || 'hybrid').toLowerCase();
      const maxSlides = Math.max(1, parseInt(root.getAttribute('data-max-slides') || '6', 10));
      const slideDuration = Math.max(4, parseInt(root.getAttribute('data-slide-duration') || '8', 10));
      const manifestUrl =
        root.getAttribute('data-manifest-url') ||
        'https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/src/images/Portfolios/featured-manifest.json';
      const slidePlanRaw = root.getAttribute('data-slide-plan') || '';
      const slidePlan = slidePlanRaw
        .split(',')
        .map((s) => s.trim().toLowerCase())
        .filter(Boolean)
        .slice(0, maxSlides);

      const FAVORITES = [
        {
          title: 'Boyd Station',
          meta: 'Story Feature',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/f75a0ba5-795a-4b29-a86e-eb890ef944a3/6-9-25_Caleb+McCartney_134.jpg',
          href: '/boyd-station',
          cta: 'Explore Project',
          alt: 'A woman and child holding a sparkler at night in Kentucky.'
        },
        {
          title: 'Politics On Assignment',
          meta: 'Photojournalism',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/1757468682503-YXX6ILQYQ1CMH1OT66WD/141024_Kamala+Speaks+at+Erie_CAL3804+1+%281%29.jpg',
          href: '/journalism',
          cta: 'See Coverage',
          alt: 'Crowd at political event in Pennsylvania.'
        },
        {
          title: 'Concert Moments',
          meta: 'Concert',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/2aa375a0-a9b1-4965-9ae2-23e9660f7c3e/250829_Haven_CAL4401.jpg',
          href: '/concert',
          cta: 'View Performances',
          alt: 'Live musician performing under stage lights.'
        },
        {
          title: 'Corporate Events',
          meta: 'Events',
          image:
            'https://images.squarespace-cdn.com/content/v1/68c0d80717db343b721449f3/abf749ae-bd3d-45a0-9d6a-690a8cf0055d/230411_Cock+Tail+Hour+-+James+Bond+Event_876_Published.jpg',
          href: '/event',
          cta: 'Book Coverage',
          alt: 'Corporate event guests networking with drinks.'
        }
      ];

      const PAGE_MAP = {
        concert: { href: '/concert', cta: 'View Performances', meta: 'Concert' },
        events: { href: '/event', cta: 'Discover Events', meta: 'Events' },
        event: { href: '/event', cta: 'Discover Events', meta: 'Events' },
        journalism: { href: '/journalism', cta: 'View Gallery', meta: 'Photojournalism' },
        photojournalism: { href: '/journalism', cta: 'View Gallery', meta: 'Photojournalism' },
        nature: { href: '/nature', cta: 'View Nature', meta: 'Nature' },
        portrait: { href: '/portraits', cta: 'View Portraits', meta: 'Portraits' },
        portraits: { href: '/portraits', cta: 'View Portraits', meta: 'Portraits' },
        featured: { href: '/featured', cta: 'Explore Featured', meta: 'Featured' }
      };

      const toTypeKey = (value) => String(value || '').trim().toLowerCase();

      const shuffle = (arr) => {
        const out = [...arr];
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      };

      const slideKey = (slide) =>
        [String(slide?.title || '').toLowerCase(), String(slide?.href || '').toLowerCase(), String(slide?.image || '')].join('|');

      const uniqueSlides = (slides) => {
        const seen = new Set();
        const out = [];
        (Array.isArray(slides) ? slides : []).forEach((slide) => {
          if (!slide || !slide.image) return;
          const key = slideKey(slide);
          if (seen.has(key)) return;
          seen.add(key);
          out.push(slide);
        });
        return out;
      };

      const dateValue = (item) =>
        item?.date?.iso || item?.dateISO || item?.concertDate?.iso || item?.generated || '';

      const pickImagePath = (item) => {
        if (!item) return '';

        if (typeof item.coverImage === 'string' && item.coverImage) {
          if (/^https?:\/\//i.test(item.coverImage)) return item.coverImage;
          if (item.relativeFolderPath) {
            return `src/images/Portfolios/${item.relativeFolderPath}/${item.coverImage}`;
          }
          if (item.folderPath) {
            return `src/images/Portfolios/${item.folderPath}/${item.coverImage}`;
          }
          return item.coverImage;
        }

        if (item.coverImage && typeof item.coverImage.path === 'string') {
          return item.coverImage.path;
        }

        const firstImage = Array.isArray(item.images) ? item.images[0] : '';
        if (typeof firstImage === 'string') {
          if (/^https?:\/\//i.test(firstImage)) return firstImage;
          if (item.relativeFolderPath) {
            return `src/images/Portfolios/${item.relativeFolderPath}/${firstImage}`;
          }
          if (item.folderPath) {
            return `src/images/Portfolios/${item.folderPath}/${firstImage}`;
          }
          return firstImage;
        }
        if (firstImage && typeof firstImage.path === 'string') return firstImage.path;

        return '';
      };

      const toAbsoluteImageUrl = (path) => {
        if (!path) return '';
        if (/^https?:\/\//i.test(path)) return path;
        const clean = String(path).replace(/^\/+/, '');
        return `https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/${encodeURI(clean)}`;
      };

      const toDynamicSlide = (item) => {
        const typeKey = toTypeKey(item?.type);
        const map = PAGE_MAP[typeKey] || PAGE_MAP.featured;
        const title = item?.title || item?.name || item?.eventName || item?.bandName || 'Featured Work';
        const imagePath = pickImagePath(item);
        const image = toAbsoluteImageUrl(imagePath);
        if (!image) return null;

        return {
          title,
          meta: map.meta,
          image,
          href: map.href,
          cta: map.cta,
          alt: `${title} ${map.meta} photography`
        };
      };

      const renderSlides = (slides) => {
        const duration = slides.length * slideDuration;
        root.style.setProperty('--mcc-hero-cycle-duration', `${duration}s`);

        stage.innerHTML = slides
          .map(
            (slide, index) => `
              <figure class="mcc-hero__slide" style="--delay:${index * slideDuration}s">
                <img src="${slide.image}" alt="${slide.alt || slide.title}" loading="${
                  index === 0 ? 'eager' : 'lazy'
                }" ${index === 0 ? 'fetchpriority="high"' : ''} />
                <figcaption class="mcc-hero__caption">
                  <h2>${slide.title}</h2>
                  <p class="mcc-hero__meta">${slide.meta || ''}</p>
                  <a class="mcc-hero__cta" href="${slide.href}">${slide.cta || 'Explore'}</a>
                </figcaption>
              </figure>
            `
          )
          .join('');
      };

      const buildFromMode = (dynamicSlides) => {
        const favoritesPool = uniqueSlides(shuffle(FAVORITES));
        const dynamicPool = uniqueSlides(dynamicSlides);
        const selected = [];
        const selectedKeys = new Set();

        let favIdx = 0;
        let dynIdx = 0;

        const pushUnique = (slide) => {
          if (!slide) return false;
          const key = slideKey(slide);
          if (selectedKeys.has(key)) return false;
          selectedKeys.add(key);
          selected.push(slide);
          return true;
        };

        const pickNextUnique = (pool, idxRef) => {
          while (idxRef.value < pool.length) {
            const candidate = pool[idxRef.value];
            idxRef.value += 1;
            if (!candidate) continue;
            const key = slideKey(candidate);
            if (selectedKeys.has(key)) continue;
            return candidate;
          }
          return null;
        };

        const favRef = { value: 0 };
        const dynRef = { value: 0 };

        const pickFavorite = () => {
          if (!favoritesPool.length) return null;
          const slide = pickNextUnique(favoritesPool, favRef);
          favIdx = favRef.value;
          return slide;
        };

        const pickDynamic = () => {
          if (!dynamicPool.length) return null;
          const slide = pickNextUnique(dynamicPool, dynRef);
          dynIdx = dynRef.value;
          return slide;
        };

        if (slidePlan.length) {
          slidePlan.forEach((slot) => {
            if (selected.length >= maxSlides) return;
            const slide = slot === 'favorite' ? pickFavorite() : pickDynamic();
            pushUnique(slide);
          });
        }

        while (selected.length < maxSlides) {
          let next = null;
          if (sourceMode === 'favorites') {
            next = pickFavorite();
          } else if (sourceMode === 'dynamic') {
            next = pickDynamic();
          } else {
            next = selected.length < 2 ? pickFavorite() : pickDynamic();
            if (!next) next = pickFavorite();
          }
          if (!next) break;
          pushUnique(next);
        }

        return selected.slice(0, maxSlides);
      };

      const init = async () => {
        try {
          let dynamicSlides = [];
          if (sourceMode !== 'favorites') {
            const res = await fetch(manifestUrl, { mode: 'cors' });
            if (res.ok) {
              const data = await res.json();
              const items = Array.isArray(data?.items) ? data.items : [];
              dynamicSlides = items
                .slice()
                .sort((a, b) => String(dateValue(b)).localeCompare(String(dateValue(a))))
                .map(toDynamicSlide)
                .filter(Boolean);
            }
          }

          const slides = buildFromMode(dynamicSlides);
          if (!slides.length) {
            renderSlides(shuffle(FAVORITES).slice(0, Math.min(maxSlides, FAVORITES.length)));
            return;
          }

          renderSlides(slides);
        } catch (error) {
          renderSlides(shuffle(FAVORITES).slice(0, Math.min(maxSlides, FAVORITES.length)));
        }
      };

      init();
    })();
  </script>
</div>
