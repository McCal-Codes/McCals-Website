<style>
  /* Client Carousel Squarespace Styles v1.1.2 */
  .ss-client-showcase {
    max-width: 1000px;
    margin: 0 auto;
    padding: 30px 20px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  .ss-client-heading {
    font: 700 24px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f5f5f5;
    margin: 0 0 10px;
  }

  .ss-client-subtitle {
    font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #888;
    margin: 0 0 30px;
  }

  .ss-client-carousel {
    position: relative;
    overflow: hidden;
    padding: 15px 0;
  }

  .ss-client-track {
    display: flex;
    animation: ss-scroll 30s linear infinite;
    width: calc(200px * 20);
  }

  .ss-client-track:hover {
    animation-play-state: paused;
  }

  @keyframes ss-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(-200px * 10)); }
  }

  .ss-client-logo {
    flex: 0 0 180px;
    height: 110px;
    margin: 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
    border-radius: 12px;
    border: 1px solid #333;
    transition: all 0.3s ease;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }

  .ss-client-logo:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
    border-color: #444;
    background: linear-gradient(135deg, #2a2a2a 0%, #3a3a3a 100%);
  }

  .ss-client-logo img {
    max-width: 140px;
    max-height: 80px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: brightness(1.1) contrast(1.1);
    transition: all 0.3s ease;
  }

  .ss-client-logo:hover img {
    filter: brightness(1.3) contrast(1.2);
    transform: scale(1.05);
  }

  /* Text-based logo styles for better readability */
  .ss-client-text-logo {
    font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f5f5f5;
    text-align: center;
    padding: 0 10px;
    letter-spacing: 0.5px;
  }

  .ss-client-text-logo .company-name {
    display: block;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .ss-client-text-logo .company-tagline {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .ss-client-stats {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }

  .ss-stat-item {
    text-align: center;
  }

  .ss-stat-number {
    font: 700 20px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f5f5f5;
    display: block;
  }

  .ss-stat-label {
    font: 600 11px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .ss-client-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    font: 600 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f5f5f5;
    opacity: 0.7;
  }

  .ss-client-spinner {
    width: 20px;
    height: 20px;
    border: 2px solid #2a2a2a;
    border-top: 2px solid #ff4d6d;
    border-radius: 50%;
    animation: ss-spin 1s linear infinite;
    margin-right: 12px;
  }

  @keyframes ss-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .ss-client-logo {
      flex: 0 0 140px;
      height: 90px;
      margin: 0 6px;
    }
    .ss-client-logo img {
      max-width: 100px;
      max-height: 60px;
    }
    .ss-client-text-logo .company-name {
      font-size: 14px;
    }
    .ss-client-text-logo .company-tagline {
      font-size: 10px;
    }
    .ss-client-stats {
      gap: 20px;
    }
    .ss-stat-number {
      font-size: 18px;
    }
  }

  @media (max-width: 480px) {
    .ss-client-showcase {
      padding: 20px 10px;
    }
  }
</style>

  function createTextLogo(client) {
    const textLogo = document.createElement('div');
    textLogo.className = 'ss-client-text-logo';
    textLogo.innerHTML = `
      <span class="company-name">${client.textFallback.company}</span>
      <span class="company-tagline">${client.textFallback.tagline}</span>
    `;
    return textLogo;
  }

  function handleLogoError(logoElement, client) {
    // Replace with text-based logo on error
    logoElement.innerHTML = '';
    const textLogo = createTextLogo(client);
    logoElement.appendChild(textLogo);
  }

  function createClientCarousel() {
    const container = document.getElementById('ss-client-container');
    if (!container) return;

    const doubledClients = [...clientsData, ...clientsData];
    const carousel = document.createElement('div');
    carousel.className = 'ss-client-carousel';
    const track = document.createElement('div');
    track.className = 'ss-client-track';

    doubledClients.forEach(client => {
      const logoElement = document.createElement('div');
      logoElement.className = 'ss-client-logo';
      logoElement.setAttribute('title', `${client.name} - ${client.project}`);

      // Try loading image first
      const img = document.createElement('img');
      img.alt = `${client.name} logo`;
      img.loading = 'lazy';
      
      // Set up error handling before setting src
      img.onerror = () => handleLogoError(logoElement, client);
      
      // Add load event to ensure proper display
      img.onload = () => {
        // Image loaded successfully, keep as is
        img.style.opacity = '1';
      };
      
      img.src = client.logo;
      img.style.opacity = '0.9'; // Slightly transparent initially
      logoElement.appendChild(img);

      logoElement.addEventListener('click', () => {
        if (client.website) window.open(client.website, '_blank', 'noopener noreferrer');
      });

      track.appendChild(logoElement);
    });

    carousel.appendChild(track);
    container.className = 'ss-client-container';
    container.innerHTML = '';
    container.appendChild(carousel);
  }

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', createClientCarousel);
  } else {
    createClientCarousel();
  }
})();
</script>
