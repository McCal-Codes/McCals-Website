<!DOCTYPE html>
<html>
<head>
    <title>Complete Widget Debug & Error Reporter</title>
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 20px; 
            background: #0d1117; 
            color: #f0f6fc; 
            line-height: 1.4;
        }
        
        .header {
            background: linear-gradient(135deg, #1f6feb 0%, #8b5cf6 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 0 10px;
            font-family: inherit;
        }
        
        .btn:hover { background: #2ea043; }
        .btn-copy { background: #1f6feb; }
        .btn-copy:hover { background: #388bfd; }
        .btn-clear { background: #da3633; }
        .btn-clear:hover { background: #f85149; }
        
        .section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .section-header {
            background: #21262d;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-content, .console-output {
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }
        
        .console-output {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        
        .log-entry, .console-entry {
            margin: 4px 0;
            padding: 6px 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .log-info { background: #0d419d20; border-left: 3px solid #1f6feb; }
        .log-success { background: #0f5b2820; border-left: 3px solid #238636; }
        .log-warning { background: #7d4e0020; border-left: 3px solid #d1942b; }
        .log-error { background: #8b120220; border-left: 3px solid #da3633; }
        
        .console-entry { margin: 2px 0; padding: 2px 0; }
        .console-error { color: #f85149; }
        .console-warn { color: #d29922; }
        .console-log { color: #7d8590; }
        
        .summary {
            background: #21262d;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .metric {
            text-align: center;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #1f6feb;
        }
        
        .metric-label {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .widget-preview {
            border: 2px solid #30363d;
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .widget-preview iframe {
            width: 100%;
            height: 600px;
            border: none;
            background: #0d1117;
        }
        

    </style>
</head>
<body>
    <div class="header">
        <h1>🛠️ Complete Widget Debug & Error Reporter</h1>
        <p>Comprehensive testing tool with copy/paste error reporting</p>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="runAllTests()">🚀 Run All Tests</button>
        <button class="btn btn-copy" onclick="copyAllResults()">📋 Copy All Results</button>
        <button class="btn btn-clear" onclick="clearAllLogs()">🗑️ Clear Logs</button>
    </div>
    
    <div class="summary">
        <div class="metric">
            <div class="metric-value" id="total-items">-</div>
            <div class="metric-label">Total Items</div>
        </div>
        <div class="metric">
            <div class="metric-value" id="loaded-portfolios">-</div>
            <div class="metric-label">Loaded Portfolios</div>
        </div>
        <div class="metric">
            <div class="metric-value" id="errors-count">-</div>
            <div class="metric-label">Errors</div>
        </div>
        <div class="metric">
            <div class="metric-value" id="test-status">-</div>
            <div class="metric-label">Status</div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">
            <span>� Test Results & Debug Output</span>
            <button class="btn btn-copy" onclick="copySection('combined-log')">Copy</button>
        </div>
        <div class="section-content" id="combined-log"></div>
    </div>
    
    <div class="widget-preview">
        <div class="section-header">
            <span>🎨 Live Widget Preview</span>
            <button class="btn btn-copy" onclick="refreshWidget()">Refresh</button>
        </div>
        <iframe id="widget-frame" src="../versions/v1.5.html"></iframe>
    </div>

    <script>
        let testResults = {
            totalItems: 0,
            loadedPortfolios: 0,
            errorsCount: 0,
            allErrors: []
        };
        
        // Console capture
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };
        
        function setupConsoleCapture() {
            console.log = (...args) => {
                originalConsole.log(...args);
                addConsoleEntry('log', args);
            };
            console.error = (...args) => {
                originalConsole.error(...args);
                addConsoleEntry('error', args);
                testResults.errorsCount++;
                testResults.allErrors.push(`[ERROR] ${args.join(' ')}`);
            };
            console.warn = (...args) => {
                originalConsole.warn(...args);
                addConsoleEntry('warn', args);
            };
        }
        
        function addEntry(level, message, source = 'console') {
            const container = document.getElementById('combined-log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${level === 'error' || level === 'warn' ? level : 'info'}`;
            
            const timestamp = new Date().toLocaleTimeString();
            const formattedMessage = typeof message === 'object' ? JSON.stringify(message, null, 2) : String(message);
            entry.innerHTML = `<strong>[${timestamp}] [${source.toUpperCase()}]</strong> ${formattedMessage}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            if (level === 'error') {
                testResults.errorsCount++;
                testResults.allErrors.push(`[${source}] ${formattedMessage}`);
            }
        }
        
        function addConsoleEntry(level, args) {
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            addEntry(level, message, 'console');
        }
        
        function log(source, message, type = 'info') {
            addEntry(type, message, source);
        }
        
        function updateMetric(id, value) {
            document.getElementById(id).textContent = value;
        }
        
        async function testManifestLoading() {
            log('manifest', '🔍 Starting manifest loading test...', 'info');
            
            const portfolioTypes = [
                { name: 'concert', folder: 'Concert', manifestName: 'concert-manifest.json', maxItems: 5, arrayKey: 'bands' },
                { name: 'events', folder: 'Events', manifestName: 'events-manifest.json', maxItems: 3, arrayKey: 'items' }, 
                { name: 'journalism', folder: 'Journalism', manifestName: 'journalism-manifest.json', maxItems: 3, arrayKey: 'events' }
            ];
            
            const allItems = [];
            const seenItems = new Set();
            let loadedPortfolios = 0;
            
            for (const type of portfolioTypes) {
                try {
                    const cacheBuster = `?t=${Date.now()}`;
                    const manifestUrl = `src/images/Portfolios/${type.folder}/${type.manifestName}${cacheBuster}`;
                    log('manifest', `Loading ${type.name}: ${manifestUrl}`, 'info');
                    
                    const response = await fetch(manifestUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    
                    const manifest = await response.json();
                    const sourceArray = manifest[type.arrayKey] || [];
                    
                    log('manifest', `✅ Found ${sourceArray.length} items in ${type.name}`, 'success');
                    
                    let addedCount = 0;
                    for (const item of sourceArray) {
                        if (addedCount >= type.maxItems) break;
                        
                        const itemKey = `${item.folderPath || ''}|${item.title || item.bandName || item.eventName || ''}`;
                        if (!seenItems.has(itemKey)) {
                            seenItems.add(itemKey);
                            allItems.push({
                                ...item,
                                portfolioSource: type.name,
                                type: type.folder,
                                title: item.title || item.bandName || item.eventName
                            });
                            addedCount++;
                        }
                    }
                    
                    if (addedCount > 0) {
                        loadedPortfolios++;
                        log('manifest', `✅ Added ${addedCount} unique items from ${type.name}`, 'success');
                    }
                    
                } catch (error) {
                    log('manifest', `❌ Failed to load ${type.name}: ${error.message}`, 'error');
                }
            }
            
            testResults.totalItems = allItems.length;
            testResults.loadedPortfolios = loadedPortfolios;
            
            log('manifest', `🎯 Final: ${allItems.length} items from ${loadedPortfolios} portfolios`, 
                allItems.length > 0 ? 'success' : 'error');
            
            return allItems;
        }
        
        async function testPathConstruction(items) {
            if (!items?.length) {
                log('path', '❌ No items to test', 'error');
                return;
            }
            
            log('path', '🛤️ Testing path construction...', 'info');
            
            for (let i = 0; i < Math.min(items.length, 3); i++) {
                const item = items[i];
                const title = item.title || 'Untitled';
                
                log('path', `\\n--- Item ${i + 1}: ${title} ---`, 'info');
                log('path', `Type: ${item.type}, FolderPath: "${item.folderPath}", Images: ${item.images?.length || 0}`, 'info');
                
                const testImage = item.images?.[0];
                if (testImage && item.folderPath) {
                    const imageUrl = `src/images/Portfolios/${item.folderPath}/${testImage}`;
                    log('path', `URL: ${imageUrl}`, 'info');
                    
                    try {
                        const response = await fetch(imageUrl, { method: 'HEAD' });
                        log('path', response.ok ? `✅ Accessible (${response.status})` : `⚠️ HTTP ${response.status}`, 
                            response.ok ? 'success' : 'warning');
                    } catch (error) {
                        log('path', `❌ Not accessible: ${error.message}`, 'error');
                    }
                } else {
                    log('path', '❌ Missing image or folderPath', 'error');
                }
            }
        }
        
        async function testUrlValidation() {
            log('url', '🔗 Testing manifest URLs...', 'info');
            
            const testUrls = [
                'Concert/concert-manifest.json',
                'Events/events-manifest.json',
                'Journalism/journalism-manifest.json'
            ];
            
            for (const url of testUrls) {
                const fullUrl = `src/images/Portfolios/${url}?t=${Date.now()}`;
                try {
                    const response = await fetch(fullUrl, { method: 'HEAD' });
                    log('url', `${url} → ${response.ok ? '✅' : '❌'} HTTP ${response.status}`, 
                        response.ok ? 'success' : 'error');
                } catch (error) {
                    log('url', `${url} → ❌ ${error.message}`, 'error');
                }
            }
        }
        
        async function runAllTests() {
            // Clear previous results
            clearAllLogs();
            testResults = { totalItems: 0, loadedPortfolios: 0, errorsCount: 0, allErrors: [] };
            
            updateMetric('test-status', 'Running...');
            
            try {
                // Run all tests
                const items = await testManifestLoading();
                await testPathConstruction(items);
                await testUrlValidation();
                
                // Update metrics
                updateMetric('total-items', testResults.totalItems);
                updateMetric('loaded-portfolios', testResults.loadedPortfolios);
                updateMetric('errors-count', testResults.errorsCount);
                updateMetric('test-status', testResults.errorsCount === 0 ? '✅ Pass' : '❌ Fail');
                
                log('complete', '🎉 All tests completed!', 'success');
                
            } catch (error) {
                log('complete', `❌ Test suite failed: ${error.message}`, 'error');
                updateMetric('test-status', '❌ Failed');
            }
        }
        
        function clearAllLogs() {
            document.getElementById('combined-log').innerHTML = '';
        }
        
        function copySection(sectionId) {
            const container = document.getElementById(sectionId);
            navigator.clipboard.writeText(container.innerText).then(() => {
                const btn = container.parentElement.querySelector('.btn-copy');
                const original = btn.textContent;
                btn.textContent = 'Copied!';
                btn.style.background = '#238636';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.style.background = '#1f6feb';
                }, 2000);
            });
        }
        
        function copyAllResults() {
            const timestamp = new Date().toISOString();
            const location = window.location.href;
            
            const summary = `=== WIDGET DEBUG REPORT ===
Generated: ${timestamp}
Location: ${location}
Total Items: ${testResults.totalItems}
Loaded Portfolios: ${testResults.loadedPortfolios}
Errors: ${testResults.errorsCount}
Status: ${document.getElementById('test-status').textContent}

=== COMPLETE TEST OUTPUT ===
${document.getElementById('combined-log').innerText}

=== ERROR SUMMARY ===
${testResults.allErrors.length > 0 ? testResults.allErrors.join('\\n') : 'No errors detected'}

=== END OF REPORT ===`;
            
            navigator.clipboard.writeText(summary).then(() => {
                alert('Complete debug report copied to clipboard!');
            });
        }
        
        function refreshWidget() {
            document.getElementById('widget-frame').src = document.getElementById('widget-frame').src;
        }
        
        // Initialize
        setupConsoleCapture();
        
        // Clear any cached data on load
        function clearBrowserCache() {
            // Clear localStorage
            Object.keys(localStorage).forEach(key => {
                if (key.includes('featured') || key.includes('manifest')) {
                    localStorage.removeItem(key);
                }
            });
            
            // Clear sessionStorage  
            Object.keys(sessionStorage).forEach(key => {
                if (key.includes('featured') || key.includes('manifest')) {
                    sessionStorage.removeItem(key);
                }
            });
            
            log('cache', 'Browser cache cleared');
        }
        
        // Auto-run tests on load
        window.addEventListener('load', () => {
            clearBrowserCache();
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
</html>
