<!--
  Example: Non-destructive jsDelivr-powered widget embed

  Place this snippet where you'd normally drop the widget's HTML in Squarespace Code Block.
  - The loader will fetch the widget HTML from jsDelivr (GitHub) and inject it into the container.
  - If the CDN fetch fails, the loader can fall back to a local copy (useful for testing or previewing).

  Replace the attributes below for your widget:
    data-repo: owner/repo on GitHub (e.g., McCal-Codes/McCals-Website)
    data-path: path to the widget file inside the repo (e.g., src/widgets/my-widget/versions/v1.2.0.html)
    data-version: optional tag/commit to pin the version (recommended)
    data-fallback: optional local URL to fall back to (e.g., /src/widgets/my-widget/versions/v1.2.0.html)

  Loader script can be hosted locally (in repo) or loaded from jsDelivr once this repo is published.
-->

<div class="mccal-widget" data-repo="McCal-Codes/McCals-Website" data-path="src/widgets/example-widget/versions/v1.0.0-example-widget.html" data-version="v1.0.0" data-fallback="/src/widgets/example-widget/versions/v1.0.0-example-widget.html">
  <!-- fallback/preview content: keep a small static placeholder so the page is usable before loader runs -->
  <style>
    .mccal-widget-placeholder { padding: 12px; background:#f6f6f6; border:1px solid #eee; color:#333; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
  </style>
  <div class="mccal-widget-placeholder">Loading widget… (will be replaced by jsDelivr content)</div>
</div>

<!-- Include the loader. For local testing use the local path; replace with jsDelivr URL when ready. -->
<!-- Local loader -->
<script src="/src/widgets/cdn/jsdelivr-loader.js" async></script>

<!-- Example CDN loader (pin to a version or branch):
<script src="https://cdn.jsdelivr.net/gh/McCal-Codes/McCals-Website@main/src/widgets/cdn/jsdelivr-loader.js" async></script>
-->
