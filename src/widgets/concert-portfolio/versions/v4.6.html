<!-- Resource hints for performance -->
<link rel="preconnect" href="https://raw.githubusercontent.com">

  <h2 class="concert-heading">Concert Portfolio</h2>
  <div class="concert-loading" id="concertLoading">

    Loading concerts...
  </div>
  <div class="concert-grid" id="concertGrid"></div>

    <div class="cl-gallery" id="clGallery"></div>
    <div class="cl-caption" style="display:none">

    </div>

<!-- Core JavaScript - Optimized for performance -->
<script>
// Performance-optimized core functionality
(function(){
  'use strict';

  // Configuration
  const CONFIG = {
    panes: 24,
    cacheDuration: 10 * 60 * 1000, // 10 minutes
    autoRefreshInterval: 15 * 60 * 1000, // 15 minutes
    basePaths: ['src/images/Portfolios/Concert/'],
    github: { owner: 'McCal-Codes', repo: 'McCals-Website', branch: 'main' }
  };

  // DOM references
  const grid = document.getElementById('concertGrid');
  const loading = document.getElementById('concertLoading');
  const portfolio = document.getElementById('concertPf');

  // State management
  let state = {
    manifest: null,
    basePath: CONFIG.basePaths[0],
    cacheKey: 'concert-manifest-v4.6',
    isVisible: true,
    timers: { autoRefresh: null, nextRefresh: null }
  };

  // Utility functions
  const log = (DEBUG ? console.log.bind(console, '[Concert v4.6]') : () => {});
  const shuffle = arr => arr.slice().sort(() => Math.random() - 0.5);

  // Cache management
  const cache = {
    get: () => {
      try {
        const data = JSON.parse(localStorage.getItem(state.cacheKey));
        return data && Date.now() - data.timestamp < CONFIG.cacheDuration ? data : null;
      } catch { return null; }
    },
    set: data => {
      try {
        localStorage.setItem(state.cacheKey, JSON.stringify({ ...data, timestamp: Date.now() }));
      } catch (e) { log('Cache write failed:', e.message); }
    }
  };

  // GitHub URL builders
  const buildUrls = {
    manifest: basePath => `https://raw.githubusercontent.com/${CONFIG.github.owner}/${CONFIG.github.repo}/${CONFIG.github.branch}/${basePath}concert-manifest.json`,
    image: (basePath, parts, filename) => `https://raw.githubusercontent.com/${CONFIG.github.owner}/${CONFIG.github.repo}/${CONFIG.github.branch}/${basePath}${parts.concat(filename).map(encodeURIComponent).join('/')}`
  };

  // Enhanced alt text generation
  const generateAltText = (slot, imageName = '') => {
    const base = `${slot.title} live concert photography`;
    return imageName ? `${base} - ${imageName.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ')}` : `${base}, ${slot.dateDisplay}`;
  };

  // SEO structured data
  const addStructuredData = manifest => {
    const totalImages = manifest.bands?.reduce((sum, band) => sum + (band.totalImages || band.images?.length || 0), 0) || 0;
    const sampleImages = manifest.bands?.slice(0, 3).flatMap(band =>
      band.images?.slice(0, 2).map(img =>
        buildUrls.image(state.basePath, band.folderPath.split('/').filter(Boolean), img)
      ) || []
    ).slice(0, 5) || [];

    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Concert Photography Portfolio",
      "description": "Professional concert photography portfolio featuring live music performances",
      "url": window.location.href,
      "image": sampleImages,
      "author": { "@type": "Person", "name": "Caleb McCartney", "jobTitle": "Concert Photographer", "url": "https://mccalmedia.com" },
      "datePublished": manifest.generated ? new Date(manifest.generated).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
      "numberOfItems": totalImages,
      "genre": "Music Photography"
    });
    document.head.appendChild(script);
    log('Structured data added for', totalImages, 'images');
  };

  // Manifest loading with fallback
  const loadManifest = async (force = false) => {
    if (!force) {
      const cached = cache.get();
      if (cached) {
        state.basePath = cached.basePath;
        return cached.manifest;
      }
    }

    for (const basePath of CONFIG.basePaths) {
      try {
        const response = await fetch(buildUrls.manifest(basePath), { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const manifest = await response.json();
        state.basePath = basePath;
        cache.set({ manifest, basePath });
        log('Manifest loaded from', basePath);
        return manifest;
      } catch (error) {
        log(`Failed to load from ${basePath}:`, error.message);
      }
    }
    throw new Error('Failed to load manifest from all sources');
  };

  // Build portfolio grid
  const buildGrid = async () => {
    try {
      log('Starting buildGrid...');
      loading.style.display = 'flex';
      grid.style.display = 'none';

      const manifest = await loadManifest();
      log('Manifest loaded:', manifest);
      if (!manifest?.bands?.length) throw new Error('No concert data available');

      // Add structured data for SEO
      addStructuredData(manifest);

      // Create image pools
      const pools = manifest.bands.map(band => ({
        dir: band.folderPath,
        parts: band.folderPath.split('/').filter(Boolean),
        title: band.bandName,
        dateDisplay: band.dateDisplay,
        date: band.dateISO || band.dateDisplay,
        venue: band.venue,
        images: shuffle(band.images.slice()),
        allImages: band.images.slice()
      }));

      // Round-robin allocation
      const slots = [];
      let hasImages = true;
      while (slots.length < CONFIG.panes && hasImages) {
        hasImages = false;
        for (const pool of pools) {
          if (slots.length >= CONFIG.panes) break;
          const image = pool.images.shift();
          if (image) {
            slots.push({
              dir: pool.dir,
              parts: pool.parts,
              title: pool.title,
              dateDisplay: pool.dateDisplay,
              date: pool.date,
              venue: pool.venue,
              thumb: image,
              allImages: pool.allImages
            });
            hasImages = true;
          }
        }
      }

      // Render cards
      const fragment = document.createDocumentFragment();
      slots.forEach((slot, index) => {
        const card = document.createElement('article');
        card.className = 'concert-card loading';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `View ${slot.title} concert photos from ${slot.dateDisplay}`);

        const img = document.createElement('img');
        img.loading = index < 3 ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.alt = generateAltText(slot);
        img.setAttribute('fetchpriority', index === 0 ? 'high' : 'auto');
        img.width = 400;
        img.height = 300;
        const imageUrl = buildUrls.image(state.basePath, slot.parts, slot.thumb);
        log('Image URL for', slot.title, ':', imageUrl);
        img.src = imageUrl;

        img.onload = () => {
          card.classList.remove('loading');
          card.classList.add('loaded');
        };

        const info = document.createElement('div');
        info.className = 'concert-info';
        info.innerHTML = `<h3 class="concert-title">${slot.title}</h3><p class="concert-meta">${slot.dateDisplay}</p>`;

        card.append(img, info);
        card.dataset.slot = JSON.stringify(slot);
        fragment.appendChild(card);
      });

      grid.innerHTML = '';
      grid.appendChild(fragment);

      loading.style.display = 'none';
      grid.style.display = 'block';
      grid.classList.add('loaded');

      log(`Rendered ${slots.length} concert cards`);

    } catch (error) {
      console.error('Failed to build concert portfolio:', error);
      loading.innerHTML = `
        <div style="text-align: center; color: #ff6b6b;">
          <p>Failed to load concert portfolio</p>
          <button onclick="location.reload()" style="background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 8px;">Retry</button>
        </div>
      `;
    }
  };

  // Lightbox functionality (lazy-loaded)
  const initLightbox = () => {
    const lightbox = document.getElementById('concertLightbox');
    if (!lightbox) return;

    // Load lightbox styles and scripts dynamically
    if (!document.getElementById('lightbox-styles')) {
      const style = document.createElement('style');
      style.id = 'lightbox-styles';
      style.textContent = `
        .concert-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:2147483647;align-items:center;justify-content:center}
        .concert-lightbox.is-open{display:flex}
        .cl-dialog{max-width:90vw;max-height:90vh;position:relative}
        .cl-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;max-height:80vh}
        .cl-gallery img{max-height:70vh;object-fit:contain;display:block;margin:0 auto;flex-shrink:0;scroll-snap-align:center}
        .cl-close{position:fixed;top:20px;right:20px;background:rgba(0,0,0,.7);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:50%;width:44px;height:44px;font:800 18px ui-sans-serif,system-ui;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2147483648}
        .cl-caption{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:12px 16px;border-radius:8px;text-align:center;max-width:80vw}
        .cl-title{margin:0 0 4px;font:800 18px/1.2 ui-sans-serif,system-ui}
        .cl-meta{margin:0;font:600 14px/1.3 ui-sans-serif,system-ui;color:#cfcfcf}
        html.lb-open body{overflow:hidden}
        html.lb-open .concert-portfolio{pointer-events:none}
      `;
      document.head.appendChild(style);
    }

    // Lightbox event handlers
    const closeBtn = lightbox.querySelector('.cl-close');
    const gallery = lightbox.querySelector('.cl-gallery');
    const title = lightbox.querySelector('.cl-title');
    const meta = lightbox.querySelector('.cl-meta');
    const caption = lightbox.querySelector('.cl-caption');

    const openLightbox = (card, images, slot) => {
      gallery.innerHTML = '';
      images.forEach((imgName, index) => {
        const img = document.createElement('img');
        img.loading = index < 3 ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.alt = generateAltText(slot, imgName);
        img.src = buildUrls.image(state.basePath, card.dataset.dir.split('/').filter(Boolean), imgName);
        gallery.appendChild(img);
      });

      title.textContent = slot.title;
      meta.textContent = `${slot.dateDisplay} • ${images.length} photos`;
      caption.style.display = 'block';
      closeBtn.style.display = 'flex';

      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.documentElement.classList.add('lb-open');
      document.body.style.overflow = 'hidden';
      lightbox.focus();
    };

    const closeLightbox = () => {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.documentElement.classList.remove('lb-open');
      document.body.style.overflow = '';
    };

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    // Card click handlers
    grid.addEventListener('click', e => {
      const card = e.target.closest('.concert-card');
      if (card) {
        const slot = JSON.parse(card.dataset.slot);
        openLightbox(card, slot.allImages, slot);
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && lightbox.classList.contains('is-open')) {
        closeLightbox();
      }
    });
  };

  // Auto-refresh functionality
  const initAutoRefresh = () => {
    const refresh = () => {
      if (state.isVisible) {
        log('Auto-refreshing portfolio...');
        buildGrid();
      }
    };

    state.timers.autoRefresh = setInterval(refresh, CONFIG.autoRefreshInterval);

    // Visibility detection
    document.addEventListener('visibilitychange', () => {
      state.isVisible = !document.hidden;
      if (state.isVisible && document.hidden) {
        // Tab became visible after being hidden
        const hiddenTime = Date.now() - performance.now();
        if (hiddenTime > CONFIG.autoRefreshInterval) {
          refresh();
        }
      }
    });
  };

  // Load non-critical styles and features
  const loadDeferredFeatures = () => {
    // Load additional styles for enhanced features
    if ('requestIdleCallback' in window) {
      requestIdleCallback(() => {
        // Load debug features if needed
        if (window.location.search.includes('debug')) {
          import('./debug-features.js').catch(() => log('Debug features not available'));
        }
      });
    }
  };

  // Initialize
  const init = async () => {
    try {
      await buildGrid();
      initLightbox();
      initAutoRefresh();
      loadDeferredFeatures();
    } catch (error) {
      console.error('Failed to initialize concert portfolio:', error);
    }
  };

  // Start the application
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Cleanup on page unload
  window.addEventListener('beforeunload', () => {
    Object.values(state.timers).forEach(timer => timer && clearInterval(timer));
  });

})();
</script></content>
