<style>
  :root {

  .mcc-nav__link a:hover, .mcc-nav__link a:focus-visible { color: var(--mcc-nav-text-color); outline: none; }

  .mcc-nav__toggle {
    display: none; border: 1px solid rgba(255,255,255,0.24); border-radius: 999px;
    background: rgba(10,10,18,0.6); color: rgba(255,255,255,0.92);

  .mcc-nav.is-scrolled .mcc-nav__toggle { background: rgba(10,10,16,0.78); border-color: rgba(255,255,255,0.26); color: rgba(255,255,255,0.92); }

  @media (max-width: 1024px) { .mcc-nav { gap: clamp(16px, 6vw, 48px); } }
  @media (max-width: 768px) {
    .mcc-nav { padding: clamp(26px, 8vw, 48px) clamp(26px, 8vw, 64px) clamp(12px, 4vw, 24px); }

    .mcc-nav__menu {
      position: absolute; top: calc(100% + clamp(12px, 3vw, 20px)); right: clamp(20px, 6vw, 40px);

      -webkit-backdrop-filter: saturate(140%) blur(20px); backdrop-filter: saturate(140%) blur(20px); z-index: 10001;
    }
    .mcc-nav__links { flex-direction: column; align-items: flex-start; gap: 12px; width: 100%; }
    .mcc-nav__link a { width: 100%; padding: 6px 0; }
    .mcc-nav__link--has-submenu { position: relative; }
    .mcc-nav__link--has-submenu > a { padding-right: 40px; }
    .mcc-nav__submenu-toggle {
      display: inline-flex; position: absolute; top: 50%; right: 0; transform: translateY(-50%);

    }

  }
  @media (max-width: 520px) {
    .mcc-nav__brand a { font-size: clamp(1.2rem, 5.8vw, 1.6rem); }

  }

  /* Submenu (desktop) */
  .mcc-nav__link--has-submenu { position: relative; display: flex; align-items: center; gap: 6px; }
  .mcc-nav__submenu {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 230px; padding: 12px; border-radius: 14px;
    background: rgba(8,8,12,0.92); border: 1px solid rgba(255,255,255,0.18);

    list-style: none; margin: 0; display: none; opacity: 0; transform: translateY(8px) scale(0.98);
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 10002;
  }
  .mcc-nav__submenu li { margin: 0; padding: 0; }
  .mcc-nav__submenu li a { display: block; padding: 10px 12px; color: rgba(255,255,255,0.92); text-decoration: none; text-shadow: none; border-radius: 8px; font-weight: 500; transition: background-color 0.2s ease, color 0.2s ease; }
  .mcc-nav__submenu li a:hover, .mcc-nav__submenu li a:focus-visible { background-color: rgba(255, 255, 255, 0.08); color: #ffffff; outline: none; }

  .mcc-nav__submenu-toggle { display: none; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.24); background: transparent; color: inherit; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease; }
  .mcc-nav__submenu-toggle:hover, .mcc-nav__submenu-toggle:focus-visible { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.32); outline: none; }
  .mcc-nav__submenu-toggle::before { content: ''; display: inline-block; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform 0.2s ease; }
  .mcc-nav__submenu-toggle[aria-expanded="true"]::before { transform: rotate(225deg); }

  @media (min-width: 769px) {
    .mcc-nav__submenu-toggle { display: none; }
    .mcc-nav__link--has-submenu:hover > .mcc-nav__submenu,
    .mcc-nav__link--has-submenu:focus-within > .mcc-nav__submenu { display: block; opacity: 1; transform: translateY(0) scale(1); }
    .mcc-nav__submenu { -webkit-backdrop-filter: saturate(150%) blur(16px); backdrop-filter: saturate(150%) blur(16px); background: rgba(8, 8, 12, 0.92); }
    .mcc-nav__link--has-submenu::after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 12px; }
  }

  /* Mobile collapsible (works in 1.6.3) */
  @media (max-width: 768px) {
    .mcc-nav__link--has-submenu { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 10px; row-gap: 0; position: static; }
    .mcc-nav__link--has-submenu > a { grid-column: 1; width: 100%; display: block; padding-right: 0; }
    .mcc-nav__submenu-toggle { grid-column: 2; display: inline-flex; position: static; transform: none; width: 32px; height: 32px; margin: 0; align-self: center; justify-self: end; z-index: 1; }
    .mcc-nav__submenu { grid-column: 1 / -1; grid-row: 2; position: static; width: 100%; margin-top: 6px; margin-left: 12px; padding-left: 8px; padding: 6px 0; background: transparent; border: 0; box-shadow: none; display: none; opacity: 1; transform: none; }
    .mcc-nav__submenu-toggle[aria-expanded="true"] + .mcc-nav__submenu { display: block; }
  }

    /* Loading indicator for dynamic submenu autofill */
    .mcc-nav__submenu[aria-busy="true"] {
      position: relative;
    }
    .mcc-nav__submenu[aria-busy="true"]::after {
      content: '';
      position: absolute;
      right: 12px;
      top: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
      border-top-color: rgba(255,255,255,0.92);
      animation: mcc-nav-spin 0.9s linear infinite;
      display: block;
    }
    @keyframes mcc-nav-spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) { .mcc-nav, .mcc-nav__toggle, .mcc-nav__link a::after { transition: none !important; } .mcc-nav__submenu { transition: none !important; } }
</style>

<div class="mcc-nav-widget" data-widget-version="1.7.1-rollback">
  <div class="mcc-nav-shell">
    <nav class="mcc-nav" aria-label="Primary navigation">
      <div class="mcc-nav__brand"><a href="/" data-match="^/$">Caleb McCartney</a></div>
      <button class="mcc-nav__toggle" type="button" aria-expanded="false" aria-controls="mcc-nav-links" aria-haspopup="true">
        <span class="sr-only">Toggle navigation</span>
        <span class="mcc-nav__toggle-box" aria-hidden="true">

        </span>

              <li><a href="/events" role="menuitem">Events</a></li>

<script>
  (function(){
    const killSelectors = ['.Header','header[role="banner"]','[data-test="header"]'];
    killSelectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(node => {
        node.setAttribute('data-mcc-nav-replaced','true');
        node.style.display = 'none';
        node.setAttribute('aria-hidden','true');
      });
    });

    const root = document.querySelector('.mcc-nav-widget');
    if (!root || root.dataset.mounted === 'true') return;
    root.dataset.mounted = 'true';

    document.documentElement.dataset.mccNav = 'active';

    const nav = root.querySelector('.mcc-nav');
    const toggle = nav.querySelector('.mcc-nav__toggle');
    const links = nav.querySelectorAll('.mcc-nav__links a');
    const submenuToggles = nav.querySelectorAll('.mcc-nav__submenu-toggle');

    const collapseAllSubmenus = () => {
      submenuToggles.forEach(btn => {
        btn.setAttribute('aria-expanded','false');
        const submenu = btn.nextElementSibling;
        if (submenu && submenu.classList.contains('mcc-nav__submenu')) {
          submenu.setAttribute('aria-hidden','true');
        }
      });
    };

    const closeMobile = () => {
      nav.classList.remove('mcc-nav--menu-open');
      if (toggle) toggle.setAttribute('aria-expanded','false');
      collapseAllSubmenus();
    };

    if (toggle) {
      toggle.addEventListener('click', function(e){
        e.stopPropagation();
        const willOpen = !nav.classList.contains('mcc-nav--menu-open');
        nav.classList.toggle('mcc-nav--menu-open', willOpen);
        this.setAttribute('aria-expanded', String(willOpen));
      });
    }

    links.forEach(anchor => anchor.addEventListener('click', closeMobile));

    submenuToggles.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        collapseAllSubmenus();
        btn.setAttribute('aria-expanded', String(!expanded));
        const submenu = btn.nextElementSibling;
        if (submenu && submenu.classList.contains('mcc-nav__submenu')) {
          submenu.setAttribute('aria-hidden', String(expanded));
        }
      });
    });

    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 && nav.classList.contains('mcc-nav--menu-open') && !nav.contains(e.target)) {
        closeMobile();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && nav.classList.contains('mcc-nav--menu-open')) {
        closeMobile();
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) collapseAllSubmenus();
      if (window.innerWidth > 768) closeMobile();
      requestAnimationFrame(updateNavHeight);
    });

    const highlight = () => {
      const currentPath = window.location.pathname.replace(/\/+$/, '');
      const currentHash = window.location.hash;
      nav.querySelectorAll('a').forEach(a => a.removeAttribute('aria-current'));
      nav.querySelectorAll('[data-match]').forEach(anchor => {
        const pattern = anchor.getAttribute('data-match');
        if (!pattern) return;
        try { if (new RegExp(pattern).test(currentPath)) { anchor.setAttribute('aria-current','page'); } }
        catch (err) { console.warn('[mcc-nav] invalid regex', pattern, err); }
      });
    };
    highlight();

    const handleRoute = () => { highlight(); closeMobile(); collapseAllSubmenus(); };
    window.addEventListener('SquarespaceRoutingComplete', handleRoute);

    const updateNavHeight = () => {
      const height = nav.getBoundingClientRect().height;
      document.documentElement.style.setProperty('--mcc-nav-height', height + 'px');
    };
    requestAnimationFrame(updateNavHeight);
    window.addEventListener('load', updateNavHeight);

    const applyScrollState = () => {
      const threshold = nav.getBoundingClientRect().height * 0.35;
      nav.classList.toggle('is-scrolled', window.scrollY > threshold);
    };
    applyScrollState();
    window.addEventListener('scroll', applyScrollState, { passive: true });

    // TODO: Dynamic sitemap-driven submenu (disabled by default)
    // Enable by adding data-sitemap-autofill="true" (and optionally data-sitemap-url and data-sitemap-cache-ttl)
    // on `.mcc-nav-widget`. You can also override labels via data-label-<slug> attributes.
    const dynamicMenu = {
        enabled: root?.dataset.sitemapAutofill === 'true',
        sitemapUrl: root?.dataset.sitemapUrl || '/sitemap.xml',
        cacheTtl: parseInt(root?.dataset.sitemapCacheTtl || '', 10) || 600000, // default 10 minutes
    // By default use session-backed caching (non-persistent) to avoid stale cross-session data
    // Set data-sitemap-persistent="true" on the widget to opt into persistent localStorage caching.
    persistent: String(root?.dataset.sitemapPersistent || 'false') === 'true', // default: sessionStorage
        showLoading: String(root?.dataset.sitemapShowLoading || 'sr-only') === 'visible',
      work: {
        container: nav.querySelector('#submenu-work'),
        // Preferred order (top -> bottom). Items present in sitemap will follow this order; any
        // additional top-level sections discovered will be appended to the end.
        order: ['featured-work','concerts','events','journalism','portraits','nature'],
        labels: Object.assign({
          'featured-work': 'Featured',
          'concerts': 'Concerts',
          'events': 'Events',
          'journalism': 'Journalism',
          'portraits': 'Portraits',
          'nature': 'Nature'
        }, (function readOverrides(){
          const out = {};
          try {
            Object.keys(root?.dataset || {}).forEach(k => {
              if (k.indexOf('label') === 0) {
                // dataset.labelFeaturedWork -> slug featured-work
                const slug = k.replace(/^label/, '').replace(/([A-Z])/g, '-$1').toLowerCase().replace(/^-/, '');
                out[slug] = root.dataset[k];
              }
            });
          } catch(e){}
          return out;
        })())
      }
    };

  const cacheKey = 'mcc-nav-sitemap-cache:' + dynamicMenu.sitemapUrl;

  // Log chosen storage mode for debugging/visibility in console (can be removed later)
  console.info('[mcc-nav] sitemap autofill:', dynamicMenu.enabled ? 'enabled' : 'disabled', '; storage:', dynamicMenu.persistent ? 'localStorage' : 'sessionStorage');

    // helper to set accessible busy state and optional loading text
    function setBusy(container, isBusy) {
      if (!container) return;
      container.setAttribute('aria-busy', String(isBusy));
      let loading = container.querySelector('.mcc-nav__submenu-loading');
      if (!loading) {
        loading = document.createElement('span');
        loading.className = 'mcc-nav__submenu-loading sr-only';
        loading.setAttribute('aria-hidden', 'true');
        loading.textContent = 'Loading…';
        container.appendChild(loading);
      }
      if (dynamicMenu.showLoading) {
        loading.classList.remove('sr-only');
        loading.style.display = isBusy ? 'inline-block' : 'none';
      } else {
        loading.classList.add('sr-only');
        loading.style.display = 'none';
      }
    }

    const fetchWithTimeout = (url, opts = {}, timeoutMs = 4000) => {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      return fetch(url, { ...opts, signal: ctrl.signal, credentials: 'same-origin' })
        .finally(() => clearTimeout(id));
    };

    function humanLabel(slug) {
      return slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    async function tryAutofillWorkFromSitemap() {
      if (!dynamicMenu.enabled) return; // keep static list unless enabled
      const container = dynamicMenu.work.container;
      if (!container) return;
  // show accessible loading state
  setBusy(container, true);

      try {
        // cache check: either localStorage (persistent) or sessionStorage (per session)
        try {
          if (dynamicMenu.persistent) {
            const cachedRaw = localStorage.getItem(cacheKey);
            if (cachedRaw) {
              try {
                const cached = JSON.parse(cachedRaw);
                if (cached?.expires && cached.expires > Date.now() && Array.isArray(cached.items) && cached.items.length) {
                  container.innerHTML = cached.items.map(i => `<li><a href="${i.href}" role="menuitem">${i.label}</a></li>`).join('');
                  setBusy(container, false);
                  return;
                } else {
                  try { localStorage.removeItem(cacheKey); } catch(e) {}
                }
              } catch (e) {
                // ignore and fetch
              }
            }
          } else {
            const cachedRaw = sessionStorage.getItem(cacheKey);
            if (cachedRaw) {
              try {
                const cached = JSON.parse(cachedRaw);
                if (cached?.ts && (Date.now() - cached.ts) < dynamicMenu.cacheTtl && Array.isArray(cached.items) && cached.items.length) {
                  container.innerHTML = cached.items.map(i => `<li><a href="${i.href}" role="menuitem">${i.label}</a></li>`).join('');
                  setBusy(container, false);
                  return;
                } else {
                  try { sessionStorage.removeItem(cacheKey); } catch(e) {}
                }
              } catch (e) {}
            }
          }
        } catch (e) {
          // storage access may throw in sandboxed contexts; ignore and fetch
        }

        const res = await fetchWithTimeout(dynamicMenu.sitemapUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        // use shared parser (exposed on globalThis as mccSitemapParser)
        const parsedSlugs = (typeof (globalThis?.mccSitemapParser?.parseTopLevelSlugs) === 'function')
          ? globalThis.mccSitemapParser.parseTopLevelSlugs(text, window.location.origin)
          : [];
        const slugs = new Set(parsedSlugs);

        // build ordered list: preferred order then append extras
        const preferred = dynamicMenu.work.order.filter(s => slugs.has(s));
        const extras = Array.from(slugs).filter(s => !dynamicMenu.work.order.includes(s));
        const finalSlugs = preferred.concat(extras);

        const items = finalSlugs.map(slug => {
          const href = '/' + slug;
          const label = dynamicMenu.work.labels[slug] || humanLabel(slug);
          return { href, label };
        });

        if (items.length) {
          container.innerHTML = items.map(i => `<li><a href="${i.href}" role="menuitem">${i.label}</a></li>`).join('');
          // cache result: store with expires timestamp (persistent) or ts (session)
          try {
            if (dynamicMenu.persistent) {
              const payload = { ts: Date.now(), expires: Date.now() + dynamicMenu.cacheTtl, items };
              localStorage.setItem(cacheKey, JSON.stringify(payload));
            } else {
              const payload = { ts: Date.now(), items };
              sessionStorage.setItem(cacheKey, JSON.stringify(payload));
            }
          } catch (e) {}
        }
      } catch (err) {
        console.warn('[mcc-nav] sitemap autofill skipped:', err?.message || err);
      } finally {
        setBusy(container, false);
      }
