<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McCal Navigation - Enhanced v1.7</title>
</head>
<body>
<!-- McCal Navigation - Enhanced Edition (v1.7-enhanced) -->
<!-- Based on v1.6.3 with all portfolios -->
<!-- Place inside Squarespace Settings → Advanced → Code Injection → HEADER -->
<style>
  :root {
    --mcc-nav-height: 0px;
    --mcc-nav-text-color: #f5f5f5;
    --mcc-nav-text-secondary: rgba(255, 255, 255, 0.86);
    --mcc-nav-brand-color: #f5f5f5;
  }

  .mcc-nav-widget,
  .mcc-nav-widget * {
    box-sizing: border-box;
  }
  body {
    overflow-x: hidden;
  }
  html[data-mcc-nav="active"] .Header,
  html[data-mcc-nav="active"] header[role="banner"],
  html[data-mcc-nav="active"] [data-test="header"] {
    display: none !important;
    visibility: hidden;
  }
  
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .mcc-nav-shell {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
  }
  .mcc-nav {
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    max-width: none;
    padding: clamp(32px, 7vw, 72px) clamp(44px, 8vw, 128px) clamp(12px, 3vw, 28px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(18px, 5vw, 72px);
    color: var(--mcc-nav-text-color);
    font-family: 'Inter','Segoe UI',system-ui,sans-serif;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.35) 60%, rgba(0, 0, 0, 0.15) 85%, transparent 100%);
  }
  .mcc-nav.is-scrolled {
    background: rgba(10, 10, 16, 0.75);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    color: #f5f5f5;
    -webkit-backdrop-filter: saturate(120%) blur(12px);
    backdrop-filter: saturate(120%) blur(12px);
  }
  .mcc-nav__brand a {
    font-family: 'Libre Baskerville','Georgia',serif;
    font-size: clamp(1.35rem, 2.6vw, 1.9rem);
    font-weight: 600;
    color: var(--mcc-nav-brand-color);
    text-decoration: none;
    letter-spacing: 0.015em;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
    transition: color 0.3s ease, opacity 0.3s ease;
  }
  .mcc-nav__brand a:hover,
  .mcc-nav__brand a:focus-visible {
    opacity: 0.85;
    outline: none;
  }
  .mcc-nav.is-scrolled .mcc-nav__brand a {
    color: #f5f5f5;
  }
  .mcc-nav__menu {
    display: flex;
    align-items: center;
    gap: clamp(1.2rem, 3vw, 2.8rem);
  }
  .mcc-nav__links {
    list-style: none;
    display: flex;
    gap: inherit;
    margin: 0;
    padding: 0;
    align-items: center;
  }
  .mcc-nav__link {
    position: relative;
  }
  .mcc-nav__link a {
    color: var(--mcc-nav-text-secondary);
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding-bottom: 6px;
    display: inline-flex;
    align-items: center;
    transition: color 0.3s ease;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }
  .mcc-nav.is-scrolled .mcc-nav__link a {
    color: rgba(255, 255, 255, 0.86);
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }
  .mcc-nav__link a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 2px;
    background: currentColor;
    border-radius: 999px;
    transform: scaleX(0);
    transform-origin: left;
    opacity: 0;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .mcc-nav__link a:hover,
  .mcc-nav__link a:focus-visible {
    color: var(--mcc-nav-text-color);
    outline: none;
  }
  .mcc-nav.is-scrolled .mcc-nav__link a:hover,
  .mcc-nav.is-scrolled .mcc-nav__link a:focus-visible {
    color: #ffffff;
  }
  .mcc-nav__link a:hover::after,
  .mcc-nav__link a:focus-visible::after,
  .mcc-nav__link a[aria-current="page"]::after {
    transform: scaleX(1);
    opacity: 1;
  }
  .mcc-nav__toggle {
    display: none;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 999px;
    background: rgba(10, 10, 18, 0.6);
    color: rgba(255, 255, 255, 0.92);
    width: 46px;
    height: 46px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .mcc-nav__toggle:hover,
  .mcc-nav__toggle:focus-visible {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
    color: #ffffff;
    transform: scale(1.05);
    outline: none;
  }
  .mcc-nav__toggle-box {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    justify-content: space-between;
    width: 22px;
    height: 14px;
  }
  .mcc-nav__toggle-line {
    height: 2px;
    border-radius: 999px;
    background: currentColor;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .mcc-nav.is-scrolled .mcc-nav__toggle {
    background: rgba(10, 10, 16, 0.78);
    border-color: rgba(255, 255, 255, 0.26);
    color: rgba(255, 255, 255, 0.92);
  }
  @media (max-width: 1024px) {
    .mcc-nav {
      gap: clamp(16px, 6vw, 48px);
    }
  }
  @media (max-width: 768px) {
    .mcc-nav {
      padding: clamp(26px, 8vw, 48px) clamp(26px, 8vw, 64px) clamp(12px, 4vw, 24px);
    }
    .mcc-nav__toggle {
      display: inline-flex;
    }
    .mcc-nav__menu {
      position: absolute;
      top: calc(100% + clamp(12px, 3vw, 20px));
      right: clamp(20px, 6vw, 40px);
      width: min(220px, 85vw);
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: clamp(14px, 4vw, 20px);
      border-radius: 16px;
      background: rgba(8, 8, 12, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 4px 10px rgba(0, 0, 0, 0.15);
      -webkit-backdrop-filter: saturate(140%) blur(20px);
      backdrop-filter: saturate(140%) blur(20px);
      z-index: 10001;
    }
    .mcc-nav__links {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
    }
    .mcc-nav__link a {
      width: 100%;
      padding: 8px 0;
    }
    .mcc-nav__link--has-submenu {
      position: relative;
    }
    .mcc-nav__link--has-submenu > a {
      padding-right: 40px;
    }
    .mcc-nav__submenu-toggle {
      display: inline-flex;
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      margin: 0;
      align-self: auto;
      z-index: 1;
    }
    .mcc-nav.mcc-nav--menu-open .mcc-nav__menu {
      display: flex;
    }
    .mcc-nav__submenu {
      position: static;
      width: 100%;
      margin-top: 6px;
      margin-left: 12px;
      padding: 6px 0 6px 8px;
      background: transparent;
      border: 0;
      box-shadow: none;
      min-width: 0;
      transform: none;
      opacity: 1;
      display: none;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .mcc-nav__submenu-toggle[aria-expanded="true"] + .mcc-nav__submenu {
      display: block !important;
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      max-height: 500px !important;
    }
  }
  @media (max-width: 520px) {
    .mcc-nav__brand a {
      font-size: clamp(1.2rem, 5.8vw, 1.6rem);
    }
    .mcc-nav {
      padding-left: clamp(20px, 7vw, 44px);
      padding-right: clamp(20px, 7vw, 44px);
    }
  }

  /* Submenu styles */
  .mcc-nav__link--has-submenu {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mcc-nav__submenu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 230px;
    padding: 12px;
    border-radius: 14px;
    background: rgba(8, 8, 12, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
    list-style: none;
    margin: 0;
    display: none;
    opacity: 0;
    transform: translateY(8px) scale(0.98);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 10002;
  }
  .mcc-nav__submenu li {
    margin: 0;
    padding: 0;
  }
  .mcc-nav__submenu li a {
    display: block;
    padding: 10px 12px;
    color: rgba(255, 255, 255, 0.92);
    text-decoration: none;
    text-shadow: none;
    border-radius: 8px;
    font-weight: 500;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .mcc-nav__submenu li a:hover,
  .mcc-nav__submenu li a:focus-visible {
    background-color: rgba(255, 255, 255, 0.08);
    color: #ffffff;
    outline: none;
  }
  .mcc-nav__submenu-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    background: transparent;
    color: inherit;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .mcc-nav__submenu-toggle:hover,
  .mcc-nav__submenu-toggle:focus-visible {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.32);
    outline: none;
  }
  .mcc-nav__submenu-toggle::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    transition: transform 0.25s ease;
  }
  .mcc-nav__submenu-toggle[aria-expanded="true"] {
    background: rgba(255, 255, 255, 0.12);
  }
  .mcc-nav__submenu-toggle[aria-expanded="true"]::before {
    transform: rotate(-135deg);
  }

  /* Desktop: show on hover/focus */
  @media (min-width: 769px) {
    .mcc-nav__submenu-toggle { display: none; }
    .mcc-nav__link--has-submenu:hover > .mcc-nav__submenu,
    .mcc-nav__link--has-submenu:focus-within > .mcc-nav__submenu,
    .mcc-nav__submenu:hover {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .mcc-nav__submenu {
      -webkit-backdrop-filter: saturate(150%) blur(16px);
      backdrop-filter: saturate(150%) blur(16px);
      background: rgba(8, 8, 12, 0.92);
    }
    .mcc-nav__link--has-submenu::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 12px;
    }
  }

  /* Reduced motion support */
  @media (prefers-reduced-motion: reduce) {
    .mcc-nav,
    .mcc-nav__toggle,
    .mcc-nav__link a::after {
      transition: none !important;
    }
    .mcc-nav__submenu { transition: none !important; }
  }
</style>

<div class="mcc-nav-widget" data-widget-version="1.7-enhanced">
  <div class="mcc-nav-shell">
    <nav class="mcc-nav" aria-label="Primary navigation">
      <div class="mcc-nav__brand"><a href="/" data-match="^/$">Caleb McCartney</a></div>
      <button class="mcc-nav__toggle" type="button" aria-expanded="false" aria-controls="mcc-nav-links" aria-haspopup="true">
        <span class="sr-only">Toggle navigation</span>
        <span class="mcc-nav__toggle-box" aria-hidden="true">
          <span class="mcc-nav__toggle-line"></span>
          <span class="mcc-nav__toggle-line"></span>
          <span class="mcc-nav__toggle-line"></span>
        </span>
      </button>
      <div class="mcc-nav__menu">
        <ul class="mcc-nav__links" id="mcc-nav-links" role="list">
          <li class="mcc-nav__link mcc-nav__link--has-submenu">
            <a href="/" data-match="^/$">Work</a>
            <button class="mcc-nav__submenu-toggle" type="button" aria-expanded="false" aria-controls="submenu-work">
              <span class="sr-only">Toggle Work submenu</span>
            </button>
            <ul class="mcc-nav__submenu" id="submenu-work" role="menu" aria-label="Work submenu" aria-hidden="true">
              <li><a href="/featured-work" role="menuitem">Featured</a></li>
              <li><a href="/concerts" role="menuitem">Concerts</a></li>
              <li><a href="/events" role="menuitem">Events</a></li>
              <li><a href="/journalism" role="menuitem">Journalism</a></li>
              <li><a href="/portraits" role="menuitem">Portraits</a></li>
              <li><a href="/nature" role="menuitem">Nature</a></li>
            </ul>
          </li>
          <li class="mcc-nav__link"><a href="/podcast" data-match="^/podcast">Podcast</a></li>
          <li class="mcc-nav__link"><a href="/about" data-match="^/about">About</a></li>
        </ul>
      </div>
    </nav>
  </div>
</div>

<script>
  (function(){
    'use strict';
    
    const killSelectors = ['.Header','header[role="banner"]','[data-test="header"]'];
    killSelectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(node => {
        node.setAttribute('data-mcc-nav-replaced','true');
        node.style.display = 'none';
        node.setAttribute('aria-hidden','true');
      });
    });

    const root = document.querySelector('.mcc-nav-widget');
    if (!root || root.dataset.mounted === 'true') return;
    root.dataset.mounted = 'true';

    document.documentElement.dataset.mccNav = 'active';

    const nav = root.querySelector('.mcc-nav');
    const toggle = nav.querySelector('.mcc-nav__toggle');
    const links = nav.querySelectorAll('.mcc-nav__links a');
    const submenuToggles = nav.querySelectorAll('.mcc-nav__submenu-toggle');

    const collapseAllSubmenus = () => {
      submenuToggles.forEach(btn => {
        btn.setAttribute('aria-expanded','false');
        const submenu = btn.nextElementSibling;
        if (submenu && submenu.classList.contains('mcc-nav__submenu')) {
          submenu.setAttribute('aria-hidden','true');
        }
      });
    };

    const closeMobile = () => {
      nav.classList.remove('mcc-nav--menu-open');
      if (toggle) toggle.setAttribute('aria-expanded','false');
      collapseAllSubmenus();
    };

    if (toggle) {
      toggle.addEventListener('click', function(e){
        e.stopPropagation();
        const willOpen = !nav.classList.contains('mcc-nav--menu-open');
        nav.classList.toggle('mcc-nav--menu-open', willOpen);
        this.setAttribute('aria-expanded', String(willOpen));
      });
    }

    links.forEach(anchor => anchor.addEventListener('click', closeMobile));

    submenuToggles.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        const submenu = btn.nextElementSibling;
        
        console.log('Toggle clicked!', {
          expanded,
          submenu,
          hasSubmenuClass: submenu?.classList.contains('mcc-nav__submenu')
        });
        
        collapseAllSubmenus();
        btn.setAttribute('aria-expanded', String(!expanded));
        
        if (submenu && submenu.classList.contains('mcc-nav__submenu')) {
          submenu.setAttribute('aria-hidden', String(expanded));
          console.log('Submenu toggled:', !expanded ? 'OPEN' : 'CLOSED');
        } else {
          console.error('Submenu not found or wrong element!');
        }
      });
    });

    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 &&
          nav.classList.contains('mcc-nav--menu-open') &&
          !nav.contains(e.target)) {
        closeMobile();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && nav.classList.contains('mcc-nav--menu-open')) {
        closeMobile();
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) collapseAllSubmenus();
      if (window.innerWidth > 768) closeMobile();
      requestAnimationFrame(updateNavHeight);
    });

    const highlight = () => {
      const currentPath = window.location.pathname.replace(/\/+$/, '');
      nav.querySelectorAll('a').forEach(a => a.removeAttribute('aria-current'));
      nav.querySelectorAll('[data-match]').forEach(anchor => {
        const pattern = anchor.getAttribute('data-match');
        if (!pattern) return;
        try {
          if (new RegExp(pattern).test(currentPath)) {
            anchor.setAttribute('aria-current','page');
          }
        } catch (err) {
          console.warn('[mcc-nav] invalid regex', pattern, err);
        }
      });
    };
    highlight();

    const handleRoute = () => {
      highlight();
      closeMobile();
      collapseAllSubmenus();
    };
    window.addEventListener('SquarespaceRoutingComplete', handleRoute);

    const updateNavHeight = () => {
      const height = nav.getBoundingClientRect().height;
      document.documentElement.style.setProperty('--mcc-nav-height', height + 'px');
    };
    requestAnimationFrame(updateNavHeight);
    window.addEventListener('load', updateNavHeight);

    const applyScrollState = () => {
      const threshold = nav.getBoundingClientRect().height * 0.35;
      nav.classList.toggle('is-scrolled', window.scrollY > threshold);
    };
    applyScrollState();
    window.addEventListener('scroll', applyScrollState, { passive: true });

    console.log('[mcc-nav v1.7-enhanced] Initialized based on v1.6.3 with all portfolios');
  })();
</script>
</body>
</html>
