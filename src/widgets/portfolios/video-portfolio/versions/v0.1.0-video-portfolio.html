<!-- Video Portfolio Widget v0.1
Author: Caleb McCartney / McCal-Codes
Version: 0.1
Purpose: Accessible, performant multimedia gallery for video content (local MP4, YouTube, Vimeo).

Performance Notes:
- Critical CSS inlined; minimal first-paint footprint
- Lazy thumbnail loading + deferred player creation
- IntersectionObserver for reveal (skipped if prefers-reduced-motion)
- No external dependencies; progressive enhancement

Accessibility Notes:
- Focus trap in lightbox; Escape closes
- Keyboard controls: Space/Enter (play/pause), m (mute), ←/→ (previous/next), Esc (close)
- ARIA roles & labels for cards, player, and modal
- Reduced motion compliance

TODO: Implement external manifest ingestion (Phase 2)
TODO: Add transcripts & captions panel with WebVTT parsing
TODO: Add adaptive bitrate streaming (HLS/DASH) fallback logic
TODO: Add debug panel with performance metrics & cache stats
-->

<style>
:root{--vp-bg:#0a0a0a;--vp-fg:#f5f5f5;--vp-line:#2a2a2a;--vp-accent:#888888;--vp-card-bg:#141414;--vp-focus:var(--vp-accent)}
@media(prefers-color-scheme:light){:root{--vp-bg:#ffffff;--vp-fg:#111;--vp-line:#e2e2e2;--vp-card-bg:#f5f5f5;--vp-accent:#666666}}
.video-portfolio{max-width:1600px;margin:60px auto;padding:40px 20px;font:400 15px/1.5 ui-sans-serif,system-ui;color:var(--vp-fg);background:transparent;position:relative}
.video-heading{margin:0 0 10px;font:800 32px/1.2 ui-sans-serif,system-ui;color:var(--vp-fg)}
.video-subheading{margin:0 auto 24px;max-width:760px;font:500 15px/1.6 ui-sans-serif,system-ui;color:rgba(245,245,245,.75)}

.video-filter-btn:hover{transform:translateY(-2px)}

.video-grid{column-width:320px;column-gap:20px;margin:10px 0 0;text-align:left;opacity:0;transition:opacity .5s}
.video-grid.loaded{opacity:1}
.video-card{position:relative;display:inline-block;width:100%;margin:0 0 20px;background:var(--vp-card-bg);border-radius:16px;overflow:hidden;cursor:pointer;break-inside:avoid;opacity:0;transform:translateY(24px);transition:all .4s cubic-bezier(.25,.46,.45,.94)}
.video-card.loaded{opacity:1;transform:translateY(0)}
.video-thumb{display:block;width:100%;height:auto;border-radius:inherit;aspect-ratio:16/9;object-fit:cover;background:#000;transition:transform .35s ease,filter .35s ease}
.video-card:hover .video-thumb{transform:scale(1.03);filter:brightness(1.08) saturate(1.08)}
.video-info{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85));color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.video-title{margin:0;font:700 15px/1.3 ui-sans-serif,system-ui}
.video-meta{margin:4px 0 0;font:600 12px/1.2 ui-sans-serif,system-ui;color:#dcdcdc}
.video-card.loading::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:vpShimmer 1.6s infinite}
@keyframes vpShimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media(max-width:1024px){.video-grid{column-width:280px}}
@media(max-width:768px){.video-portfolio{padding:24px 16px}.video-heading{font-size:28px}.video-grid{column-width:240px}}
@media(max-width:520px){.video-grid{column-width:100%}}
/* Lightbox */
.vp-lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:2147483647;padding:30px 40px;backdrop-filter:blur(6px)}
.vp-lightbox.open{display:flex}
.vp-dialog{max-width:1200px;width:100%;max-height:88vh;display:flex;flex-direction:column;gap:16px;outline:none}
.vp-player-wrap{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 14px 32px rgba(0,0,0,.55)}
.vp-player{width:100%;height:auto;display:block;aspect-ratio:16/9;background:#000}
.vp-close{position:fixed;top:22px;right:22px;background:rgba(0,0,0,.7);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:50%;width:48px;height:48px;font:800 20px/1 ui-sans-serif,system-ui;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2147483648;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:background .2s ease}
.vp-close:hover{background:rgba(0,0,0,.85)}
.vp-caption{background:rgba(0,0,0,.7);color:#fff;padding:12px 16px;border-radius:8px;text-align:left;font:500 14px/1.5 ui-sans-serif,system-ui;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.vp-caption h3{margin:0 0 6px;font:700 18px/1.2 ui-sans-serif,system-ui}
.vp-caption p{margin:0;font:500 14px/1.4 ui-sans-serif,system-ui}
html.vp-open body{overflow:hidden}
html.vp-open header,html.vp-open nav,[class*='nav'],[id*='nav'],.site-header,.Header{opacity:0 !important;visibility:hidden !important;pointer-events:none !important}
/* Reduced Motion */
@media(prefers-reduced-motion:reduce){.video-card{transition:none}.video-card:hover .video-thumb{transform:none;filter:none}}
</style>

<script>
(function(){
  'use strict';
  const ROOT = document.getElementById('videoPf');
  const GRID = document.getElementById('videoGrid');
  const FILTERS = document.getElementById('videoFilters');
  const LB = document.getElementById('vpLightbox');
  const DIALOG = LB.querySelector('.vp-dialog');
  const PLAYER_WRAP = LB.querySelector('.vp-player-wrap');
  const TITLE = document.getElementById('vpLbTitle');
  const META = document.getElementById('vpLbMeta');
  const CLOSE = LB.querySelector('.vp-close');
  const DATA_EL = document.getElementById('videoPortfolioData');
  const DEBUG = window.location.search.includes('debug');

  const state = {
    videos: [],
    activeFilter: null,
    lastFocus: null,
    observer: null
  };

  function log(){ if(DEBUG) console.log('[VideoPortfolio v0.1]', ...arguments); }

  function parseData(){
    try {
      const json = JSON.parse(DATA_EL.textContent.trim());
      if(Array.isArray(json.videos)) state.videos = json.videos.filter(v => v && v.id && v.title);
      log('Parsed videos:', state.videos.length);
    } catch(e){ console.error('Video dataset parse error', e); }
  }

  function buildFilters(){
    const tagSet = new Set();
    state.videos.forEach(v => (v.tags||[]).forEach(t => tagSet.add(t)));
    const tags = Array.from(tagSet).sort();
    FILTERS.innerHTML='';
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.type='button';
      btn.className='video-filter-btn';
      btn.textContent=tag.replace(/-/g,' ');
      btn.setAttribute('aria-pressed','false');
      btn.setAttribute('data-tag', tag);
      btn.addEventListener('click', () => toggleFilter(tag, btn));
      FILTERS.appendChild(btn);
    });
    if(tags.length){
      const allBtn = document.createElement('button');
      allBtn.type='button';
      allBtn.className='video-filter-btn';
      allBtn.textContent='All';
      allBtn.setAttribute('aria-pressed','true');
      allBtn.dataset.tag='__all';
      allBtn.addEventListener('click', () => clearFilter());
      FILTERS.insertBefore(allBtn, FILTERS.firstChild);
    }
  }

  function toggleFilter(tag, btn){
    if(state.activeFilter === tag){ clearFilter(); return; }
    state.activeFilter = tag;
    Array.from(FILTERS.children).forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    renderGrid();
  }
  function clearFilter(){ state.activeFilter = null; Array.from(FILTERS.children).forEach(b => b.setAttribute('aria-pressed', b.dataset.tag==='__all'?'true':'false')); renderGrid(); }

  function buildCard(video){
    const card = document.createElement('article');
    card.className='video-card loading';
    card.tabIndex=0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', `Play video: ${video.title}`);
    card.dataset.id = video.id;

    const img = document.createElement('img');
    img.className='video-thumb';
    img.alt = `${video.title} thumbnail`;
    img.loading='lazy';
    img.decoding='async';
    img.src = video.poster || placeholderPoster(video);
    img.addEventListener('load', () => { card.classList.remove('loading'); card.classList.add('loaded'); });

    const info = document.createElement('div');
    info.className='video-info';
    info.innerHTML = `<h3 class="video-title">${video.title}</h3><p class="video-meta">${formatDuration(video.duration)} • ${(video.tags||[]).join(', ')}</p>`;

    card.append(img, info);
    card.addEventListener('click', () => openLightbox(video, card));
    card.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openLightbox(video, card); }});

    return card;
  }

  function placeholderPoster(v){ return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect fill="%23000" width="640" height="360"/><text x="50%" y="50%" fill="%23fff" dy=".3em" font-family="Arial" font-size="24" text-anchor="middle">No Poster</text></svg>'; }
  function formatDuration(sec){ if(!sec && sec!==0) return ''; const m=Math.floor(sec/60); const s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; }

  function renderGrid(){
    const videos = state.activeFilter ? state.videos.filter(v => (v.tags||[]).includes(state.activeFilter)) : state.videos;
    GRID.innerHTML='';
    const frag = document.createDocumentFragment();
    videos.forEach(v => frag.appendChild(buildCard(v)));
    GRID.appendChild(frag);
    GRID.classList.add('loaded');
  }

  function openLightbox(video, trigger){
    state.lastFocus = trigger;
    LB.classList.add('open');
    LB.setAttribute('aria-hidden','false');
    document.documentElement.classList.add('vp-open');
    buildPlayer(video);
    TITLE.textContent = video.title;
    META.textContent = `${formatDuration(video.duration)} • ${video.description || ''}`;
    DIALOG.focus();
  }
  function closeLightbox(){
    LB.classList.remove('open');
    LB.setAttribute('aria-hidden','true');
    document.documentElement.classList.remove('vp-open');
    PLAYER_WRAP.innerHTML='';
    if(state.lastFocus) state.lastFocus.focus();
  }

  function buildPlayer(video){
    PLAYER_WRAP.innerHTML='';
    let el;
    if(video.sourceType==='mp4'){
      el=document.createElement('video');
      el.className='vp-player';
      el.controls=true;
      el.preload='metadata';
      el.src=video.src;
      if(video.poster) el.poster=video.poster;
    } else if(video.sourceType==='youtube'){
      el=document.createElement('iframe');
      el.className='vp-player';
      el.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      el.allowFullscreen=true; el.title=video.title; el.loading='lazy';
      el.src=`https://www.youtube.com/embed/${encodeURIComponent(video.src)}?rel=0&modestbranding=1`;
    } else if(video.sourceType==='vimeo'){
      el=document.createElement('iframe');
      el.className='vp-player';
      el.allow='autoplay; fullscreen; picture-in-picture';
      el.title=video.title; el.loading='lazy';
      el.src=`https://player.vimeo.com/video/${encodeURIComponent(video.src)}?title=0&byline=0&portrait=0`;
    } else {
      el=document.createElement('div');
      el.style.color='var(--vp-fg)';
      el.style.padding='20px';
      el.textContent='Unsupported video sourceType.';
    }
    PLAYER_WRAP.appendChild(el);
  }

  function initObserver(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      Array.from(GRID.children).forEach(c=>c.classList.add('loaded'));
      return;
    }
    state.observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){ entry.target.classList.add('loaded'); state.observer.unobserve(entry.target); }
      });
    }, { rootMargin:'60px 0px 60px 0px', threshold:.15 });
    Array.from(GRID.children).forEach(card => { state.observer.observe(card); });
  }

  function addStructuredData(){
    if(!state.videos.length) return;
    const sample = state.videos.slice(0,5).map(v => ({"@type":"VideoObject","name":v.title,"description":v.description||'',"thumbnailUrl":v.poster||'',"uploadDate":v.uploadDate||new Date().toISOString().split('T')[0],"duration":"PT"+Math.round((v.duration||0)/60)+'M'+((v.duration||0)%60)+'S'}));
    const script=document.createElement('script');
    script.type='application/ld+json';
    script.textContent=JSON.stringify({"@context":"https://schema.org","@type":"ItemList","itemListElement":sample});
    document.head.appendChild(script);
  }

  function bindGlobal(){
    document.addEventListener('keydown', e => {
      if(e.key==='Escape' && LB.classList.contains('open')){ e.preventDefault(); closeLightbox(); }
      if(!LB.classList.contains('open')) return;
      const player = PLAYER_WRAP.querySelector('video');
      if(player){
        if(e.key===' '||e.key==='Spacebar'||e.key==='Enter'){ e.preventDefault(); if(player.paused) player.play(); else player.pause(); }
        if(e.key==='m'){ player.muted=!player.muted; }
      }
    });
    CLOSE.addEventListener('click', closeLightbox);
    LB.addEventListener('click', e => { if(e.target===LB) closeLightbox(); });
  }

  function init(){
    parseData();
    buildFilters();
    renderGrid();
    initObserver();
    addStructuredData();
    bindGlobal();
  }

  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
