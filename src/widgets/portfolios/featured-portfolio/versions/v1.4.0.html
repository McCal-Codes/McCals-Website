<script>
  (() => {
    const pf = document.getElementById('featuredPf');
    if (!pf) return;

    const grid = document.getElementById('featuredGrid');
    const loading = document.getElementById('featuredLoading');
    const debugToggle = document.getElementById('debugToggle');
    const debugPanel = document.getElementById('debugInfo');
    const debugStatus = document.getElementById('debugStatus');
    const metaCount = document.getElementById('metaCount');
    const metaUpdated = document.getElementById('metaUpdated');
    const metaSource = document.getElementById('metaSource');
    const versionIndicator = document.getElementById('versionIndicator');

    const lb = document.getElementById('featuredLightbox');
    const lbDialog = lb.querySelector('.fp-dialog');
    const lbGallery = document.getElementById('fpGallery');
    const lbTitle = document.getElementById('fpTitle');
    const lbMeta = document.getElementById('fpMeta');
    const lbClose = lb.querySelector('.fp-close');

    const AUTO_REFRESH_INTERVAL = 15 * 60 * 1000;
    const CACHE_TTL = 15 * 60 * 1000;
    const CACHE_KEY_PREFIX = 'featured-portfolio-cache:v1.4:';
    const MAX_LIGHTBOX_IMAGES = Math.max(1, parseInt(pf.dataset.lightboxLimit || '24', 10));
    const TARGET_PANES = Math.max(1, parseInt(pf.dataset.panes || '12', 10));
    const rangeDaysRaw = parseInt(pf.dataset.rangeDays || '0', 10); // Default to 0 (no limit) to show all items
    const RANGE_DAYS = Number.isFinite(rangeDaysRaw) ? rangeDaysRaw : 0;
    const FORCE_DIVERSE = (pf.dataset.forceDiverse || 'true').toLowerCase() === 'true';
    const CARDS_STAGGER = 100;

    const debugMetrics = {
      startTime: performance.now(),
      apiCalls: 0,
      itemCount: 0,
      imageCount: 0,
      lastRefresh: 'Never',
      manifest: '--',
    };

    let autoRefreshTimer = null;
    let nextRefreshTimer = null;
    let debugActive = false;
    let isTabVisible = true;
    let activeManifestUrl = '';
    let manifestSummary = '';

    const GH = { owner: 'McCal-Codes', repo: 'McCals-Website', branch: 'main' };
    const RAW_ROOT = `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/`;
    const PATH_PREFIX = 'src/images/Portfolios/';

    const providedManifest = (pf.dataset.manifest || '').trim();
    // Manifest priority: override -> unified -> per-category fallbacks
    const manifestCandidates = [];
    if (providedManifest) manifestCandidates.push(providedManifest);
    manifestCandidates.push('src/images/Portfolios/featured-manifest.json');
    manifestCandidates.push('src/images/Portfolios/portfolio-manifest.json');
    manifestCandidates.push('src/images/Portfolios/Concert/concert-manifest.json');
    manifestCandidates.push('src/images/Portfolios/Events/events-manifest.json');
    manifestCandidates.push('src/images/Portfolios/Journalism/journalism-manifest.json');

    const manifestSources = Array.from(new Set(manifestCandidates.filter(Boolean)));

    function logDebug(message, data = null) {
      if (debugActive) {
        console.log('[Featured Debug v1.2]', message, data || '');
        debugStatus.textContent = message;
        updateDebugMetrics();
      }
      // Always log errors to console even without debug mode
      if (message.toLowerCase().includes('error') || message.toLowerCase().includes('failed')) {
        console.error('[Featured Portfolio v1.2]', message, data || '');
      }
    }

    function toggleDebug() {
      debugActive = !debugActive;
      debugPanel.classList.toggle('active', debugActive);
      if (debugActive) {
        updateDebugMetrics();
      }
    }

    debugToggle.addEventListener('click', toggleDebug);
    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
    });

    function cacheKey(url) {
      return `${CACHE_KEY_PREFIX}${url}`;
    }

    function readCache(url) {
      try {
        const payload = localStorage.getItem(cacheKey(url));
        if (!payload) return null;
        const parsed = JSON.parse(payload);
        if (!parsed || typeof parsed !== 'object') return null;
        const age = Date.now() - parsed.timestamp;
        if (age > CACHE_TTL) return null;
        return parsed.manifest;
      } catch (error) {
        logDebug('Cache read failed', error.message);
        return null;
      }
    }

    function writeCache(url, manifest) {
      try {
        const payload = { timestamp: Date.now(), manifest };
        localStorage.setItem(cacheKey(url), JSON.stringify(payload));
      } catch (error) {
        logDebug('Cache write failed', error.message);
      }
    }

    function resolveManifestUrl(candidate) {
      if (/^https?:/i.test(candidate)) return candidate;
      const cleaned = candidate
        .replace(/^(\.\.?\/)+/, '')
        .replace(/^\.\/+/, '')
        .replace(/^\/+/, '');
      return RAW_ROOT + cleaned;
    }

    async function fetchManifest(url, forceRefresh = false) {
      if (!forceRefresh) {
        const cacheHit = readCache(url);
        if (cacheHit) {
          logDebug('Using cached manifest', url);
          return cacheHit;
        }
      }

      debugMetrics.apiCalls += 1;
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      const json = await response.json();
      writeCache(url, json);
      return json;
    }

    function cleanPath(value) {
      if (!value) return '';
      return String(value).replace(/\\+/g, '/').trim();
    }

    function canonicalizeType(value) {
      if (!value) return 'portfolio';
      const normalized = String(value).trim().toLowerCase();
      if (!normalized) return 'portfolio';
      if (['concert', 'concerts', 'music', 'music photography'].includes(normalized))
        return 'concert';
      if (
        ['event', 'events', 'event photography', 'corporate', 'events photography'].includes(
          normalized,
        )
      )
        return 'event';
      if (['journalism', 'photojournalism', 'photo journalism', 'documentary'].includes(normalized))
        return 'journalism';
      if (['portfolio', 'work', 'projects', 'featured'].includes(normalized)) return 'portfolio';
      return normalized;
    }

    function titleCase(value) {
      if (!value) return '';
      return String(value)
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function ensurePrefix(parts, prefix) {
      if (!Array.isArray(prefix) || !prefix.length) {
        return parts.slice();
      }
      const prefixLower = prefix.map((seg) => seg.toLowerCase());
      const currentLower = parts.slice(0, prefix.length).map((seg) => seg.toLowerCase());
      if (currentLower.join('/') === prefixLower.join('/')) {
        return parts.slice();
      }
      return prefix.concat(parts);
    }

    function resolvePathSegments(parts, item, rootSegments) {
      let resolved = parts.slice();
      const itemBase = cleanPath(
        item.basePath || item.base || item.collectionPath || item.rootPath || item.folderRoot || '',
      );
      if (itemBase) {
        const baseParts = itemBase.split('/').filter(Boolean);
        resolved = ensurePrefix(resolved, baseParts);
      }
      if (item.collection && typeof item.collection === 'string') {
        const collectionParts = cleanPath(item.collection).split('/').filter(Boolean);
        resolved = ensurePrefix(resolved, collectionParts);
      }
      resolved = ensurePrefix(resolved, rootSegments);
      return resolved;
    }

    function extractRootSegments(url) {
      try {
        const parsed = new URL(url);
        const segments = parsed.pathname.split('/').filter(Boolean);
        const marker = segments.lastIndexOf('Portfolios');
        if (marker === -1) return [];
        return segments.slice(marker + 1, segments.length - 1);
      } catch {
        return [];
      }
    }

    function normalizeImageRef(value) {
      if (!value) return null;
      const str = String(value).trim();
      if (!str) return null;
      return str.replace(/\\+/g, '/');
    }

    function normalizeImageEntries(images, cover) {
      const list = [];
      for (const entry of images) {
        const ref = normalizeImageRef(
          typeof entry === 'object'
            ? entry && (entry.src || entry.file || entry.filename || entry.path || entry.url)
            : entry,
        );
        if (ref) list.push(ref);
      }
      const coverRef = normalizeImageRef(cover);
      if (coverRef) {
        if (!list.includes(coverRef)) list.unshift(coverRef);
      }
      return list.slice(0, MAX_LIGHTBOX_IMAGES);
    }

    function encodeSegments(path) {
      return path
        .split('/')
        .filter(Boolean)
        .map((seg) => encodeURIComponent(seg))
        .join('/');
    }

    function buildImageUrl(pathSegments, imageRef) {
      if (!imageRef) return '';
      if (/^(https?:)?\/\//i.test(imageRef) || imageRef.startsWith('data:')) {
        return imageRef;
      }
      const normalized = normalizeImageRef(imageRef);
      if (!normalized) return '';
      if (normalized.startsWith('src/')) {
        return RAW_ROOT + normalized;
      }
      if (normalized.startsWith('images/')) {
        return RAW_ROOT + normalized;
      }
      if (normalized.startsWith('Portfolios/')) {
        return `${RAW_ROOT}src/images/${encodeSegments(normalized)}`;
      }
      if (normalized.startsWith('../')) {
        const trimmed = normalized.replace(/^\.\.\/+/, '');
        return `${RAW_ROOT}${encodeSegments(trimmed)}`;
      }
      if (normalized.includes('/')) {
        return `${RAW_ROOT}${PATH_PREFIX}${encodeSegments(normalized)}`;
      }
      const basePath = pathSegments.map((seg) => encodeURIComponent(seg)).join('/');
      return `${RAW_ROOT}${PATH_PREFIX}${basePath}/${encodeURIComponent(normalized)}`;
    }

    function dedupeItems(items) {
      const seen = new Set();
      const result = [];
      for (const item of items) {
        const key = `${item.id || ''}|${item.folderKey}|${item.cover || ''}`;
        if (seen.has(key)) continue;
        seen.add(key);
        result.push(item);
      }
      return result;
    }

    function extractDate(entry) {
      const dateData = entry.date || entry.datetime || entry.metaDate || null;
      const displayCandidates = [
        entry.dateDisplay,
        entry.displayDate,
        entry.prettyDate,
        entry.dateText,
      ];
      const isoCandidates = [];
      if (typeof entry.dateISO === 'string') isoCandidates.push(entry.dateISO);
      if (typeof entry.dateIso === 'string') isoCandidates.push(entry.dateIso);
      if (typeof entry.date === 'string') isoCandidates.push(entry.date);
      if (typeof entry.lastUpdated === 'string') isoCandidates.push(entry.lastUpdated);
      if (typeof entry.generatedAt === 'string') isoCandidates.push(entry.generatedAt);
      if (typeof entry.generated === 'string') isoCandidates.push(entry.generated);

      if (dateData && typeof dateData === 'object') {
        if (typeof dateData.iso === 'string') isoCandidates.push(dateData.iso);
        if (typeof dateData.utc === 'string') isoCandidates.push(dateData.utc);
        if (typeof dateData.value === 'string') isoCandidates.push(dateData.value);
        if (dateData.year && dateData.month) {
          const day = dateData.day || 1;
          const iso = `${dateData.year}-${String(dateData.month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          isoCandidates.push(iso);
        }
        if (dateData.display) displayCandidates.push(dateData.display);
        if (dateData.dateDisplay) displayCandidates.push(dateData.dateDisplay);
        if (dateData.monthName && dateData.year) {
          displayCandidates.push(`${dateData.monthName} ${dateData.year}`);
        }
      }

      let iso = isoCandidates.find(Boolean) || null;
      let value = iso ? Date.parse(iso.replace(/\//g, '-')) : NaN;
      if (!Number.isFinite(value)) {
        value = 0;
        iso = null;
      }
      let display = displayCandidates.find(Boolean) || '';
      if (!display && iso) {
        try {
          display = new Date(value).toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'long',
          });
        } catch {
          display = iso;
        }
      }
      return { iso, display, value };
    }

    function normalizeItems(manifest, rootSegments = []) {
      const rawItems = Array.isArray(manifest?.items) ? manifest.items : [];
      return rawItems
        .map((item, index) => {
          const folderPath = cleanPath(item.folderPath || item.path || item.source || '');
          const rawParts = folderPath ? folderPath.split('/').filter(Boolean) : [];
          const parts = rawParts.length ? rawParts : [];
          if (!parts.length) return null;

          const pathSegments = resolvePathSegments(parts, item, rootSegments);
          if (!pathSegments.length) return null;

          const rawImages = Array.isArray(item.images) ? item.images : [];
          const coverCandidate =
            item.coverImage || item.cover || item.heroImage || item.thumbnail || null;
          const images = normalizeImageEntries(rawImages, coverCandidate);
          if (!images.length) return null;

          const { iso, display, value } = extractDate(item);
          const id = item.id || item.slug || item.uid || `${pathSegments.join('-')}-${index}`;
          const type = canonicalizeType(
            item.type || item.category || pathSegments[0] || 'portfolio',
          );
          const typeLabel = titleCase(type);
          const tags = Array.isArray(item.tags) ? item.tags.filter(Boolean) : [];
          const sourceLabel = titleCase(
            item.collection ||
              item.collectionName ||
              item.source ||
              pathSegments[0] ||
              typeLabel ||
              'Portfolio',
          );

          return {
            id,
            title:
              item.title ||
              item.name ||
              pathSegments[pathSegments.length - 1] ||
              `Item ${index + 1}`,
            type,
            typeLabel,
            source: sourceLabel,
            pathSegments,
            folderKey: pathSegments.join('/'),
            dateDisplay: display,
            dateValue: value,
            isoDate: iso,
            cover: images[0],
            images,
            tags,
          };
        })
        .filter(Boolean);
    }

    function applyRangeFilter(items) {
      if (!Number.isFinite(RANGE_DAYS) || RANGE_DAYS <= 0) {
        logDebug('Range filter disabled - showing all items');
        return items;
      }

      const cutoff = Date.now() - RANGE_DAYS * 24 * 60 * 60 * 1000;
      const cutoffDate = new Date(cutoff);

      logDebug(`Date filter: looking back ${RANGE_DAYS} days from ${new Date().toISOString()}`);
      logDebug(`Cutoff date: ${cutoffDate.toISOString()}`);

      // Debug: log each item's date
      items.forEach((item) => {
        const itemDate = new Date(item.dateValue);
        const isIncluded = item.dateValue >= cutoff;
        logDebug(
          `Item "${item.title}" (${item.type}): ${itemDate.toISOString()} - ${isIncluded ? 'INCLUDED' : 'EXCLUDED'}`,
        );
      });

      const filtered = items.filter((item) => item.dateValue >= cutoff);
      logDebug(`Range filter: ${items.length} items -> ${filtered.length} items after filtering`);

      return filtered.length ? filtered : items;
    }

    function ensureDiverseSelection(items, targetCount) {
      if (items.length <= targetCount) return items;

      // Group items by type
      const byType = {};
      items.forEach((item) => {
        const type = canonicalizeType(item.type);
        if (!byType[type]) byType[type] = [];
        byType[type].push(item);
      });

      const types = Object.keys(byType);
      logDebug(`Portfolio types available: ${types.join(', ')}`);

      if (types.length <= 1) {
        // If only one type, just return the newest items
        return items.slice(0, targetCount);
      }

      const result = [];

      // Calculate slots per type - ensure each type gets at least 2 items if possible
      const minPerType = Math.max(1, Math.floor(targetCount / types.length));
      const maxPerType = Math.min(
        targetCount - types.length + 1,
        Math.ceil((targetCount / types.length) * 1.5),
      );

      logDebug(
        `Diversity algorithm: ${minPerType}-${maxPerType} items per type for ${types.length} types`,
      );

      // Round-robin selection to ensure diversity
      let remainingSlots = targetCount;
      let round = 0;

      while (remainingSlots > 0 && round < 10) {
        // Safety limit
        let addedThisRound = 0;

        for (const type of types) {
          if (remainingSlots <= 0) break;

          const typeItems = byType[type];
          const alreadySelected = result.filter(
            (item) => canonicalizeType(item.type) === type,
          ).length;

          // Don't exceed maxPerType, but ensure minPerType
          if (alreadySelected < minPerType || (round === 0 && alreadySelected < maxPerType)) {
            const nextItem = typeItems[alreadySelected];
            if (nextItem) {
              result.push(nextItem);
              remainingSlots--;
              addedThisRound++;
            }
          }
        }

        // If we didn't add any items this round, fill remaining with newest overall
        if (addedThisRound === 0) {
          const remainingItems = items.filter((item) => !result.includes(item));
          result.push(...remainingItems.slice(0, remainingSlots));
          break;
        }

        round++;
      }

      // Log the final distribution
      const finalDistribution = {};
      result.forEach((item) => {
        const type = canonicalizeType(item.type);
        finalDistribution[type] = (finalDistribution[type] || 0) + 1;
      });
      logDebug('Final portfolio distribution:', finalDistribution);

      // Final sort by date (newest first)
      return result.sort((a, b) => b.dateValue - a.dateValue);
    }

    function renderEmpty() {
      grid.innerHTML =
        '<div class="featured-empty">No featured items available right now. Check back soon!</div>';
      grid.classList.add('loaded');
      loading.style.display = 'none';
    }

    function showError(message) {
      loading.style.display = 'none';
      grid.innerHTML = `<div class="featured-error">${message}</div>`;
      grid.classList.remove('loaded');
    }

    function isAggregateCandidate(candidate, index) {
      if (index === 0 && providedManifest) return true;
      const lower = candidate.toLowerCase();
      return lower.includes('featured-manifest') || lower.includes('portfolio-manifest');
    }

    async function loadAndRender(forceRefresh = false) {
      try {
        debugMetrics.startTime = performance.now();
        manifestSummary = '';
        activeManifestUrl = '';

        loading.style.display = 'flex';
        grid.style.display = 'none';
        grid.classList.remove('loaded');
        grid.innerHTML = '';
        debugStatus.textContent = 'Fetching manifests…';
        console.log(
          '[Featured Portfolio v1.4] Starting manifest load, candidates:',
          manifestSources,
        );

        const aggregated = [];
        const manifestDetails = [];
        const errors = [];

        for (let i = 0; i < manifestSources.length; i += 1) {
          const candidate = manifestSources[i];
          const url = resolveManifestUrl(candidate);
          const kindIsAggregate = isAggregateCandidate(candidate, i);

          try {
            const manifest = await fetchManifest(url, forceRefresh);
            const rootSegments = extractRootSegments(url);
            const normalized = normalizeItems(manifest, rootSegments);
            manifestDetails.push({ url, manifest, count: normalized.length });

            if (!normalized.length) continue;

            if (kindIsAggregate) {
              aggregated.splice(0, aggregated.length, ...normalized);
              manifestSummary = manifest.generated || manifest.generatedAt || '';
              activeManifestUrl = url;
              logDebug('Loaded aggregate manifest', { url, count: normalized.length });
              break;
            }

            aggregated.push(...normalized);
            if (!manifestSummary) {
              manifestSummary = manifest.generated || manifest.generatedAt || '';
            }
            activeManifestUrl = aggregated.length
              ? manifestDetails.map((item) => item.url).join(', ')
              : url;
            logDebug('Loaded manifest segment', { url, count: normalized.length });
          } catch (error) {
            errors.push({ url, error });
            logDebug(`Failed to load manifest: ${error.message}`, { url, error: error.message });
          }
        }

        if (!aggregated.length) {
          const errorMessage = errors.length
            ? errors.map((e) => `${e.error.message} (${e.url})`).join('; ')
            : 'No manifest items found.';
          throw new Error(errorMessage);
        }

        if (!activeManifestUrl) {
          activeManifestUrl = manifestDetails.map((item) => item.url).join(', ');
        }

        const deduped = dedupeItems(aggregated);
        const sorted = deduped.sort((a, b) => b.dateValue - a.dateValue);

        // Apply range filter
        const ranged = applyRangeFilter(sorted);

        // Use diverse selection if enabled, otherwise just take the newest items
        const slots = FORCE_DIVERSE
          ? ensureDiverseSelection(ranged, TARGET_PANES)
          : ranged.slice(0, TARGET_PANES);

        if (!slots.length) {
          renderEmpty();
          return;
        }

        debugMetrics.itemCount = slots.length;
        debugMetrics.imageCount = slots.reduce((acc, item) => acc + item.images.length, 0);
        debugMetrics.lastRefresh = new Date().toLocaleTimeString();
        debugMetrics.manifest = activeManifestUrl || '--';

        // Log portfolio type distribution for debugging
        const typeDistribution = {};
        slots.forEach((item) => {
          const type = item.type || 'portfolio';
          typeDistribution[type] = (typeDistribution[type] || 0) + 1;
        });
        logDebug('Portfolio type distribution', typeDistribution);

        metaCount.textContent = String(slots.length);
        metaUpdated.textContent = manifestSummary || debugMetrics.lastRefresh;
        const sourceSet = new Set(slots.map((item) => item.source.toUpperCase()));
        metaSource.textContent = sourceSet.size === 1 ? Array.from(sourceSet)[0] : 'MIXED';

        const fragment = document.createDocumentFragment();
        const cards = [];

        slots.forEach((slot, index) => {
          const card = document.createElement('article');
          card.className = 'featured-card loading';
          card.tabIndex = 0;
          card.dataset.dir = slot.folderKey;
          card.dataset.type = slot.type;

          const img = document.createElement('img');
          img.loading = 'lazy';
          img.decoding = 'async';
          img.alt = `${slot.title} � ${slot.typeLabel}`;

          const info = document.createElement('div');
          info.className = 'featured-info';
          const tagMarkup = slot.tags.length
            ? `<div class="featured-tags">${slot.tags
                .slice(0, 3)
                .map((tag) => `<span class="featured-tag">${tag}</span>`)
                .join('')}</div>`
            : '';
          info.innerHTML = `
          <h3 class="featured-title">${slot.title}</h3>
          <p class="featured-meta">${[slot.typeLabel, slot.dateDisplay].filter(Boolean).join(' | ')}</p>
          ${tagMarkup}
        `;

          card.appendChild(img);
          card.appendChild(info);
          fragment.appendChild(card);

          cards.push({ card, slot, img, index });

          const openLightbox = () => openLightboxFor(slot);
          card.addEventListener('click', openLightbox);
          card.addEventListener('keydown', (evt) => {
            if (evt.key === 'Enter' || evt.key === ' ') {
              evt.preventDefault();
              openLightbox();
            }
          });
        });

        grid.appendChild(fragment);
        grid.style.display = 'block';

        cards.forEach(({ card, slot, img, index }) => {
          setTimeout(() => loadCardImage({ card, slot, img }), index * CARDS_STAGGER);
        });

        requestAnimationFrame(() => {
          grid.classList.add('loaded');
        });

        updateDebugMetrics();
        logDebug('Featured gallery loaded', `${slots.length} items from ${debugMetrics.manifest}`);
      } catch (error) {
        console.error('Featured gallery failed:', error);
        logDebug('Featured gallery failed', error.message);
        showError(`Error loading featured gallery: ${error.message}`);
      }
    }

    async function loadCardImage({ card, slot, img }) {
      try {
        const coverRef = slot.cover || slot.images[0];
        const src = buildImageUrl(slot.pathSegments, coverRef);
        await loadImageWithRetry(img, src, 2);
        card.classList.remove('loading');
        card.classList.add('loaded');
      } catch (error) {
        console.warn(`Failed to load image for ${slot.title}:`, error);
        card.classList.remove('loading');
        card.classList.add('error');
      }
    }

    function loadImageWithRetry(img, src, maxRetries = 2) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const attempt = () => {
          const probe = new Image();
          probe.onload = () => {
            img.src = src;
            img.classList.add('loaded');
            resolve();
          };
          probe.onerror = () => {
            attempts += 1;
            if (attempts > maxRetries) {
              reject(new Error('Image failed to load'));
            } else {
              const backoff = Math.pow(2, attempts) * 1000;
              setTimeout(attempt, backoff);
            }
          };
          probe.src = src;
        };
        attempt();
      });
    }

    function openLightboxFor(slot) {
      lbGallery.innerHTML = '<div class="fp-hint">Scroll -></div>';

      slot.images.forEach((fileName) => {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = `${slot.title} photo`;
        img.className = 'loading';
        img.src = buildImageUrl(slot.pathSegments, fileName);
        img.addEventListener('load', () => {
          img.classList.remove('loading');
          img.classList.add('loaded');
        });
        lbGallery.appendChild(img);
      });

      lbTitle.textContent = slot.title;
      const metaBits = [
        slot.typeLabel,
        slot.dateDisplay,
        `${slot.images.length} photo${slot.images.length === 1 ? '' : 's'}`,
      ].filter(Boolean);
      lbMeta.textContent = metaBits.join(' | ');

      lb.classList.add('is-open');
      lb.setAttribute('aria-hidden', 'false');
      document.documentElement.classList.add('fp-open');
      lbDialog.focus();

      const hint = lbGallery.querySelector('.fp-hint');
      if (hint && slot.images.length > 1) {
        setTimeout(() => hint.classList.add('fade'), 3000);
      }
    }

    function closeLightbox() {
      lb.classList.remove('is-open');
      lb.setAttribute('aria-hidden', 'true');
      document.documentElement.classList.remove('fp-open');
    }

    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', (evt) => {
      if (evt.target === lb) closeLightbox();
    });
    document.addEventListener('keydown', (evt) => {
      if (evt.key === 'Escape' && lb.classList.contains('is-open')) {
        evt.preventDefault();
        closeLightbox();
      }
    });

    function updateDebugMetrics() {
      const loadTime = Math.round(performance.now() - debugMetrics.startTime);
      document.getElementById('debugLoadTime').textContent = loadTime;
      document.getElementById('debugItemCount').textContent = debugMetrics.itemCount;
      document.getElementById('debugImageCount').textContent = debugMetrics.imageCount;
      document.getElementById('debugApiCalls').textContent = debugMetrics.apiCalls;
      document.getElementById('debugLastRefresh').textContent = debugMetrics.lastRefresh;
      document.getElementById('debugManifest').textContent = debugMetrics.manifest;
    }

    function updateNextRefreshIndicator() {
      const indicator = document.getElementById('autoRefreshIndicator');
      if (!indicator) return;

      let timeLeft = AUTO_REFRESH_INTERVAL;
      function tick() {
        const minutes = Math.floor(timeLeft / 60000);
        const seconds = Math.floor((timeLeft % 60000) / 1000);
        indicator.textContent = `Next refresh: ${minutes}:${String(seconds).padStart(2, '0')}`;
        if (timeLeft > 0) {
          timeLeft -= 1000;
          nextRefreshTimer = setTimeout(tick, 1000);
        }
      }
      tick();
    }

    function setupAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if (isTabVisible) {
          debugMetrics.startTime = performance.now();
          loadAndRender(true);
          updateNextRefreshIndicator();
        }
      }, AUTO_REFRESH_INTERVAL);
      updateNextRefreshIndicator();
    }

    versionIndicator.addEventListener('click', () => {
      alert(`Featured Portfolio v1.4\nActive manifest(s): ${debugMetrics.manifest}`);
    });

    loadAndRender();
    setupAutoRefresh();

    window.addEventListener('beforeunload', () => {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      if (nextRefreshTimer) clearTimeout(nextRefreshTimer);
    });
  })();
</script>
