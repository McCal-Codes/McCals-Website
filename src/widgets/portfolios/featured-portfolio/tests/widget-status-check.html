<!DOCTYPE html>
<html>
<head>
    <title>Widget Status Check</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #f0f0f0; }
        .status { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #4a2a2a; border-left: 4px solid #ff6b6b; }
        .success { background: #2a4a2a; border-left: 4px solid #51cf66; }
        .info { background: #2a3a4a; border-left: 4px solid #74c0fc; }
        .widget-container { background: #000; border: 2px solid #333; margin: 20px 0; }
        iframe { width: 100%; height: 600px; border: none; }
    </style>
</head>
<body>
    <h1>Widget Status Check</h1>
    
    <div id="status-log"></div>
    
    <div class="widget-container">
        <h3>Live Widget Test</h3>
        <iframe id="widget-frame" src="../versions/v1.5.html"></iframe>
    </div>

    <script>
        const statusLog = document.getElementById('status-log');
        
        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            statusLog.appendChild(div);
        }
        
        // Listen for widget messages
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'widget-debug') {
                const data = event.data.data;
                addStatus(`Widget Debug: ${JSON.stringify(data)}`, 'info');
            }
        });
        
        // Test widget loading
        const iframe = document.getElementById('widget-frame');
        iframe.onload = () => {
            addStatus('✅ Widget iframe loaded successfully', 'success');
            
            // Try to communicate with widget
            setTimeout(() => {
                try {
                    iframe.contentWindow.postMessage({ type: 'status-request' }, '*');
                    addStatus('📡 Sent status request to widget', 'info');
                } catch (error) {
                    addStatus(`❌ Cannot communicate with widget: ${error.message}`, 'error');
                }
            }, 2000);
        };
        
        iframe.onerror = () => {
            addStatus('❌ Widget iframe failed to load', 'error');
        };
        
        // Check if dev server is running
        fetch('../../../../src/images/Portfolios/Concert/concert-manifest.json')
            .then(response => {
                if (response.ok) {
                    addStatus('✅ Dev server is accessible', 'success');
                } else {
                    addStatus(`⚠️ Dev server returns HTTP ${response.status}`, 'error');
                }
            })
            .catch(error => {
                addStatus(`❌ Dev server not accessible: ${error.message}`, 'error');
            });
        
        addStatus('🔍 Widget status check started...', 'info');
    </script>
</body>
</html>
