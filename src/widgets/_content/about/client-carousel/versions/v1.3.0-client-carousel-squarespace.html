    function createTextLogo(client) {
      const textLogo = document.createElement('div');
      textLogo.className = 'ss-client-text-logo';
      textLogo.innerHTML = `
      <span class="company-name">${client.textFallback.company}</span>
      <span class="company-tagline">${client.textFallback.tagline}</span>
    `;
      return textLogo;
    }

    function handleLogoError(logoElement, client) {
      // Replace with text-based logo on error
      logoElement.innerHTML = '';
      const textLogo = createTextLogo(client);
      logoElement.appendChild(textLogo);
    }

    // Fisher-Yates shuffle algorithm for random client order
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function createClientCarousel() {
      const container = document.getElementById('ss-client-container');
      if (!container) return;

      // Shuffle the clients for random order each time
      const shuffledClients = shuffleArray(clientsData);

      // Create three copies for seamless infinite loop
      const tripleClients = [...shuffledClients, ...shuffledClients, ...shuffledClients];

      const carousel = document.createElement('div');
      carousel.className = 'ss-client-carousel';
      const track = document.createElement('ul');
      track.className = 'ss-client-track';
      track.setAttribute('role', 'list');
      track.setAttribute('aria-label', 'Client logos carousel');

      tripleClients.forEach((client) => {
        const logoElement = document.createElement('li');
        logoElement.className = 'ss-client-logo';
        logoElement.setAttribute('title', `${client.name} - ${client.project}`);

        // If no logo URL, use text fallback immediately
        if (!client.logo || client.logo.trim() === '') {
          const textLogo = createTextLogo(client);
          logoElement.appendChild(textLogo);
        } else {
          // Try loading image first
          const img = document.createElement('img');
          img.alt = `${client.name} logo - ${client.project}`;
          img.loading = 'lazy';
          if (client.logoClass) {
            img.classList.add(client.logoClass);
          }

          // Set up error handling before setting src
          img.onerror = () => handleLogoError(logoElement, client);

          // Add load event to ensure proper display
          img.onload = () => {
            // Image loaded successfully - white filter already applied via CSS
            img.style.opacity = '1';
          };

          img.src = client.logo;
          img.style.opacity = '0.9'; // Slightly transparent initially
          logoElement.appendChild(img);
        }

        if (client.website) {
          logoElement.setAttribute('role', 'button');
          logoElement.setAttribute('aria-label', `Open ${client.name} website`);
          logoElement.addEventListener('click', () => {
            window.open(client.website, '_blank', 'noopener noreferrer');
          });
        }

        track.appendChild(logoElement);
      });

      carousel.appendChild(track);
      container.className = 'ss-client-container';
      container.innerHTML = '';
      container.appendChild(carousel);

      // Inject Organization JSON-LD structured data for SEO
      try {
        const uniqueClients = Array.from(new Map(clientsData.map((c) => [c.name, c])).values());
        const orgSchema = {
          '@context': 'https://schema.org',
          '@type': 'Organization',
          name: 'McCal Media',
          url: 'https://mccalmedia.com',
          aggregateRating: {
            '@type': 'AggregateRating',
            ratingValue: '5.0',
            reviewCount: '50',
            bestRating: '5',
          },
          partner: uniqueClients.map((c) => ({
            '@type': 'Organization',
            name: c.name,
            ...(c.website ? { url: c.website } : {}),
          })),
        };
        const ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.textContent = JSON.stringify(orgSchema);
        // Append after the carousel for easier inspection
        container.parentElement.appendChild(ld);
      } catch (e) {
        console.warn('JSON-LD injection failed:', e);
      }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', createClientCarousel);
    } else {
      createClientCarousel();
    }
  })();
</script>
