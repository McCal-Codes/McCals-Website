    function slugify(input, fallback) {
      const value = (input || fallback || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
      return value || fallback || 'episode-' + Math.random().toString(36).slice(2, 7);
    }

    function formatDate(dateStr) {
      try {
        const date = new Date(dateStr);
        if (Number.isNaN(date.getTime())) return 'Recent';
        const now = new Date();
        const diff = now - date;
        const dayMs = 1000 * 60 * 60 * 24;
        if (diff < dayMs) return 'Today';
        if (diff < dayMs * 2) return 'Yesterday';
        if (diff < dayMs * 7) return Math.floor(diff / dayMs) + ' days ago';
        return date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
        });
      } catch (e) {
        return 'Recent';
      }
    }

    function cleanDescription(html) {
      if (!html) return '';
      const div = document.createElement('div');
      div.innerHTML = html;
      const text = (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
      return text;
    }

    function trimDescription(text) {
      if (!text) return '';
      return text.length > 220 ? text.slice(0, 217) + '...' : text;
    }

    function getEpisodeBadge(episode) {
      const pubDate = new Date(episode.pubDate);
      const now = new Date();

      if (daysSincePublished <= 7) {
        return '<span class="episode-badge new">New</span>';
      }

      // Show "Featured" badge for the most recent episode (index 0 in the list)
      // This would be determined by the order from the RSS feed
      return '';
    }

    function updateDebugInfo(statusText) {
      const loadTimeEl = document.getElementById('loadTime');
      const episodeCountEl = document.getElementById('episodeCount');
      const cacheStatusEl = document.getElementById('cacheStatus');
      const requestCountEl = document.getElementById('requestCount');
      const audioCountEl = document.getElementById('audioCount');
      const fallbackStatusEl = document.getElementById('fallbackStatus');
      const debugStatusEl = document.getElementById('debugStatus');
      const audioStatusEl = document.getElementById('audioStatus');

      if (loadTimeEl) loadTimeEl.textContent = Math.round(performance.now() - startTime).toString();
      if (episodeCountEl) episodeCountEl.textContent = episodeData.length.toString();
      if (cacheStatusEl) cacheStatusEl.textContent = cacheStatus;
      if (requestCountEl) requestCountEl.textContent = requestCount.toString();
      if (audioCountEl) audioCountEl.textContent = audioCount.toString();
      if (fallbackStatusEl) fallbackStatusEl.textContent = fallbackUsed ? 'YES' : 'NO';
      if (debugStatusEl && statusText) debugStatusEl.textContent = statusText;
      if (audioStatusEl) audioStatusEl.textContent = audioStatus;
    }

    function renderEpisodes(list) {
      const feedContainer = document.getElementById('podcastFeed');
      const grid = document.getElementById('episodesGrid');
      const maxEpisodes = parseInt(feedContainer?.dataset?.maxEpisodes, 10) || 6;
      const episodesToRender = list.slice(0, maxEpisodes);

      audioCount = 0;
      episodeData = episodesToRender;
      if (grid) {
        grid.innerHTML = episodesToRender
          .map((episode, index) => createEpisodeCard(episode, index))
          .join('');
        episodesToRender.forEach((episode) => {
          const playerId = 'episode-' + slugify(episode.guid, episode.title);
          const audioEl = document.getElementById('audio-' + playerId);
          if (audioEl) {
            const urlFromEpisode = episode.audioUrl || audioByLink.get(episode.link);
            if (urlFromEpisode) {
              audioEl.src = urlFromEpisode;
              audioEl.crossOrigin = 'anonymous';
              audioEl.preload = 'metadata';
            }
          }
        });
      }

      updateDebugInfo('Rendered ' + episodesToRender.length + ' episode cards.');
      audioStatus = 'idle';
      const audioStatusEl = document.getElementById('audioStatus');
      if (audioStatusEl) audioStatusEl.textContent = audioStatus;
    }

    function getCachedEpisodes() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (!cached) {
          cacheStatus = 'MISS';
          return null;
        }
        const parsed = JSON.parse(cached);
        if (!parsed || !Array.isArray(parsed.episodes) || !parsed.timestamp) {
          cacheStatus = 'MISS';
          return null;
        }
        if (Date.now() - parsed.timestamp > CACHE_TTL) {
          cacheStatus = 'STALE';
          return parsed.episodes;
        }
        cacheStatus = 'HIT';
        return parsed.episodes;
      } catch (e) {
        cacheStatus = 'MISS';
        return null;
      }
    }

    function saveEpisodesToCache(episodes) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ episodes, timestamp: Date.now() }));
      } catch (e) {
        // ignore cache failure
      }
    }

    function updateDescriptionFromFeed(text) {
      const cleaned = trimDescription(cleanDescription(text));
      if (!cleaned) return;
      const descriptionEl = document.getElementById('podcastDescription');
      if (descriptionEl) descriptionEl.textContent = cleaned;
    }

    function renderSpotifyEmbed() {
      try {
        const feed = document.getElementById('podcastFeed');
        const url = feed?.dataset?.spotifyShowUrl;
        const showIdMatch = (url || '').match(/open\.?.spotify\.com\/show\/([A-Za-z0-9]+)/);
        if (!showIdMatch) return;
        const mount = document.getElementById('spotifyEmbedMount');
        if (!mount) return;
        const iframe = document.createElement('iframe');
        iframe.style.borderRadius = '12px';
        iframe.style.border = '0';
        iframe.width = '100%';
        iframe.height = '152';
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
        iframe.loading = 'lazy';
        iframe.src =
          'https://open.spotify.com/embed/show/' + showIdMatch[1] + '?utm_source=generator';
        mount.innerHTML = '';
        mount.appendChild(iframe);
      } catch (e) {
        // ignore embed failure
      }
    }

    async function fetchEpisodesFromFeed() {
      const feed = document.getElementById('podcastFeed');
      const feedUrl = feed?.dataset?.feedUrl;
      if (!feedUrl) return null;
      requestCount++;
      updateDebugInfo('Fetching latest episodes from RSS feed...');
      let contents = '';
      try {
        updateDebugInfo('Attempting AllOrigins proxy...');
        const response = await fetch(
          'https://api.allorigins.win/get?url=' + encodeURIComponent(feedUrl),
          { signal: createTimeoutSignal(8000) },
        );
        if (response.ok) {
          const payload = await response.json();
          contents = payload?.contents || '';
        } else {
          throw new Error('AllOrigins failed');
        }
      } catch (e) {
        updateDebugInfo('AllOrigins failed, falling back to CORS.sh...');
        try {
          const response = await fetch('https://proxy.cors.sh/' + feedUrl, {
            headers: { 'x-cors-gratis': 'true' },
            signal: createTimeoutSignal(8000),
          });
          if (response.ok) {
            contents = await response.text();
          } else {
            throw new Error('CORS.sh failed');
          }
        } catch (e2) {
          log('All proxies failed:', e2.message);
          throw new Error('All CORS proxies failed');
        }
      }

      const parser = new DOMParser();
      const xml = parser.parseFromString(contents, 'text/xml');

      const channelDescription = xml.querySelector('channel > description')?.textContent?.trim();
      if (channelDescription) updateDescriptionFromFeed(channelDescription);

      const imageFromFeed = xml.querySelector('channel > image > url')?.textContent?.trim();
      if (imageFromFeed) {
        FALLBACK_EPISODES.forEach((episode) => {
          if (!episode.image) episode.image = imageFromFeed;
        });
      }

      const items = Array.from(xml.querySelectorAll('item'));
      if (!items.length) throw new Error('Feed returned no episodes');

      const episodes = items.map((item, index) => {
        const title = item.querySelector('title')?.textContent?.trim() || 'New Episode';
        const description = item.querySelector('description')?.textContent || '';
        const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';
        const link = item.querySelector('link')?.textContent?.trim() || '';
        const guidRaw =
          item.querySelector('guid')?.textContent?.trim() || link || 'episode-' + index;
        const enclosure = item.querySelector('enclosure');
        const audioUrl = enclosure?.getAttribute('url') || '';
        const itunesImageNode = item.querySelector('itunes\\:image');
        const genericImageNode = item.querySelector('image');
        let image = imageFromFeed || podcastImage;
        if (itunesImageNode && typeof itunesImageNode.getAttribute === 'function') {
          image = itunesImageNode.getAttribute('href') || image;
        } else if (genericImageNode && genericImageNode.textContent) {
          image = genericImageNode.textContent.trim() || image;
        }
        if (link && audioUrl) audioByLink.set(link, audioUrl);
        return {
          title,
          description,
          pubDate,
          link,
          guid: slugify(guidRaw, title),
          audioUrl,
          image,
        };
      });

      return episodes;
    }

    async function hydrateEpisodes() {
      if (hydrationPromise) return hydrationPromise;
      hydrationPromise = (async () => {
        try {
          const episodes = await fetchEpisodesFromFeed();
          if (!episodes || !episodes.length) return;
          fallbackUsed = false;
          cacheStatus = cacheStatus === 'STALE' ? 'REFRESH' : 'NETWORK';
          saveEpisodesToCache(episodes);
          renderEpisodes(episodes);
          updateDebugInfo('Episodes refreshed from RSS feed.');
        } catch (error) {
          console.warn('Podcast feed refresh failed:', error);
          updateDebugInfo('Using fallback data (RSS unavailable).');
          fallbackUsed = true;
          audioStatus = 'disabled';
          const audioStatusEl = document.getElementById('audioStatus');
          if (audioStatusEl) audioStatusEl.textContent = audioStatus;
        } finally {
          hydrationPromise = null;
        }
      })();
      return hydrationPromise;
    }

    const previewTimers = new Map();
    const previewListeners = new Map();

    function clearPreview(playerId) {
      try {
        const timer = previewTimers.get(playerId);
        if (timer) {
          clearTimeout(timer);
          previewTimers.delete(playerId);
        }
        const listener = previewListeners.get(playerId);
        if (listener) {
          const audio = document.getElementById('audio-' + playerId);
          if (audio) audio.removeEventListener('timeupdate', listener);
          previewListeners.delete(playerId);
        }
      } catch (e) {
        // ignore cleanup failure
      }
    }

    function ensureAudioSource(playerId) {
      const container = document.getElementById('player-' + playerId);
      const audioEl = document.getElementById('audio-' + playerId);
      if (!container || !audioEl) return false;
      if (audioEl.src) return true;
      const link = container.dataset.episodeLink;
      const mappedUrl = audioByLink.get(link);
      if (mappedUrl) {
        audioEl.src = mappedUrl;
        audioEl.crossOrigin = 'anonymous';
        audioEl.preload = 'metadata';
        return true;
      }
      return false;
    }

    return {
      previewAudio: async function (playerId, seconds) {
        try {
          const audio = document.getElementById('audio-' + playerId);
          const btn = document.getElementById('playBtn-' + playerId);
          const container = document.getElementById('player-' + playerId);
          if (!audio || !btn || !container) return;

          if (!ensureAudioSource(playerId)) {
            await hydrateEpisodes();
            if (!ensureAudioSource(playerId)) {
              const titleEl = container.querySelector('.audio-title');
              if (titleEl) titleEl.textContent = 'Audio not yet available';
              return;
            }
          }

          if (currentlyPlaying && currentlyPlaying !== playerId) {
            this.stopAudio(currentlyPlaying);
          }

          if (!(isFinite(audio.duration) && audio.readyState >= 1)) {
            await new Promise((resolve) => {
              audio.addEventListener('loadedmetadata', resolve, { once: true });
            });
          }

          const previewSec = Math.max(1, Number(seconds) || 15);
          const guard = 1;
          const duration = isFinite(audio.duration) ? audio.duration : 0;
          const maxStart = Math.max(0, duration - previewSec - guard);
          const start = maxStart > 0 ? Math.random() * maxStart : 0;

          clearPreview(playerId);
          audio.currentTime = start;
          currentlyPlaying = playerId;
          audioStatus = 'preview';
          btn.classList.add('loading');
          updateDebugInfo('Playing preview from ' + start.toFixed(1) + 's');
          try {
            await audio.play();
          } catch (e) {
            this.onAudioError(playerId);
            return;
          } finally {
            btn.classList.remove('loading');
          }

          btn.classList.add('playing');
          btn.innerHTML =
            '<svg class="icon" viewBox="0 0 24 24" width="22" height="22"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

          const stopAt = start + previewSec;
          const endPreview = () => {
            clearPreview(playerId);
            audio.pause();
            btn.classList.remove('playing', 'loading');
            btn.innerHTML =
              '<svg class="icon" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>';
            if (currentlyPlaying === playerId) currentlyPlaying = null;
            audioStatus = 'idle';
            updateDebugInfo('Preview ended.');
          };

          const onTimeUpdate = () => {
            if (audio.currentTime >= stopAt || audio.ended) endPreview();
          };
          audio.addEventListener('timeupdate', onTimeUpdate);
          previewListeners.set(playerId, onTimeUpdate);
          const timer = setTimeout(endPreview, (previewSec + 2) * 1000);
          previewTimers.set(playerId, timer);
        } catch (error) {
          console.error('previewAudio error:', error);
        }
      },

      toggleAudio: function (playerId) {
        const audio = document.getElementById('audio-' + playerId);
        const btn = document.getElementById('playBtn-' + playerId);
        if (!audio || !btn) return;
        if (!ensureAudioSource(playerId)) {
          hydrateEpisodes();
          updateDebugInfo('Attempting to fetch audio source...');
          return;
        }
        if (currentlyPlaying && currentlyPlaying !== playerId) this.stopAudio(currentlyPlaying);
        if (audio.paused) {
          this.playAudio(playerId);
        } else {
          this.pauseAudio(playerId);
        }
      },

      playAudio: function (playerId) {
        const audio = document.getElementById('audio-' + playerId);
        const btn = document.getElementById('playBtn-' + playerId);
        if (!audio || !btn) return;
        clearPreview(playerId);
        currentlyPlaying = playerId;
        audioStatus = 'playing';
        btn.classList.add('loading');
        audio.volume = 0.8;
        audio
          .play()
          .then(() => {
            btn.classList.remove('loading');
            btn.classList.add('playing');
            btn.innerHTML =
              '<svg class="icon" viewBox="0 0 24 24" width="22" height="22"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
            updateDebugInfo('Playing full episode audio.');
          })
          .catch((err) => {
            console.error('Audio play failed:', err);
            this.onAudioError(playerId);
          });
      },

      pauseAudio: function (playerId) {
        const audio = document.getElementById('audio-' + playerId);
        const btn = document.getElementById('playBtn-' + playerId);
        if (!audio || !btn) return;
        clearPreview(playerId);
        audio.pause();
        btn.classList.remove('playing', 'loading');
        btn.innerHTML =
          '<svg class="icon" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>';
        audioStatus = 'paused';
        updateDebugInfo('Audio paused.');
      },

      stopAudio: function (playerId) {
        const audio = document.getElementById('audio-' + playerId);
        const btn = document.getElementById('playBtn-' + playerId);
        const progress = document.getElementById('progress-' + playerId);
        const timeDisplay = document.getElementById('currentTime-' + playerId);
        clearPreview(playerId);
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
        if (btn) {
          btn.classList.remove('playing', 'loading', 'error');
          btn.innerHTML =
            '<svg class="icon" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>';
        }
        if (progress) progress.style.width = '0%';
        if (timeDisplay) timeDisplay.textContent = '0:00';
        if (currentlyPlaying === playerId) currentlyPlaying = null;
        audioStatus = 'idle';
        updateDebugInfo('Audio stopped.');
      },

      seekAudio: function (playerId, event) {
        if (currentlyPlaying !== playerId) return;
        const audio = document.getElementById('audio-' + playerId);
        if (!audio || !audio.duration) return;
        const rect = event.currentTarget.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        audio.currentTime = pct * audio.duration;
      },

      setVolume: function (playerId, volume) {
        const audio = document.getElementById('audio-' + playerId);
        if (audio) audio.volume = (Number(volume) || 0) / 100;
      },

      onAudioLoaded: function (playerId) {
        const durationEl = document.getElementById('duration-' + playerId);
        const audio = document.getElementById('audio-' + playerId);
        if (durationEl && audio && isFinite(audio.duration)) {
          const minutes = Math.floor(audio.duration / 60);
          const seconds = Math.floor(audio.duration % 60)
            .toString()
            .padStart(2, '0');
          durationEl.textContent = minutes + ':' + seconds;
        }
      },

      onTimeUpdate: function (playerId) {
        if (currentlyPlaying !== playerId) return;
        const audio = document.getElementById('audio-' + playerId);
        const progress = document.getElementById('progress-' + playerId);
        const timeDisplay = document.getElementById('currentTime-' + playerId);
        if (audio && progress && timeDisplay && audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          progress.style.width = pct + '%';
          const minutes = Math.floor(audio.currentTime / 60);
          const seconds = Math.floor(audio.currentTime % 60)
            .toString()
            .padStart(2, '0');
          timeDisplay.textContent = minutes + ':' + seconds;
        }
      },

      onAudioEnded: function (playerId) {
        this.stopAudio(playerId);
      },

      onAudioError: function (playerId) {
        const btn = document.getElementById('playBtn-' + playerId);
        const title = document.querySelector('#player-' + playerId + ' .audio-title');
        if (btn) {
          btn.classList.remove('loading', 'playing');
          btn.classList.add('error');
        }
        if (title) title.textContent = 'Audio unavailable';
        audioStatus = 'error';
        if (currentlyPlaying === playerId) currentlyPlaying = null;
        updateDebugInfo('Audio error encountered.');
      },

      toggleDebug: function () {
        debugActive = !debugActive;
        const panel = document.getElementById('debugPanel');
        if (debugActive && !panel) {
          // Lazy-load debug panel when first activated
          this.createDebugPanel();
        } else if (panel) {
          panel.classList.toggle('active', debugActive);
        }
        updateDebugInfo(debugActive ? 'Debug panel enabled.' : 'Debug panel hidden.');
      },

      createDebugPanel: function () {
        const debugPanel = document.createElement('div');
        debugPanel.id = 'debugPanel';
        debugPanel.className = 'debug-panel active';
        debugPanel.innerHTML = `
        <h4 style="margin:0 0 8px;font-size:12px;color:var(--accent);font-weight:700;">Podcast Debug</h4>
        <div style="display:flex;flex-direction:column;gap:3px;margin-bottom:6px;">
          <div><strong>Load Time:</strong> <span id="loadTime">--</span>ms</div>
          <div><strong>Episodes:</strong> <span id="episodeCount">--</span></div>
          <div><strong>Cache:</strong> <span id="cacheStatus">--</span></div>
          <div><strong>Requests:</strong> <span id="requestCount">--</span></div>
          <div><strong>Audio Players:</strong> <span id="audioCount">--</span></div>
          <div><strong>Fallback:</strong> <span id="fallbackStatus">--</span></div>
          <div><strong>Audio Status:</strong> <span id="audioStatus">--</span></div>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;" id="debugStatus">Initializing...</div>
        <div class="debug-actions">
          <button class="dbg-btn" onclick="PodcastWidget.refreshData()">Refresh</button>
          <button class="dbg-btn" onclick="PodcastWidget.clearCache()">Clear Cache</button>
        </div>
      `;
        document.getElementById('podcastFeed').appendChild(debugPanel);
      },

      init: function () {
        const feed = document.getElementById('podcastFeed');
        const joinButton = document.getElementById('podcastJoinButton');
        const calendlyUrl = feed?.dataset?.calendlyUrl?.trim();
        if (joinButton) {
          if (calendlyUrl) {
            joinButton.href = calendlyUrl;
          } else {
            joinButton.remove();
          }
        }
        const descriptionEl = document.getElementById('podcastDescription');
        if (descriptionEl && feed?.dataset?.podcastDescription) {
          descriptionEl.textContent = feed.dataset.podcastDescription;
        }
        if (feed?.dataset?.spotifyEmbed === 'true') renderSpotifyEmbed();

        const cached = getCachedEpisodes();
        if (cached && cached.length) {
          fallbackUsed = false;
          renderEpisodes(cached);
          audioStatus = 'idle';
          updateDebugInfo('Loaded episodes from cache.');
        } else {
          fallbackUsed = true;
          renderEpisodes(FALLBACK_EPISODES);
          // Populate audio URLs for fallback episodes
          FALLBACK_EPISODES.forEach((episode) => {
            if (episode.link && episode.audioUrl) {
              audioByLink.set(episode.link, episode.audioUrl);
            }
          });
          updateDebugInfo('Showing fallback episodes while RSS loads.');
        }

        hydrateEpisodes();
      },
    };
  })();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => PodcastWidget.init());
  } else {
    PodcastWidget.init();
  }
</script>
