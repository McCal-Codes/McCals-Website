        --mcc-radius-sm: 10px;
      }

        :root {
          --mcc-bg: #f7f7f8;
          --mcc-bg-soft: #ffffff;
          --mcc-card: rgba(255, 255, 255, 0.84);
          --mcc-border: rgba(0, 0, 0, 0.1);

        border-radius: 999px;

    <script>
      /**
       * Roadmap content layer (easy monthly updates):
       * - Update `meta.lastUpdated`.
       * - Add or edit milestones in tracks.life / tracks.webdev.
       * - Status values: completed | active | future.
       */
      const ROADMAP_CONTENT = {
        meta: {
          lastUpdated: '2026-03-02',
          owner: 'Caleb McCartney',
          siteUrl: 'https://mcc-cal.com/roadmap',
        },
        tracks: {
          life: {
            title: 'Creative Evolution',
            subtitle: 'From experimentation to deeper storytelling and critical observation.',
            storyTitle: 'Life & Photography Journey',
            storyBody: [
              'My creative work evolved from technical experimentation into documentary and conceptual storytelling grounded in lived experience.',
              'This track captures major artistic phases, core themes, and the direction I am building toward next.',
            ],
            stats: [
              { label: 'Years Active', value: '6+' },
              { label: 'Core Themes', value: '3' },
              { label: 'Major Eras', value: '5' },
              { label: 'Current Focus', value: 'Synthesis' },
            ],
            milestones: [
              {
                time: '2018 - 2022',
                title: 'Foundations',
                status: 'completed',
                highlights: [
                  'Built technical fundamentals in composition, darkroom techniques, and visual metaphor.',
                  'Early writing and image experiments explored fear, pressure, and identity.',
                ],
              },
              {
                time: '2023 - 2024',
                title: 'Depth & Voice',
                status: 'completed',
                highlights: [
                  'Shifted toward candid photojournalism and emotionally grounded narratives.',
                  'Used visual storytelling to process grief, trauma, and social tension.',
                ],
              },
              {
                time: 'Jan 2025',
                title: 'Critical Eye',
                status: 'completed',
                highlights: [
                  'Developed stronger social critique in writing and image framing.',
                  'Connected theory and lived experience through essays and portfolio direction.',
                ],
              },
              {
                time: 'Spring 2025',
                title: 'One Nation Divided',
                status: 'completed',
                highlights: [
                  'Blended documentary and pop-art aesthetics to explore polarization.',
                  'Focused on participant-observer reporting and reflective analysis.',
                ],
              },
              {
                time: '2026+',
                title: 'Nuanced Trajectory',
                status: 'future',
                highlights: [
                  'Unify personal memoir with broader social and political analysis.',
                  'Position art as both witness and healing mechanism.',
                ],
              },
            ],
          },
          webdev: {
            title: 'Web Development Journey',
            subtitle: 'Rapid growth from fundamentals to architecture, automation, and production delivery.',
            storyTitle: 'From Zero to Production',
            storyBody: [
              'I started web development to understand and control every layer of my own digital ecosystem.',
              'This track maps the sprint from basics to robust widget architecture, performance standards, and automation workflows.',
            ],
            stats: [
              { label: 'Git Commits', value: '500+' },
              { label: 'Widgets Built', value: '12+' },
              { label: 'Months Sprinting', value: '6' },
              { label: 'Core Stack', value: 'HTML/CSS/JS' },
            ],
            milestones: [
              {
                time: 'Sep 2025',
                title: 'The Spark',
                status: 'completed',
                highlights: [
                  'Learned HTML/CSS fundamentals and shipped first static pages.',
                  'Adopted Git workflows and started iterative feature delivery.',
                ],
              },
              {
                time: 'Oct 2025',
                title: 'JavaScript & Logic',
                status: 'completed',
                highlights: [
                  'Built dynamic widgets using DOM and async patterns.',
                  'Improved interaction design and image-heavy UI performance.',
                ],
              },
              {
                time: 'Nov 2025',
                title: 'Architecture',
                status: 'completed',
                highlights: [
                  'Standardized widget patterns and shared design tokens.',
                  'Improved reliability with workflows, validation, and CI support.',
                ],
              },
              {
                time: 'Dec 2025',
                title: 'Scale & Polish',
                status: 'completed',
                highlights: [
                  'Extended admin and content tooling with self-contained components.',
                  'Strengthened documentation and release structure.',
                ],
              },
              {
                time: 'Jan - Mar 2026',
                title: 'Optimization & Expansion',
                status: 'active',
                highlights: [
                  'Improve cross-device UX and SEO for core pages/widgets.',
                  'Expand API integrations and production observability.',
                ],
              },
              {
                time: '2026+',
                title: 'Mastery',
                status: 'future',
                highlights: [
                  'Scale full-stack services and automation confidence.',
                  'Refine teaching, documentation, and open-source quality.',
                ],
              },
            ],
          },
        },
      };

      const ROADMAP_SYNC_CONFIG = {
        enabled: true,
        maxItems: 4,
        appendLabel: 'Live TODO:',
      };

      const state = {
        mode: 'life',
        filter: 'all',
      };

      const dom = {
        root: document.querySelector('.mcc-roadmap'),
        title: document.getElementById('mcc-title'),
        subtitle: document.getElementById('mcc-subtitle'),
        story: document.getElementById('mcc-story'),
        stats: document.getElementById('mcc-stats'),
        timeline: document.getElementById('mcc-timeline'),
        lastUpdated: document.getElementById('mcc-last-updated'),
        syncStatus: document.getElementById('mcc-sync-status'),
        modeButtons: Array.from(document.querySelectorAll('.mcc-switch-btn')),
        filterButtons: Array.from(document.querySelectorAll('.mcc-filter-btn')),
      };

      function statusLabel(status) {
        if (status === 'completed') return 'Completed';
        if (status === 'active') return 'Active';
        return 'Future';
      }

      function escapeHtml(input) {
        return String(input)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function sanitizeTodoText(text) {
        return text
          .replace(/\[(.*?)\]\((.*?)\)/g, '$1')
          .replace(/`([^`]+)`/g, '$1')
          .replace(/\*\*([^*]+)\*\*/g, '$1')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function parseOpenTodoItems(markdown) {
        const lines = String(markdown || '').split(/\r?\n/);
        const open = [];

        for (const line of lines) {
          const checklistMatch = line.match(/^\s*-\s*\[\s\]\s*(.+)$/i);
          const todoTagMatch = line.match(/^\s*TODO:\s*(.+)$/i);
          const raw = checklistMatch ? checklistMatch[1] : todoTagMatch ? todoTagMatch[1] : null;
          if (!raw) continue;
          if (/\bIGNORE\b/i.test(raw)) continue;

          const cleaned = sanitizeTodoText(raw.replace(/^TODO:\s*/i, ''));
          if (!cleaned) continue;

          open.push(cleaned);
        }

        return open;
      }

      async function fetchTodoMarkdown(sourceUrl) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 3500);
        try {
          const response = await fetch(sourceUrl, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            signal: controller.signal,
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return await response.text();
        } finally {
          clearTimeout(timeout);
        }
      }

      function applyTodoSync(todoItems) {
        if (!todoItems.length) return { applied: false, reason: 'no-open-items' };

        const webdev = ROADMAP_CONTENT.tracks.webdev;
        const activeMilestone =
          webdev.milestones.find((milestone) => milestone.status === 'active') || webdev.milestones[0];

        if (!activeMilestone) return { applied: false, reason: 'no-milestone' };

        const feedItems = todoItems.slice(0, ROADMAP_SYNC_CONFIG.maxItems);
        const liveHighlights = feedItems.map((item) => `${ROADMAP_SYNC_CONFIG.appendLabel} ${item}`);

        activeMilestone.highlights = [...activeMilestone.highlights, ...liveHighlights];

        if (todoItems.length > ROADMAP_SYNC_CONFIG.maxItems) {
          activeMilestone.highlights.push(
            `Live TODO: +${todoItems.length - ROADMAP_SYNC_CONFIG.maxItems} additional open items in updates/todo.md`,
          );
        }

        const openStat = webdev.stats.find((stat) => stat.label === 'Open TODOs');
        if (openStat) {
          openStat.value = String(todoItems.length);
        } else {
          webdev.stats = [{ label: 'Open TODOs', value: String(todoItems.length) }, ...webdev.stats].slice(
            0,
            4,
          );
        }

        return { applied: true, count: todoItems.length };
      }

      async function syncWebDevRoadmapFromTodo() {
        if (!ROADMAP_SYNC_CONFIG.enabled) {
          return { applied: false, reason: 'disabled' };
        }

        const source =
          dom.root?.getAttribute('data-todo-source') ||
          'https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/updates/todo.md';

        try {
          const markdown = await fetchTodoMarkdown(source);
          const todoItems = parseOpenTodoItems(markdown);
          const result = applyTodoSync(todoItems);
          return { ...result, source };
        } catch (error) {
          return { applied: false, reason: 'fetch-failed', source, details: error?.message || 'unknown' };
        }
      }

      function renderStory(track) {
        dom.story.innerHTML = `
          <h2>${escapeHtml(track.storyTitle)}</h2>
          ${track.storyBody.map((line) => `<p>${escapeHtml(line)}</p>`).join('')}
        `;
      }

      function renderStats(track) {
        dom.stats.innerHTML = track.stats
          .map(
            (stat) => `
            <div class="mcc-stat">
              <div class="mcc-stat-value">${escapeHtml(stat.value)}</div>
              <div class="mcc-stat-label">${escapeHtml(stat.label)}</div>
            </div>
          `,
          )
          .join('');
      }

      function getFilteredMilestones(track) {
        if (state.filter === 'all') return track.milestones;
        return track.milestones.filter((m) => m.status === state.filter);
      }

      function renderTimeline(track) {
        const items = getFilteredMilestones(track);
        dom.timeline.innerHTML = items
          .map(
            (item) => `
            <article class="mcc-item" itemscope itemtype="https://schema.org/CreativeWork">
              <div class="mcc-item-head">
                <h3 class="mcc-item-title" itemprop="name">${escapeHtml(item.title)}</h3>
                <span class="mcc-chip ${escapeHtml(item.status)}">${statusLabel(item.status)}</span>
              </div>
              <div class="mcc-item-time" itemprop="temporalCoverage">${escapeHtml(item.time)}</div>
              <ul>
                ${item.highlights.map((h) => `<li itemprop="description">${escapeHtml(h)}</li>`).join('')}
              </ul>
            </article>
          `,
          )
          .join('');
      }

      function injectItemListSchema(track) {
        const old = document.getElementById('mcc-roadmap-itemlist-schema');
        if (old) old.remove();

        const schema = {
          '@context': 'https://schema.org',
          '@type': 'ItemList',
          name: `${track.title} Milestones`,
          itemListOrder: 'https://schema.org/ItemListOrderAscending',
          numberOfItems: track.milestones.length,
          itemListElement: track.milestones.map((milestone, index) => ({
            '@type': 'ListItem',
            position: index + 1,
            name: milestone.title,
            description: milestone.highlights.join(' '),
          })),
        };

        const script = document.createElement('script');
        script.id = 'mcc-roadmap-itemlist-schema';
        script.type = 'application/ld+json';
        script.textContent = JSON.stringify(schema);
        document.head.appendChild(script);
      }

      function setMode(nextMode) {
        if (!ROADMAP_CONTENT.tracks[nextMode]) return;
        state.mode = nextMode;
        const track = ROADMAP_CONTENT.tracks[nextMode];

        dom.title.textContent = track.title;
        dom.subtitle.textContent = track.subtitle;

        dom.modeButtons.forEach((btn) => {
          btn.setAttribute('aria-pressed', String(btn.dataset.mode === nextMode));
        });

        renderStory(track);
        renderStats(track);
        renderTimeline(track);
        injectItemListSchema(track);

        if (history.pushState) {
          history.replaceState(null, '', `#${nextMode}`);
        }
      }

      function setFilter(nextFilter) {
        state.filter = nextFilter;
        dom.filterButtons.forEach((btn) => {
          btn.setAttribute('aria-pressed', String(btn.dataset.filter === nextFilter));
        });
        renderTimeline(ROADMAP_CONTENT.tracks[state.mode]);
      }

      async function initialize() {
        dom.modeButtons.forEach((btn) => {
          btn.addEventListener('click', () => setMode(btn.dataset.mode));
        });

        dom.filterButtons.forEach((btn) => {
          btn.addEventListener('click', () => setFilter(btn.dataset.filter));
        });

        const syncResult = await syncWebDevRoadmapFromTodo();
        if (dom.syncStatus) {
          if (syncResult.applied) {
            dom.syncStatus.textContent = `Live sync: ${syncResult.count} open TODOs loaded from updates/todo.md`;
          } else {
            dom.syncStatus.textContent = 'Live sync: unavailable (using embedded roadmap data)';
          }
        }

        const hashMode = window.location.hash.replace('#', '');
        const initialMode = ROADMAP_CONTENT.tracks[hashMode] ? hashMode : 'life';
        setMode(initialMode);
        setFilter('all');

        dom.lastUpdated.textContent = `Last updated: ${ROADMAP_CONTENT.meta.lastUpdated}`;
      }

      initialize();
    </script>
  </body>
</html>
