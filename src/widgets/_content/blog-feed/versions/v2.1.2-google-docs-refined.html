<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Feed Widget v2.1.2 (Google Docs Refined)</title>
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 
         * McCals-Website Widget: Blog Feed (Google Docs)
         * Version: v2.1.2
         * Enhanced readability and precise parsing
         */

      :root {
        /* Monochrome Palette */
        --mcc-bg-primary: #ffffff;
        --mcc-bg-secondary: #f8f9fa;
        --mcc-text-primary: #0a0a0a;
        --mcc-text-secondary: #4a5568;
        --mcc-text-muted: #718096;
        --mcc-border: #e2e8f0;
        --mcc-accent: #000000;

        /* Glassmorphism */
        --mcc-glass-bg: rgba(255, 255, 255, 0.85);
        --mcc-glass-border: rgba(0, 0, 0, 0.08);
        --mcc-glass-blur: 20px;

        /* Shadows */
        --mcc-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
        --mcc-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --mcc-shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.12);

        /* Typography */
        --mcc-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --mcc-font-display: 'Outfit', sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --mcc-bg-primary: #1a1a1a;
          --mcc-bg-secondary: #0a0a0a;
          --mcc-text-primary: #f7fafc;
          --mcc-text-secondary: #cbd5e0;
          --mcc-text-muted: #a0aec0;
          --mcc-border: #2d3748;
          --mcc-accent: #ffffff;
          --mcc-glass-bg: rgba(26, 26, 26, 0.85);
          --mcc-glass-border: rgba(255, 255, 255, 0.1);
        }
      }

      * {
        box-sizing: border-box;
      }

      .mcc-blog-widget {
        font-family: var(--mcc-font-sans);
        color: var(--mcc-text-primary);
        line-height: 1.7;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Loading State */
      .mcc-blog-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 5rem 2rem;
        color: var(--mcc-text-muted);
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        border-radius: 2rem;
        backdrop-filter: blur(var(--mcc-glass-blur));
      }

      .mcc-blog-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--mcc-border);
        border-top-color: var(--mcc-accent);
        border-radius: 50%;
        animation: mcc-spin 1s linear infinite;
        margin-bottom: 1.5rem;
      }

      @keyframes mcc-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Blog Grid - Single Column for Better Readability */
      .mcc-blog-grid {
        display: flex;
        flex-direction: column;
        gap: 3rem;
        max-width: 900px;
        margin: 0 auto;
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }

      .mcc-blog-grid.mcc-loaded {
        opacity: 1;
        transform: translateY(0);
      }

      /* Blog Card - Magazine Style */
      .mcc-blog-card {
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        backdrop-filter: blur(var(--mcc-glass-blur));
        -webkit-backdrop-filter: blur(var(--mcc-glass-blur));
        border-radius: 1.5rem;
        overflow: hidden;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease,
          border-color 0.3s ease;
        box-shadow: var(--mcc-shadow-sm);
      }

      .mcc-blog-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--mcc-shadow-lg);
        border-color: var(--mcc-accent);
      }

      /* Hero Image - Wider Aspect Ratio */
      .mcc-blog-hero {
        width: 100%;
        height: 400px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .mcc-blog-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
      }

      .mcc-blog-card:hover .mcc-blog-hero img {
        transform: scale(1.03);
      }

      /* Card Content - Generous Spacing */
      .mcc-blog-content {
        padding: 2.5rem 3rem 3rem;
      }

      /* Meta Information */
      .mcc-blog-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        font-size: 0.875rem;
        color: var(--mcc-text-muted);
        margin-bottom: 1.25rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      .mcc-blog-category {
        background: var(--mcc-accent);
        color: var(--mcc-bg-primary);
        padding: 0.375rem 0.875rem;
        border-radius: 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .mcc-blog-date {
        color: var(--mcc-text-secondary);
      }

      .mcc-blog-author {
        color: var(--mcc-text-secondary);
        font-weight: 600;
      }

      /* Title - Large and Bold */
      .mcc-blog-title {
        font-family: var(--mcc-font-display);
        font-size: 2.25rem;
        font-weight: 800;
        margin: 0 0 1.5rem 0;
        line-height: 1.2;
        color: var(--mcc-text-primary);
        letter-spacing: -0.02em;
      }

      /* Excerpt - Readable and Spacious */
      .mcc-blog-excerpt {
        color: var(--mcc-text-secondary);
        font-size: 1.125rem;
        line-height: 1.8;
        margin-bottom: 2rem;
        font-weight: 400;
      }

      /* Tags */
      .mcc-blog-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.625rem;
        margin-bottom: 2rem;
      }

      .mcc-blog-tag {
        font-size: 0.8125rem;
        padding: 0.375rem 0.75rem;
        background: var(--mcc-bg-secondary);
        border: 1px solid var(--mcc-border);
        border-radius: 0.5rem;
        color: var(--mcc-text-secondary);
        font-weight: 500;
      }

      /* Read More Button */
      .mcc-blog-expand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 1.75rem;
        background: var(--mcc-accent);
        color: var(--mcc-bg-primary);
        font-family: var(--mcc-font-sans);
        font-weight: 700;
        text-decoration: none;
        font-size: 0.9375rem;
        border-radius: 0.75rem;
        border: none;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: var(--mcc-shadow-sm);
        letter-spacing: 0.01em;
        pointer-events: auto;
        position: relative;
        z-index: 10;
      }

      .mcc-blog-expand:hover {
        transform: translateY(-2px);
        box-shadow: var(--mcc-shadow-md);
      }

      .mcc-blog-expand:active {
        transform: translateY(0);
      }

      .mcc-blog-expand::after {
        content: '→';
        font-size: 1.125rem;
        transition: transform 0.2s;
      }

      .mcc-blog-expand:hover::after {
        transform: translateX(4px);
      }

      .mcc-blog-error {
        text-align: center;
        padding: 3rem 2rem;
        color: #dc2626;
        background: rgba(220, 38, 38, 0.05);
        border-radius: 1.5rem;
        border: 1px solid rgba(220, 38, 38, 0.2);
        font-size: 1rem;
      }

      .mcc-blog-error h3 {
        margin: 0 0 0.75rem 0;
        font-size: 1.25rem;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .mcc-blog-widget {
          padding: 2rem 1rem;
        }

        .mcc-blog-hero {
          height: 280px;
        }

        .mcc-blog-content {
          padding: 2rem 1.5rem 2.5rem;
        }

        .mcc-blog-title {
          font-size: 1.75rem;
        }

        .mcc-blog-excerpt {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body
    style="
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
    "
  >
    <div
      id="mccBlogWidget"
      class="mcc-blog-widget"
      data-doc-id="https://docs.google.com/document/d/e/2PACX-1vRYF2JnbIfiNkCq8zLMxnvedTHPjzXPYQsmVTqX75ossMlyCuxSNOARhdUXSeE9FrPXnZJUzf_dV6WD/pub"
      data-max-posts="12"
    >
      <div class="mcc-blog-loading">
        <div class="mcc-blog-spinner"></div>
        <span>Loading blog posts...</span>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        const CONFIG = {
          docId: document.getElementById('mccBlogWidget').dataset.docId,
          maxPosts: parseInt(document.getElementById('mccBlogWidget').dataset.maxPosts) || 6,
        };

        // --- Utils ---

        function getFetchUrl(input) {
          if (input.startsWith('http')) return input;
          return `https://docs.google.com/document/d/${input}/pub`;
        }

        async function fetchGoogleDoc(urlInput) {
          const url = getFetchUrl(urlInput);
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.text();
        }

        // --- Enhanced Metadata Extraction ---

        function extractMetadata(textBlock) {
          const result = {
            date: null,
            author: null,
            category: null,
            tags: [],
            excerpt: null,
          };

          const lines = textBlock
            .split('\n')
            .map((l) => l.trim())
            .filter(Boolean);

          for (const line of lines) {
            const lower = line.toLowerCase();

            // Structured metadata
            if (lower.startsWith('date:')) {
              result.date = parseDateString(line.substring(5).trim());
            } else if (lower.startsWith('category:')) {
              result.category = line.substring(9).trim();
            } else if (lower.startsWith('tags:')) {
              const tagStr = line.substring(5).trim();
              result.tags = tagStr
                .split(',')
                .map((t) => t.trim())
                .filter(Boolean);
            } else if (lower.startsWith('excerpt:')) {
              result.excerpt = line
                .substring(8)
                .trim()
                .replace(/^["']|["']$/g, '');
            }
            // "By Author" pattern
            else if (lower.startsWith('by ')) {
              const authorMatch = line.match(/^By\s+(.+?)(?:\s{2,}|\d|$)/i);
              if (authorMatch) {
                result.author = authorMatch[1].trim();
              }
            }
            // Inline date patterns
            else {
              const dateMatch = line.match(
                /(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})|(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4})/i,
              );
              if (dateMatch && !result.date) {
                result.date = parseDateString(dateMatch[0]);
              }
            }
          }

          return result;
        }

        function parseDateString(str) {
          if (!str) return null;

          // MM-DD-YY or MM/DD/YY
          const shortDate = str.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
          if (shortDate) {
            let year = shortDate[3];
            if (year.length === 2) year = '20' + year;
            const date = new Date(`${shortDate[1]}/${shortDate[2]}/${year}`);
            if (!isNaN(date.getTime())) return date;
          }

          // Natural language
          const parsed = new Date(str);
          if (!isNaN(parsed.getTime())) return parsed;

          return null;
        }

        // --- Improved Parsing Logic ---

        function parseGoogleDoc(html) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const posts = [];

          // Get all elements in order
          const allElements = Array.from(doc.body.querySelectorAll('*'));

          let currentPost = null;
          let metadataLines = [];
          let collectingMetadata = false;
          let bodyStarted = false;

          for (let i = 0; i < allElements.length; i++) {
            const el = allElements[i];
            const tag = el.tagName;
            const text = el.textContent.trim();

            // Skip empty elements
            if (!text) continue;

            // H1 or H2 = New Post
            if ((tag === 'H1' || tag === 'H2') && text.length > 0) {
              // Save previous post
              if (currentPost) {
                // Apply collected metadata
                if (metadataLines.length > 0) {
                  const meta = extractMetadata(metadataLines.join('\n'));
                  Object.assign(currentPost, meta);
                }
                posts.push(currentPost);
              }

              // Start new post
              currentPost = {
                title: text,
                body: '',
                images: [],
                author: null,
                date: null,
                category: null,
                tags: [],
                excerpt: null,
              };

              metadataLines = [];
              collectingMetadata = true;
              bodyStarted = false;
              continue;
            }

            if (!currentPost) continue;

            // Collect metadata (next few lines after title)
            if (collectingMetadata && !bodyStarted) {
              // Check if this looks like metadata
              const isMetadataLine =
                text.toLowerCase().match(/^(date:|category:|tags:|excerpt:|by |post:)/i) ||
                text.match(/\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/) ||
                text.match(/\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i);

              if (isMetadataLine && text.length < 150) {
                metadataLines.push(text);
                continue;
              } else if (tag.match(/^H[3-6]$/) && text.length < 100) {
                // Small headings might be metadata
                metadataLines.push(text);
                continue;
              } else if (tag === 'P' && text.length > 50) {
                // Real paragraph content - stop collecting metadata
                collectingMetadata = false;
                bodyStarted = true;

                // Apply metadata now
                if (metadataLines.length > 0) {
                  const meta = extractMetadata(metadataLines.join('\n'));
                  Object.assign(currentPost, meta);
                  metadataLines = [];
                }
              }
            }

            // Handle images
            if (tag === 'IMG') {
              currentPost.images.push(el.src);
              continue;
            }

            // Skip "Sources" heading and content after it
            if (text.toLowerCase() === 'sources' && tag.match(/^H[3-6]$/)) {
              // Stop processing this post's body
              break;
            }

            // Add body content
            if (
              bodyStarted &&
              ['P', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'H3', 'H4', 'H5', 'H6'].includes(tag)
            ) {
              // Skip metadata-like lines in body
              if (text.toLowerCase().match(/^(date:|category:|tags:|excerpt:|post:)/)) {
                continue;
              }

              // Clean Google redirect URLs
              el.querySelectorAll('a').forEach((a) => {
                try {
                  const urlObj = new URL(a.href);
                  if (urlObj.hostname.includes('google.com') && urlObj.searchParams.has('q')) {
                    a.href = urlObj.searchParams.get('q');
                  }
                } catch (e) {}
              });

              // Clean and add content
              let content = el.outerHTML;
              content = content.replace(/\s(class|style|id)="[^"]*"/g, '');
              currentPost.body += content;
            }
          }

          // Save last post
          if (currentPost) {
            if (metadataLines.length > 0) {
              const meta = extractMetadata(metadataLines.join('\n'));
              Object.assign(currentPost, meta);
            }
            posts.push(currentPost);
          }

          // Sort by date descending
          posts.sort((a, b) => {
            const dA = a.date || new Date(0);
            const dB = b.date || new Date(0);
            return dB - dA;
          });

          console.log('Parsed posts:', posts);
          return posts;
        }

        // --- Rendering ---

        function renderPosts(posts) {
          const container = document.getElementById('mccBlogWidget');

          if (posts.length === 0) {
            container.innerHTML = `<div class="mcc-blog-error">
                    <h3>No posts found</h3>
                    <p>Check that your document uses H1 or H2 for post titles.</p>
                </div>`;
            return;
          }

          const grid = document.createElement('div');
          grid.className = 'mcc-blog-grid';

          posts.slice(0, CONFIG.maxPosts).forEach((post) => {
            const article = document.createElement('article');
            article.className = 'mcc-blog-card';

            // Hero image
            const heroImg =
              post.images[0] ||
              'https://images.unsplash.com/photo-1499750310159-53f0f6145f4b?auto=format&fit=crop&w=1200&q=80';

            // Display date
            const displayDate = post.date
              ? post.date.toLocaleDateString('en-US', {
                  month: 'long',
                  day: 'numeric',
                  year: 'numeric',
                })
              : '';

            // Excerpt - use provided or generate
            let excerpt = post.excerpt;
            if (!excerpt && post.body) {
              const tmp = document.createElement('div');
              tmp.innerHTML = post.body;
              excerpt = tmp.textContent.substring(0, 220).trim() + '...';
            }

            // Meta elements
            const categoryHtml = post.category
              ? `<span class="mcc-blog-category">${post.category}</span>`
              : '';

            const authorHtml = post.author
              ? `<span class="mcc-blog-author">${post.author}</span>`
              : '';

            const dateHtml = displayDate ? `<span class="mcc-blog-date">${displayDate}</span>` : '';

            // Tags
            const tagsHtml =
              post.tags.length > 0
                ? `<div class="mcc-blog-tags">${post.tags.map((t) => `<span class="mcc-blog-tag">${t}</span>`).join('')}</div>`
                : '';

            article.innerHTML = `
                    <div class="mcc-blog-hero">
                        <img src="${heroImg}" alt="${post.title}" loading="lazy">
                    </div>
                    <div class="mcc-blog-content">
                        <div class="mcc-blog-meta">
                            ${categoryHtml}
                            ${dateHtml}
                            ${authorHtml}
                        </div>
                        <h2 class="mcc-blog-title">${post.title}</h2>
                        ${excerpt ? `<div class="mcc-blog-excerpt">${excerpt}</div>` : ''}
                        ${tagsHtml}
                        <button class="mcc-blog-expand" type="button">Read Full Article</button>
                    </div>
                `;

            // Click handler - attach after DOM insertion
            const expandBtn = article.querySelector('.mcc-blog-expand');
            console.log('Attaching click handler to button:', expandBtn);

            expandBtn.addEventListener('click', function (e) {
              console.log('Button clicked!', e);
              e.preventDefault();
              e.stopPropagation();

              // Escape HTML for safe insertion
              const escapeHtml = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
              };

              const newWindow = window.open('', '_blank');
              if (!newWindow) {
                alert('Please allow popups to read the full article');
                return;
              }

              newWindow.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${escapeHtml(post.title)}</title>
    <style>
        body{font-family:'Inter',system-ui,sans-serif;max-width:750px;margin:3rem auto;padding:0 2rem;line-height:1.8;color:#1a1a1a;font-size:1.0625rem;background:#fff}
        h1{font-size:2.75rem;font-weight:800;margin:0 0 1rem 0;line-height:1.15;letter-spacing:-0.02em}
        .meta{color:#718096;margin-bottom:2.5rem;font-size:0.9375rem;padding-bottom:1.5rem;border-bottom:1px solid #e2e8f0}
        .meta strong{color:#4a5568}
        img{max-width:100%;height:auto;border-radius:0.75rem;margin:2rem 0}
        p{margin:1.25rem 0}
        a{color:#000;font-weight:500;text-decoration:underline}
        a:hover{opacity:0.7}
        h2,h3,h4{margin:2rem 0 1rem;font-weight:700;line-height:1.3}
        h2{font-size:1.75rem}
        h3{font-size:1.375rem}
        h4{font-size:1.125rem}
        ul,ol{margin:1.25rem 0;padding-left:1.75rem}
        li{margin:0.5rem 0}
        blockquote{border-left:4px solid #e2e8f0;padding-left:1.5rem;margin:1.5rem 0;font-style:italic;color:#4a5568}
        @media(prefers-color-scheme:dark){
            body{background:#0a0a0a;color:#f7fafc}
            h1{color:#fff}
            .meta{color:#a0aec0;border-color:#2d3748}
            .meta strong{color:#cbd5e0}
            a{color:#fff}
            blockquote{border-color:#2d3748;color:#cbd5e0}
        }
    </style>
</head>
<body>
    <h1>${escapeHtml(post.title)}</h1>
    <div class="meta">
        ${displayDate ? `<strong>${escapeHtml(displayDate)}</strong>` : ''}
        ${post.author ? ` • ${escapeHtml(post.author)}` : ''}
        ${post.category ? ` • ${escapeHtml(post.category)}` : ''}
    </div>
    ${post.body}
</body>
</html>`);
              newWindow.document.close();
            });

            grid.appendChild(article);

            // SEO
            if (post.date) injectSeo(post, heroImg);
          });

          container.innerHTML = '';
          container.appendChild(grid);

          requestAnimationFrame(() => grid.classList.add('mcc-loaded'));
        }

        // --- SEO ---

        function injectSeo(post, image) {
          const script = document.createElement('script');
          script.type = 'application/ld+json';

          const schema = {
            '@context': 'https://schema.org',
            '@type': 'BlogPosting',
            headline: post.title,
            image: [image],
            datePublished: post.date ? post.date.toISOString() : new Date().toISOString(),
            author: {
              '@type': 'Person',
              name: post.author || 'Caleb McCartney',
            },
          };

          if (post.category) schema.articleSection = post.category;
          if (post.tags.length > 0) schema.keywords = post.tags.join(', ');
          if (post.excerpt) schema.description = post.excerpt;

          script.text = JSON.stringify(schema);
          document.head.appendChild(script);
        }

        // --- Init ---

        async function init() {
          try {
            const html = await fetchGoogleDoc(CONFIG.docId);
            const posts = parseGoogleDoc(html);
            renderPosts(posts);
          } catch (err) {
            console.error('Blog load error:', err);
            const container = document.getElementById('mccBlogWidget');
            container.innerHTML = `<div class="mcc-blog-error">
                    <h3>Unable to load blog</h3>
                    <p>${err.message}</p>
                    <p style="font-size:0.875rem;margin-top:1rem;opacity:0.8">Ensure the document is published to web.</p>
                </div>`;
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
