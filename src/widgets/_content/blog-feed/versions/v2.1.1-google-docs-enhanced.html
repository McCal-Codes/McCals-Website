<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Feed Widget v2.1.1 (Google Docs Enhanced)</title>
    <!-- Preload fonts to ensure premium feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 
         * McCals-Website Widget: Blog Feed (Google Docs)
         * Version: v2.1.1
         * Theme: Monochrome / Glassmorphism 2.0
         * 
         * Features:
         * - Google Docs as CMS (Public > Publish to Web)
         * - Enhanced metadata parsing (author, date, category, tags)
         * - Automatic SEO (JSON-LD injection)
         * - Client-side "Source" detection for attribution
         * - Premium Glassmorphism UI
         */

      :root {
        /* Core Monochrome Tokens */
        --mcc-color-bg: #f8f9fa;
        --mcc-color-text: #1a1a1a;
        --mcc-color-text-muted: #666666;
        --mcc-color-accent: #000000;

        /* Glassmorphism */
        --mcc-glass-bg: rgba(255, 255, 255, 0.7);
        --mcc-glass-border: rgba(255, 255, 255, 0.5);
        --mcc-glass-blur: 16px;
        --mcc-shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        --mcc-shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        --mcc-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);

        /* Typography */
        --mcc-font-sans: 'Inter', sans-serif;
        --mcc-font-display: 'Outfit', sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --mcc-color-bg: #0a0a0a;
          --mcc-color-text: #f3f4f6;
          --mcc-color-text-muted: #9ca3af;
          --mcc-color-accent: #ffffff;

          --mcc-glass-bg: rgba(20, 20, 20, 0.6);
          --mcc-glass-border: rgba(255, 255, 255, 0.1);
        }
      }

      /* Reset & Base */
      .mcc-blog-widget {
        font-family: var(--mcc-font-sans);
        color: var(--mcc-color-text);
        line-height: 1.6;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem;
        box-sizing: border-box;
      }

      /* Loading State */
      .mcc-blog-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem;
        color: var(--mcc-color-text-muted);
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        border-radius: 1.5rem;
        backdrop-filter: blur(var(--mcc-glass-blur));
      }

      .mcc-blog-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--mcc-glass-border);
        border-top-color: var(--mcc-color-accent);
        border-radius: 50%;
        animation: mcc-spin 1s linear infinite;
        margin-bottom: 1rem;
      }

      @keyframes mcc-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Blog Grid */
      .mcc-blog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2rem;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }

      .mcc-blog-grid.mcc-loaded {
        opacity: 1;
        transform: translateY(0);
      }

      /* Blog Card */
      .mcc-blog-card {
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        backdrop-filter: blur(var(--mcc-glass-blur));
        -webkit-backdrop-filter: blur(var(--mcc-glass-blur));
        border-radius: 1.5rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        box-shadow: var(--mcc-shadow-sm);
        height: 100%;
      }

      .mcc-blog-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--mcc-shadow-lg);
      }

      /* Hero Image */
      .mcc-blog-hero {
        width: 100%;
        height: 240px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .mcc-blog-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }

      .mcc-blog-card:hover .mcc-blog-hero img {
        transform: scale(1.05);
      }

      /* Card Content */
      .mcc-blog-content {
        padding: 1.5rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }

      .mcc-blog-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        font-size: 0.8125rem;
        color: var(--mcc-color-text-muted);
        margin-bottom: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .mcc-blog-category {
        background: var(--mcc-color-accent);
        color: white;
        padding: 0.25rem 0.625rem;
        border-radius: 0.375rem;
        font-size: 0.75rem;
      }

      .mcc-blog-title {
        font-family: var(--mcc-font-display);
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 1rem 0;
        line-height: 1.25;
        color: var(--mcc-color-text);
      }

      .mcc-blog-excerpt {
        color: var(--mcc-color-text-muted);
        font-size: 1rem;
        margin-bottom: 1.5rem;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        flex-grow: 1;
      }

      /* Source/Attribution */
      .mcc-blog-source {
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid var(--mcc-glass-border);
        font-size: 0.875rem;
        color: var(--mcc-color-text-muted);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .mcc-blog-source a {
        color: var(--mcc-color-accent);
        text-decoration: none;
        font-weight: 500;
        transition: opacity 0.2s;
      }

      .mcc-blog-source a:hover {
        opacity: 0.7;
      }

      /* Read More Button */
      .mcc-blog-expand {
        display: inline-flex;
        align-items: center;
        margin-top: 1rem;
        color: var(--mcc-color-accent);
        font-weight: 600;
        text-decoration: none;
        font-size: 0.95rem;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .mcc-blog-expand:hover {
        opacity: 0.7;
      }

      .mcc-blog-error {
        text-align: center;
        padding: 2rem;
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
        border-radius: 1rem;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      /* Tags */
      .mcc-blog-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .mcc-blog-tag {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 0.25rem;
        color: var(--mcc-color-text-muted);
      }
    </style>
  </head>
  <body
    style="
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
    "
  >
    <!-- 
      WIDGET CONFIGURATION 
      Replace data-doc-id with your Google Doc ID or full published URL
      Doc must be "Published to Web"
    -->
    <div
      id="mccBlogWidget"
      class="mcc-blog-widget"
      data-doc-id="https://docs.google.com/document/d/e/2PACX-1vRYF2JnbIfiNkCq8zLMxnvedTHPjzXPYQsmVTqX75ossMlyCuxSNOARhdUXSeE9FrPXnZJUzf_dV6WD/pub"
      data-max-posts="12"
    >
      <div class="mcc-blog-loading">
        <div class="mcc-blog-spinner"></div>
        <span>Loading updates...</span>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        const CONFIG = {
          docId: document.getElementById('mccBlogWidget').dataset.docId,
          maxPosts: parseInt(document.getElementById('mccBlogWidget').dataset.maxPosts) || 6,
        };

        // --- Utils ---

        function sanitizeHtml(html) {
          const temp = document.createElement('div');
          temp.innerHTML = html || '';

          const forbidden = ['SCRIPT', 'IFRAME', 'OBJECT', 'EMBED', 'STYLE', 'LINK', 'META'];
          temp.querySelectorAll('*').forEach((el) => {
            if (forbidden.includes(el.tagName)) el.remove();
          });

          temp.querySelectorAll('*').forEach((el) => {
            [...el.attributes].forEach((attr) => {
              if (attr.name.startsWith('on')) el.removeAttribute(attr.name);
              if (attr.name === 'href' && attr.value.startsWith('javascript:'))
                el.removeAttribute('href');
            });
          });

          return temp.innerHTML;
        }

        function getFetchUrl(input) {
          if (input.startsWith('http')) return input;
          return `https://docs.google.com/document/d/${input}/pub`;
        }

        // --- Fetching ---

        async function fetchGoogleDoc(urlInput) {
          const url = getFetchUrl(urlInput);
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.text();
          } catch (e) {
            throw new Error(
              "Could not fetch document. Ensure 'File > Share > Publish to web' is active.",
            );
          }
        }

        // --- Parsing ---

        function extractMetadata(text) {
          const result = {
            date: null,
            author: null,
            category: null,
            tags: [],
            excerpt: null,
            image: null,
          };

          if (!text) return result;

          // Parse structured metadata (looking for patterns like "date: value")
          const lines = text.split('\n');

          for (const line of lines) {
            const trimmed = line.trim().toLowerCase();

            // Date patterns
            if (trimmed.startsWith('date:')) {
              const dateStr = line.substring(line.indexOf(':') + 1).trim();
              result.date = parseDateString(dateStr);
            }

            // Category
            if (trimmed.startsWith('category:')) {
              result.category = line.substring(line.indexOf(':') + 1).trim();
            }

            // Tags
            if (trimmed.startsWith('tags:')) {
              const tagStr = line.substring(line.indexOf(':') + 1).trim();
              result.tags = tagStr
                .split(',')
                .map((t) => t.trim())
                .filter(Boolean);
            }

            // Excerpt
            if (trimmed.startsWith('excerpt:')) {
              result.excerpt = line.substring(line.indexOf(':') + 1).trim();
            }

            // Image
            if (trimmed.startsWith('image:')) {
              result.image = line.substring(line.indexOf(':') + 1).trim();
            }
          }

          // Also try inline "By Author" pattern
          const byMatch = text.match(/By\s+([A-Za-z\s]+?)(?=\s{2,}|\d{1,2}|$)/i);
          if (byMatch) {
            result.author = byMatch[1].trim();
          }

          // Try date patterns in text
          if (!result.date) {
            const dateMatch = text.match(
              /(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})|(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4})/i,
            );
            if (dateMatch) {
              result.date = parseDateString(dateMatch[0]);
            }
          }

          return result;
        }

        function parseDateString(str) {
          if (!str) return null;

          // Try various formats
          // MM-DD-YY or MM/DD/YY
          const shortDate = str.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
          if (shortDate) {
            let year = shortDate[3];
            if (year.length === 2) year = '20' + year;
            return new Date(`${shortDate[1]}/${shortDate[2]}/${year}`);
          }

          // Try natural language
          const parsed = new Date(str);
          if (!isNaN(parsed.getTime())) return parsed;

          return null;
        }

        function parseGoogleDoc(html) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const posts = [];

          let currentPost = null;
          let metadataBuffer = '';
          let inMetadataSection = false;

          const walker = document.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT);
          let node;

          while ((node = walker.nextNode())) {
            const tag = node.tagName;
            const text = node.textContent.trim();

            // H1/H2 = New Post Title
            if ((tag === 'H1' || tag === 'H2') && text.length > 0) {
              // Save previous post
              if (currentPost) {
                // Process metadata buffer
                if (metadataBuffer) {
                  const meta = extractMetadata(metadataBuffer);
                  Object.assign(currentPost, meta);
                }
                posts.push(currentPost);
              }

              // Start new post
              currentPost = {
                title: text,
                body: '',
                images: [],
                sources: [],
                author: null,
                date: null,
                category: null,
                tags: [],
                excerpt: null,
              };

              metadataBuffer = '';
              inMetadataSection = true;
            } else if (currentPost) {
              // Check if this looks like metadata (small text blocks right after title)
              if (inMetadataSection && text.length < 200) {
                metadataBuffer += text + '\n';

                // If we hit a paragraph with substantial content, end metadata section
                if (tag === 'P' && text.length > 100 && !text.toLowerCase().includes('date:')) {
                  inMetadataSection = false;
                  const meta = extractMetadata(metadataBuffer);
                  Object.assign(currentPost, meta);
                  metadataBuffer = '';
                }
              }

              // Handle images
              if (tag === 'IMG') {
                currentPost.images.push(node.src);
              }

              // Handle "Sources" section
              if (text.toLowerCase() === 'sources' && tag.match(/^H[3-6]$/)) {
                currentPost.body += '<h4 class="mcc-sources-heading">Sources</h4>';
                continue;
              }

              // Handle content paragraphs
              if (['P', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'H3', 'H4', 'H5', 'H6'].includes(tag)) {
                // Skip metadata lines in body
                const lower = text.toLowerCase();
                if (
                  lower.startsWith('date:') ||
                  lower.startsWith('category:') ||
                  lower.startsWith('tags:') ||
                  lower.startsWith('excerpt:') ||
                  lower.startsWith('image:') ||
                  lower.match(/^post:/)
                ) {
                  continue;
                }

                // Clean Google redirect URLs
                node.querySelectorAll('a').forEach((a) => {
                  try {
                    const urlObj = new URL(a.href);
                    if (urlObj.hostname.includes('google.com') && urlObj.searchParams.has('q')) {
                      a.href = urlObj.searchParams.get('q');
                    }
                  } catch (e) {}
                });

                // Add to body
                let content = node.outerHTML;
                content = content.replace(/class="[^"]*"/g, '');
                content = content.replace(/style="[^"]*"/g, '');
                content = content.replace(/id="[^"]*"/g, '');

                currentPost.body += content;
              }
            }
          }

          // Save last post
          if (currentPost) {
            if (metadataBuffer) {
              const meta = extractMetadata(metadataBuffer);
              Object.assign(currentPost, meta);
            }
            posts.push(currentPost);
          }

          // Sort by date descending
          posts.sort((a, b) => {
            const dA = a.date || new Date(0);
            const dB = b.date || new Date(0);
            return dB - dA;
          });

          return posts;
        }

        // --- Rendering ---

        function renderPosts(posts) {
          const container = document.getElementById('mccBlogWidget');

          if (posts.length === 0) {
            container.innerHTML = `<div class="mcc-blog-error">No posts found. Check document structure.</div>`;
            return;
          }

          const grid = document.createElement('div');
          grid.className = 'mcc-blog-grid';

          posts.slice(0, CONFIG.maxPosts).forEach((post) => {
            const article = document.createElement('article');
            article.className = 'mcc-blog-card';

            // Hero image
            const heroImg =
              post.image ||
              post.images[0] ||
              'https://images.unsplash.com/photo-1499750310159-53f0f6145f4b?auto=format&fit=crop&w=800&q=80';

            // Display date
            const displayDate = post.date
              ? post.date.toLocaleDateString('en-US', {
                  month: 'long',
                  day: 'numeric',
                  year: 'numeric',
                })
              : '';

            // Excerpt
            const excerpt =
              post.excerpt ||
              (() => {
                const tmp = document.createElement('div');
                tmp.innerHTML = post.body;
                return tmp.textContent.substring(0, 160).trim() + '...';
              })();

            // Category badge
            const categoryHtml = post.category
              ? `<span class="mcc-blog-category">${post.category}</span>`
              : '';

            // Author
            const authorHtml = post.author ? `<span>/ ${post.author}</span>` : '';

            // Tags
            const tagsHtml =
              post.tags.length > 0
                ? `<div class="mcc-blog-tags">${post.tags.map((t) => `<span class="mcc-blog-tag">${t}</span>`).join('')}</div>`
                : '';

            article.innerHTML = `
                    <div class="mcc-blog-hero">
                        <img src="${heroImg}" alt="${post.title}" loading="lazy">
                    </div>
                    <div class="mcc-blog-content">
                        <div class="mcc-blog-meta">
                            ${categoryHtml}
                            ${displayDate ? `<span class="mcc-blog-date">${displayDate}</span>` : ''}
                            ${authorHtml}
                        </div>
                        <h2 class="mcc-blog-title">${post.title}</h2>
                        <div class="mcc-blog-excerpt">${excerpt}</div>
                        ${tagsHtml}
                        <a href="#" class="mcc-blog-expand">Read Full Post &rarr;</a>
                    </div>
                `;

            // Click handler for expansion
            article.querySelector('.mcc-blog-expand').addEventListener('click', (e) => {
              e.preventDefault();
              const w = window.open('', '_blank');
              w.document.write(`
                        <!DOCTYPE html>
                        <html><head>
                        <title>${post.title}</title>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <style>
                            body{font-family:'Inter',sans-serif;max-width:800px;margin:2rem auto;padding:1rem;line-height:1.7;color:#1a1a1a}
                            img{max-width:100%;height:auto;border-radius:0.5rem;margin:1.5rem 0}
                            h1{font-size:2.5rem;margin-bottom:0.5rem}
                            .meta{color:#666;margin-bottom:2rem;font-size:0.9rem}
                            a{color:#000;text-decoration:underline}
                        </style>
                        </head><body>
                        <h1>${post.title}</h1>
                        <div class="meta">
                            ${displayDate ? `<strong>${displayDate}</strong>` : ''}
                            ${post.author ? ` by ${post.author}` : ''}
                            ${post.category ? ` • ${post.category}` : ''}
                        </div>
                        ${post.body}
                        </body></html>
                    `);
            });

            grid.appendChild(article);

            // SEO injection
            if (post.date) injectSeo(post, heroImg);
          });

          container.innerHTML = '';
          container.appendChild(grid);

          requestAnimationFrame(() => grid.classList.add('mcc-loaded'));
        }

        // --- SEO ---

        function injectSeo(post, image) {
          const script = document.createElement('script');
          script.type = 'application/ld+json';

          const schema = {
            '@context': 'https://schema.org',
            '@type': 'BlogPosting',
            headline: post.title,
            image: [image],
            datePublished: post.date ? post.date.toISOString() : new Date().toISOString(),
            author: {
              '@type': 'Person',
              name: post.author || 'Caleb McCartney',
            },
            articleBody: post.body.replace(/(<([^>]+)>)/gi, '').substring(0, 5000),
          };

          if (post.category) {
            schema.articleSection = post.category;
          }

          if (post.tags.length > 0) {
            schema.keywords = post.tags.join(', ');
          }

          script.text = JSON.stringify(schema);
          document.head.appendChild(script);
        }

        // --- Init ---

        async function init() {
          try {
            const html = await fetchGoogleDoc(CONFIG.docId);
            const posts = parseGoogleDoc(html);
            console.log('Parsed posts:', posts); // Debug
            renderPosts(posts);
          } catch (err) {
            console.error(err);
            const container = document.getElementById('mccBlogWidget');
            container.innerHTML = `<div class="mcc-blog-error">
                    <h3>Unable to load blog</h3>
                    <p>${err.message}</p>
                </div>`;
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
