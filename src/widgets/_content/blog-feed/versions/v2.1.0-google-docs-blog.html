<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Feed Widget v2.1.0 (Google Docs)</title>
    <!-- Preload fonts to ensure premium feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- site-widgets:inline:start -->
    <style data-site-widgets-inline>
      :root {
        --mcc-accent: #ff4d6d;
        --mcc-accent-strong: #ff2b50;
        --mcc-bg: #ffffff;
        --mcc-fg: #111827;
        --mcc-line: #e5e7eb;
        --mcc-muted: #6b7280;
        --bg: var(--mcc-bg);
        --fg: var(--mcc-fg);
        --line: var(--mcc-line);
        --accent: var(--mcc-accent);
        --muted: var(--mcc-muted);
        --chip: #1b1b1b;
        --focus: #7dd3fc;
        --link: var(--accent);
        --panel-bg: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(0, 0, 0, 0.08);
        --panel-blur: 8px;
        --mcc-space-1: 4px;
        --mcc-space-2: 8px;
        --mcc-space-3: 12px;
        --mcc-space-4: 16px;
        --mcc-space-5: 24px;
        --mcc-space-6: 32px;
        --mcc-radius: 10px;
        --mcc-control-height: 40px;
        --mcc-z-top: 2147483647;
      }
      [data-theme='light'] {
        --fg: #0a0a0a;
        --bg: #ffffff;
        --line: #e5e5e5;
        --panel-bg: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(0, 0, 0, 0.08);
        --panel-blur: 8px;
        --chip: #fafafa;
        --focus: #0ea5e9;
        --link: var(--accent);
      }
      [data-theme='dark'] {
        --fg: #f7f7f7;
        --bg: #06060a;
        --line: #2a2a2a;
        --panel-bg: rgba(20, 20, 20, 0.78);
        --panel-border: rgba(255, 255, 255, 0.12);
        --panel-blur: 8px;
        --chip: #1b1b1b;
        --focus: #7dd3fc;
        --link: var(--accent);
      }
      [class^='mcc-'],
      [class*=' mcc-'] {
        box-sizing: border-box;
        font-family:
          Inter,
          'Segoe UI',
          system-ui,
          -apple-system,
          'Helvetica Neue',
          Arial,
          sans-serif;
        color: var(--fg);
      }
      [class^='mcc-'] a:focus-visible,
      [class^='mcc-'] button:focus-visible,
      [class^='mcc-'] [role='button']:focus-visible,
      [class*=' mcc-'] a:focus-visible,
      [class*=' mcc-'] button:focus-visible,
      [class*=' mcc-'] [role='button']:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
        border-radius: 6px;
      }
      .mcc-sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0 0 0 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      .mcc-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--mcc-space-2);
        padding: 0.6rem 1.2rem;
        height: var(--mcc-control-height);
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        border: 0;
        cursor: pointer;
        font-weight: 600;
      }
      .mcc-btn:hover,
      .mcc-btn:focus-visible {
        background: var(--mcc-accent-strong);
        transform: translateY(-1px);
      }
      .mcc-img-cover {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .mcc-row {
        display: flex;
        gap: var(--mcc-space-3);
        align-items: center;
      }
      .mcc-col {
        display: flex;
        flex-direction: column;
        gap: var(--mcc-space-2);
      }
      .mcc-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      [class^='mcc-'] {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      @media (prefers-reduced-motion: reduce) {
        [class^='mcc-'] * {
          animation: none !important;
          transition: none !important;
        }
      }
      @media print {
        [class^='mcc-'] {
          color: #000 !important;
          background: transparent !important;
        }
      }
    </style>
    <!-- site-widgets:inline:end -->

    <style>
      /* 
         * McCals-Website Widget: Blog Feed (Google Docs)
         * Version: v2.1.0
         * Theme: Monochrome / Glassmorphism 2.0
         * 
         * Features:
         * - Google Docs as CMS (Public > Publish to Web)
         * - Automatic SEO (JSON-LD injection)
         * - Client-side "Source" detection for attribution
         * - Premium Glassmorphism UI
         */

      :root {
        /* Core Monochrome Tokens */
        --mcc-color-bg: #f8f9fa;
        --mcc-color-text: #1a1a1a;
        --mcc-color-text-muted: #666666;
        --mcc-color-accent: #000000;

        /* Glassmorphism */
        --mcc-glass-bg: rgba(255, 255, 255, 0.7);
        --mcc-glass-border: rgba(255, 255, 255, 0.5);
        --mcc-glass-blur: 16px;
        --mcc-shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        --mcc-shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        --mcc-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);

        /* Typography */
        --mcc-font-sans: 'Inter', sans-serif;
        --mcc-font-display: 'Outfit', sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --mcc-color-bg: #0a0a0a;
          --mcc-color-text: #f3f4f6;
          --mcc-color-text-muted: #9ca3af;
          --mcc-color-accent: #ffffff;

          --mcc-glass-bg: rgba(20, 20, 20, 0.6);
          --mcc-glass-border: rgba(255, 255, 255, 0.1);
        }
      }

      /* Reset & Base */
      .mcc-blog-widget {
        font-family: var(--mcc-font-sans);
        color: var(--mcc-color-text);
        line-height: 1.6;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem;
        box-sizing: border-box;
      }

      /* Loading State */
      .mcc-blog-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem;
        color: var(--mcc-color-text-muted);
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        border-radius: 1.5rem;
        backdrop-filter: blur(var(--mcc-glass-blur));
      }

      .mcc-blog-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--mcc-glass-border);
        border-top-color: var(--mcc-color-accent);
        border-radius: 50%;
        animation: mcc-spin 1s linear infinite;
        margin-bottom: 1rem;
      }

      @keyframes mcc-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Blog Grid */
      .mcc-blog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }

      .mcc-blog-grid.mcc-loaded {
        opacity: 1;
        transform: translateY(0);
      }

      /* Blog Card */
      .mcc-blog-card {
        background: var(--mcc-glass-bg);
        border: 1px solid var(--mcc-glass-border);
        backdrop-filter: blur(var(--mcc-glass-blur));
        -webkit-backdrop-filter: blur(var(--mcc-glass-blur));
        border-radius: 1.5rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        box-shadow: var(--mcc-shadow-sm);
        height: 100%;
      }

      .mcc-blog-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--mcc-shadow-lg);
      }

      /* Hero Image */
      .mcc-blog-hero {
        width: 100%;
        height: 240px;
        position: relative;
        overflow: hidden;
        background: #e5e5e5;
      }

      .mcc-blog-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }

      .mcc-blog-card:hover .mcc-blog-hero img {
        transform: scale(1.05);
      }

      /* Card Content */
      .mcc-blog-content {
        padding: 1.5rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }

      .mcc-blog-meta {
        display: flex;
        gap: 1rem;
        font-size: 0.875rem;
        color: var(--mcc-color-text-muted);
        margin-bottom: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .mcc-blog-title {
        font-family: var(--mcc-font-display);
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 1rem 0;
        line-height: 1.25;
        color: var(--mcc-color-text);
      }

      .mcc-blog-excerpt {
        color: var(--mcc-color-text-muted);
        font-size: 1rem;
        margin-bottom: 1.5rem;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Source/Attribution */
      .mcc-blog-source {
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid var(--mcc-glass-border);
        font-size: 0.875rem;
        color: var(--mcc-color-text-muted);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .mcc-blog-source a {
        color: var(--mcc-color-accent);
        text-decoration: none;
        font-weight: 500;
        transition: opacity 0.2s;
      }

      .mcc-blog-source a:hover {
        opacity: 0.7;
      }

      /* Read overlay for full content (optional expansion) */
      .mcc-blog-expand {
        display: inline-flex;
        align-items: center;
        margin-top: 1rem;
        color: var(--mcc-color-accent);
        font-weight: 600;
        text-decoration: none;
        font-size: 0.95rem;
      }

      .mcc-blog-error {
        text-align: center;
        padding: 2rem;
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
        border-radius: 1rem;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
    </style>
  </head>
  <body
    style="
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
    "
  >
    <!-- 
      WIDGET CONFIGURATION 
      Replace data-doc-id with your Google Doc ID
      Doc must be "Published to Web"
    -->
    <div
      id="mccBlogWidget"
      class="mcc-blog-widget"
      data-doc-id="1PlnajhCPl2Np5AN_uVcxG7xIR_BGkjfk9rUDcInbJLc"
      data-max-posts="12"
    >
      <div class="mcc-blog-loading">
        <div class="mcc-blog-spinner"></div>
        <span>Loading updates...</span>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        const CONFIG = {
          docId: document.getElementById('mccBlogWidget').dataset.docId,
          maxPosts: parseInt(document.getElementById('mccBlogWidget').dataset.maxPosts) || 6,
        };

        // --- Utils ---

        function sanitizeHtml(html) {
          const temp = document.createElement('div');
          temp.innerHTML = html || '';

          // Remove scripts and potentially malicious tags
          const forbidden = ['SCRIPT', 'IFRAME', 'OBJECT', 'EMBED', 'STYLE', 'LINK'];
          temp.querySelectorAll('*').forEach((el) => {
            if (forbidden.includes(el.tagName)) el.remove();
          });

          // Clean attributes
          temp.querySelectorAll('*').forEach((el) => {
            [...el.attributes].forEach((attr) => {
              if (attr.name.startsWith('on')) el.removeAttribute(attr.name);
              if (attr.name === 'href' && attr.value.startsWith('javascript:'))
                el.removeAttribute('href');
            });
          });

          return temp.innerHTML;
        }

        function extractDocId(urlOrId) {
          const match = urlOrId.match(/\/document\/d\/([a-zA-Z0-9-_]+)/);
          return match ? match[1] : urlOrId;
        }

        // --- Fetching ---

        async function fetchGoogleDoc(docId) {
          const url = `https://docs.google.com/document/d/${docId}/pub`;
          try {
            const response = await fetch(url, { mode: 'cors' }); // 'cors' mode usually works for pub docs
            if (!response.ok) throw new Error(`Status ${response.status}`);
            return await response.text();
          } catch (e) {
            // Fallback: try proxy if direct fail (CORS issues are common with GDocs)
            console.warn('Direct fetch failed, ensuring user knows to Publish to Web');
            throw new Error(
              "Could not fetch document. Ensure 'File > Share > Publish to web' is active.",
            );
          }
        }

        // --- Parsing ---

        function parseGoogleDoc(html) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const posts = [];

          // Logic: H1 or H2 starts a new post
          // The first image in the section is the hero

          let currentPost = null;

          // We iterate via a TreeWalker to flatten the structure
          const walker = document.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT);
          let node;

          while ((node = walker.nextNode())) {
            const tag = node.tagName;

            if (tag === 'H1' || tag === 'H2') {
              // Save previous post
              if (currentPost) posts.push(currentPost);

              // Start new post
              currentPost = {
                title: node.textContent.trim(),
                body: '',
                images: [],
                source: null, // For attribution
                date: new Date().toISOString(), // Default to now, parsing later
              };
            } else if (currentPost) {
              // Detect content
              if (tag === 'IMG') {
                currentPost.images.push(node.src);
              } else if (['P', 'UL', 'OL', 'BLOCKQUOTE'].includes(tag)) {
                const text = node.textContent.trim();
                // simplistic source detection
                if (text.toLowerCase().startsWith('source:')) {
                  currentPost.source = text.substring(7).trim(); // Remove "Source:"
                  // If it's a link, try to extract href logic if node has 'A' child
                  const link = node.querySelector('a');
                  if (link) {
                    currentPost.sourceUrl = link.href;
                    currentPost.source = link.textContent || currentPost.source;
                  }
                } else {
                  currentPost.body += node.outerHTML;
                }
              }
            }
          }
          if (currentPost) posts.push(currentPost);

          return posts;
        }

        // --- Rendering ---

        function renderPosts(posts) {
          const container = document.getElementById('mccBlogWidget');

          if (posts.length === 0) {
            container.innerHTML = `<div class="mcc-blog-error">No posts found in the document. Use H1 or H2 for titles.</div>`;
            return;
          }

          const grid = document.createElement('div');
          grid.className = 'mcc-blog-grid';

          posts.slice(0, CONFIG.maxPosts).forEach((post) => {
            const article = document.createElement('article');
            article.className = 'mcc-blog-card';

            // Content preparation
            const heroImg =
              post.images[0] ||
              'https://via.placeholder.com/800x400/e5e5e5/1a1a1a?text=McCal+Media';
            const dateStr = new Date().toLocaleDateString('en-US', {
              month: 'short',
              day: 'numeric',
              year: 'numeric',
            });

            // Strip HTML from body for excerpt
            const tmp = document.createElement('div');
            tmp.innerHTML = post.body;
            const excerpt = tmp.textContent.substring(0, 150) + '...';

            // Source segment
            let sourceHtml = '';
            if (post.source) {
              sourceHtml = `
                        <div class="mcc-blog-source">
                            <span>Source:</span>
                            ${
                              post.sourceUrl
                                ? `<a href="${post.sourceUrl}" target="_blank" rel="noopener">${post.source}</a>`
                                : `<span>${post.source}</span>`
                            }
                        </div>
                    `;
            }

            article.innerHTML = `
                    <div class="mcc-blog-hero">
                        <img src="${heroImg}" alt="${post.title}" loading="lazy">
                    </div>
                    <div class="mcc-blog-content">
                        <div class="mcc-blog-meta">
                            <span class="mcc-blog-date">${dateStr}</span>
                        </div>
                        <h2 class="mcc-blog-title">${post.title}</h2>
                        <div class="mcc-blog-excerpt">${excerpt}</div>
                        ${sourceHtml}
                        <a href="#" class="mcc-blog-expand" onclick="alert('Full post view to be implemented'); return false;">Read More &rarr;</a>
                    </div>
                `;

            grid.appendChild(article);

            // SEO: Inject JSON-LD
            injectSeo(post, heroImg);
          });

          container.innerHTML = '';
          container.appendChild(grid);

          // Trigger animation
          requestAnimationFrame(() => grid.classList.add('mcc-loaded'));
        }

        // --- SEO ---

        function injectSeo(post, image) {
          const script = document.createElement('script');
          script.type = 'application/ld+json';

          const schema = {
            '@context': 'https://schema.org',
            '@type': 'BlogPosting',
            headline: post.title,
            image: [image],
            datePublished: post.date,
            author: {
              '@type': 'Person',
              name: 'Caleb McCartney', // Default author
            },
            articleBody: post.body.replace(/(<([^>]+)>)/gi, ''),
          };

          script.text = JSON.stringify(schema);
          document.head.appendChild(script);
        }

        // --- Init ---

        async function init() {
          try {
            const docId = extractDocId(CONFIG.docId);
            const html = await fetchGoogleDoc(docId);
            const posts = parseGoogleDoc(html);
            renderPosts(posts);
          } catch (err) {
            console.error(err);
            const container = document.getElementById('mccBlogWidget');
            container.innerHTML = `<div class="mcc-blog-error">
                    <h3>Unable to load blog</h3>
                    <p>${err.message}</p>
                    <p style="font-size:0.8em; margin-top:0.5rem">Ensure Google Doc is "Published to web" (File > Share > Publish to web)</p>
                </div>`;
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
