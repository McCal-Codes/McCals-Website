<style>
  .admin-dashboard-container {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem;
    color: #222;
  }
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 2rem;
    margin-bottom: 2rem;
  }
  .dashboard-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    padding: 1.5rem;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }
  .card-title {
    font-weight: 700;
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
  }
  .status {
    display: inline-block;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.25em 0.75em;
    border-radius: 1em;
    margin-bottom: 0.5em;
  }
  .status-ok { background: #d1fae5; color: #065f46; }
  .status-warn { background: #fef3c7; color: #92400e; }
  .status-err { background: #fee2e2; color: #991b1b; }
  .card-detail { color: #555; font-size: 0.95em; margin-top: 0.5em; }
  .dashboard-links {
    margin-top: 2rem;
    padding: 1rem;
    background: #f9fafb;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }
  .dashboard-links a {
    color: #2563eb;
    text-decoration: none;
    margin-right: 1.5em;
    font-weight: 500;
  }
  .dashboard-links a:hover { text-decoration: underline; }
  @media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }
</style>

<div class="admin-dashboard-container" id="adminDashboard">
  <h1>Admin Dashboard</h1>
  <div class="dashboard-grid">
    <div class="dashboard-card" id="apiStatusCard">
      <div class="card-title">API Health</div>
      <div class="status" id="apiStatus">Checking...</div>
      <div class="card-detail" id="apiDetail"></div>
    </div>
    <div class="dashboard-card" id="manifestStatusCard">
      <div class="card-title">Manifest Status</div>
      <div class="status" id="manifestStatus">Checking...</div>
      <div class="card-detail" id="manifestDetail"></div>
    </div>
    <div class="dashboard-card" id="widgetStatusCard">
      <div class="card-title">Widget Validation</div>
      <div class="status" id="widgetStatus">Checking...</div>
      <div class="card-detail" id="widgetDetail"></div>
    </div>
  </div>
  <div class="dashboard-links">
    <strong>Quick Links:</strong>
    <a href="/reports/" target="_blank">Reports</a>
    <a href="/logs/" target="_blank">Logs</a>
    <a href="/src/widgets/" target="_blank">Widgets</a>
    <a href="/src/images/Portfolios/" target="_blank">Manifests</a>
    <a href="https://github.com/McCal-Codes/McCals-Website/actions" target="_blank">CI/CD</a>
  </div>
</div>

<script>
(function() {
  // API Health Check
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:8787/api/v1/blog'
    : 'https://api.mcc-cal.com/api/v1/blog';
  const apiStatus = document.getElementById('apiStatus');
  const apiDetail = document.getElementById('apiDetail');
  fetch(API_BASE + '/posts', { method: 'GET' })
    .then(r => {
      if (r.ok) {
        apiStatus.textContent = 'Healthy';
        apiStatus.className = 'status status-ok';
        apiDetail.textContent = 'API responded to /posts.';
      } else {
        apiStatus.textContent = 'Error';
        apiStatus.className = 'status status-err';
        apiDetail.textContent = 'API responded with status ' + r.status;
      }
    })
    .catch(e => {
      apiStatus.textContent = 'Unreachable';
      apiStatus.className = 'status status-err';
      apiDetail.textContent = e.message || 'Network error.';
    });

  // Manifest Health Check (Concert as example)
  const manifestStatus = document.getElementById('manifestStatus');
  const manifestDetail = document.getElementById('manifestDetail');
  fetch('/src/images/Portfolios/Concert/concert-manifest.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      if (data && data.bands && Array.isArray(data.bands)) {
        manifestStatus.textContent = 'Valid';
        manifestStatus.className = 'status status-ok';
        manifestDetail.textContent = 'Bands: ' + data.bands.length + ', Last updated: ' + (data.lastUpdated || 'unknown');
      } else {
        manifestStatus.textContent = 'Invalid';
        manifestStatus.className = 'status status-warn';
        manifestDetail.textContent = 'Manifest missing bands array.';
      }
    })
    .catch(e => {
      manifestStatus.textContent = 'Error';
      manifestStatus.className = 'status status-err';
      manifestDetail.textContent = e.message || 'Could not load manifest.';
    });

  // Widget Validation (HTML validation stub)
  const widgetStatus = document.getElementById('widgetStatus');
  const widgetDetail = document.getElementById('widgetDetail');
  fetch('/reports/axe-concert-widget-results.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      if (data.violations && data.violations.length === 0) {
        widgetStatus.textContent = 'Valid';
        widgetStatus.className = 'status status-ok';
        widgetDetail.textContent = 'No accessibility violations.';
      } else if (data.violations) {
        widgetStatus.textContent = 'Issues';
        widgetStatus.className = 'status status-warn';
        widgetDetail.textContent = data.violations.length + ' accessibility issues.';
      } else {
        widgetStatus.textContent = 'Unknown';
        widgetStatus.className = 'status status-warn';
        widgetDetail.textContent = 'Validation result missing.';
      }
    })
    .catch(e => {
      widgetStatus.textContent = 'Error';
      widgetStatus.className = 'status status-err';
      widgetDetail.textContent = e.message || 'Could not load validation report.';
    });
})();
</script>
