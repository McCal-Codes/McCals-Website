<!-- Nature Portfolio Widget v1.2 – Unified Lightbox Header Isolation -->
<!-- Change: Adds html.lb-open pointer-events:none to common Squarespace header containers so nav / announcement bars never sit above images. -->
<style>
  :root { --fg:#f5f5f5; --bg:#0a0a0a; --line:#1f3025; --accent:#8fbf9f; }
  @media (prefers-color-scheme: light){ :root { --fg:#0a0a0a; --bg:#fff; --line:#cfd9d2; } }
  * { scrollbar-width:thin; scrollbar-color:rgba(143,191,159,0.25) transparent; }
  *::-webkit-scrollbar{ width:4px; height:4px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:rgba(143,191,159,0.28); border-radius:3px; }
  *::-webkit-scrollbar-thumb:hover{ background:rgba(143,191,159,0.45); }

  .nature-featured { max-width:1600px; margin:60px auto; padding:40px 20px; text-align:center; position:relative; }
  .nature-heading { font:800 34px/1.2 ui-sans-serif,system-ui; margin:0 0 12px; color:var(--fg); }
  .nature-subhead { font:500 16px/1.5 ui-sans-serif,system-ui; margin:0 0 28px; color:rgba(255,255,255,0.72); }
  @media (prefers-color-scheme: light){ .nature-subhead { color:rgba(10,10,10,0.6); } }
  .nature-meta-bar { display:flex; justify-content:center; gap:40px; flex-wrap:wrap; font:600 11px/1.4 ui-sans-serif,system-ui; color:rgba(255,255,255,0.55); margin-bottom:30px; letter-spacing:.18em; text-transform:uppercase; }
  .nature-meta-bar span{ display:inline-flex; align-items:center; gap:6px; }
  .nature-meta-bar strong{ font:700 13px/1 ui-sans-serif,system-ui; color:var(--fg); letter-spacing:.22em; }
  .nature-loading{ display:flex; align-items:center; justify-content:center; min-height:200px; font:600 16px/1.4 ui-sans-serif,system-ui; opacity:.75; color:var(--fg); }
  .nature-spinner{ width:20px; height:20px; border:2px solid var(--line); border-top:2px solid var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin-right:12px; }
  @keyframes spin{ 0%{ transform:rotate(0);}100%{ transform:rotate(360deg);} }
  .nature-grid{ column-width:320px; column-gap:16px; text-align:left; opacity:0; transition:opacity .5s ease; }
  .nature-grid.loaded{ opacity:1; }
  @media (max-width:1024px){ .nature-grid{ column-width:280px; column-gap:12px; } }
  @media (max-width:768px){ .nature-grid{ column-width:240px; column-gap:10px; } }
  @media (max-width:520px){ .nature-grid{ column-width:100%; column-gap:8px; } }
  .nature-card{ position:relative; display:inline-block; width:100%; margin:0 0 16px; background:#101414; border-radius:16px; overflow:hidden; cursor:pointer; break-inside:avoid; opacity:0; transform:translateY(22px); transition:all .34s ease; }
  .nature-card.loaded{ opacity:1; transform:translateY(0); }
  .nature-card img{ display:block; width:100%; height:auto; object-fit:cover; border-radius:inherit; transition:transform .35s ease, filter .35s ease; }
  .nature-card:hover img{ transform:scale(1.03); filter:contrast(1.08) saturate(1.06); }
  .nature-info{ position:absolute; inset:auto 0 0 0; display:flex; flex-direction:column; justify-content:flex-end; padding:14px 18px; background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,0.92)); color:#fff; }
  .nature-title{ margin:0; font:800 18px/1.25 ui-sans-serif,system-ui; }
  .nature-meta{ margin:6px 0 0; font:600 12px/1.3 ui-sans-serif,system-ui; color:rgba(255,255,255,0.78); }
  .nature-tags{ margin:8px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  .nature-tag{ background:rgba(255,255,255,0.08); border-radius:999px; padding:4px 11px; font:600 10px/1 ui-sans-serif,system-ui; letter-spacing:.12em; text-transform:uppercase; }
  .nature-tag-primary{ background:rgba(143,191,159,0.30); color:rgba(255,255,255,0.95); }
  .nature-empty{ text-align:center; padding:80px 20px; color:rgba(255,255,255,0.6); font:600 16px/1.4 ui-sans-serif,system-ui; }
  .nature-error{ margin:30px auto; padding:24px; max-width:520px; border-radius:16px; background:rgba(255,96,96,0.08); border:1px solid rgba(255,96,96,0.28); color:#fff; font:600 14px/1.5 ui-sans-serif,system-ui; }

  .nature-lightbox{ position:fixed; inset:0; background:rgba(0,0,0,0.92); display:none; align-items:center; justify-content:center; z-index:2147483647; overflow:hidden; }
  .nature-lightbox.is-open{ display:flex; }
  .nl-dialog{ position:relative; max-width:90vw; max-height:85vh; display:flex; flex-direction:column; background:transparent; outline:none; }
  .nl-close{ position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.55); color:#fff; font-size:20px; cursor:pointer; transition:all .2s ease; z-index:2; backdrop-filter:blur(4px); }
  .nl-close:hover{ background:rgba(0,0,0,0.85); transform:scale(1.06); }
  .nl-gallery{ display:flex; flex-direction:column; gap:20px; overflow-y:auto; scroll-snap-type:y mandatory; flex:1; }
  .nl-gallery img{ display:block; max-height:72vh; width:auto; align-self:center; border-radius:12px; box-shadow:0 20px 40px rgba(0,0,0,0.55); background:#050505; scroll-snap-align:start; }
  .nl-gallery img.loading{ opacity:.6; filter:blur(4px); }
  .nl-gallery img.loaded{ opacity:1; filter:none; transition:opacity .35s ease, filter .35s ease; }
  .nl-hint{ position:sticky; top:6px; align-self:center; background:rgba(0,0,0,0.55); color:#fff; padding:6px 10px; border-radius:999px; font:600 12px/1 ui-sans-serif,system-ui; transition:opacity .4s ease; }
  .nl-hint.fade{ opacity:0; }
  .nl-caption{ text-align:center; color:#fff; margin-top:14px; }
  .nl-title{ margin:0 0 6px; font:700 18px/1.3 ui-sans-serif,system-ui; }
  .nl-meta{ margin:0; font:500 12px/1.4 ui-sans-serif,system-ui; color:rgba(255,255,255,0.75); }

  /* Header isolation pattern */
  html.lb-open header,
  html.lb-open .Header,
  html.lb-open [id*="Header"],
  html.lb-open .site-header,
  html.lb-open .sqs-announcement-bar{ pointer-events:none !important; }
  html.lb-open body { overflow:hidden; }

  @media (max-width:720px){
    .nature-featured{ padding:30px 16px; margin:40px auto; }
    .nature-heading{ font-size:30px; }
    .nature-subhead{ margin-bottom:22px; font-size:15px; }
  }
</style>

<div class="nature-featured" id="natureWidget" data-panes="12">
  <div class="nature-header">
    <h2 class="nature-heading">Nature Highlights</h2>
    <p class="nature-subhead">Landscapes, wildlife, and environment stories pulled from the nature archive.</p>
  </div>
  <div class="nature-meta-bar" aria-live="polite">
    <span><strong id="natureMetaCount">--</strong> items</span>
    <span><strong id="natureMetaUpdated">--</strong> updated</span>
    <span><strong id="natureMetaSource">--</strong> source</span>
  </div>
  <div class="nature-loading" id="natureLoading" role="status"><div class="nature-spinner" aria-hidden="true"></div>Loading nature collections...</div>
  <div class="nature-grid" id="natureGrid" hidden></div>
</div>

<div class="nature-lightbox" id="natureLightbox" aria-hidden="true">
  <div class="nl-dialog" role="dialog" aria-modal="true" aria-labelledby="nlTitle" tabindex="-1">
    <button class="nl-close" type="button" aria-label="Close">&times;</button>
    <div class="nl-gallery" id="nlGallery"><div class="nl-hint">Scroll to explore</div></div>
    <div class="nl-caption"><h3 class="nl-title" id="nlTitle"></h3><p class="nl-meta" id="nlMeta"></p></div>
  </div>
</div>

<script>
(()=>{
  const root=document.getElementById('natureWidget');if(!root) return;
  const grid=document.getElementById('natureGrid');
  const loading=document.getElementById('natureLoading');
  const metaCount=document.getElementById('natureMetaCount');
  const metaUpdated=document.getElementById('natureMetaUpdated');
  const metaSource=document.getElementById('natureMetaSource');
  const lb=document.getElementById('natureLightbox');
  const lbDialog=lb.querySelector('.nl-dialog');
  const lbGallery=document.getElementById('nlGallery');
  const lbTitle=document.getElementById('nlTitle');
  const lbMeta=document.getElementById('nlMeta');
  const lbClose=lb.querySelector('.nl-close');
  const TARGET=Math.max(1,parseInt(root.dataset.panes||'12',10));
  const GH={owner:'McCal-Codes',repo:'McCals-Website',branch:'main'};
  const RAW=`https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/`;
  const MANIFEST_PATH='src/images/Portfolios/Nature/nature-manifest.json';
  const CACHE_KEY='nature-v1.2-cache';
  const CACHE_MS=10*60*1000;
  function now(){return Date.now();}
  function readCache(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw) return null;const data=JSON.parse(raw);if(now()-data.t > CACHE_MS) return null;return data.m;}catch{return null;}}
  function writeCache(m){try{localStorage.setItem(CACHE_KEY,JSON.stringify({m,t:now()}));}catch{}}
  async function fetchManifest(force){
    if(!force){const c=readCache();if(c) return c;}
    try {
      const r=await fetch(RAW+MANIFEST_PATH,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      writeCache(j);
      return j;
    } catch (err) {
      // Show error immediately
      showError('Failed to fetch manifest: '+(err.message||err));
      throw err;
    }
  }
  function parseDate(col){
    const iso=col.captureDate?.iso||col.dateISO||null;let val=0;
    if(iso){const p=Date.parse(iso.replace(/\//g,'-'));if(!Number.isNaN(p)) val=p;}
    const disp=col.dateDisplay||col.captureDate?.display|| (iso? new Date(val).toLocaleDateString(undefined,{year:'numeric',month:'long'}):'');
    return {iso:iso||null,value:val,display:disp};
  }
  function buildItems(man){
    const raw=Array.isArray(man?.collections)?man.collections:[];
    const items=raw.map((c,i)=>{
      const parts=String(c.folderPath||'').split('/').filter(Boolean);
      if(!parts.length) return null;
      const imgs=Array.isArray(c.images)?c.images.filter(Boolean):[];
      if(!imgs.length) return null;
      const d=parseDate(c);
      const title=String(c.collectionName||parts[parts.length-1]||`Collection ${i+1}`).trim();
      const tags=Array.isArray(c.tags)?c.tags.filter(Boolean):[];
      if(!tags.some(t=>/nature/i.test(t))) tags.unshift('Nature');
      return {title,parts,images:imgs,cover:imgs[0],dateDisplay:d.display,dateValue:d.value};
    }).filter(Boolean);
    items.sort((a,b)=>b.dateValue-a.dateValue);
    return items.slice(0,TARGET);
  }
  function imageUrl(item,file){
    return RAW+'src/images/Portfolios/Nature/'+item.parts.map(encodeURIComponent).join('/')+'/'+encodeURIComponent(file);
  }
  function showError(msg){
    loading.innerHTML='<div class="nature-error" role="alert">'+msg+'</div>';
    loading.style.display='block';
    grid.hidden=true;
    // Optionally, set focus for screen readers
    loading.setAttribute('tabindex','-1');
    loading.focus&&loading.focus();
  }
  function render(items,manifest){
    loading.style.display='none';
    if(!items.length){
      grid.innerHTML='<div class="nature-empty">No nature collections found.</div>';
      grid.hidden=false;
      return;
    }
    const frag=document.createDocumentFragment();
    items.forEach((it,idx)=>{
      const card=document.createElement('article');
      card.className='nature-card loading';
      card.tabIndex=0;
      const img=document.createElement('img');
      img.alt=it.title;
      const info=document.createElement('div');
      info.className='nature-info';
      const h=document.createElement('h3');
      h.className='nature-title';
      h.textContent=it.title;
      info.appendChild(h);
      if(it.dateDisplay){
        const m=document.createElement('p');
        m.className='nature-meta';
        m.textContent=it.dateDisplay;
        info.appendChild(m);
      }
      const tagsWrap=document.createElement('div');
      tagsWrap.className='nature-tags';
      // Always add Nature tag
      const tg=document.createElement('span');
      tg.className='nature-tag nature-tag-primary';
      tg.textContent='Nature';
      tagsWrap.appendChild(tg);
      // Add Birds tag if in Birds folder
      if(it.parts.length>=3 && it.parts[0]==='Wildlife' && it.parts[1]==='Birds'){
        const birdsTag=document.createElement('span');
        birdsTag.className='nature-tag';
        birdsTag.textContent='Birds';
        tagsWrap.appendChild(birdsTag);
      }
      info.appendChild(tagsWrap);
      card.appendChild(img);
      card.appendChild(info);
      frag.appendChild(card);
      function open(){openLightbox(it);}
      card.addEventListener('click',open);
      card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
      setTimeout(()=>{
        const src=imageUrl(it,it.cover);
        const probe=new Image();
        probe.onload=()=>{img.src=src;card.classList.remove('loading');card.classList.add('loaded');};
        probe.onerror=()=>{card.classList.remove('loading');card.classList.add('error');img.alt+=' (failed to load image)';};
        probe.src=src;
      }, idx*90);
    });
    grid.innerHTML='';
    grid.appendChild(frag);
    grid.hidden=false;
    grid.classList.add('loaded');
    metaCount.textContent=items.length.toString().padStart(2,'0');
    metaUpdated.textContent=new Date().toLocaleDateString();
    metaSource.textContent='Nature Manifest';
  }
  function openLightbox(item){
    lbGallery.innerHTML='<div class="nl-hint">Scroll to explore</div>';
    item.images.forEach(f=>{
      const im=document.createElement('img');
      im.alt=item.title+' nature photo';
      im.className='loading';
      im.src=imageUrl(item,f);
      im.onload=()=>{im.classList.remove('loading');im.classList.add('loaded');};
      im.onerror=()=>{im.classList.remove('loading');im.classList.add('error');im.alt+=' (failed to load image)';};
      lbGallery.appendChild(im);
    });
    lbTitle.textContent=item.title;
    lbMeta.textContent=[item.dateDisplay,`${item.images.length} photos`].filter(Boolean).join(' – ');
    lb.classList.add('is-open');
    lb.setAttribute('aria-hidden','false');
    document.documentElement.classList.add('lb-open');
    lbDialog.focus();
    const hint=lbGallery.querySelector('.nl-hint');
    if(hint && item.images.length>1){setTimeout(()=>hint.classList.add('fade'),3000);}
  }
  function close(){
    lb.classList.remove('is-open');
    lb.setAttribute('aria-hidden','true');
    document.documentElement.classList.remove('lb-open');
  }
  lbClose.addEventListener('click',close);
  lb.addEventListener('click',e=>{if(e.target===lb) close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lb.classList.contains('is-open')){e.preventDefault();close();}});
  // Fetch and render manifest
  fetchManifest(false)
    .then(m=>{const items=buildItems(m);render(items,m);})
    .catch(err=>{showError('Failed to load nature collections: '+(err.message||err));});
})();
</script>
