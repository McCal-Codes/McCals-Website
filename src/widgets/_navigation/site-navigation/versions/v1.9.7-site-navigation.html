<script>
  (function () {
    const killSelectors = ['.Header', 'header[role="banner"]', '[data-test="header"]'];
    killSelectors.forEach((sel) => {
      document.querySelectorAll(sel).forEach((node) => {
        node.setAttribute('data-mcc-nav-replaced', 'true');
        node.style.display = 'none';
        node.setAttribute('aria-hidden', 'true');
      });
    });

    const root = document.querySelector('.mcc-nav-widget');
    if (!root || root.dataset.mounted === 'true') return;
    root.dataset.mounted = 'true';
    document.documentElement.dataset.mccNav = 'active';

    const nav = root.querySelector('.mcc-nav');
    const toggle = nav.querySelector('.mcc-nav__toggle');
    const links = nav.querySelectorAll('.mcc-nav__links a');
    const submenuToggles = nav.querySelectorAll('.mcc-nav__submenu-toggle');

    const collapseAllSubmenus = () => {
      submenuToggles.forEach((btn) => {
        btn.setAttribute('aria-expanded', 'false');
        const submenu = btn.closest('.mcc-nav__link').querySelector('.mcc-nav__submenu');
        if (submenu) {
          submenu.setAttribute('aria-hidden', 'true');
          if (window.innerWidth <= 768) submenu.style.display = 'none';
        }
      });
    };

    const closeMobile = () => {
      nav.classList.remove('mcc-nav--menu-open');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
      collapseAllSubmenus();
    };

    if (toggle) {
      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        const willOpen = !nav.classList.contains('mcc-nav--menu-open');
        nav.classList.toggle('mcc-nav--menu-open', willOpen);
        this.setAttribute('aria-expanded', String(willOpen));
      });
    }

    links.forEach((anchor) => {
      if (!anchor.closest('.mcc-nav__submenu')) {
        anchor.addEventListener('click', closeMobile);
      }
    });

    submenuToggles.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        const submenu = btn.closest('.mcc-nav__link').querySelector('.mcc-nav__submenu');

        // Close others
        submenuToggles.forEach((other) => {
          if (other !== btn) other.setAttribute('aria-expanded', 'false');
        });
        document.querySelectorAll('.mcc-nav__submenu').forEach((s) => {
          if (s !== submenu && window.innerWidth <= 768) s.style.display = 'none';
        });

        btn.setAttribute('aria-expanded', String(!expanded));
        if (submenu) {
          submenu.setAttribute('aria-hidden', String(expanded));
          if (window.innerWidth <= 768) {
            submenu.style.display = expanded ? 'none' : 'block';
          }
        }
      });
    });

    document.addEventListener('click', (e) => {
      if (
        window.innerWidth <= 768 &&
        nav.classList.contains('mcc-nav--menu-open') &&
        !nav.contains(e.target)
      ) {
        closeMobile();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMobile();
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) {
        closeMobile();
        document.querySelectorAll('.mcc-nav__submenu').forEach((s) => (s.style.display = ''));
      }
    });

    const highlight = () => {
      const currentPath = window.location.pathname.replace(/\/+$/, '') || '/';
      nav.querySelectorAll('a').forEach((a) => a.removeAttribute('aria-current'));
      nav.querySelectorAll('[data-match]').forEach((anchor) => {
        const pattern = anchor.getAttribute('data-match');
        if (pattern && new RegExp(pattern).test(currentPath)) {
          anchor.setAttribute('aria-current', 'page');
        }
      });
    };
    highlight();
    window.addEventListener('SquarespaceRoutingComplete', highlight);

    const updateNavHeight = () => {
      document.documentElement.style.setProperty(
        '--mcc-nav-height',
        nav.getBoundingClientRect().height + 'px',
      );
    };
    requestAnimationFrame(updateNavHeight);
    window.addEventListener('load', updateNavHeight);
    window.addEventListener('resize', updateNavHeight);

    const applyScrollState = () => {
      nav.classList.toggle('is-scrolled', window.scrollY > 50);
    };
    window.addEventListener('scroll', applyScrollState, { passive: true });
    applyScrollState();
  })();
</script>
