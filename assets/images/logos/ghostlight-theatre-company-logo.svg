<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="background: transparent;">
  <defs>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer cylinder -->
  <ellipse cx="100" cy="60" rx="35" ry="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <rect x="65" y="60" width="70" height="50" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <ellipse cx="100" cy="110" rx="35" ry="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Light rays -->
  <line x1="40" y1="50" x2="50" y2="60" stroke="#2c3e50" stroke-width="1"/>
  <line x1="35" y1="85" x2="45" y2="85" stroke="#2c3e50" stroke-width="1"/>
  <line x1="40" y1="120" x2="50" y2="110" stroke="#2c3e50" stroke-width="1"/>
  
  <line x1="160" y1="50" x2="150" y2="60" stroke="#2c3e50" stroke-width="1"/>
  <line x1="165" y1="85" x2="155" y2="85" stroke="#2c3e50" stroke-width="1"/>
  <line x1="160" y1="120" x2="150" y2="110" stroke="#2c3e50" stroke-width="1"/>
  
  <line x1="100" y1="30" x2="100" y2="40" stroke="#2c3e50" stroke-width="1"/>
  <line x1="100" y1="130" x2="100" y2="140" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Light bulb -->
  <ellipse cx="100" cy="85" rx="20" ry="25" fill="url(#bulbGrad)" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Bulb base -->
  <rect x="95" y="105" width="10" height="8" fill="#2c3e50"/>
  <rect x="93" y="113" width="14" height="3" fill="#2c3e50"/>
  
  <!-- Filament -->
  <path d="M 90 85 Q 100 75 110 85 Q 100 95 90 85" fill="none" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Text -->
  <text x="100" y="160" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Ghostlight</text>
  <text x="100" y="175" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#2c3e50">Theatre Company</text>
</svg>