<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" style="background: transparent;">
  <defs>
    <!-- Modern gradient -->
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="spaceTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A5568;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background shape -->
  <rect x="10" y="15" width="35" height="50" rx="5" fill="url(#spaceGradient)" opacity="0.8"/>
  
  <!-- Stairs/steps representing "upstairs" -->
  <g transform="translate(15, 20)">
    <rect x="0" y="35" width="25" height="3" fill="#ffffff" opacity="0.9"/>
    <rect x="3" y="30" width="22" height="3" fill="#ffffff" opacity="0.8"/>
    <rect x="6" y="25" width="19" height="3" fill="#ffffff" opacity="0.7"/>
    <rect x="9" y="20" width="16" height="3" fill="#ffffff" opacity="0.6"/>
    <rect x="12" y="15" width="13" height="3" fill="#ffffff" opacity="0.5"/>
    
    <!-- Arrow pointing up -->
    <polygon points="20,5 15,12 18,12 18,18 22,18 22,12 25,12" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Company name -->
  <text x="55" y="25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" 
        fill="url(#spaceTextGradient)" letter-spacing="0.5px">THE SPACE</text>
  <text x="55" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" 
        fill="url(#spaceTextGradient)" letter-spacing="0.5px">UPSTAIRS</text>
  
  <!-- Subtitle -->
  <text x="55" y="52" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" 
        fill="#718096" letter-spacing="0.3px">CREATIVE • VENUE • ARTS</text>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="25" r="2" fill="url(#spaceGradient)" opacity="0.4"/>
  <circle cx="185" cy="55" r="1.5" fill="url(#spaceGradient)" opacity="0.3"/>
</svg>