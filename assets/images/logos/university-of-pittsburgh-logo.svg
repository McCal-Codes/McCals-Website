<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" style="background: transparent;">
  <defs>
    <!-- Pitt blue gradient -->
    <linearGradient id="pittGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003594;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB81C;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="pittTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003594;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002654;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield background -->
  <path d="M15 20 L15 60 L30 70 L45 60 L45 20 Z" fill="url(#pittGradient)" stroke="#002654" stroke-width="1"/>
  
  <!-- Cathedral of Learning representation -->
  <g transform="translate(20, 25)">
    <!-- Main tower -->
    <rect x="8" y="5" width="4" height="35" fill="#ffffff" opacity="0.9"/>
    <!-- Side towers -->
    <rect x="4" y="15" width="3" height="25" fill="#ffffff" opacity="0.7"/>
    <rect x="13" y="15" width="3" height="25" fill="#ffffff" opacity="0.7"/>
    <!-- Base -->
    <rect x="2" y="35" width="16" height="5" fill="#ffffff" opacity="0.8"/>
    <!-- Windows -->
    <rect x="8.5" y="10" width="1" height="2" fill="url(#pittGradient)" opacity="0.8"/>
    <rect x="8.5" y="15" width="1" height="2" fill="url(#pittGradient)" opacity="0.8"/>
    <rect x="8.5" y="20" width="1" height="2" fill="url(#pittGradient)" opacity="0.8"/>
  </g>
  
  <!-- University name -->
  <text x="55" y="25" font-family="Times, serif" font-size="14" font-weight="bold" 
        fill="url(#pittTextGradient)" letter-spacing="0.5px">UNIVERSITY</text>
  <text x="55" y="40" font-family="Times, serif" font-size="14" font-weight="bold" 
        fill="url(#pittTextGradient)" letter-spacing="0.5px">OF</text>
  <text x="55" y="55" font-family="Times, serif" font-size="14" font-weight="bold" 
        fill="url(#pittTextGradient)" letter-spacing="0.5px">PITTSBURGH</text>
  
  <!-- Tagline -->
  <text x="55" y="67" font-family="Arial, sans-serif" font-size="8" font-weight="400" 
        fill="#666666" letter-spacing="0.2px">EXCELLENCE • TRADITION</text>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="20" r="2" fill="url(#pittGradient)" opacity="0.4"/>
  <circle cx="185" cy="60" r="1.5" fill="#FFB81C" opacity="0.3"/>
</svg>
