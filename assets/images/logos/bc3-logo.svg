<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" style="background: transparent;">
  <defs>
    <!-- BC3 colors gradient -->
    <linearGradient id="bc3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5F8B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="bc3TextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003d72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background shape representing education -->
  <rect x="10" y="15" width="35" height="50" rx="5" fill="url(#bc3Gradient)" opacity="0.9"/>
  
  <!-- Book/education symbol -->
  <g transform="translate(15, 20)">
    <!-- Open book pages -->
    <path d="M0,10 L25,10 L25,35 L12.5,32 L0,35 Z" fill="#ffffff" opacity="0.9" stroke="#003d72" stroke-width="0.5"/>
    <!-- Book spine -->
    <line x1="12.5" y1="10" x2="12.5" y2="32" stroke="#003d72" stroke-width="1"/>
    <!-- Text lines -->
    <line x1="3" y1="15" x2="10" y2="15" stroke="#003d72" stroke-width="0.5" opacity="0.7"/>
    <line x1="3" y1="18" x2="10" y2="18" stroke="#003d72" stroke-width="0.5" opacity="0.7"/>
    <line x1="3" y1="21" x2="10" y2="21" stroke="#003d72" stroke-width="0.5" opacity="0.7"/>
    <line x1="15" y1="15" x2="22" y2="15" stroke="#003d72" stroke-width="0.5" opacity="0.7"/>
    <line x1="15" y1="18" x2="22" y2="18" stroke="#003d72" stroke-width="0.5" opacity="0.7"/>
    <line x1="15" y1="21" x2="22" y2="21" stroke="#003d72" stroke-width="0.5" opacity="0.7"/>
  </g>
  
  <!-- BC3 text -->
  <text x="55" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" 
        fill="url(#bc3TextGradient)" letter-spacing="1px">BC3</text>
  
  <!-- Full name -->
  <text x="55" y="45" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" 
        fill="#003d72" letter-spacing="0.3px">BUTLER COUNTY</text>
  <text x="55" y="56" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" 
        fill="#003d72" letter-spacing="0.3px">COMMUNITY COLLEGE</text>
  
  <!-- Tagline -->
  <text x="55" y="68" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" 
        fill="#666666" letter-spacing="0.2px">EDUCATION • OPPORTUNITY</text>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="20" r="2" fill="url(#bc3Gradient)" opacity="0.4"/>
  <circle cx="185" cy="60" r="1.5" fill="url(#bc3Gradient)" opacity="0.3"/>
</svg>