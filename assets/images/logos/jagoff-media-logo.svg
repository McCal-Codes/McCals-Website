<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" style="background: transparent;">
  <!-- Jagoff Media logo based on provided yellow/black design -->
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Yellow background shape -->
  <path d="M 50 20 L 350 20 Q 370 20 370 40 L 370 80 Q 370 100 350 100 L 50 100 Q 30 100 30 80 L 30 40 Q 30 20 50 20 Z" fill="url(#yellowGrad)" stroke="#000000" stroke-width="3"/>
  
  <!-- Main text YAJAGOFF! -->
  <text x="200" y="75" font-family="Arial Black, Helvetica, sans-serif" font-size="36" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="2px">YA JAGOFF!</text>
</svg>
