<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" style="background: transparent;">
  <!-- Western PA Press Club logo based on provided design -->
  
  <!-- "the" text in gray -->
  <text x="20" y="40" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="normal" fill="#999999">the</text>
  
  <!-- Main red background block -->
  <rect x="20" y="60" width="460" height="80" fill="#B22222" rx="5"/>
  
  <!-- "PRESS" text in white -->
  <text x="35" y="120" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" letter-spacing="2px">PRESS</text>
  
  <!-- "Club" text in white -->
  <text x="380" y="135" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">Club</text>
  
  <!-- "of Western Pennsylvania" text in black -->
  <text x="20" y="175" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000000">of Western Pennsylvania</text>
</svg>