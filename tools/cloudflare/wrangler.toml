# McCal API - Cloudflare Worker Configuration
# 
# Complete setup guide: docs/integrations/CLOUDFLARE-SUBDOMAIN-SETUP.md
# 
# Before deploying:
# 1. Create KV namespace: wrangler kv:namespace create "MCCAL_KV"
# 2. Update kv_namespaces.id with the ID returned above
# 3. Deploy: wrangler deploy complete-worker.js
# 4. Set secrets using: wrangler secret put VARIABLE_NAME
#    - JWT_SECRET
#    - WEBHOOK_SECRET
#    - BLOG_AUTHORS

name = "mccal-api"
main = "complete-worker.js"
compatibility_date = "2024-01-01"
account_id = "" # Set to your Cloudflare Account ID

# KV Namespace for rate limiting and blog storage
# Get ID from: wrangler kv:namespace create "MCCAL_KV"
kv_namespaces = [
  { binding = "MCCAL_KV", id = "YOUR_KV_NAMESPACE_ID_HERE" }
]

# Routes - API requests to api.mcc-cal.com route to this Worker
# Uncomment after setting up DNS CNAME record (api.mcc-cal.com → worker URL)
routes = [
  { pattern = "api.mcc-cal.com/*", zone_name = "mcc-cal.com" }
]

# Environment variables (non-sensitive)
# These are public and safe to commit
[vars]
ALLOWED_ORIGINS = "https://mcc-cal.com,https://*.mcc-cal.com,http://localhost:*"
MANIFEST_BASE_URL = "https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main"

# Secrets (set with: wrangler secret put VARIABLE_NAME)
# ⚠️  NEVER commit actual secrets - set in Cloudflare Dashboard
# JWT_SECRET = "generated_with_openssl_rand_hex_32"
# WEBHOOK_SECRET = "generated_with_openssl_rand_hex_32"
# BLOG_AUTHORS = "[{\"id\":\"author-1\",\"username\":\"mccal\",\"password\":\"secure-password\",\"name\":\"McCal\"}]"

# Production environment (optional)
# [env.production]
# name = "mccal-api-production"
# kv_namespaces = [
#   { binding = "MCCAL_KV", id = "your_production_kv_id" }
# ]
# routes = [
#   { pattern = "api.mcc-cal.com/*", zone_name = "mcc-cal.com" }
# ]
# 
# vars = { ALLOWED_ORIGINS = "https://mcc-cal.com,https://*.mcc-cal.com" }

