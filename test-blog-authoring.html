<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Widget v0.2 - Authoring Test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .container {
        background: white;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
      }
      h2 {
        color: #555;
        margin-top: 0;
      }
      label {
        display: block;
        margin: 10px 0 5px;
        font-weight: 500;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: inherit;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      button {
        background: #0a7a3e;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
      }
      button:hover {
        background: #085a30;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 4px;
        font-size: 14px;
      }
      .success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }
      .posts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .post-card {
        background: #f9f9f9;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 15px;
      }
      .post-card h3 {
        margin: 0 0 10px;
        color: #333;
      }
      .post-card .meta {
        font-size: 12px;
        color: #999;
        margin-bottom: 10px;
      }
      .post-card p {
        margin: 0;
        color: #555;
        font-size: 14px;
        line-height: 1.5;
      }
      .api-base {
        background: #f0f0f0;
        padding: 10px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        word-break: break-all;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>Blog Widget v0.2 - Authoring Test</h1>

    <div class="container">
      <h2>API Configuration</h2>
      <label>API Base URL:</label>
      <input
        type="text"
        id="apiBase"
        value="http://localhost:3001"
        placeholder="http://localhost:3001"
      />
      <button onclick="updateApiBase()">Update</button>
      <div id="apiStatus" class="status info" style="display: none"></div>
    </div>

    <div class="container">
      <h2>1. Test Login</h2>
      <label>Username:</label>
      <input
        type="text"
        id="username"
        placeholder="e.g., mccal"
        value="mccal"
      />

      <label>Password:</label>
      <input
        type="password"
        id="password"
        placeholder="test-password"
        value="test-password"
      />

      <button onclick="testLogin()">Login</button>
      <div id="loginStatus" class="status" style="display: none"></div>

      <label style="margin-top: 20px">Token (after login):</label>
      <input
        type="text"
        id="token"
        readonly
        placeholder="Token will appear here"
        style="background: #f5f5f5"
      />
    </div>

    <div class="container">
      <h2>2. Create New Post (requires login)</h2>
      <label>Title:</label>
      <input
        type="text"
        id="postTitle"
        placeholder="e.g., My First Blog Post"
      />

      <label>Excerpt:</label>
      <input
        type="text"
        id="postExcerpt"
        placeholder="e.g., A brief summary..."
      />

      <label>Content (separate paragraphs with |):</label>
      <textarea
        id="postContent"
        placeholder="First paragraph|Second paragraph|Third paragraph"
        rows="4"
      ></textarea>

      <label>Image URLs (optional, separate with |):</label>
      <input
        type="text"
        id="postImages"
        placeholder="https://example.com/image1.jpg|https://example.com/image2.jpg"
      />

      <button onclick="testCreatePost()">Create Post</button>
      <div id="createStatus" class="status" style="display: none"></div>
    </div>

    <div class="container">
      <h2>3. Fetch All Posts (read-only, no auth)</h2>
      <button onclick="testFetchPosts()">Fetch Posts</button>
      <div id="fetchStatus" class="status" style="display: none"></div>

      <div id="posts" class="posts-grid"></div>
    </div>

    <script>
      let apiBase = localStorage.getItem("apiBase") || "http://localhost:3001";
      let token = localStorage.getItem("blogToken") || "";

      document.getElementById("apiBase").value = apiBase;
      if (token) document.getElementById("token").value = token;

      function updateApiBase() {
        apiBase = document.getElementById("apiBase").value;
        localStorage.setItem("apiBase", apiBase);
        showStatus("apiStatus", "API base updated: " + apiBase, "success");
      }

      function showStatus(elementId, message, type = "info") {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.className = "status " + type;
        el.style.display = "block";
      }

      async function testLogin() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (!username || !password) {
          showStatus(
            "loginStatus",
            "Please enter username and password",
            "error"
          );
          return;
        }

        try {
          const res = await fetch(`${apiBase}/api/v1/blog/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (res.ok && data.token) {
            token = data.token;
            document.getElementById("token").value = token;
            localStorage.setItem("blogToken", token);
            showStatus(
              "loginStatus",
              `✅ Login successful! Author: ${data.author.name}`,
              "success"
            );
          } else {
            showStatus(
              "loginStatus",
              `❌ Login failed: ${data.message || "Unknown error"}`,
              "error"
            );
          }
        } catch (err) {
          showStatus("loginStatus", `❌ Error: ${err.message}`, "error");
        }
      }

      async function testCreatePost() {
        if (!token) {
          showStatus("createStatus", "❌ Please login first", "error");
          return;
        }

        const title = document.getElementById("postTitle").value;
        const excerpt = document.getElementById("postExcerpt").value;
        const contentStr = document.getElementById("postContent").value;
        const imagesStr = document.getElementById("postImages").value;

        if (!title || !excerpt || !contentStr) {
          showStatus(
            "createStatus",
            "Please fill in title, excerpt, and content",
            "error"
          );
          return;
        }

        const content = contentStr
          .split("|")
          .map((p) => p.trim())
          .filter((p) => p);
        const images = imagesStr
          ? imagesStr.split("|").map((url) => ({
              src: url.trim(),
              alt: "Post image",
              caption: undefined,
            }))
          : [];

        try {
          const res = await fetch(`${apiBase}/api/v1/blog/posts`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ title, excerpt, content, images }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            showStatus(
              "createStatus",
              "✅ Post created successfully!",
              "success"
            );
            // Refresh posts
            setTimeout(() => testFetchPosts(), 500);
          } else {
            showStatus(
              "createStatus",
              `❌ Failed: ${data.message || "Unknown error"}`,
              "error"
            );
          }
        } catch (err) {
          showStatus("createStatus", `❌ Error: ${err.message}`, "error");
        }
      }

      async function testFetchPosts() {
        try {
          const res = await fetch(`${apiBase}/api/v1/blog/posts`);
          const data = await res.json();

          if (res.ok && data.posts) {
            const postsDiv = document.getElementById("posts");
            postsDiv.innerHTML = "";

            if (data.posts.length === 0) {
              showStatus("fetchStatus", "ℹ️ No posts yet", "info");
              return;
            }

            showStatus(
              "fetchStatus",
              `✅ Loaded ${data.posts.length} post(s)`,
              "success"
            );

            data.posts.forEach((post) => {
              const card = document.createElement("div");
              card.className = "post-card";
              card.innerHTML = `
              <h3>${escapeHtml(post.title)}</h3>
              <div class="meta">By ${escapeHtml(post.author)} • ${
                post.date
              }</div>
              <p>${escapeHtml(post.excerpt)}</p>
            `;
              postsDiv.appendChild(card);
            });
          } else {
            showStatus(
              "fetchStatus",
              `❌ Failed to fetch posts: ${data.message || "Unknown error"}`,
              "error"
            );
          }
        } catch (err) {
          showStatus("fetchStatus", `❌ Error: ${err.message}`, "error");
        }
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Load initial posts on page load
      window.addEventListener("load", () => {
        testFetchPosts();
      });
    </script>
  </body>
</html>
