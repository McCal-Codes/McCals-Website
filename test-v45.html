<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concert Portfolio v4.5 Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        .test-container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Concert Portfolio v4.5 Test</h1>
        <p>This page tests the v4.5 concert portfolio widget with SEO enhancements.</p>

        <!-- Concert Portfolio Widget v4.5 -->
        <div id="concert-widget-container">
            <!-- The widget will be inserted here -->
        </div>

        <script>
            // Load the widget HTML
            fetch('./src/widgets/concert-portfolio/versions/v4.5.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('concert-widget-container').innerHTML = html;
                    // Auto-enable debug mode after a short delay
                    setTimeout(() => {
                        if (window.toggleDebug) {
                            window.toggleDebug();
                            console.log('Debug mode enabled automatically');
                        }
                    }, 1000);
                })
                .catch(error => {
                    console.error('Failed to load widget:', error);
                    document.getElementById('concert-widget-container').innerHTML =
                        '<p style="color: red;">Failed to load widget: ' + error.message + '</p>';
                });
        </script>
    </div>
</body>
</html></content>
