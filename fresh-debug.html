<!DOCTYPE html>
<html>
<head>
    <title>Fresh Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .result { margin: 10px 0; padding: 10px; background: white; border-radius: 4px; }
        .success { border-left: 4px solid #28a745; }
        .error { border-left: 4px solid #dc3545; }
    </style>
</head>
<body>
    <h1>Fresh Debug Test</h1>
    <button onclick="runTest()">Run Fresh Test</button>
    <button onclick="clearAll()">Clear All Cache</button>
    
    <div id="results"></div>
    
    <script>
        function log(message, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
        }
        
        function clearAll() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('results').innerHTML = '';
            log('All cache cleared');
        }
        
        async function runTest() {
            log('🚀 Starting fresh manifest test...');
            
            const portfolios = [
                { name: 'Concert', path: 'src/images/Portfolios/Concert/concert-manifest.json', arrayKey: 'bands' },
                { name: 'Events', path: 'src/images/Portfolios/Events/events-manifest.json', arrayKey: 'items' },
                { name: 'Journalism', path: 'src/images/Portfolios/Journalism/journalism-manifest.json', arrayKey: 'events' }
            ];
            
            let totalItems = 0;
            
            for (const portfolio of portfolios) {
                try {
                    const url = `${portfolio.path}?fresh=${Date.now()}`;
                    log(`Loading ${portfolio.name}: ${url}`);
                    
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const manifest = await response.json();
                    const items = manifest[portfolio.arrayKey] || [];
                    
                    log(`✅ ${portfolio.name}: ${items.length} items found (array: ${portfolio.arrayKey})`);
                    totalItems += items.length;
                    
                    if (items.length > 0) {
                        const sample = items[0];
                        log(`Sample item: ${sample.title || sample.bandName || sample.eventName || 'No title'}`);
                    }
                    
                } catch (error) {
                    log(`❌ ${portfolio.name}: ${error.message}`, true);
                }
            }
            
            log(`🎯 Total items found: ${totalItems}`);
        }
        
        // Auto-run on load
        window.addEventListener('load', () => {
            clearAll();
            setTimeout(runTest, 500);
        });
    </script>
</body>
</html>
