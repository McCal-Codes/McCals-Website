<style>
  /* Client Carousel Squarespace Styles */
  .ss-client-showcase {
    max-width: 1000px;
    margin: 0 auto;
    padding: 30px 20px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  .ss-client-heading {
    font: 700 24px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f5f5f5;
    margin: 0 0 10px;
  }

  .ss-client-subtitle {
    font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #888;
    margin: 0 0 30px;
  }

  .ss-client-carousel {
    position: relative;
    overflow: hidden;
    padding: 15px 0;
  }

  .ss-client-track {
    display: flex;
    animation: ss-scroll 25s linear infinite;
    width: calc(180px * 20);
  }

  .ss-client-track:hover {
    animation-play-state: paused;
  }

  @keyframes ss-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(-180px * 10)); }
  }

  .ss-client-logo {
    flex: 0 0 160px;
    height: 100px;
    margin: 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    border-radius: 10px;
    border: 1px solid #2a2a2a;
    transition: all 0.3s ease;
    cursor: pointer;
    overflow: hidden;
  }

  .ss-client-logo:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }

  .ss-client-logo img {
    max-width: 120px;
    max-height: 70px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: grayscale(1) opacity(0.7);
    transition: filter 0.3s ease;
  }

  .ss-client-logo:hover img {
    filter: grayscale(0) opacity(1);
  }

  .ss-client-stats {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }

  .ss-stat-item {
    text-align: center;
  }

  .ss-stat-number {
    font: 700 20px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f5f5f5;
    display: block;
  }

  .ss-stat-label {
    font: 600 11px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .ss-client-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    font: 600 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #f5f5f5;
    opacity: 0.7;
  }

  .ss-client-spinner {
    width: 20px;
    height: 20px;
    border: 2px solid #2a2a2a;
    border-top: 2px solid #ff4d6d;
    border-radius: 50%;
    animation: ss-spin 1s linear infinite;
    margin-right: 12px;
  }

  @keyframes ss-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .ss-client-logo {
      flex: 0 0 120px;
      height: 80px;
      margin: 0 6px;
    }
    .ss-client-logo img {
      max-width: 80px;
      max-height: 50px;
    }
    .ss-client-stats {
      gap: 20px;
    }
    .ss-stat-number {
      font-size: 18px;
    }
  }

  @media (max-width: 480px) {
    .ss-client-showcase {
      padding: 20px 10px;
    }
  }
</style>

<div class="ss-client-showcase">

  <div id="ss-client-container" class="ss-client-loading">
    <div class="ss-client-spinner"></div>
    Loading clients...
  </div>

  <div class="ss-client-stats">
    <div class="ss-stat-item">

</div>

  function handleLogoError(img, client) {
    const fallbacks = {
      'New York Post': 'https://via.placeholder.com/200x80/1a1a1a/FFFFFF?text=New+York+Post',
      'Pittsburgh Magazine': 'https://via.placeholder.com/200x80/2a2a2a/FFFFFF?text=Pittsburgh+Magazine',

      'Yinzers Meet': 'https://via.placeholder.com/200x80/2d2d2d/FFFFFF?text=Yinzers+Meet',

      'University of Pittsburgh': 'https://via.placeholder.com/200x80/003594/FFFFFF?text=Pitt',
      'Butler County Community College': 'https://via.placeholder.com/200x80/2d2d2d/FFFFFF?text=BC3',
      'Penn State Fayette': 'https://via.placeholder.com/200x80/041E42/FFFFFF?text=Penn+State+Fayette',
      'The Watchful Shepherd': 'https://via.placeholder.com/200x80/4A5568/FFFFFF?text=Watchful+Shepherd',
      'Voyage Visuals': 'https://via.placeholder.com/200x80/2d2d2d/FFFFFF?text=Voyage+Visuals',
      'The Space Upstairs': 'https://via.placeholder.com/200x80/262626/FFFFFF?text=Space+Upstairs',
      'Haven Pittsburgh': 'https://via.placeholder.com/200x80/2E7D32/FFFFFF?text=Haven+Pittsburgh'
    };
    img.src = fallbacks[client.name] || `https://via.placeholder.com/200x80/222222/FFFFFF?text=${encodeURIComponent(client.name)}`;
  }

  function createClientCarousel() {
    const container = document.getElementById('ss-client-container');
    if (!container) return;

    const doubledClients = [...clientsData, ...clientsData];
    const carousel = document.createElement('div');
    carousel.className = 'ss-client-carousel';
    const track = document.createElement('div');
    track.className = 'ss-client-track';

    doubledClients.forEach(client => {
      const logoElement = document.createElement('div');
      logoElement.className = 'ss-client-logo';
      logoElement.setAttribute('title', `${client.name} - ${client.project}`);

      const img = document.createElement('img');
      img.alt = `${client.name} logo`;
      img.loading = 'lazy';
      img.onerror = () => handleLogoError(img, client);
      img.src = client.logo;

      logoElement.appendChild(img);
      logoElement.addEventListener('click', () => {
        if (client.website) window.open(client.website, '_blank', 'noopener noreferrer');
      });

      track.appendChild(logoElement);
    });

    carousel.appendChild(track);
    container.className = 'ss-client-container';
    container.innerHTML = '';
    container.appendChild(carousel);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', createClientCarousel);
  } else {
    createClientCarousel();
  }
})();
</script>
