<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Portfolio Widget v1.2 Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }
    .test-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>Featured Portfolio Widget v1.2 Test</h1>
    
    <!-- Load the widget directly from the file -->
    <div id="widget-container">
      <!-- Widget will be loaded here -->
    </div>
  </div>

  <script>
    async function loadWidget() {
      try {
        const response = await fetch('/src/widgets/featured-portfolio/versions/v1.2.html');
        const widgetHtml = await response.text();
        
        // Extract just the widget part (everything after the comment block)
        const widgetStart = widgetHtml.indexOf('<style>');
        if (widgetStart !== -1) {
          const cleanWidget = widgetHtml.substring(widgetStart);
          document.getElementById('widget-container').innerHTML = cleanWidget;
          console.log('Widget v1.2 loaded successfully');
        } else {
          console.error('Could not find widget content');
        }
      } catch (error) {
        console.error('Error loading widget:', error);
      }
    }

    // Load the widget when the page loads
    loadWidget();
    
    // Add some debugging
    window.addEventListener('load', () => {
      setTimeout(() => {
        console.log('Page fully loaded, checking for debug panel...');
        const debugToggle = document.querySelector('.debug-toggle');
        if (debugToggle) {
          console.log('Debug toggle found, enabling debug mode');
          debugToggle.click();
        }
      }, 2000);
    });
  </script>
</body>
</html>
