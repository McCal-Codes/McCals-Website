<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Portfolio v1.5 - Full Widget Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
        .debug-overlay {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #ccc;
            z-index: 10001;
            border: 1px solid #333;
            max-width: 300px;
        }
        .debug-overlay h4 {
            margin: 0 0 8px 0;
            color: #888;
            font-size: 12px;
        }
        .debug-overlay div {
            margin: 2px 0;
        }
        .debug-overlay .status {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="debug-overlay">
        <h4>🔍 Environment Debug</h4>
        <div>Protocol: <span id="protocol"></span></div>
        <div>Hostname: <span id="hostname"></span></div>
        <div>Is Local: <span id="isLocal" class="status"></span></div>
        <div>Base Path: <span id="basePath"></span></div>
        <div>Manifest Path: <span id="manifestPath"></span></div>
    </div>

    <!-- Include the actual widget content -->
    <div id="widget-container"></div>

    <script>
        // Update debug overlay
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('hostname').textContent = window.location.hostname || 'file://';
        
        const isLocal = window.location.protocol === 'file:' || 
                        window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1';
                        
        const RAW_ROOT = isLocal ? '../../../' : 'https://raw.githubusercontent.com/McCal-Codes/McCals-Website/main/';
        
        document.getElementById('isLocal').textContent = isLocal ? 'YES' : 'NO';
        document.getElementById('basePath').textContent = RAW_ROOT;
        document.getElementById('manifestPath').textContent = RAW_ROOT + 'src/images/Portfolios/featured-manifest.json';
        
        // Load the widget content
        fetch('/src/widgets/featured-portfolio/versions/v1.5.html')
            .then(response => response.text())
            .then(html => {
                // Extract just the widget part (everything after the first <style> tag)
                const styleStart = html.indexOf('<style>');
                const widgetContent = html.substring(styleStart);
                document.getElementById('widget-container').innerHTML = widgetContent;
            })
            .catch(error => {
                console.error('Failed to load widget:', error);
                document.getElementById('widget-container').innerHTML = `
                    <div style="text-align: center; padding: 50px; color: #ff6b6b;">
                        <h2>Failed to load widget</h2>
                        <p>Error: ${error.message}</p>
                        <p>Make sure you're running this from the local dev server</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
