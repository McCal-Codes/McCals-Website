name: Auto-Generate Concert Manifest

on:
  push:
    branches: [main]
    paths:
      - 'src/images/Portfolios/Concert/**'
      - 'scripts/manifest/**'
      - '.github/workflows/concert-manifest.yml'

  pull_request:
    branches: [main]
    paths:
      - 'src/images/Portfolios/Concert/**'
      - 'scripts/manifest/**'
      - '.github/workflows/concert-manifest.yml'

  # Also run on manual trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: concert-manifest-${{ github.ref }}
  cancel-in-progress: false # Don't cancel - let it complete to avoid corruption

jobs:
  generate:
    uses: ./.github/workflows/reusable-manifest.yml
    with:
      portfolio: concert
      notify-webhook: true
    secrets: inherit
