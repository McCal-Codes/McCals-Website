name: AI instructions preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Preflight summary
        run: |
          node scripts/utils/ai-instructions-preflight.js --short | tee preflight-summary.txt

      - name: Upload summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-instructions-preflight
          path: preflight-summary.txt
