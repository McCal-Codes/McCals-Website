name: Accessibility — axe (Playwright/Firefox)

on:
  push:
    branches: [ 'staging' ]
  pull_request:
    paths:
      - 'src/widgets/**'
      - 'src/site/**'
      - '.github/workflows/a11y-axe-firefox.yml'
  workflow_dispatch:
    inputs:
      target-url:
        description: 'Page URL to scan (required for manual runs)'
        required: true

jobs:
  axe-audit:
    name: Run axe (Playwright/Firefox) and upload results
    runs-on: ubuntu-latest
    steps:
      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: '20'
          fetch-depth: '0'
          use-lfs: 'false'

      - name: Install Playwright Firefox runtime
        run: npx playwright install firefox

      - name: Ensure TARGET_URL
        id: ensure_target_url
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -n "${{ github.event.inputs.target-url }}" ]; then
            TARGET_URL='${{ github.event.inputs.target-url }}'
          else
            TARGET_URL="$STAGING_URL"
          fi
          if [ -z "${TARGET_URL}" ]; then
            echo "Skipping axe audit: TARGET_URL/STAGING_URL not set.";
            echo "skip=true" >> "$GITHUB_OUTPUT";
            exit 0;
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "target_url=${TARGET_URL}" >> "$GITHUB_OUTPUT"
          echo "TARGET_URL=${TARGET_URL}" > target_url.env

      - name: Run axe-firefox audit
        if: steps.ensure_target_url.outputs.skip != 'true'
        env:
          AXE_FAIL_ON_VIOLATIONS: 'true'
        run: |
          . ./target_url.env
          echo "Running axe audit against: ${TARGET_URL}"
          npm run a11y:axe:firefox -- "${TARGET_URL}"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: axe-firefox-reports
          path: |
            reports/axe-firefox-results.json
            reports/axe-firefox-widget-report.html
            reports/axe-firefox-summary.md
