---
name: Accessibility — axe

# What this used to be, and why each part is gone:
#
#   - Its pull_request paths filter named src/widgets/** and src/site/**, and
#     neither directory exists. No code change could trigger it.
#   - The script exited non-zero only when axe itself threw, so violations were
#     written to JSON and the job went green.
#   - It injected axe from a CDN at run time, so a cdnjs outage was the only
#     realistic way it went red.
#   - It scanned one URL, from a secret, and skipped silently when that secret
#     was unset. The upload step had no matching condition, so it published
#     three report files regardless. Two of the three were never written by any
#     script: they were committed in November 2025 and re-uploaded on every run
#     as though they were results.
#
# It now builds the site, serves it, and scans several routes against that
# build. No secret, so no silent skip, and nothing to be stale.

on:
  pull_request:
    paths:
      - 'sites/mcc-cal-vite/src/**'
      - 'sites/mcc-cal-vite/index.html'
      - 'scripts/a11y/**'
      - '.github/workflows/a11y-axe-firefox.yml'
  workflow_dispatch:
    inputs:
      target-url:
        description: 'Scan a deployed URL instead of a local build'
        required: false

permissions:
  contents: read

jobs:
  axe-audit:
    name: Scan for accessibility violations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            sites/mcc-cal-vite/package-lock.json

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-firefox-

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Build, serve and scan
        id: scan
        env:
          TARGET_URL: ${{ github.event.inputs.target-url }}
        run: |
          set -euo pipefail

          if [ -n "${TARGET_URL}" ]; then
            node scripts/a11y/axe-firefox.js --base-url "${TARGET_URL}"
            exit $?
          fi

          cd sites/mcc-cal-vite
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

          # What was observed: vite printed "Local: http://localhost:4173/" and
          # the readiness probe against http://127.0.0.1:4173/ then timed out for
          # the full 30 seconds, so the scan never ran. The likeliest cause is
          # the runner resolving localhost to ::1 while the probe asked for IPv4,
          # but that was not reproducible locally, so this does not rely on the
          # diagnosis: the host is pinned, and the probe below tries both names.
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          # Serving and scanning in one step, so the server's life is the step's
          # life. A background process started in one step and used in another
          # is not something to rely on.
          trap 'kill "${PREVIEW_PID}" 2>/dev/null || true' EXIT

          ready=
          for _ in $(seq 1 30); do
            for host in 127.0.0.1 localhost; do
              if curl -sf -o /dev/null "http://${host}:4173/"; then ready="${host}"; break 2; fi
            done
            sleep 1
          done
          if [ -z "${ready}" ]; then
            echo "Preview server answered on neither 127.0.0.1 nor localhost:4173" >&2
            # Say what it did print, so the next person is not guessing either.
            ss -tlnp 2>/dev/null | grep 4173 || true
            exit 1
          fi
          echo "Preview server ready on ${ready}:4173"

          cd "${GITHUB_WORKSPACE}"
          node scripts/a11y/axe-firefox.js --base-url "http://${ready}:4173"

      - name: Upload reports
        # Whether the scan passed or failed, but not when it never ran: a
        # missing report then is correct, and erroring on it buries the real
        # failure under a second one.
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: axe-reports
          path: |
            reports/axe-firefox-results.json
            reports/axe-firefox-summary.md
          if-no-files-found: error
