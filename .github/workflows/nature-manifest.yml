name: Auto-Generate Nature Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/Nature/**'
      - 'scripts/manifest/**'
      - '.github/workflows/nature-manifest.yml'
  
  pull_request:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/Nature/**'
      - 'scripts/manifest/**'
      - '.github/workflows/nature-manifest.yml'
  
  # Also run on manual trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nature-manifest-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel - let it complete to avoid corruption

jobs:
  update-nature-manifest:
    runs-on: ubuntu-latest
    env:
      MANIFEST_WEBHOOK_URL: ${{ secrets.MANIFEST_WEBHOOK_URL }}
      MANIFEST_WEBHOOK_BASE: ${{ secrets.MANIFEST_WEBHOOK_BASE }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check for nature images
        id: check_images
        run: |
          echo "🔍 Checking for nature images..."
          
          # Count total images in nature directory
          IMAGE_COUNT=$(find src/images/Portfolios/Nature -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) | wc -l)
          echo "📸 Found $IMAGE_COUNT nature images"
          
          # Count wildlife collections
          WILDLIFE_COUNT=$(find src/images/Portfolios/Nature/Wildlife -mindepth 2 -maxdepth 2 -type d ! -name ".*" 2>/dev/null | wc -l)
          echo "🦅 Found $WILDLIFE_COUNT wildlife collections"
          
          # Count landscape collections
          LANDSCAPE_COUNT=$(find src/images/Portfolios/Nature/Landscapes -mindepth 1 -maxdepth 1 -type d ! -name ".*" 2>/dev/null | wc -l)
          echo "🏞️ Found $LANDSCAPE_COUNT landscape collections"
          
          # Count forest collections
          FOREST_COUNT=$(find src/images/Portfolios/Nature/Forests -mindepth 1 -maxdepth 1 -type d ! -name ".*" 2>/dev/null | wc -l)
          echo "🌲 Found $FOREST_COUNT forest collections"
          
          # Set outputs
          echo "image_count=$IMAGE_COUNT" >> $GITHUB_OUTPUT
          echo "wildlife_count=$WILDLIFE_COUNT" >> $GITHUB_OUTPUT
          echo "landscape_count=$LANDSCAPE_COUNT" >> $GITHUB_OUTPUT
          echo "forest_count=$FOREST_COUNT" >> $GITHUB_OUTPUT
          
          # Check if nature manifest script exists
          if [ -f "scripts/manifest/generate-nature-manifest.js" ]; then
            echo "✅ Nature manifest generator found"
            echo "has_generator=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Nature manifest generator not found"
            echo "has_generator=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate nature manifest
        if: steps.check_images.outputs.has_generator == 'true'
        run: |
          echo "🔄 Regenerating nature manifest..."
          
          # Create backup of existing manifest for widget protection
          if [ -f "src/images/Portfolios/Nature/nature-manifest.json" ]; then
            cp "src/images/Portfolios/Nature/nature-manifest.json" "src/images/Portfolios/Nature/nature-manifest.json.backup"
            echo "📋 Created backup of existing manifest"
          fi
          
          # Retry logic for manifest generation
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            
            if npm run manifest:nature; then
              echo "✅ Nature manifest generation completed"
              break
            else
              echo "⚠️ Attempt $attempt failed"
              if [ $attempt -eq 3 ]; then
                echo "❌ All attempts failed"
                # Restore from backup if available
                if [ -f "src/images/Portfolios/Nature/nature-manifest.json.backup" ]; then
                  mv "src/images/Portfolios/Nature/nature-manifest.json.backup" "src/images/Portfolios/Nature/nature-manifest.json"
                  echo "🔄 Restored manifest from backup"
                fi
                exit 1
              fi
              sleep 5
            fi
          done
          
          # Validate manifest exists and is valid JSON
          if [ -f "src/images/Portfolios/Nature/nature-manifest.json" ]; then
            # Test if it's valid JSON
            if jq empty src/images/Portfolios/Nature/nature-manifest.json 2>/dev/null; then
              echo "✅ Nature manifest generated successfully"
              
              # Extract key info from manifest
              COLLECTIONS=$(jq '.totalCollections' src/images/Portfolios/Nature/nature-manifest.json)
              echo "📁 Total collections: $COLLECTIONS"
              
              # Clean up backup
              rm -f "src/images/Portfolios/Nature/nature-manifest.json.backup"
            else
              echo "❌ Generated manifest is not valid JSON"
              # Restore from backup if available
              if [ -f "src/images/Portfolios/Nature/nature-manifest.json.backup" ]; then
                mv "src/images/Portfolios/Nature/nature-manifest.json.backup" "src/images/Portfolios/Nature/nature-manifest.json"
                echo "🔄 Restored manifest from backup"
              fi
              exit 1
            fi
          else
            echo "❌ Manifest file was not created"
            # Restore from backup if available
            if [ -f "src/images/Portfolios/Nature/nature-manifest.json.backup" ]; then
              mv "src/images/Portfolios/Nature/nature-manifest.json.backup" "src/images/Portfolios/Nature/nature-manifest.json"
              echo "🔄 Restored manifest from backup"
            fi
            exit 1
          fi

      - name: Widget compatibility check
        if: steps.check_images.outputs.has_generator == 'true'
        run: |
          echo "🔍 Checking widget compatibility..."
          
          # Verify manifest has required structure for widgets
          if jq -e '.version' src/images/Portfolios/Nature/nature-manifest.json > /dev/null; then
            echo "✅ Manifest version field present"
          else
            echo "⚠️ Manifest missing version field"
          fi
          
          if jq -e '.collections' src/images/Portfolios/Nature/nature-manifest.json > /dev/null; then
            echo "✅ Manifest collections field present"
          else
            echo "❌ Manifest missing collections field (CRITICAL)"
            exit 1
          fi
          
          echo "✅ Widget compatibility check passed"

      - name: Check for changes
        id: check_changes
        if: steps.check_images.outputs.has_generator == 'true'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "📝 Changes detected in manifest"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            echo "Changed files:"
            git status --porcelain
          else
            echo "✅ No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push manifest
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage all manifest files
          git add src/images/Portfolios/Nature/nature-manifest.json
          # Per-folder manifests are deprecated. Do NOT add per-folder manifest.json files.
          # If you need to remove legacy per-folder manifests, use scripts/manifest/remove-subfolder-manifests.js
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "📋 No changes to commit"
          else
            # Create commit with detailed message
            COLLECTIONS=$(jq '.totalCollections' src/images/Portfolios/Nature/nature-manifest.json)
            
            git commit -m "🌱 Auto-update nature manifest" \
              -m "Updated nature-manifest.json" \
              -m "Collections: $COLLECTIONS" \
              -m "Wildlife: ${{ steps.check_images.outputs.wildlife_count }}" \
              -m "Landscapes: ${{ steps.check_images.outputs.landscape_count }}" \
              -m "Forests: ${{ steps.check_images.outputs.forest_count }}" \
              -m "Images: ${{ steps.check_images.outputs.image_count }}" \
              -m "Generated by GitHub Actions"
            
            echo "✅ Changes committed"
          fi

      - name: Notify API webhook
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        uses: ./.github/actions/notify-manifest-webhook
        with:
          portfolio: nature
          type: refresh

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        run: |
          # Use retry logic for push
          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3..."
            
            if git push; then
              echo "✅ Changes pushed successfully"
              break
            else
              echo "⚠️ Push attempt $attempt failed"
              if [ $attempt -eq 3 ]; then
                echo "❌ All push attempts failed"
                exit 1
              fi
              
              # Pull with rebase before retry
              git pull --rebase
              sleep 3
            fi
          done

      - name: PR Validation Summary
        if: github.event_name == 'pull_request' && steps.check_images.outputs.has_generator == 'true'
        run: |
          echo "🎯 Nature Manifest Workflow Summary:"
          echo "- Images found: ${{ steps.check_images.outputs.image_count }}"
          echo "- Wildlife collections: ${{ steps.check_images.outputs.wildlife_count }}"
          echo "- Landscape collections: ${{ steps.check_images.outputs.landscape_count }}"
          echo "- Forest collections: ${{ steps.check_images.outputs.forest_count }}"
          echo "- Generator available: ${{ steps.check_images.outputs.has_generator }}"
          echo ""
          
          if [ -f "src/images/Portfolios/Nature/nature-manifest.json" ]; then
            echo "✅ Nature manifest exists"
            
            # Show manifest summary
            if command -v jq &> /dev/null; then
              echo ""
              echo "📊 Manifest Contents:"
              jq -r '.collections[] | "  • \(.collectionName): \(.totalImages) images [\(.tags | join(", "))]"'
            fi
          else
            echo "❌ Nature manifest missing"
          fi

      - name: Push changes
        if: steps.check_images.outputs.has_generator == 'true'
        run: |
          # Use retry logic for push
          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3..."
            
            if git push; then
              echo "✅ Changes pushed successfully"
              break
            else
              echo "⚠️ Push attempt $attempt failed"
              if [ $attempt -eq 3 ]; then
                echo "❌ All push attempts failed"
                exit 1
              fi
              
              # Pull with rebase before retry
              git pull --rebase
              sleep 3
            fi
          done

      - name: Summary
        if: always()
        run: |
          echo "🎯 Nature Manifest Workflow Summary:"
          echo "- Images found: ${{ steps.check_images.outputs.image_count }}"
          echo "- Wildlife collections: ${{ steps.check_images.outputs.wildlife_count }}"
          echo "- Landscape collections: ${{ steps.check_images.outputs.landscape_count }}"
          echo "- Forest collections: ${{ steps.check_images.outputs.forest_count }}"
          echo "- Generator available: ${{ steps.check_images.outputs.has_generator }}"
          echo ""
          
          if [ -f "src/images/Portfolios/Nature/nature-manifest.json" ]; then
            echo "✅ Nature manifest exists"
            
            # Show manifest summary
            if command -v jq &> /dev/null; then
              echo ""
              echo "📊 Manifest Contents:"
              jq -r '.collections[] | "  • \(.collectionName): \(.totalImages) images [\(.tags | join(", "))]"' src/images/Portfolios/Nature/nature-manifest.json || echo "  (Unable to parse manifest)"
            fi
          else
            echo "❌ Nature manifest missing"
          fi
