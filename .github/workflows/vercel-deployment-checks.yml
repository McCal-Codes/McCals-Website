name: Vercel Deployment Checks

concurrency:
  group: vercel-deployment-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read
  statuses: write

jobs:
  # Build Check
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: cd sites/mcc-cal-vite && npm ci --prefer-offline --no-audit --no-fund

      - name: Run Build
        run: cd sites/mcc-cal-vite && npm run build

      - name: Notify Vercel - Build
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: Build',
              description: '${{ job.status }}' === 'success' ? 'Build passed' : 'Build failed'
            })

  # Lint Check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Notify Vercel - Lint
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: Lint',
              description: '${{ job.status }}' === 'success' ? 'Lint passed' : 'Lint failed'
            })

  # TypeScript Check
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: cd sites/mcc-cal-vite && npm ci --prefer-offline --no-audit --no-fund

      - name: Run TypeScript Check
        run: cd sites/mcc-cal-vite && npx tsc -b --noEmit

      - name: Notify Vercel - TypeScript
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: TypeScript Check',
              description: '${{ job.status }}' === 'success' ? 'TypeScript passed' : 'TypeScript failed'
            })

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: cd sites/mcc-cal-vite && npm ci --prefer-offline --no-audit --no-fund

      - name: Run Vitest
        run: cd sites/mcc-cal-vite && npm run test:run

      - name: Notify Vercel - Unit tests
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: Unit tests',
              description: '${{ job.status }}' === 'success' ? 'Vitest passed' : 'Vitest failed'
            })

  # Aggregate Status Check (optional - marks overall status)
  all-checks-complete:
    name: All Checks Complete
    needs: [build, lint, typecheck, unit-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check All Jobs Status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "One or more checks failed"
            exit 1
          else
            echo "All checks passed"
          fi

      - name: Notify Vercel - All Checks
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: All Checks',
              description: '${{ job.status }}' === 'success' ? 'All checks passed' : 'Some checks failed'
            })
