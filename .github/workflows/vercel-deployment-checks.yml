name: Vercel Deployment Checks

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read
  statuses: write

jobs:
  # Build Check
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd sites/mcc-cal-vite && npm ci --prefer-offline --no-audit --no-fund

      - name: Run Build
        run: cd sites/mcc-cal-vite && npm run build:fast

      - name: Notify Vercel - Build
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: Build',
              description: '${{ job.status }}' === 'success' ? 'Build passed' : 'Build failed'
            })

  # Lint Check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd sites/mcc-cal-vite && npm ci --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: cd sites/mcc-cal-vite && npm run lint

      - name: Notify Vercel - Lint
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: Lint',
              description: '${{ job.status }}' === 'success' ? 'Lint passed' : 'Lint failed'
            })

  # CI Validation Check
  ci-check:
    name: CI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd sites/mcc-cal-vite && npm ci --prefer-offline --no-audit --no-fund

      - name: Run CI Check
        run: cd sites/mcc-cal-vite && npm run ci:check

      - name: Notify Vercel - CI Check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: CI Validation',
              description: '${{ job.status }}' === 'success' ? 'CI check passed' : 'CI check failed'
            })

  # Manifest Validation Check
  manifest-check:
    name: Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd sites/mcc-cal-vite && npm ci --prefer-offline --no-audit --no-fund || true

      - name: Validate Manifests
        run: cd sites/mcc-cal-vite && node scripts/validate-manifests.js

      - name: Notify Vercel - Manifest Check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: Manifest Validation',
              description: '${{ job.status }}' === 'success' ? 'Manifest check passed' : 'Manifest check failed'
            })

  # Aggregate Status Check (optional - marks overall status)
  all-checks-complete:
    name: All Checks Complete
    needs: [build, lint, ci-check, manifest-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check All Jobs Status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.ci-check.result }}" == "failure" ]] || \
             [[ "${{ needs.manifest-check.result }}" == "failure" ]]; then
            echo "One or more checks failed"
            exit 1
          else
            echo "All checks passed"
          fi

      - name: Notify Vercel - All Checks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Vercel - mc-cals-website: All Checks',
              description: '${{ job.status }}' === 'success' ? 'All checks passed' : 'Some checks failed'
            })
