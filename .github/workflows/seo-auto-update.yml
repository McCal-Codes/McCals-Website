name: SEO Auto Update

concurrency:
  group: seo-auto-update-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'src/images/Portfolios/**'
      - 'scripts/blog/**'
      - 'scripts/manifest/**'
      - 'sites/mcc-cal-vite/scripts/**'
      - 'sites/mcc-cal-vite/src/config/public-routes.js'
      - 'sites/mcc-cal-vite/src/content/pageSeoData.json'
      - '.github/workflows/seo-auto-update.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  update-seo:
    name: Update SEO assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_DIR: sites/mcc-cal-vite
      APP_SITEMAP: sites/mcc-cal-vite/dist/sitemap.xml
      SOURCE_SITEMAP: sites/mcc-cal-vite/public-vite/sitemap.xml
      SITE_URL: ${{ secrets.SITE_URL || 'https://mcc-cal.com' }}
      API_BASE: ${{ secrets.API_BASE_URL || 'https://api.mcc-cal.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            sites/mcc-cal-vite/package-lock.json

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install public app dependencies
        run: cd "$APP_DIR" && npm ci --prefer-offline --no-audit --no-fund

      - name: Generate portfolio manifests
        run: npm run manifest:generate

      - name: Verify API availability
        run: |
          API_BASE_NO_SLASH="${API_BASE%/}"
          echo "Checking API at ${API_BASE_NO_SLASH}"
          curl -sf "${API_BASE_NO_SLASH}/api/v1/health" || echo "Warning: API health check failed, continuing with static generation"

      - name: Build public app SEO output
        run: cd "$APP_DIR" && npm run build

      - name: Validate generated sitemap
        run: |
          SITE_URL_NO_SLASH="${SITE_URL%/}"

          if [ ! -f "$SOURCE_SITEMAP" ]; then
            echo "Source sitemap not found: $SOURCE_SITEMAP"
            exit 1
          fi

          if [ ! -f "$APP_SITEMAP" ]; then
            echo "Built sitemap not found: $APP_SITEMAP"
            exit 1
          fi

          if ! grep -q '<?xml version="1.0"' "$APP_SITEMAP"; then
            echo "Built sitemap missing XML declaration"
            exit 1
          fi

          STALE_DOMAIN='mccalmedia[.]com'
          if grep -Eq "$STALE_DOMAIN" "$SOURCE_SITEMAP" "$APP_SITEMAP"; then
            echo "Sitemap contains the legacy site domain"
            exit 1
          fi

          if ! grep -Fq "$SITE_URL_NO_SLASH" "$APP_SITEMAP"; then
            echo "Built sitemap does not contain canonical site URL: $SITE_URL_NO_SLASH"
            exit 1
          fi

          URL_COUNT=$(grep -c '<loc>' "$APP_SITEMAP" || echo "0")
          echo "Validated $URL_COUNT sitemap URLs for $SITE_URL_NO_SLASH"

      - name: Check for generated changes
        id: changes
        run: |
          GENERATED_PATHS=(
            "src/content/blog"
            "src/images/Portfolios"
            "$APP_DIR/public-vite/images/social"
            "$APP_DIR/public-vite/manifests"
            "$APP_DIR/public-vite/sitemap.xml"
          )

          if [ -z "$(git status --porcelain -- "${GENERATED_PATHS[@]}")" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No SEO changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "SEO changes detected:"
            git status --short -- "${GENERATED_PATHS[@]}"
          fi

      - name: Commit SEO updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          GENERATED_PATHS=(
            "src/content/blog"
            "src/images/Portfolios"
            "$APP_DIR/public-vite/images/social"
            "$APP_DIR/public-vite/manifests"
            "$APP_DIR/public-vite/sitemap.xml"
          )

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -- "${GENERATED_PATHS[@]}"

          if git diff --cached --quiet; then
            echo "No generated changes to commit after staging"
            exit 0
          fi

          URL_COUNT=$(grep -c '<loc>' "$SOURCE_SITEMAP" || echo "0")
          MANIFEST_COUNT=$(find "$APP_DIR/public-vite/manifests" -name '*.json' | wc -l)

          git commit \
            -m "chore: update SEO assets [automated]" \
            -m "Sitemap: $URL_COUNT URLs" \
            -m "Public manifests: $MANIFEST_COUNT files" \
            -m "Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            -m "Trigger: ${{ github.event_name }}"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git push

      - name: Submit sitemap to search engines
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          SITE_URL_NO_SLASH="${SITE_URL%/}"
          SITEMAP_URL="${SITE_URL_NO_SLASH}/sitemap.xml"

          echo "Submitting sitemap: $SITEMAP_URL"
          curl -s "https://www.google.com/ping?sitemap=${SITEMAP_URL}" || true

          # Bing removed unauthenticated ping submissions. Keep this log as the
          # reminder to use Bing Webmaster Tools or IndexNow when configured.
          echo "Bing sitemap submission should be handled through Bing Webmaster Tools or IndexNow: $SITEMAP_URL"

      - name: Create summary
        run: |
          SITE_URL_NO_SLASH="${SITE_URL%/}"
          URL_COUNT=$(grep -c '<loc>' "$APP_SITEMAP" 2>/dev/null || echo "0")
          SOURCE_URL_COUNT=$(grep -c '<loc>' "$SOURCE_SITEMAP" 2>/dev/null || echo "0")
          MANIFEST_COUNT=$(find "$APP_DIR/public-vite/manifests" -name '*.json' 2>/dev/null | wc -l)

          echo "## SEO Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Canonical site URL: $SITE_URL_NO_SLASH" >> $GITHUB_STEP_SUMMARY
          echo "- Source sitemap URLs: $SOURCE_URL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Built sitemap URLs: $URL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Public manifest files: $MANIFEST_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Changes committed: ${{ steps.changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`$SOURCE_SITEMAP\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$APP_SITEMAP\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$APP_DIR/public-vite/manifests/*.json\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload SEO artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seo-assets
          path: |
            sites/mcc-cal-vite/dist/sitemap.xml
            sites/mcc-cal-vite/public-vite/sitemap.xml
            sites/mcc-cal-vite/public-vite/manifests/*.json
          retention-days: 30
