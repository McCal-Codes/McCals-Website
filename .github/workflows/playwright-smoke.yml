name: Playwright Smoke Test

on:
  schedule:
    # Runs daily at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (chromium)
        run: |
          mkdir -p reports/playwright
          npx playwright test tests/playwright --reporter=list,html --workers=1

      # The axe step that was here has moved to a11y-axe-firefox.yml, which runs
      # on pull requests against a build it makes itself. This one depended on a
      # STAGING_URL secret and exited 0 when it was unset, so on most nights it
      # scanned nothing and said nothing, and its output was written to disk and
      # never uploaded. Two copies of a scan, one of them silent, is worse than
      # one that runs.

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports
          path: |
            playwright-report/
            reports/playwright/
