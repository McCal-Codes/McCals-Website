name: Playwright Smoke Test

on:
  schedule:
    # Runs daily at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: '20'
          fetch-depth: '0'
          use-lfs: 'false'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (chromium)
        run: |
          mkdir -p reports/playwright
          # Run tests with HTML and list reporters; keep exit code for reporting but do not fail the job
          npx playwright test tests/playwright --reporter=list,html --workers=1 || true

      - name: Run axe-core (Firefox) against staging URL
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          AXE_FAIL_ON_VIOLATIONS: 'true'
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "Skipping axe audit: STAGING_URL secret not set."; exit 0; fi
          npx playwright install firefox
          npm run a11y:axe:firefox -- "$STAGING_URL"

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            reports/playwright/
