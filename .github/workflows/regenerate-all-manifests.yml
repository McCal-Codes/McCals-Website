name: Regenerate All Manifests

on:
  push:
    branches: [main]
    paths:
      - 'src/images/Portfolios/**'
      - '.github/workflows/regenerate-all-manifests.yml'
  # Manual trigger still available for emergency recovery
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even if no changes detected'
        required: false
        default: false
        type: boolean
      manifests:
        description: 'Which manifests to regenerate (comma-separated: concert,events,journalism,nature,portrait,featured,universal or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

concurrency:
  group: regenerate-all-manifests
  cancel-in-progress: false

jobs:
  # Parse input to determine which portfolios to process
  prepare:
    name: Prepare manifest list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.manifests || 'all' }}"
          
          if [ "$INPUT" = "all" ]; then
            PORTFOLIOS='["concert","events","journalism","nature","portrait","featured","universal"]'
          else
            # Convert comma-separated to JSON array
            PORTFOLIOS=$(echo "$INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/^/"/;s/$/"/' | paste -sd, | sed 's/.*/[&]/')
          fi
          
          echo "matrix={\"portfolio\":$PORTFOLIOS}" >> $GITHUB_OUTPUT
          echo "📋 Will regenerate: $PORTFOLIOS"

  # Generate manifests in parallel using matrix
  regenerate:
    name: Regenerate ${{ matrix.portfolio }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      fail-fast: false  # Continue even if one fails
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate manifest
        id: generate
        uses: ./.github/actions/generate-manifest
        with:
          portfolio: ${{ matrix.portfolio }}
          force: ${{ github.event.inputs.force }}

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.portfolio }}
          path: ${{ steps.generate.outputs.manifest_path }}
          retention-days: 1

  # Collect all manifests and commit in one batch
  commit:
    name: Commit all changes
    needs: regenerate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all manifest artifacts
        uses: actions/download-artifact@v4
        with:
          path: manifests-temp
          pattern: manifest-*

      - name: Copy manifests to correct locations
        run: |
          # Map artifacts back to their proper locations
          for dir in manifests-temp/manifest-*; do
            [ -d "$dir" ] || continue
            portfolio=$(basename "$dir" | sed 's/manifest-//')
            
            case "$portfolio" in
              concert)
                cp -f "$dir"/* src/images/Portfolios/Concert/ 2>/dev/null || true
                ;;
              events)
                cp -f "$dir"/* src/images/Portfolios/Events/ 2>/dev/null || true
                ;;
              journalism)
                cp -f "$dir"/* src/images/Portfolios/Journalism/ 2>/dev/null || true
                ;;
              nature)
                cp -f "$dir"/* src/images/Portfolios/Nature/ 2>/dev/null || true
                ;;
              portrait)
                cp -f "$dir"/* src/images/Portfolios/Portrait/ 2>/dev/null || true
                ;;
              featured|universal)
                cp -f "$dir"/* src/images/Portfolios/ 2>/dev/null || true
                ;;
            esac
          done
          
          echo "✅ All manifests copied to proper locations"

      - name: Commit and push all changes
        uses: ./.github/actions/commit-and-push
        with:
          files: |
            src/images/Portfolios/Concert/concert-manifest.json
            src/images/Portfolios/Events/events-manifest.json
            src/images/Portfolios/Journalism/journalism-manifest.json
            src/images/Portfolios/Nature/nature-manifest.json
            src/images/Portfolios/Portrait/portrait-manifest.json
            src/images/Portfolios/featured-manifest.json
            src/images/Portfolios/portfolio-manifest.json
          commit-message: |
            🔄 Manual regeneration of manifests

            - Manifests: ${{ github.event.inputs.manifests || 'all' }}
            - Force: ${{ github.event.inputs.force }}
            - Trigger: Manual workflow dispatch

      - name: Notify webhook
        uses: ./.github/actions/notify-manifest-webhook
        with:
          portfolio: all
          type: refresh

  # Summary job
  summary:
    name: Summary
    needs: [prepare, regenerate, commit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "## 🔄 Manifest Regeneration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Manifests | ${{ github.event.inputs.manifests || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Force | ${{ github.event.inputs.force }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regenerate Status | ${{ needs.regenerate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Status | ${{ needs.commit.result }} |" >> $GITHUB_STEP_SUMMARY
