name: Dependabot Automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Triage Dependabot PR
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: false

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve low-risk Dependabot update
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            steps.metadata.outputs.dependency-type != 'direct:production'
          )
        run: gh pr review --approve "$PR_URL" --body "$REVIEW_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_BODY: >-
            Auto-approved by Dependabot Automation because this is a patch update
            or a non-production minor update. Configure required checks on the
            target branch before enabling repository auto-merge.

      - name: Queue low-risk Dependabot update for auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            steps.metadata.outputs.dependency-type != 'direct:production'
          )
        run: |
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::notice::GitHub auto-merge must be enabled for this repository before Dependabot PRs can be queued automatically."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
