name: Auto-Generate Events Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/Events/**'
      - 'scripts/generate-events-manifest.js'
      - '.github/workflows/events-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-events-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.1'
          cache: 'npm'

      - name: Install deps
        run: |
          npm cache clean --force
          npm ci

      - name: Generate manifest
        run: |
          node scripts/generate-events-manifest.js --root src/images/Portfolios/Events --force
          test -f src/images/Portfolios/Events/events-manifest.json

      - name: Commit + push
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add src/images/Portfolios/Events/events-manifest.json
            git commit -m "🎞️ Auto-update events manifest (src/) — $(date -u +%F)"
            git push
          else
            echo "No changes"
          fi
