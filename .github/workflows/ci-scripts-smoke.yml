name: CI — Scripts Lint & Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Validate script references
        run: npm run ci:validate-scripts

      - name: Run duplicate script scanner (report only)
        run: node scripts/utils/find-duplicate-scripts.js

      - name: Run minimal smoke tests
        run: npm run ci:smoke-test

      - name: Archive duplicates (optional)
        if: false
        run: npm run ci:archive-duplicates
