name: Widget Performance (Playwright Scaffold)

# Auto-trigger disabled: src/widgets/ and src/site/ are retired widget-era paths.
# Run manually if needed via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run performance scaffold
        run: node scripts/utils/perf-widgets.js

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-performance-reports
          path: test-results/*
