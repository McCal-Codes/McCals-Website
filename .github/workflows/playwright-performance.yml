name: Performance Budget

# Guards the public Vite app against critical-path regressions. Asserts the
# CLS / LCP / FCP / JS / CSS / image budgets declared in
# sites/mcc-cal-vite/scripts/check-performance-budget.js against a production
# build served by `vite preview`.

on:
  pull_request:
    paths:
      - 'sites/mcc-cal-vite/**'
      - '.github/workflows/playwright-performance.yml'
  workflow_dispatch:

jobs:
  perf:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sites/mcc-cal-vite/package-lock.json

      - name: Install dependencies
        working-directory: sites/mcc-cal-vite
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: sites/mcc-cal-vite
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: sites/mcc-cal-vite
        run: npm run build

      - name: Serve production build
        working-directory: sites/mcc-cal-vite
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 60000

      - name: Check performance budget
        working-directory: sites/mcc-cal-vite
        run: npm run perf:budget
