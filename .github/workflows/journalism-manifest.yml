name: Auto-Generate Journalism Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/Journalism/**'
      - 'scripts/manifest/**'
      - '.github/workflows/journalism-manifest.yml'
  
  pull_request:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/Journalism/**'
      - 'scripts/manifest/**'
      - '.github/workflows/journalism-manifest.yml'
  
  # Also run on manual trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journalism-manifest-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel - let it complete to avoid corruption

jobs:
  generate:
    uses: ./.github/workflows/reusable-manifest.yml
    with:
      portfolio: journalism
      notify-webhook: true
    secrets: inherit
