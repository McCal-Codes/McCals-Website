name: Regenerate sitemap

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit sitemap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: npm run sitemap:generate -- --base https://mcc-cal.com --out dist/sitemap.xml

      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml dist/sitemap.xml || true
          if git diff --cached --quiet; then
            echo "No sitemap changes to commit"
          else
            git commit -m "chore: regenerate sitemap (action)"
            git push
          fi
