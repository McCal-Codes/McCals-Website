name: Lint Scripts

on:
  push:
    paths:
      - 'scripts/**'
  pull_request:
    paths:
      - 'scripts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      # This workflow is named "Lint Scripts" and did not lint. It ran
      # `ci:validate-scripts`, which is the same command ci-scripts-smoke.yml
      # already runs, so scripts/ went unlinted in CI while two runners did one
      # another's work. `npm run lint:scripts` was defined and invoked nowhere.
      - name: Lint scripts
        run: npm run lint:scripts
