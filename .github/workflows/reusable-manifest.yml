name: Reusable Manifest Generation

concurrency:
  group: manifest-push-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      portfolio:
        description: 'Portfolio type to generate manifest for'
        required: true
        type: string
      force:
        description: 'Force regeneration'
        required: false
        default: false
        type: boolean
      notify-webhook:
        description: 'Send webhook notification after generation'
        required: false
        default: true
        type: boolean
    outputs:
      success:
        description: 'Whether the workflow succeeded'
        value: ${{ jobs.generate.outputs.success }}
      committed:
        description: 'Whether changes were committed'
        value: ${{ jobs.generate.outputs.committed }}

  workflow_dispatch:
    inputs:
      portfolio:
        description: 'Portfolio type to generate manifest for'
        required: true
        default: concert
        type: string
      force:
        description: 'Force regeneration'
        required: false
        default: false
        type: boolean
      notify-webhook:
        description: 'Send webhook notification after generation'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    name: Generate ${{ inputs.portfolio }} manifest
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.generate.outputs.success }}
      committed: ${{ steps.push.outputs.committed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          lfs: true
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate manifest
        id: generate
        uses: ./.github/actions/generate-manifest
        with:
          portfolio: ${{ inputs.portfolio }}
          force: ${{ inputs.force }}

      - name: Validate manifest JSON
        run: |
          test -f "${{ steps.generate.outputs.manifest_path }}" || (echo "Missing manifest file" && exit 1)
          jq empty "${{ steps.generate.outputs.manifest_path }}"

      - name: Commit and push (rebase-safe)
        id: push
        if: github.event_name != 'pull_request'
        env:
          MANIFEST_FILE: ${{ steps.generate.outputs.manifest_path }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add "$MANIFEST_FILE"
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "🔄 Auto-update ${BRANCH} ${MANIFEST_FILE##*/}"

          # Rebase with autostash to avoid push races when multiple manifest jobs run
          git pull --rebase --autostash origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Notify webhook
        if: inputs.notify-webhook && steps.push.outputs.committed == 'true'
        uses: ./.github/actions/notify-manifest-webhook
        with:
          portfolio: ${{ inputs.portfolio }}
          type: refresh
