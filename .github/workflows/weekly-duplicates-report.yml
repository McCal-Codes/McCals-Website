name: Weekly Duplicate Scripts Report

on:
  schedule:
    # Runs every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

jobs:
  find-duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run duplicate scanner (report-only)
        run: |
          mkdir -p reports
          node scripts/utils/find-duplicate-scripts.js > reports/duplicate-scripts-$(date +"%Y%m%d-%H%M%S").txt || true
          echo "Report written to reports/"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-scripts-report
          path: reports/
