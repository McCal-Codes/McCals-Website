name: Sync Dev Portfolio GitHub Data

# Refreshes sites/mcc-cal-dev/src/content/github.json from the GitHub API so the
# technical portfolio's versions, releases, languages, and licenses stay accurate
# without anyone editing them by hand.
#
# The output is committed rather than fetched at runtime: the site's CSP is
# `connect-src 'self'`, and builds must be deterministic and work offline.

on:
  workflow_dispatch: {}
  schedule:
    # Twice daily. Release cadence does not justify more.
    - cron: '25 6,18 * * *'

permissions:
  contents: write

concurrency:
  group: dev-portfolio-github-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'

      - name: Sync GitHub metadata
        env:
          # Raises the rate limit from 60/hour to 5000/hour. All tracked repos are
          # public, so the default token's read scope is sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node sites/mcc-cal-dev/scripts/sync-github.js

      - name: Detect changes
        id: diff
        run: |
          # generatedAt changes on every run, so compare everything except that line.
          if git diff --quiet -- sites/mcc-cal-dev/src/content/github.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git diff -U0 -- sites/mcc-cal-dev/src/content/github.json \
              | grep -E '^[+-] ' | grep -v '"generatedAt"')" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- sites/mcc-cal-dev/src/content/github.json
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed metadata
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/mcc-cal-dev/src/content/github.json
          git commit -m "chore: refresh dev portfolio repository metadata"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "Repository metadata updated and pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No substantive metadata changes." >> "$GITHUB_STEP_SUMMARY"
          fi
