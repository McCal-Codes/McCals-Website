name: Sync Dev Portfolio GitHub Data

# Refreshes sites/mcc-cal-dev/src/content/github.json from the GitHub API so the
# technical portfolio's versions, releases, languages, and licenses stay accurate
# without anyone editing them by hand.
#
# The output is committed rather than fetched at runtime: the site's CSP is
# `connect-src 'self'`, and builds must be deterministic and work offline.

on:
  workflow_dispatch: {}
  schedule:
    # Twice daily. Release cadence does not justify more.
    - cron: '25 6,18 * * *'

permissions:
  contents: write

concurrency:
  group: dev-portfolio-github-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'

      - name: Sync GitHub metadata
        env:
          # Raises the rate limit from 60/hour to 5000/hour. All tracked repos are
          # public, so the default token's read scope is sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node sites/mcc-cal-dev/scripts/sync-github.js

      - name: Sync live website metadata
        # Client sites are third-party hosts we do not control. The script already
        # keeps the previous record on failure, so a site being down must not fail
        # the job either.
        continue-on-error: true
        run: node sites/mcc-cal-dev/scripts/sync-sites.js

      - name: Detect changes
        id: diff
        env:
          TRACKED: >-
            sites/mcc-cal-dev/src/content/github.json
            sites/mcc-cal-dev/src/content/sites.json
            sites/mcc-cal-dev/public/site-previews
        run: |
          # generatedAt and checkedAt change on every run. Treat a diff made up
          # only of those as no change, so the workflow does not commit noise.
          # shellcheck disable=SC2086
          if git diff --quiet -- $TRACKED && [ -z "$(git status --porcelain -- $TRACKED)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git diff -U0 -- $TRACKED \
              | grep -E '^[+-] ' \
              | grep -vE '"(generatedAt|checkedAt)"')" ] \
              && [ -z "$(git status --porcelain -- $TRACKED | grep '^??')" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- $TRACKED
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed metadata
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/mcc-cal-dev/src/content/github.json \
                  sites/mcc-cal-dev/src/content/sites.json \
                  sites/mcc-cal-dev/public/site-previews
          git commit -m "chore: refresh dev portfolio repository and site metadata"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "Repository metadata updated and pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No substantive metadata changes." >> "$GITHUB_STEP_SUMMARY"
          fi
