name: Auto-Generate Concert Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/Concert/**'
      - 'scripts/manifest/**'
      - '.github/workflows/build-manifest.yml'
  
  pull_request:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/Concert/**'
      - 'scripts/manifest/**'
      - '.github/workflows/build-manifest.yml'
  
  # Also run on manual trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: concert-manifest-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel - let it complete to avoid corruption

jobs:
  update-concert-manifest:
    runs-on: ubuntu-latest
    env:
      MANIFEST_WEBHOOK_URL: ${{ secrets.MANIFEST_WEBHOOK_URL }}
      MANIFEST_WEBHOOK_BASE: ${{ secrets.MANIFEST_WEBHOOK_BASE }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check for concert images
        id: check_images
        run: |
          echo "🔍 Checking for concert images..."
          
          # Count total images in concert directory
          IMAGE_COUNT=$(find src/images/Portfolios/Concert -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) | wc -l)
          echo "📸 Found $IMAGE_COUNT concert images"
          
          # Count band directories
          BAND_COUNT=$(find src/images/Portfolios/Concert -mindepth 1 -maxdepth 1 -type d ! -name ".*" | wc -l)
          echo "🎵 Found $BAND_COUNT band directories"
          
          # Set outputs
          echo "image_count=$IMAGE_COUNT" >> $GITHUB_OUTPUT
          echo "band_count=$BAND_COUNT" >> $GITHUB_OUTPUT
          
          # Check if concert manifest script exists (canonical path)
          if [ -f "scripts/manifest/generate-concert-manifest.js" ]; then
            echo "✅ Concert manifest generator found"
            echo "has_generator=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Concert manifest generator not found"
            echo "has_generator=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate concert manifest
        if: steps.check_images.outputs.has_generator == 'true'
        run: |
          echo "🔄 Regenerating concert manifest..."
          
          # Create backup of existing manifest for widget protection
          if [ -f "src/images/Portfolios/Concert/concert-manifest.json" ]; then
            cp "src/images/Portfolios/Concert/concert-manifest.json" "src/images/Portfolios/Concert/concert-manifest.json.backup"
            echo "📋 Created backup of existing manifest"
          fi
          
          # Retry logic for manifest generation
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            
            if npm run manifest:concert; then
              echo "✅ Concert manifest generation completed"
              break
            else
              echo "⚠️ Attempt $attempt failed"
              if [ $attempt -eq 3 ]; then
                echo "❌ All attempts failed"
                exit 1
              fi
              sleep 5
            fi
          done
          
          # Validate manifest exists and is valid JSON
          if [ -f "src/images/Portfolios/Concert/concert-manifest.json" ]; then
            # Test if it's valid JSON
            if jq empty src/images/Portfolios/Concert/concert-manifest.json 2>/dev/null; then
              echo "✅ Concert manifest generated successfully"
              
              # Extract key info from manifest
              MANIFEST_BANDS=$(jq -r '.totalBands // 0' src/images/Portfolios/Concert/concert-manifest.json)
              MANIFEST_VERSION=$(jq -r '.version // "unknown"' src/images/Portfolios/Concert/concert-manifest.json)
              
              echo "📊 Manifest info:"
              echo "   - Version: $MANIFEST_VERSION"
              echo "   - Total bands: $MANIFEST_BANDS"
              echo "   - Generated: $(date)"
              
              # Widget compatibility checks - ensure required fields exist
              echo "🔍 Checking widget compatibility..."
              REQUIRED_FIELDS=("version" "generated" "totalBands" "bands")
              for field in "${REQUIRED_FIELDS[@]}"; do
                if jq -e ".$field" src/images/Portfolios/Concert/concert-manifest.json > /dev/null 2>&1; then
                  echo "✅ Required field '$field': Present"
                else
                  echo "❌ Required field '$field': Missing"
                  echo "::error::Manifest missing required field '$field' - this could break widgets"
                  exit 1
                fi
              done
              
              # Check bands array structure
              if jq -e '.bands[0] | has("bandName") and has("folderPath") and has("totalImages") and has("images")' src/images/Portfolios/Concert/concert-manifest.json > /dev/null 2>&1; then
                echo "✅ Band structure: Compatible with widgets"
              else
                echo "⚠️ Band structure: May be incompatible - checking first band"
                # Show structure for debugging
                jq -r '.bands[0] // "No bands found"' src/images/Portfolios/Concert/concert-manifest.json
              fi
              
              # Verify minimum data integrity
              if [ "$MANIFEST_BANDS" -eq 0 ]; then
                echo "⚠️ Warning: No bands found in manifest"
              fi
            else
              echo "❌ Concert manifest is not valid JSON"
              # Restore backup if it exists
              if [ -f "src/images/Portfolios/Concert/concert-manifest.json.backup" ]; then
                echo "🔄 Restoring backup manifest"
                mv "src/images/Portfolios/Concert/concert-manifest.json.backup" "src/images/Portfolios/Concert/concert-manifest.json"
              fi
              exit 1
            fi
          else
            echo "❌ Concert manifest not found after generation"
            # Restore backup if it exists
            if [ -f "src/images/Portfolios/Concert/concert-manifest.json.backup" ]; then
              echo "🔄 Restoring backup manifest"
              mv "src/images/Portfolios/Concert/concert-manifest.json.backup" "src/images/Portfolios/Concert/concert-manifest.json"
            fi
            exit 1
          fi
          
          # Clean up backup on success
          if [ -f "src/images/Portfolios/Concert/concert-manifest.json.backup" ]; then
            rm "src/images/Portfolios/Concert/concert-manifest.json.backup"
            echo "🗑️ Cleaned up backup file"
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "📝 Changes detected in manifest"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            echo "Changed files:"
            git status --porcelain
          else
            echo "✅ No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push manifest
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # Add only manifest files
          git add src/images/Portfolios/Concert/concert-manifest.json
          # Per-folder manifests are deprecated. Do not add src/images/Portfolios/Concert/**/manifest.json anymore.
          # Use scripts/manifest/remove-subfolder-manifests.js to clean legacy files before running this workflow.
          
          # Create descriptive commit message
          BANDS=${{ steps.check_images.outputs.band_count }}
          IMAGES=${{ steps.check_images.outputs.image_count }}
          
          git commit -m "🎬 Auto-update concert manifest
          
          - Bands: $BANDS
          - Images: $IMAGES
          - Generated: $(date -u)
          - Trigger: ${{ github.event_name }}"
          
          git push
          
          echo "✅ Concert manifest updated and pushed successfully!"

      - name: Notify API webhook
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        uses: ./.github/actions/notify-manifest-webhook
        with:
          portfolio: concert
          type: refresh

      - name: PR Validation Summary
        if: github.event_name == 'pull_request' && steps.check_images.outputs.has_generator == 'true'
        run: |
          echo "🔍 Pull Request Validation Summary:"
          echo "- Images found: ${{ steps.check_images.outputs.image_count }}"
          echo "- Bands found: ${{ steps.check_images.outputs.band_count }}"
          echo "- Manifest generated: ✅"
          echo "- Validation passed: ✅"
          echo ""
          echo "Manifest files are ready for review in this PR."
