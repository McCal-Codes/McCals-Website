name: Auto-Generate Universal Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/**'
      - 'scripts/manifest/**'
      - '.github/workflows/universal-manifest.yml'
  
  pull_request:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/**'
      - 'scripts/manifest/**'
      - '.github/workflows/universal-manifest.yml'
  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    uses: ./.github/workflows/reusable-manifest.yml
    with:
      portfolio: universal
      notify-webhook: true
    secrets: inherit
