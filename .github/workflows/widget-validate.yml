# Widget Validation CI Workflow
# Runs widget HTML validation on every push and pull request

name: Widget Validation

on:
  push:
    paths:
      - 'src/widgets/**/versions/*.html'
      - 'scripts/utils/validate-widgets.js'
      - '.github/workflows/widget-validate.yml'
  pull_request:
    paths:
      - 'src/widgets/**/versions/*.html'
      - 'scripts/utils/validate-widgets.js'
      - '.github/workflows/widget-validate.yml'

jobs:
  validate-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run widget validation script
        run: node scripts/utils/validate-widgets.js
