# Widget Validation CI Workflow
# Runs widget HTML validation on every push and pull request

name: Widget Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/widgets/**'
      - 'scripts/**'
      - 'reports/**'
      - '.github/workflows/widget-validate.yml'
  pull_request:
    paths:
      - 'src/widgets/**'
      - 'scripts/**'
      - 'reports/**'
      - '.github/workflows/widget-validate.yml'

jobs:
  validate-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run widget validation script
        run: npm run validate:widgets

      - name: Audit widget READMEs
        run: npm run audit:widget-readmes
      - name: Upload validator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-validation-report
          path: |
            reports/*
            test-results/*
