---
name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'src/widgets/**'
      - 'src/site/**'
      - 'lighthouserc.json'
  push:
    branches:
      - main
    paths:
      - 'src/widgets/**'
      - 'src/site/**'
      - 'lighthouserc.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build site
        run: npm run build 2>/dev/null || echo "No build script, skipping"

      - name: Start dev server
        run: |
          npm run dev &
          echo "DEV_SERVER_PID=$!" >> $GITHUB_ENV
          # Wait for server to be ready (max 30s)
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Dev server ready"
              break
            fi
            sleep 1
          done

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      # Run LHCI (use token if present). Use a shell check instead of step-level
      # `if:` expressions to avoid YAML/linter false positives in editors.
      - name: Run Lighthouse CI
        run: |
          echo "Starting LHCI autorun"
          if [ -n "${LHCI_GITHUB_APP_TOKEN}" ]; then
            echo "LHCI_GITHUB_APP_TOKEN provided — running with token"
          else
            echo "No LHCI_GITHUB_APP_TOKEN — running without token"
          fi
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30

      - name: Stop dev server
        if: always()
        run: kill $DEV_SERVER_PID 2>/dev/null || true

      - name: Comment PR with results
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the manifest file
            const lhciDir = '.lighthouseci';
            if (!fs.existsSync(lhciDir)) {
              console.log('No Lighthouse results found');
              return;
            }
            
            const manifestPath = path.join(lhciDir, 'manifest.json');
            if (!fs.existsSync(manifestPath)) {
              console.log('No manifest.json found');
              return;
            }
            
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const reports = manifest[0]?.summary || {};
            
            // Build comment
            let comment = '### 🔍 Lighthouse Performance Report\n\n';
            comment += '| Metric | Score |\n';
            comment += '|--------|-------|\n';
            
            const categories = ['performance', 'accessibility', 'best-practices', 'seo'];
            categories.forEach(cat => {
              if (reports[cat]) {
                const score = Math.round(reports[cat] * 100);
                const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟡' : '🔴';
                comment += `| ${emoji} ${cat.replace('-', ' ')} | ${score} |\n`;
              }
            });
            
            comment += '\n---\n';
            // Build run URL without relying on `context` globals to avoid linter warnings in editors
            const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            comment += `📊 [View full report in artifacts](${runUrl})\n`;
            
            // Post comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('Lighthouse Performance Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
