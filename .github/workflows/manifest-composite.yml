name: Composite Manifest Generation

on:
  workflow_dispatch:
    inputs:
      portfolios:
        description: 'Portfolios to generate (comma-separated or "all")'
        required: false
        default: 'all'
        type: string
  # Disabled auto-trigger - individual workflows handle path-based triggers
  # push:
  #   paths:
  #     - 'scripts/manifest/**'
  #     - 'src/images/Portfolios/**'

permissions:
  contents: write

concurrency:
  group: manifest-composite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Prepare the matrix based on input
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.portfolios || 'all' }}"
          
          if [ "$INPUT" = "all" ]; then
            PORTFOLIOS='["concert","events","journalism","nature","portrait","universal"]'
          else
            PORTFOLIOS=$(echo "$INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/^/"/;s/$/"/' | paste -sd, | sed 's/.*/[&]/')
          fi
          
          echo "matrix={\"portfolio\":$PORTFOLIOS}" >> $GITHUB_OUTPUT

  # Generate manifests in parallel
  generate:
    name: Generate ${{ matrix.portfolio }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate manifest
        uses: ./.github/actions/generate-manifest
        with:
          portfolio: ${{ matrix.portfolio }}

      - name: Validate manifest
        run: node scripts/utils/validate-manifests.js 2>/dev/null || echo "ℹ️ Validation skipped"

      - name: Commit and push
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/commit-and-push
        with:
          files: src/images/Portfolios/**/manifest.json src/images/Portfolios/**/*-manifest.json
          commit-message: "ci: Update ${{ matrix.portfolio }} manifest (composite)"

      - name: Notify webhook
        uses: ./.github/actions/notify-manifest-webhook
        with:
          portfolio: ${{ matrix.portfolio }}
          type: refresh

  # Summary
  summary:
    name: Summary
    needs: [prepare, generate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "## Composite Manifest Generation" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Generate | ${{ needs.generate.result }} |" >> $GITHUB_STEP_SUMMARY
