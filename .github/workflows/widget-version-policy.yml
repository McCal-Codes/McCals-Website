name: Enforce Widget Version Policy

on:
  push:
    branches: [ main ]
    paths:
      - 'src/widgets/**'
      - 'scripts/utils/scan-widget-versions.js'
      - '.github/workflows/widget-version-policy.yml'
  pull_request:
    paths:
      - 'src/widgets/**'
      - 'scripts/utils/scan-widget-versions.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (ci)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run scanner
        run: node scripts/utils/scan-widget-versions.js --fail > scan-output.txt

      - name: Display scan results
        run: cat scan-output.txt

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-version-scan
          path: scan-output.txt
