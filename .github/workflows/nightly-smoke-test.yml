name: Nightly Smoke Test

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run minimal smoke test
        run: |
          mkdir -p reports
          node scripts/utils/smoke-test.js > reports/smoke-$(date +"%Y%m%d-%H%M%S").log 2>&1 || true
          echo "Smoke test finished, report in reports/"

      - name: Upload smoke report
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-report
          path: reports/
