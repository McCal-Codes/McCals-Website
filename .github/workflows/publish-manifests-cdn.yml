name: Publish Manifests to CDN

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (default: YYYYMMDDHHMM)'
        required: false
  push:
    branches: [ main ]
    paths:
      - 'src/images/Portfolios/**'
      - 'scripts/manifest/**'
      - 'scripts/utils/**manifest**'
      - 'scripts/seo/generate-structured-data.js'
      - 'scripts/seo/generate-sitemap.js'
      - '.github/workflows/publish-manifests-cdn.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate manifests
        run: npm run manifest:generate

      - name: Detect manifest changes
        id: diff
        run: |
          if git status --porcelain -- src/images/Portfolios | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create manifest branch
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git switch -C manifests-cdn

      - name: Commit manifest updates
        if: steps.diff.outputs.has_changes == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Use null-delimited find to handle paths with spaces
          if ! find src/images/Portfolios -name '*.json' -type f -print0 | grep -qz .; then
            echo "has_commit=false" >> $GITHUB_OUTPUT
            echo "No manifest files found to commit."
            exit 0
          fi
          # Add files using null-delimited input to handle spaces
          find src/images/Portfolios -name '*.json' -type f -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "has_commit=false" >> $GITHUB_OUTPUT
            echo "No staged changes after add; skipping commit."
            exit 0
          fi
          git commit -m "chore: publish manifests for CDN"
          echo "has_commit=true" >> $GITHUB_OUTPUT

      - name: Tag release
        if: steps.diff.outputs.has_changes == 'true' && steps.commit.outputs.has_commit == 'true'
        id: tagging
        run: |
          TAG_INPUT="${{ github.event.inputs.tag_suffix }}"
          TS=$(date +%Y%m%d%H%M)
          TAG="manifests-${TAG_INPUT:-$TS}"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          git tag -a "$TAG" -m "Manifest publish $TAG"

      - name: Push branch and tag
        if: steps.diff.outputs.has_changes == 'true' && steps.commit.outputs.has_commit == 'true'
        run: |
          git push --force origin manifests-cdn
          git push origin ${{ steps.tagging.outputs.tag_name }}

      - name: Notify API webhook for CDN publish
        if: steps.diff.outputs.has_changes == 'true' && steps.commit.outputs.has_commit == 'true'
        uses: ./.github/actions/notify-manifest-webhook
        with:
          portfolio: publish
          type: publish

      - name: Purge and warm Cloudflare edge cache
        if: steps.diff.outputs.has_changes == 'true' && steps.commit.outputs.has_commit == 'true'
        env:
          CF_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
          CF_WEBHOOK_SECRET: ${{ secrets.CLOUDFLARE_WEBHOOK_SECRET }}
        run: |
          # Skip if Cloudflare secrets not configured
          if [ -z "$CF_API_URL" ] || [ -z "$CF_WEBHOOK_SECRET" ]; then
            echo "ℹ️ Cloudflare cache purge skipped (secrets not configured)"
            exit 0
          fi
          
          echo "🔄 Triggering Cloudflare edge cache refresh..."
          
          # Call the combined refresh endpoint (purge + warm)
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${CF_API_URL}/api/v1/webhooks/refresh" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${CF_WEBHOOK_SECRET}" \
            --max-time 30)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Cloudflare cache refreshed successfully"
            echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
          else
            echo "⚠️ Cloudflare cache refresh returned HTTP $HTTP_CODE (non-fatal)"
            echo "$BODY"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.has_changes }}" != "true" ]; then
            echo "No manifest changes detected; nothing to publish."
          elif [ "${{ steps.commit.outputs.has_commit }}" != "true" ]; then
            echo "Changes detected but nothing staged/committed; no publish."
          else
            echo "Published branch: manifests-cdn"
            echo "Tag: ${{ steps.tagging.outputs.tag_name }}"
            echo "jsDelivr base: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.tagging.outputs.tag_name }}/src/images/Portfolios/"
          fi
