name: Validate Workflows

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: '20'
          fetch-depth: '0'
          use-lfs: 'false'

      - name: Run workflow validator
        run: node scripts/utils/ci-validate-workflows.js
