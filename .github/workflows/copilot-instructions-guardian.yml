---
name: Copilot Instructions Guardian

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'package.json'
      - 'dev-server.js'
      - 'scripts/**'
      - 'src/site/**'
      - 'src/widgets/**'
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/copilot-instructions.md'
      - '.github/canvas-instructions.md'
      - '.github/codex-instructions.md'
      - 'README.md'
      - 'docs/README.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Ensure instructions updated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          echo "Comparing $BASE_SHA...$HEAD_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tr '\n' ' ')
          echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT
          # Detect if any of the AI instruction docs are in the changed set.
          # Note: avoid -w because patterns contain hyphens/dots which can break word-boundary matching.
          if echo "$CHANGED" | grep -E -q "(\.|^|\s)\.github/(copilot|canvas|codex)-instructions\.md(\s|$)"; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Guard and optionally comment / fail
        uses: actions/github-script@v7
        with:
          script: |
            const needsUpdate = `${{ steps.changed.outputs.needs_update }}` === 'true';
            if (needsUpdate) {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const bypassLabels = new Set(['skip-copilot-instructions', 'docs-acknowledged']);
              const hasBypass = labels.some(l => bypassLabels.has(l.name));
              if (!hasBypass) {
                const changed = `${{ steps.changed.outputs.changed_files }}`.split(' ').filter(Boolean);
                const header = '⚠️ Copilot instructions reminder';
                const body = [
                  'The PR changes core repo behavior/files but `.github/copilot-instructions.md` was not updated.',
                  '',
                  '**Changed files (subset):**',
                  '```',
                  changed.slice(0, 30).join('\n'),
                  '```',
                  '',
                  'Please review and update `.github/copilot-instructions.md` so AI agents stay accurate.',
                  '',
                  'Bypass: add label `docs-acknowledged` or `skip-copilot-instructions` to this PR.'
                ].join('\n');
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                });
                const already = comments.some(c => c.user.type === 'Bot' && c.body && c.body.includes('Copilot instructions reminder'));
                if (!already) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: `### ${header}\n\n${body}`,
                  });
                }
                core.setFailed("Copilot instructions not updated. Please edit .github/copilot-instructions.md or add the 'docs-acknowledged' label to bypass.");
              }
            }

      - name: Require CHANGELOG when instructions change
        uses: actions/github-script@v7
        with:
          script: |
            const changed = `${{ steps.changed.outputs.changed_files }}`.split(' ').filter(Boolean);
            const instructionsChanged = changed.includes('.github/copilot-instructions.md');
            const canvasChanged = changed.includes('.github/canvas-instructions.md');
            const codexChanged = changed.includes('.github/codex-instructions.md');
            const changelogChanged = changed.includes('CHANGELOG.md') || changed.includes('docs/CHANGELOG.md');
            if ((instructionsChanged || canvasChanged || codexChanged) && !changelogChanged) {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const bypassLabels = new Set(['skip-copilot-instructions', 'docs-acknowledged']);
              const hasBypass = labels.some(l => bypassLabels.has(l.name));
              const note = [
                'This PR updates `.github/copilot-instructions.md` but no CHANGELOG entry was found.',
                '',
                'Please add an entry to `CHANGELOG.md` describing the update to the Copilot instructions (e.g., under a Docs/Meta section).',
                'You can bypass with label `docs-acknowledged` if intentional.'
              ].join('\n');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const already = comments.some(c => c.user.type === 'Bot' && c.body && c.body.includes('updates `.github/copilot-instructions.md`'));
              if (!already) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `### 📝 CHANGELOG required for Copilot instructions\n\n${note}`,
                });
              }
              if (!hasBypass) {
                core.setFailed('Copilot instructions changed without CHANGELOG update.');
              }
            }

