<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: transparent;">
  <!-- The Watchful Shepherd logo based on provided design -->
  
  <!-- Shepherd's crook/staff -->
  <path d="M 200 50 Q 210 40 220 45 Q 225 50 220 55 Q 210 60 200 55 L 200 80" 
        fill="none" stroke="#6495ED" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Main title text -->
  <text x="200" y="120" font-family="Times New Roman, serif" font-size="32" font-weight="normal" 
        text-anchor="middle" fill="#6495ED">The Watchful Shepherd</text>
  
  <!-- USA text -->
  <text x="380" y="115" font-family="Times New Roman, serif" font-size="16" font-weight="normal" 
        fill="#6495ED">USA</text>
  
  <!-- Trademark symbol -->
  <text x="370" y="100" font-family="Times New Roman, serif" font-size="10" font-weight="normal" 
        fill="#6495ED">SM</text>
  
  <!-- Subtitle -->
  <text x="200" y="160" font-family="Times New Roman, serif" font-size="18" font-weight="normal" 
        text-anchor="middle" fill="#666666">Prevent Child Abuse</text>
</svg>