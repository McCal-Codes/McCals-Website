<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" style="background: transparent;">
  <defs>
    <!-- Steelers colors gradient -->
    <linearGradient id="steelersGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB612;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text shadow -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Football shape -->
  <ellipse cx="30" cy="40" rx="18" ry="11" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Football laces -->
  <g transform="translate(26, 35)">
    <line x1="4" y1="0" x2="4" y2="10" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="2" y1="2" x2="6" y2="2" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="2" y1="4" x2="6" y2="4" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="2" y1="6" x2="6" y2="6" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="2" y1="8" x2="6" y2="8" stroke="#ffffff" stroke-width="0.8"/>
  </g>
  
  <!-- Terrible Towel waving -->
  <g transform="translate(12, 12)">
    <path d="M0,5 Q5,0 10,2 Q15,4 18,1 L18,20 Q15,23 10,21 Q5,19 0,24 Z" 
          fill="#FFB612" stroke="#E6A500" stroke-width="0.8"/>
    <text x="4" y="15" font-family="Arial, sans-serif" font-size="5" font-weight="bold" 
          fill="#000000">TT</text>
  </g>
  
  <!-- Company name -->
  <text x="55" y="28" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900" 
        fill="#000000" letter-spacing="0.8px" filter="url(#textShadow)">TERRIBLE</text>
  <text x="55" y="50" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900" 
        fill="#FFB612" letter-spacing="0.8px" filter="url(#textShadow)">TAILGATE</text>
  
  <!-- Tagline -->
  <text x="55" y="62" font-family="Arial, sans-serif" font-size="8" font-weight="600" 
        fill="#444444" letter-spacing="0.3px">PITTSBURGH SPORTS • FOOD</text>
  
  <!-- Steelers-inspired elements -->
  <polygon points="180,15 185,20 180,25" fill="#FFB612" opacity="0.6"/>
  <polygon points="175,55 180,60 175,65" fill="#000000" opacity="0.4"/>
</svg>
